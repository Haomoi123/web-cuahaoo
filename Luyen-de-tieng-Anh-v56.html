  // Tìm từ gốc (Lemma) tiếng Anh nếu từ đang tra là dạng chia động từ / số nhiều (VD: learning -> learn, blurred -> blur, studies -> study)
  function guessEnglishLemmas(word){
    const w = String(word || '').toLowerCase().trim();
    if(!w || !/^[a-z]+$/.test(w) || w.length <= 3) return [];
    const cands = new Set();
    const irregulars = {
      'went':'go','gone':'go','saw':'see','seen':'see','took':'take','taken':'take',
      'made':'make','known':'know','knew':'know','thought':'think','told':'tell',
      'found':'find','gave':'give','given':'give','felt':'feel','became':'become',
      'left':'leave','kept':'keep','held':'hold','wrote':'write','written':'write',
      'stood':'stand','heard':'hear','built':'build','sent':'send','spent':'spend',
      'paid':'pay','met':'meet','led':'lead','understood':'understand','spoke':'speak',

      'leaves':'leaf','wolves':'wolf','thieves':'thief','shelves':'shelf','criteria':'criterion',
      'phenomena':'phenomenon','analyses':'analysis','media':'medium','data':'datum',
      'better':'good','best':'good','worse':'bad','worst':'bad','further':'far','farther':'far'
    };
    if(irregulars[w]) cands.add(irregulars[w]);

    if(w.endsWith('ing') && w.length > 4){
      const stem = w.slice(0, -3);
      cands.add(stem);
      cands.add(stem + 'e');
      if(stem.length >= 3 && stem[stem.length - 1] === stem[stem.length - 2]){
        cands.add(stem.slice(0, -1)); // blurr -> blur, runn -> run
      }
    }
    if(w.endsWith('ied') && w.length > 4){
      cands.add(w.slice(0, -3) + 'y'); // studied -> study
    } else if(w.endsWith('ed') && w.length > 4){
      const stem = w.slice(0, -2);
      cands.add(stem);
      cands.add(w.slice(0, -1)); //baked -> bake
      if(stem.length >= 3 && stem[stem.length - 1] === stem[stem.length - 2]){
        cands.add(stem.slice(0, -1)); // blurred -> blur, stopped -> stop
      }
    }
    if(w.endsWith('ies') && w.length > 4){
      cands.add(w.slice(0, -3) + 'y'); // studies -> study
    } else if(w.endsWith('es') && w.length > 4){
      cands.add(w.slice(0, -2));
      cands.add(w.slice(0, -1));
    } else if(w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us') && !w.endsWith('is') && w.length > 3){
      cands.add(w.slice(0, -1));
    }
    if(w.endsWith('ly') && w.length > 4){
      cands.add(w.slice(0, -2));
      if(w.endsWith('ily')) cands.add(w.slice(0, -3) + 'y'); // happily -> happy
    }
    cands.delete(w);
    return [...cands].slice(0, 3);
  }

  // 1. Gọi Google Translate API mở rộng (bao gồm cả nghĩa chính, từ điển từ loại chi tiết, nghĩa thay thế, định nghĩa, ví dụ, đồng nghĩa)
  const dictCache = new Map();
  fetchGoogleTranslate = async function(txt){

    const cacheKey = 'gt__' + cleanQ.toLowerCase();

    const r = await fetch(url);
    if(!r.ok) throw new Error('Không kết nối được máy chủ dịch');

  async function fetchFreeDictEntry(word){
    const w = String(word || '').trim().toLowerCase();
    if(!w || w.split(/\s+/).length > 2 || !/^[a-z\s-]+$/i.test(w)) return null;
    const cacheKey = 'fd__' + w;
    if(dictCache.has(cacheKey)) return dictCache.get(cacheKey);

      const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w)}`);

    const lemmas = guessEnglishLemmas(w);

            dictCache.set(cacheKey, arr2);

    dictCache.set(cacheKey, null);

      for(const p of (entry.phonetics || [])){
        const txt = (p.text || '').trim();
        const aud = (p.audio || '').trim();
        if(txt && !ipaGen) ipaGen = txt;
        if(/-uk\.mp3|_gb_|british/i.test(aud)){
          if(aud && !audioUk) audioUk = aud;
          if(txt && !ipaUk) ipaUk = txt;
        } else if(/-us\.mp3|_us_|american/i.test(aud)){
          if(aud && !audioUs) audioUs = aud;
          if(txt && !ipaUs) ipaUs = txt;
        } else if(aud && !audioUs){
          audioUs = aud;
        }
      }
    }
    if(!ipaUk) ipaUk = ipaGen;
    if(!ipaUs) ipaUs = ipaGen;
    return {ipaUk, ipaUs, ipaGen, audioUk, audioUs, word: headWord, isLemmaOf: fdEntries[0]._isLemmaOf || ''};
  }

  // Phát âm thanh MP3 bản xứ hoặc đọc bằng giọng UK / US
  function playDictAudio(audioUrl, fallbackText, accent){
    stopSpeech();
    if(audioUrl){
      try {
        const aud = new Audio(audioUrl);
        CUR_AUDIO = aud;
        aud.play().catch(() => speakWithAccent(fallbackText, accent));
        return;
      } catch(e){}
    }
    speakWithAccent(fallbackText, accent);
  }

  function speakWithAccent(txt, accent){
    if(!txt) return;
    const vc = getVoiceCfg();
    const prevAccent = vc.accent;
    if(accent) vc.accent = accent;
    saveVoiceCfg(vc);
    speakText(txt, 'en');
    if(accent){
      vc.accent = prevAccent;
      saveVoiceCfg(vc);
    }
  }

  // Lịch sử ngăn xếp (stack) khi người dùng bấm vào từng từ con để có thể bấm "Quay lại cụm từ gốc"
  let LOOKUP_STACK = [];
  let CUR_LOOKUP_AUDIO = {uk: '', us: ''};
  let LAST_IPA_STR = '';

  async function performDictionaryLookup(rawQuery, pushStack = false){
    const cleaned = sanitizeLookupInput(rawQuery);
    if(!cleaned) return;
    if(pushStack && ST && ST.toLowerCase() !== cleaned.toLowerCase()){
      LOOKUP_STACK.push(ST);
    }
    ST = cleaned;
    LAST_TR = '';
    LAST_IPA_STR = '';

    const inp = $('#dict-q-inp');
    if(inp && inp.value !== cleaned) inp.value = cleaned;

    // 1. Vẽ dãy từ đơn (Clickable Word Chips) nếu cụm đang tra có từ 2 từ trở lên
    const words = cleaned.split(/\s+/).map(w => w.replace(/^[^A-Za-z0-9'-]+|[^A-Za-z0-9'-]+$/g, '')).filter(w => w.length >= 2);
    const chipsBox = $('#dict-chips-box');
    if(chipsBox){
      if(words.length > 1 || LOOKUP_STACK.length > 0){
        const backBtn = LOOKUP_STACK.length > 0
          ? `<button type="button" class="dict-wchip" style="border-color:var(--pr);color:var(--pr)" data-a="dict_pop_back">⬅ Quay lại "${esc(LOOKUP_STACK[LOOKUP_STACK.length - 1].slice(0, 28))}"</button>`
          : '';
        const wordBtns = words.length > 1
          ? `<span class="mu">🔍 Bấm vào từng từ để tra riêng:</span>` + words.slice(0, 14).map(w =>
              `<button type="button" class="dict-wchip" data-a="dict_lookup_word" data-w="${esc(w)}">${esc(w)}</button>`
            ).join('')
          : `<span class="mu">Đang xem chi tiết từ đơn: <b>${esc(cleaned)}</b></span>`;
        chipsBox.style.display = 'flex';
        chipsBox.innerHTML = `${backBtn}${wordBtns}`;
      } else {
        chipsBox.style.display = 'none';
        chipsBox.innerHTML = '';
      }
    }

    const outBox = $('#tr-out');
    const ipaBox = $('#tr-ipa-box');
    const dictBox = $('#tr-dict');
    if(outBox) outBox.innerHTML = `⏳ Đang dịch & tra cứu từ điển...`;
    if(ipaBox) ipaBox.innerHTML = '';
    if(dictBox) dictBox.innerHTML = '';

    // Nếu là cụm 2-3 từ có từ hạn định ở đầu (VD: "his learning", "the benchmark", "to solidify", "an integral"),
    // tự động lấy thêm từ chính (headword) để tra từ điển chi tiết & phiên âm IPA!
    let targetDictWord = cleaned;
    const stopWords = new Set(['a','an','the','his','her','my','your','our','their','its','this','that','these','those','to','in','on','at','of','for','with','by','from','as','is','are','was','were','be','been']);
    if(words.length >= 2 && words.length <= 4){
      const contentWords = words.filter(w => !stopWords.has(w.toLowerCase()));
      if(contentWords.length >= 1) targetDictWord = contentWords[contentWords.length - 1];
    }

    try {
      // Chạy song song: (1) Dịch cả cụm/câu, (2) Tra FreeDict cho từ/cụm, (3) Nếu là cụm ngắn thì tra thêm Google Dict cho từ chính
      const tasks = [
        fetchGoogleTranslate(cleaned),
        words.length <= 4 ? fetchFreeDictEntry(targetDictWord) : Promise.resolve(null),
        (words.length >= 2 && words.length <= 4 && targetDictWord.toLowerCase() !== cleaned.toLowerCase())
          ? fetchGoogleTranslate(targetDictWord).catch(() => null)
          : Promise.resolve(null)
      ];
      const [gtData, fdEntries, gtHeadwordData] = await Promise.all(tasks);

      // A. HIỂN THỊ PHIÊN ÂM IPA (UK / US) & PHÁT ÂM
      const phon = extractPhoneticsFromFreeDict(fdEntries);
      const gtPhon = (gtData?.sentences || []).map(s => s.src_translit || '').join(' ').trim();
      CUR_LOOKUP_AUDIO = {uk: phon.audioUk || '', us: phon.audioUs || '', word: phon.word || targetDictWord};

      if(ipaBox){
        const ipaUkTxt = phon.ipaUk || (gtPhon ? `/${gtPhon}/` : '');
        const ipaUsTxt = phon.ipaUs || ipaUkTxt;
        LAST_IPA_STR = ipaUsTxt || ipaUkTxt || '';
        const targetLbl = (targetDictWord.toLowerCase() !== cleaned.toLowerCase() && (ipaUkTxt || fdEntries))
          ? `<span class="f-cat-tag" style="margin:0">Từ trung tâm: <b>${esc(phon.word || targetDictWord)}</b></span>`
          : (phon.isLemmaOf ? `<span class="f-cat-tag" style="margin:0">Từ gốc của "${esc(phon.isLemmaOf)}": <b>${esc(phon.word)}</b></span>` : '');

        ipaBox.innerHTML = `<div class="dict-ipa-bar">
          ${targetLbl}
          <button type="button" class="ipa-pill" data-a="dict_play_uk" title="Nghe phát âm chuẩn Anh - Anh (UK)">
            <span>🇬🇧 UK</span>
            ${ipaUkTxt ? `<span class="ipa-code">${esc(ipaUkTxt)}</span>` : ''}
            <span>🔊</span>
          </button>
          <button type="button" class="ipa-pill" data-a="dict_play_us" title="Nghe phát âm chuẩn Anh - Mỹ (US)">
            <span>🇺🇸 US</span>
            ${ipaUsTxt ? `<span class="ipa-code">${esc(ipaUsTxt)}</span>` : ''}
            <span>🔊</span>
          </button>
        </div>`;
      }

      // B. HIỂN THỊ NGHĨA TIẾNG VIỆT CHÍNH & CÁC CÁCH DỊCH THEO NGỮ CẢNH KHÁC (ALTERNATIVE TRANSLATIONS)
      const trans = (gtData?.sentences || []).map(s => s.trans || '').join('').trim();
      LAST_TR = sanitizeLookupInput(trans) || trans;

      // Lấy các nghĩa thay thế từ dt=at (alternative_translations)
      const altList = [];
      if(Array.isArray(gtData?.alternative_translations)){
        for(const block of gtData.alternative_translations){
          for(const alt of (block.alternative || [])){
            const wAlt = (alt.word_postproc || '').trim();
            if(wAlt && wAlt.toLowerCase() !== LAST_TR.toLowerCase() && !altList.some(x => x.toLowerCase() === wAlt.toLowerCase())){
              altList.push(wAlt);
            }
          }
        }
      }

      if(outBox){
        const altHtml = altList.length > 0 ? `
          <div class="dict-alt-pills">
            <span class="mu" style="font-size:12px;align-self:center">🔄 Các nghĩa / cách dịch khác:</span>
            ${altList.slice(0, 6).map(a => `<span class="dict-alt-pill">${esc(a)}</span>`).join('')}
          </div>
        ` : '';

        outBox.className = 'dict-main-meaning';
        outBox.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px">
            <b style="color:var(--ok);font-size:14px">🇻🇳 Nghĩa tiếng Việt chuẩn:</b>
            <button type="button" class="gh" style="padding:3px 9px;font-size:12.5px;background:var(--cd)" data-a="ttstr">🔊 Đọc nghĩa Việt</button>
          </div>
          <div style="font-size:17px;font-weight:700;color:var(--tx);line-height:1.5">${esc(LAST_TR || 'Không tìm thấy bản dịch.')}</div>
          ${altHtml}
        `;
      }

      const vc = getVoiceCfg();
      if(vc.autoReadVi && LAST_TR) speakText(LAST_TR, 'vi');

      // C. HIỂN THỊ TỪ ĐIỂN CHI TIẾT THEO TỪ LOẠI (KẾT HỢP GOOGLE DICT + OXFORD/FREE DICT)
      const dictSource = (gtData?.dict && gtData.dict.length) ? gtData.dict : (gtHeadwordData?.dict || []);
      const dictWordTitle = (gtData?.dict && gtData.dict.length) ? cleaned : targetDictWord;
      let dictSectionsHtml = '';

      // C1. Từ điển Anh - Việt phân theo từ loại (Danh từ, Động từ, Tính từ...)
      if(dictSource && dictSource.length){
        const posBlocks = dictSource.map(d => {
          const entries = (d.entry || []).slice(0, 6);
          const rowsHtml = entries.length
            ? entries.map(en => {
                const viWord = esc(en.word || '');
                const revWords = (en.reverse_translation || []).slice(0, 5).map(esc).join(', ');
                return `<div class="dict-entry-row">
                  <span class="dict-entry-vi">• ${viWord}</span>
                  ${revWords ? `<span class="dict-entry-en">(${revWords})</span>` : ''}
                </div>`;
              }).join('')
            : `<div class="dict-entry-row"><span class="dict-entry-vi">• ${(d.terms || []).slice(0, 8).map(esc).join(', ')}</span></div>`;

          return `<div class="dict-pos-block">
            <div><span class="pos-tag">${esc(fmtPosVi(d.pos))}</span> ${d.base_form ? `<small class="mu">(Từ gốc: <b>${esc(d.base_form)}</b>)</small>` : ''}</div>
            ${rowsHtml}
          </div>`;
        }).join('');

        dictSectionsHtml += `<div class="dict-card-sec">
          <div style="font-weight:800;font-size:14px;color:var(--pr);margin-bottom:8px">📖 Từ điển Anh - Việt theo từ loại (${esc(dictWordTitle)}):</div>
          ${posBlocks}
        </div>`;
      }

      // C2. Định nghĩa Anh-Anh, Ví dụ ngữ cảnh & Từ đồng nghĩa / Trái nghĩa (từ Free Dictionary API + Google Definitions)
      if(Array.isArray(fdEntries) && fdEntries.length){
        const allMeanings = [];
        const synSet = new Set();
        const antSet = new Set();

        for(const ent of fdEntries){
          for(const m of (ent.meanings || [])){
            allMeanings.push(m);
            (m.synonyms || []).forEach(s => synSet.add(s));
            (m.antonyms || []).forEach(a => antSet.add(a));
            for(const df of (m.definitions || [])){
              (df.synonyms || []).forEach(s => synSet.add(s));
              (df.antonyms || []).forEach(a => antSet.add(a));
            }
          }
        }

        const enBlocks = allMeanings.slice(0, 4).map(m => {
          const defs = (m.definitions || []).slice(0, 2);
          return `<div class="dict-pos-block">
            <div><span class="pos-tag" style="background:linear-gradient(135deg,#4f46e5,#0e7c86)">${esc(fmtPosVi(m.partOfSpeech))}</span></div>
            ${defs.map((df, idx) => `
              <div style="margin-top:5px;font-size:13.6px;line-height:1.55">
                <b>${idx + 1}.</b> ${esc(df.definition || '')}
                ${df.example ? `<div class="dict-ex-item">💬 <i>"${esc(df.example)}"</i></div>` : ''}
              </div>
            `).join('')}
          </div>`;
        }).join('');

        const synArr = [...synSet].slice(0, 10);
        const antArr = [...antSet].slice(0, 8);
        const synAntHtml = (synArr.length || antArr.length) ? `
          <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)">
            ${synArr.length ? `<div style="margin-bottom:6px"><small class="mu"><b>🟢 Từ đồng nghĩa (Synonyms - bấm để tra):</b></small><div class="dict-syn-wrap">${synArr.map(s => `<span class="dict-syn-chip" data-a="dict_lookup_word" data-w="${esc(s)}">${esc(s)}</span>`).join('')}</div></div>` : ''}
            ${antArr.length ? `<div><small class="mu"><b>🔴 Từ trái nghĩa (Antonyms - bấm để tra):</b></small><div class="dict-syn-wrap">${antArr.map(a => `<span class="dict-syn-chip" style="color:var(--no)" data-a="dict_lookup_word" data-w="${esc(a)}">${esc(a)}</span>`).join('')}</div></div>` : ''}
          </div>
        ` : '';

        dictSectionsHtml += `<div class="dict-card-sec">
          <div style="font-weight:800;font-size:14px;color:#4f46e5;margin-bottom:8px">🇬🇧 Định nghĩa chuẩn Anh - Anh, Ví dụ & Đồng nghĩa (${esc(phon.word || targetDictWord)}):</div>
          ${enBlocks}
          ${synAntHtml}
        </div>`;
      }

      if(dictBox){
        dictBox.innerHTML = dictSectionsHtml;
      }
    } catch(err){
      if(outBox){
        outBox.innerHTML = `<span class="mu">Không kết nối được máy chủ từ điển nhanh. Hãy bấm <b>"✨ AI phân tích chuyên sâu"</b> bên dưới để tra cứu bằng AI.</span>`;
      }
    }
  }

  // Mở cửa sổ Dịch nhanh & Tra từ điển Đa Tầng
  function openUpgradedTranslateModal(initialText){
    const cleaned = sanitizeLookupInput(initialText || ST || getSelection()?.toString() || '');
    ST = cleaned;
    LOOKUP_STACK = [];
    $('#pop').style.display = 'none';
    const vc = getVoiceCfg();
    const gLbl = vc.gender === 'male' ? 'Nam' : vc.gender === 'child' ? 'Trẻ em' : 'Nữ';

    modal(`<div class="dict-modal-wrap">
      <div class="hd" style="margin-bottom:10px">
        <h3 style="margin:0">🌐 Dịch nhanh & Từ điển Anh - Việt Đa Tầng</h3>
        <div class="row" style="margin:0">
          <button type="button" class="gh" style="padding:4px 10px;font-size:12.5px" data-a="tts" title="Đọc tiếng Anh">🔊 Nghe Anh</button>
          <button type="button" class="gh" style="padding:4px 10px;font-size:12.5px" data-a="vset_tr" title="Chỉnh tốc độ, giọng Nam/Nữ">🎙 ${gLbl} · ${vc.rate}x</button>
        </div>
      </div>

      <!-- Thanh tìm kiếm & sửa từ cần tra ngay trong hộp thoại -->
      <div class="dict-search-bar">
        <span style="font-size:16px;padding-left:4px">🔍</span>
        <input id="dict-q-inp" class="dict-search-inp" value="${esc(cleaned)}" placeholder="Nhập từ vựng, cụm từ hoặc câu tiếng Anh cần tra...">
        <button type="button" class="pri" style="padding:5px 12px;font-size:13px" data-a="dict_search_go">Tra từ</button>
      </div>

      <!-- Dãy các từ đơn để bấm tra nhanh từng từ trong cụm -->
      <div id="dict-chips-box" class="dict-word-chips" style="display:none"></div>

      <!-- Thanh Phiên âm Quốc tế IPA (UK / US) -->
      <div id="tr-ipa-box"></div>

      <!-- Nghĩa tiếng Việt chính & Các nghĩa thay thế -->
      <div id="tr-out" class="tr-res">⏳ Đang nhập từ cần tra...</div>

      <!-- Từ điển chi tiết theo từ loại, Định nghĩa, Ví dụ, Đồng nghĩa / Trái nghĩa -->
      <div id="tr-dict"></div>

      <!-- Khung Phân tích Ngữ pháp & Từ vựng từ AI (Đã lọc sạch 100% ký tự thừa) -->
      <div id="tr-ai-box"></div>

      <div class="row" style="margin-top:12px;justify-content:space-between">
        <div class="row" style="margin:0">
          ${PS ? `<button type="button" class="pri" id="btn-tr-save" data-a="trsave">🖍 Highlight & Lưu từ vựng</button>` : ''}
          <button type="button" class="gh" style="border-color:var(--pr);color:var(--pr);font-weight:700" id="btn-tr-ai" data-a="trai">✨ AI phân tích ngữ pháp & từ vựng</button>
        </div>
        <button type="button" class="gh" data-a="close">Đóng</button>
      </div>
    </div>`);

    const inp = $('#dict-q-inp');
    inp?.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        act.dict_search_go();
      }
    });

    if(cleaned){
      performDictionaryLookup(cleaned, false);
    } else {
      setTimeout(() => inp?.focus(), 30);
    }
  }

  // Ghi đè act.tr, act.trai, act.trsave và bổ sung các action tra từ mới
  Object.assign(act, {
    tr(){
      const rawSel = (ST || getSelection()?.toString() || '').trim();
      openUpgradedTranslateModal(rawSel);
    },
    open_dict(){
      PS = null;
      const sel = getSelection()?.toString().trim() || '';
      openUpgradedTranslateModal(sel);
    },
    dict_search_go(){
      const v = ($('#dict-q-inp')?.value || '').trim();
      if(!v) return;
      $('#tr-ai-box').innerHTML = '';
      const aiBtn = $('#btn-tr-ai');
      if(aiBtn) aiBtn.disabled = false;
      performDictionaryLookup(v, true);
    },
    dict_lookup_word(d){
      const w = (d.w || '').trim();
      if(!w) return;
      $('#tr-ai-box').innerHTML = '';
      const aiBtn = $('#btn-tr-ai');
      if(aiBtn) aiBtn.disabled = false;
      performDictionaryLookup(w, true);
    },
    dict_pop_back(){
      const prev = LOOKUP_STACK.pop();
      if(!prev) return;
      $('#tr-ai-box').innerHTML = '';
      const aiBtn = $('#btn-tr-ai');
      if(aiBtn) aiBtn.disabled = false;
      performDictionaryLookup(prev, false);
    },
    dict_play_uk(){
      playDictAudio(CUR_LOOKUP_AUDIO.uk, CUR_LOOKUP_AUDIO.word || ST, 'en-GB');
    },
    dict_play_us(){
      playDictAudio(CUR_LOOKUP_AUDIO.us, CUR_LOOKUP_AUDIO.word || ST, 'en-US');
    },
    trsave(){
      if(!PS) return;
      const ipaPart = LAST_IPA_STR ? ` ${LAST_IPA_STR}` : '';
      const note = LAST_TR ? `${ST}${ipaPart}: ${LAST_TR}` : ST;
      addH(note);
      modal('');
    },
    async trai(){
      const box = $('#tr-ai-box'), btn = $('#btn-tr-ai');
      const queryTxt = sanitizeLookupInput($('#dict-q-inp')?.value || ST);
      if(!box || !queryTxt) return;
      ST = queryTxt;
      if(btn) btn.disabled = true;
      box.innerHTML = `<div class="tr-ai-clean">⏳ <b>AI đang phân tích chuyên sâu cho "${esc(queryTxt)}"...</b></div>`;

      const prompt = `Bạn là từ điển học thuật Anh - Việt chuyên luyện thi. Hãy phân tích ngắn gọn, súc tích, dễ hiểu từ/cụm từ/câu tiếng Anh sau: "${queryTxt}".
TUYỆT ĐỐI KHÔNG viết câu chào hỏi hay câu dẫn nhập ("Dưới đây là..."). Trình bày trực tiếp theo đúng 4 mục sau:
### 1. 🎯 Nghĩa chuẩn xác theo ngữ cảnh
- Nghĩa phổ biến: ...
- Nghĩa học thuật / trang trọng (nếu có): ...
### 2. 🔤 Phiên âm IPA, Từ loại & Gia đình từ (Word Family)
- Phiên âm IPA (UK/US) & Từ loại của "${queryTxt}".
- Các từ cùng gốc (Danh từ, Động từ, Tính từ, Trạng từ) kèm nghĩa ngắn gọn.
### 3. 🧩 Cấu trúc ngữ pháp, Collocations & Từ đồng nghĩa
- Các cụm từ cố định (Collocations / Phrasal verbs / Giới từ đi kèm) hay ra thi.
- Từ đồng nghĩa (Synonyms) & Trái nghĩa (Antonyms) sát nghĩa nhất.
### 4. 💬 Ví dụ thực tế trong bài thi
- 1-2 câu ví dụ tiếng Anh ngắn gọn kèm bản dịch tiếng Việt.`;

      try {
        const gKey = (localStorage.getItem('gemini_api_key') || '').trim();
        let ansText = '';
        if(gKey){
          const res = await callGeminiWithSmartFallback([{text: prompt}], gKey, false);
          ansText = res.raw || '';
        } else if(window.claude){
          const s = await window.claude.use('sample');
          ansText = await s.text(prompt);
        } else {
          throw new Error('Hãy cài Gemini API Key ở mục "⚙ Cài đặt AI" cột bên trái để dùng tính năng AI phân tích chuyên sâu.');
        }

        if(!LAST_TR){
          const firstLine = ansText.split(/\r?\n/).find(l => l.trim() && !l.trim().startsWith('#')) || '';
          LAST_TR = sanitizeLookupInput(firstLine);
        }

        // Chuyển đổi toàn bộ phản hồi AI qua bộ lọc renderCleanMarkdown -> Không bao giờ còn ký tự **, ###, * thừa!
        box.innerHTML = `<div class="tr-ai-clean">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1.5px solid var(--bd)">
            <b style="color:var(--pr);font-size:15px">✨ Phân tích Chuyên sâu từ AI (${esc(queryTxt)})</b>
            <span class="badge" style="margin:0">Chuẩn luyện thi</span>
          </div>

        <div class="row" style="margin-top:8px">
          ${parentW ? `<button type="button" class="pri" data-a="mv_quick_out" data-f="${cur.id}">⬅ Đưa ra ngoài "${esc(parentW.name)}" (Ra 1 cấp)</button>` : ''}
          ${cur.pid ? `<button type="button" class="gh" data-a="mv_quick_root" data-f="${cur.id}">🏠 Đưa hẳn ra ngoài cùng (Cấp gốc)</button>` : ''}
          ${sIdx > 0 ? `<button type="button" class="gh" data-a="mv_quick_in" data-f="${cur.id}">➡ Đưa vào trong "${esc(sibs[sIdx-1].name)}"</button>` : ''}
          ${sIdx > 0 ? `<button type="button" class="gh" data-a="mv_quick_up" data-f="${cur.id}">⬆ Đẩy lên trên</button>` : ''}
          ${sIdx >= 0 && sIdx < sibs.length - 1 ? `<button type="button" class="gh" data-a="mv_quick_dn" data-f="${cur.id}">⬇ Đẩy xuống dưới</button>` : ''}
        </div>
      </div>

      ${D.cats && D.cats.length ? `
        <p><b>🏷 Hoặc đưa ra làm Thư mục gốc thuộc Đầu mục phân loại:</b></p>
        <div class="row" style="margin-bottom:10px">
          ${D.cats.map(c => `<button type="button" class="gh ${(!cur.pid && cur.cat===c.id)?' on':''}" style="${(!cur.pid && cur.cat===c.id)?'border-color:var(--pr);color:var(--pr);font-weight:700':''}" data-a="mv_to_cat" data-c="${c.id}">🏷 ${esc(c.name)}</button>`).join('')}
          <button type="button" class="gh ${(!cur.pid && !cur.cat)?' on':''}" data-a="mv_to_cat" data-c="">📂 Chưa phân loại</button>
        </div>
      ` : ''}

      <p><b>📁 Hoặc chọn thư mục đích để đưa “${esc(cur.name)}” vào bên trong:</b></p>
      <div class="mv-dest-list">
        <div class="op ${!cur.pid ? 'sel' : ''}" data-a="mv2" data-t="">
          <span>🏠 <b>Ngoài cùng (Không nằm trong thư mục nào)</b></span>
        </div>
        ${treeOpts.map(o => `
          <div class="op ${(cur.pid || '') === o.id ? 'sel' : ''}" style="margin-left:${(o.dp + 1) * 16}px" data-a="mv2" data-t="${o.id}">
            <span>📁 ${esc(o.name)} ${parentW && parentW.id === o.id ? '<small class="mu">(Thư mục cha hiện tại)</small>' : ''}</span>
          </div>
        `).join('')}
      </div>

      <div class="row" style="margin-top:12px;justify-content:flex-end">
        <button class="gh" data-a="close">Đóng</button>
      </div>`);
  };

  act.mv2 = function(d){
    const targetId = d.t || '';
    const w = D.weeks.find(x => x.id === MV);
    if(!w) return;
    withPreservedActiveWeek(() => {
      if(!targetId){
        const keepCat = getEffectiveCat(w);
        w.pid = '';
        w.cat = keepCat;
      } else {
        if(MV === targetId || desc(MV).has(targetId)) return;
        w.pid = targetId;
        w.cat = '';
        EXP_SET.add(targetId);
        saveExp();
      }
    });
    save();
    if(window.SFX) window.SFX.ding();
    modal('');
    render();
  };

  // --- DI CHUYỂN BÀI THI (EXAMS) & FILE TÀI LIỆU (FILES) VÀO TRONG / RA NGOÀI / SANG MỤC KHÁC ---
  let MV_EXAM_CTX = null; // {wi, ei}
  let MV_FILE_CTX = null; // {scope: 'week'|'exam', wi, ei, fi}

  function moveExamToFolder(fromWi, ei, targetWid){
    const srcW = D.weeks[fromWi];
    const ex = srcW?.exams?.[ei];
    const dstW = D.weeks.find(w => w.id === targetWid);
    if(!srcW || !ex || !dstW || srcW.id === dstW.id) return false;

    srcW.exams.splice(ei, 1);
    dstW.exams = dstW.exams || [];
    dstW.exams.push(ex);

    // Đồng bộ lịch sử làm bài, sổ tay câu sai và phiên tạm dừng theo thư mục mới
    (D.hist || []).forEach(h => {
      if((h.ex && h.ex.id === ex.id) || (h.title === ex.title && h.wid === srcW.id)){
        h.wid = dstW.id;
        h.week = dstW.name;
      }
    });
    if(D.mistakeStore){
      for(const m of Object.values(D.mistakeStore)){
        if(m && (m.examId === ex.id || (m.examTitle === ex.title && m.wid === srcW.id))){
          m.wid = dstW.id;
          m.weekName = dstW.name;
        }
      }
    }
    if(D.savedSessions){
      for(const s of Object.values(D.savedSessions)){
        if(s && (s.examId === ex.id || (s.title === ex.title && s.wid === srcW.id))){
          s.wid = dstW.id;
          s.weekName = dstW.name;
        }
      }
    }
    if(typeof window.markMistakesDirty === 'function') window.markMistakesDirty();
    save();
    if(window.SFX) window.SFX.ding();
    return true;
  }

  function openMoveExamModal(wi, ei){
    const w = D.weeks[wi];
    const ex = w?.exams?.[ei];
    if(!w || !ex) return;
    MV_EXAM_CTX = {wi, ei};
    const parentW = w.pid ? D.weeks.find(x => x.id === w.pid) : null;
    const subFolders = kids(w.id).map(([k]) => k);

    const allFolders = [];
    const walk = (p, dp) => kids(p).forEach(([fw]) => {
      allFolders.push({id: fw.id, name: fw.name, dp, isCur: fw.id === w.id});
      walk(fw.id, dp + 1);
    });
    walk('', 0);

    modal(`<h3>⇄ Di chuyển Bài thi “${esc(ex.title)}”</h3>
      <p class="mu" style="margin-top:0">Đang nằm tại: <b>📁 ${esc(pathOf(w.id))}</b></p>

      ${(parentW || subFolders.length || w.exams.length > 1) ? `
        <div style="background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px">
          <b>⚡ Di chuyển nhanh Vào trong / Ra ngoài / Đổi thứ tự:</b>
          <div class="row" style="margin-top:8px">
            ${parentW ? `<button type="button" class="pri" data-a="mve_to_folder" data-t="${parentW.id}">⬅ Đưa ra ngoài thư mục cha (${esc(parentW.name)})</button>` : ''}
            ${subFolders.map(sf => `<button type="button" class="gh" style="border-color:var(--pr);color:var(--pr)" data-a="mve_to_folder" data-t="${sf.id}">➡ Đưa vào trong "${esc(sf.name)}"</button>`).join('')}
            ${ei > 0 ? `<button type="button" class="gh" data-a="mve_shift" data-dir="-1">⬆ Đẩy lên trên</button>` : ''}
            ${ei < w.exams.length - 1 ? `<button type="button" class="gh" data-a="mve_shift" data-dir="1">⬇ Đẩy xuống dưới</button>` : ''}
          </div>
        </div>
      ` : ''}

      <p><b>📂 Chọn thư mục đích bất kỳ để chuyển bài thi này tới:</b></p>
      <div class="mv-dest-list">
        ${allFolders.map(f => `
          <div class="op ${f.isCur ? 'sel' : ''}" style="margin-left:${f.dp * 16}px" data-a="mve_to_folder" data-t="${f.id}">
            <span>📁 ${esc(f.name)} ${f.isCur ? '<small class="mu">(Thư mục hiện tại)</small>' : ''}</span>
          </div>
        `).join('')}
      </div>

      <div class="row" style="margin-top:12px;justify-content:flex-end">
        <button class="gh" data-a="close">Đóng</button>
      </div>`);
  }

  function openMoveFileModal(scope, wi, ei, fi){
    const w = D.weeks[wi];
    if(!w) return;
    const isFromExam = scope === 'exam';
    const srcEx = isFromExam ? w.exams?.[ei] : null;
    const fileObj = isFromExam ? srcEx?.files?.[fi] : w.files?.[fi];
    if(!fileObj) return;

    MV_FILE_CTX = {scope, wi, ei, fi};
    const parentW = w.pid ? D.weeks.find(x => x.id === w.pid) : null;
    const subFolders = kids(w.id).map(([k]) => k);
    const examsInFolder = w.exams || [];

    const allFolders = [];
    const walk = (p, dp) => kids(p).forEach(([fw]) => {
      allFolders.push({id: fw.id, name: fw.name, dp, isCur: (!isFromExam && fw.id === w.id)});
      walk(fw.id, dp + 1);
    });
    walk('', 0);

    modal(`<h3>⇄ Di chuyển File “${esc(fileObj.title || fileObj.name)}”</h3>
      <p class="mu" style="margin-top:0">Vị trí hiện tại: <b>${isFromExam ? `📘 Bài thi "${esc(srcEx.title)}" (trong 📁 ${esc(w.name)})` : `📁 Thư mục "${esc(pathOf(w.id))}"`}</b></p>

      <div style="background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px">
        <b>⚡ Đưa File Vào trong / Ra ngoài nhanh:</b>
        <div class="row" style="margin-top:8px">
          ${isFromExam ? `
            <button type="button" class="pri" data-a="mvf_to_folder" data-t="${w.id}">⬅ Đưa File ra ngoài Thư mục "${esc(w.name)}"</button>
          ` : ''}
          ${parentW ? `
            <button type="button" class="pri" data-a="mvf_to_folder" data-t="${parentW.id}">⬅ Đưa File ra ngoài thư mục cha "${esc(parentW.name)}"</button>
          ` : ''}
          ${subFolders.map(sf => `
            <button type="button" class="gh" style="border-color:var(--pr);color:var(--pr)" data-a="mvf_to_folder" data-t="${sf.id}">➡ Đưa vào trong thư mục "${esc(sf.name)}"</button>
          `).join('')}
        </div>
      </div>

      ${examsInFolder.length ? `
        <p><b>📘 Đưa File vào đính kèm bên trong một Bài thi của thư mục "${esc(w.name)}":</b></p>
        <div class="mv-dest-list" style="max-height:140px;margin-bottom:10px">
          ${examsInFolder.map((exItem, exIdx) => `
            <div class="op ${(isFromExam && ei === exIdx) ? 'sel' : ''}" data-a="mvf_to_exam" data-ei="${exIdx}">
              <span>📘 <b>${esc(exItem.title)}</b> ${(isFromExam && ei === exIdx) ? '<small class="mu">(Đang ở bài này)</small>' : ''}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}

      <p><b>📂 Hoặc chuyển File sang Thư mục khác:</b></p>
      <div class="mv-dest-list" style="max-height:190px">
        ${allFolders.map(f => `
          <div class="op ${f.isCur ? 'sel' : ''}" style="margin-left:${f.dp * 16}px" data-a="mvf_to_folder" data-t="${f.id}">
            <span>📁 ${esc(f.name)} ${f.isCur ? '<small class="mu">(Thư mục hiện tại)</small>' : ''}</span>
          </div>
        `).join('')}
      </div>

      <div class="row" style="margin-top:12px;justify-content:flex-end">
        <button class="gh" data-a="close">Đóng</button>
      </div>`);
  }

  // --- NÂNG CẤP TRANG THƯ MỤC CHÍNH (renderWeek) ĐỂ THÊM BREADCRUMB TƯƠNG TÁC & CÁC NÚT DI CHUYỂN ---
  const origRenderWeek37 = renderWeek;
  renderWeek = function(m){
    origRenderWeek37(m);
    const w = D.weeks[V.wi];
    if(!w) return;
    const pg = m.querySelector('.pg');
    if(!pg) return;

    // 1. Nâng cấp đường dẫn Breadcrumb (<small class="mu">) thành Thanh đường dẫn bấm được từng cấp
    const oldBc = pg.querySelector(':scope > small.mu');
    if(oldBc){
      const chain = [];
      let cur = w;
      const visited = new Set();
      while(cur && !visited.has(cur.id)){
        visited.add(cur.id);
        chain.unshift(cur);
        cur = cur.pid ? D.weeks.find(x => x.id === cur.pid) : null;
      }
      const effCatId = getEffectiveCat(w);
      const catObj = effCatId ? (D.cats || []).find(c => c.id === effCatId) : null;
      const parentW = w.pid ? D.weeks.find(x => x.id === w.pid) : null;

      const bcHtml = `<div class="interactive-bc no-print">
        <span class="bc-item" data-a="stats" title="Về trang Tổng quan">🏠 Tất cả</span>
        ${catObj ? `<span class="bc-sep">›</span><span class="bc-item" data-a="sc" data-c="${catObj.id}">🏷 ${esc(catObj.name)}</span>` : ''}
        ${chain.map((item, idx) => {
          const wIdx = D.weeks.indexOf(item);
          const isLast = idx === chain.length - 1;
          return `<span class="bc-sep">›</span><span class="bc-item ${isLast ? 'cur' : ''}" ${isLast ? '' : `data-a="week" data-i="${wIdx}"`}>📁 ${esc(item.name)}</span>`;
        }).join('')}
        ${parentW ? `
          <div style="margin-left:auto;display:flex;gap:5px">
            <button type="button" class="subf-qbtn" style="border-color:var(--pr)!important;color:var(--pr)!important" data-a="f_outdent" data-f="${w.id}" title="Đưa thư mục ${esc(w.name)} ra ngoài ${esc(parentW.name)} 1 cấp">⬅ Đưa mục này ra ngoài "${esc(parentW.name)}"</button>
          </div>
        ` : ''}
      </div>`;
      oldBc.outerHTML = bcHtml;
    }

    // 2. Thêm các nút điều khiển nhanh (⬅ Ra ngoài, ➡ Vào trong, ⬆, ⬇, ⇄) vào từng thẻ Thư mục con (.kp > div[data-a="week"])
    const subCards = pg.querySelectorAll('.kp > div[data-a="week"]');
    subCards.forEach(card => {
      const childWi = +card.dataset.i;
      const childW = D.weeks[childWi];
      if(!childW) return;
      const sibs = getSiblingsOf(childW);
      const sIdx = sibs.indexOf(childW);
      card.insertAdjacentHTML('beforeend', `
        <div class="subf-quick-bar no-print">
          <button type="button" class="subf-qbtn" data-a="f_outdent" data-f="${childW.id}" title="Đưa thư mục con này ra ngoài 1 cấp (ngang hàng với ${esc(w.name)})">⬅ Ra ngoài</button>
          ${sIdx > 0 ? `<button type="button" class="subf-qbtn" data-a="f_indent" data-f="${childW.id}" title="Đưa vào trong thư mục ${esc(sibs[sIdx-1].name)}">➡ Vào trong</button>` : ''}
          ${sIdx > 0 ? `<button type="button" class="subf-qbtn" data-a="f_up" data-f="${childW.id}" title="Đẩy lên trước">⬆</button>` : ''}
          ${sIdx < sibs.length - 1 ? `<button type="button" class="subf-qbtn" data-a="f_down" data-f="${childW.id}" title="Đẩy xuống sau">⬇</button>` : ''}
          <button type="button" class="subf-qbtn" data-a="mv" data-f="${childW.id}" title="Chọn vị trí di chuyển tới">⇄ Chuyển</button>
        </div>
      `);
    });

    // 3. Thêm nút "⇄ Di chuyển" và "⬆ / ⬇" cho từng File tài liệu trong thư mục (viewf_w)
    pg.querySelectorAll('button[data-a="viewf_w"]').forEach(viewBtn => {
      const fi = +viewBtn.dataset.fi;
      const row = viewBtn.parentElement;
      if(!row || row.querySelector('[data-a="mvf_open_w"]')) return;
      viewBtn.insertAdjacentHTML('afterend', `
        <button type="button" class="gh" style="padding:5px 10px;font-size:13px;border-color:var(--pr);color:var(--pr)" data-a="mvf_open_w" data-fi="${fi}" title="Di chuyển file này ra ngoài, vào thư mục con hoặc gắn vào bài thi">⇄ Di chuyển</button>
        ${fi > 0 ? `<button type="button" class="gh" style="padding:5px 8px;font-size:12px" data-a="mvf_shift_w" data-fi="${fi}" data-dir="-1" title="Đẩy file lên trên">⬆</button>` : ''}
        ${fi < (w.files?.length || 0) - 1 ? `<button type="button" class="gh" style="padding:5px 8px;font-size:12px" data-a="mvf_shift_w" data-fi="${fi}" data-dir="1" title="Đẩy file xuống dưới">⬇</button>` : ''}
      `);
    });

    // 4. Thêm nút "⇄" nhỏ trên từng pill file đính kèm trong bài thi (.f-pill[data-a="viewf_e"]) để rút ra ngoài thư mục hoặc chuyển bài
    pg.querySelectorAll('.f-pill[data-a="viewf_e"]').forEach(pill => {
      const ei = +pill.dataset.ei;
      const fi = +pill.dataset.fi;
      if(pill.querySelector('[data-a="mvf_open_e"]')) return;
      pill.insertAdjacentHTML('beforeend', `<span class="f-act" data-a="mvf_open_e" data-ei="${ei}" data-fi="${fi}" title="Di chuyển file này ra ngoài thư mục hoặc sang bài khác">⇄</span>`);
    });

    // 5. Thêm nút "⇄ Di chuyển" và "⬆ / ⬇" cho từng Bài thi (w.exams)
    pg.querySelectorAll('button[data-a="edite"]').forEach(editBtn => {
      const ei = +editBtn.dataset.i;
      const row = editBtn.parentElement;
      if(!row || row.querySelector('[data-a="mve_open"]')) return;
      editBtn.insertAdjacentHTML('afterend', `
        <button type="button" class="gh" data-a="mve_open" data-i="${ei}" title="Di chuyển bài thi này ra ngoài, vào thư mục con hoặc sang mục khác">⇄ Di chuyển</button>
        ${ei > 0 ? `<button type="button" class="gh" style="padding:6px 9px" data-a="mve_shift_inline" data-i="${ei}" data-dir="-1" title="Đẩy bài thi lên trên">⬆</button>` : ''}
        ${ei < (w.exams?.length || 0) - 1 ? `<button type="button" class="gh" style="padding:6px 9px" data-a="mve_shift_inline" data-i="${ei}" data-dir="1" title="Đẩy bài thi xuống dưới">⬇</button>` : ''}
      `);
    });
  };

  // --- ĐĂNG KÝ TẤT CẢ CÁC ACTION DI CHUYỂN ---
  Object.assign(act, {
    f_outdent(d){
      outdentFolder(d.f);
    },
    f_indent(d){
      indentFolder(d.f);
    },
    f_up(d){
      shiftFolderOrder(d.f, -1);
    },
    f_down(d){
      shiftFolderOrder(d.f, 1);
    },
    mv_quick_out(d){
      modal('');
      outdentFolder(d.f);
    },
    mv_quick_root(d){
      const w = D.weeks.find(x => x.id === d.f);
      if(!w) return;
      withPreservedActiveWeek(() => {
        w.cat = getEffectiveCat(w);
        w.pid = '';
      });
      save();
      if(window.SFX) window.SFX.ding();
      modal('');
      render();
    },
    mv_quick_in(d){
      modal('');
      indentFolder(d.f);
    },
    mv_quick_up(d){
      shiftFolderOrder(d.f, -1);
      act.mv({f: d.f});
    },
    mv_quick_dn(d){
      shiftFolderOrder(d.f, 1);
      act.mv({f: d.f});
    },
    mv_to_cat(d){
      const w = D.weeks.find(x => x.id === MV);
      if(!w) return;
      withPreservedActiveWeek(() => {
        w.pid = '';
        w.cat = d.c || '';
      });
      save();
      if(window.SFX) window.SFX.ding();
      modal('');
      render();
    },

    // Action di chuyển Bài thi
    mve_open(d){
      openMoveExamModal(V.wi, +d.i);
    },
    mve_to_folder(d){
      if(!MV_EXAM_CTX) return;
      const ok = moveExamToFolder(MV_EXAM_CTX.wi, MV_EXAM_CTX.ei, d.t);
      modal('');
      if(ok) render();
    },
    mve_shift(d){
      if(!MV_EXAM_CTX) return;
      const w = D.weeks[MV_EXAM_CTX.wi];
      const ei = MV_EXAM_CTX.ei;
      const ni = ei + (+d.dir);
      if(!w?.exams || ni < 0 || ni >= w.exams.length) return;
      const tmp = w.exams[ei];
      w.exams[ei] = w.exams[ni];
      w.exams[ni] = tmp;
      MV_EXAM_CTX.ei = ni;
      save();
      if(window.SFX) window.SFX.tap();
      openMoveExamModal(MV_EXAM_CTX.wi, ni);
      render();
    },
    mve_shift_inline(d){
      const w = D.weeks[V.wi];
      const ei = +d.i;
      const ni = ei + (+d.dir);
      if(!w?.exams || ni < 0 || ni >= w.exams.length) return;
      const tmp = w.exams[ei];
      w.exams[ei] = w.exams[ni];
      w.exams[ni] = tmp;
      save();
      if(window.SFX) window.SFX.tap();
      render();
    },

    // Action di chuyển File tài liệu
    mvf_open_w(d){
      openMoveFileModal('week', V.wi, -1, +d.fi);
    },
    mvf_open_e(d){
      openMoveFileModal('exam', V.wi, +d.ei, +d.fi);
    },
    mvf_shift_w(d){
      const w = D.weeks[V.wi];
      const fi = +d.fi;
      const nfi = fi + (+d.dir);
      if(!w?.files || nfi < 0 || nfi >= w.files.length) return;
      const tmp = w.files[fi];
      w.files[fi] = w.files[nfi];
      w.files[nfi] = tmp;
      save();
      if(window.SFX) window.SFX.tap();
      render();
    },
    mvf_to_folder(d){
      if(!MV_FILE_CTX) return;
      const {scope, wi, ei, fi} = MV_FILE_CTX;
      const srcW = D.weeks[wi];
      const dstW = D.weeks.find(w => w.id === d.t);
      if(!srcW || !dstW) return;
      if(scope === 'week' && srcW.id === dstW.id){ modal(''); return; }

      const srcArr = scope === 'exam' ? srcW.exams?.[ei]?.files : srcW.files;
      if(!srcArr || !srcArr[fi]) return;
      const [fileObj] = srcArr.splice(fi, 1);
      dstW.files = dstW.files || [];
      dstW.files.push(fileObj);

      save();
      if(window.SFX) window.SFX.ding();
      modal('');
      render();
    },
    mvf_to_exam(d){
      if(!MV_FILE_CTX) return;
      const {scope, wi, ei, fi} = MV_FILE_CTX;
      const targetEi = +d.ei;
      const srcW = D.weeks[wi];
      const dstEx = srcW?.exams?.[targetEi];
      if(!srcW || !dstEx) return;
      if(scope === 'exam' && ei === targetEi){ modal(''); return; }

      const srcArr = scope === 'exam' ? srcW.exams?.[ei]?.files : srcW.files;
      if(!srcArr || !srcArr[fi]) return;
      const [fileObj] = srcArr.splice(fi, 1);
      dstEx.files = dstEx.files || [];
      dstEx.files.push(fileObj);

      save();
      if(window.SFX) window.SFX.ding();
      modal('');
      render();
    }
  });

  render();
})();


/* === BẢN NÂNG CẤP V39: CHẤM ĐIỂM TỪNG PHẦN (LÀM TRƯỚC CHẤM TRƯỚC, CÂU CÒN LẠI LÀM SAU CHẤM TIẾP) & TỔNG HỢP VỀ 1 BÀI DUY NHẤT (GỘP ĐIỂM + CỘNG DỒN TỔNG THỜI GIAN) === */
