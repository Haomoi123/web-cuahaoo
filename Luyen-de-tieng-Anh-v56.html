      background: var(--bg);
      border: 1px dashed var(--bd);
      border-radius: 9px;
    }
    .match-qpill {
      min-width: 32px;
      height: 30px;
      padding: 0 8px;
      border-radius: 7px;
      border: 1.5px solid var(--bd);
      background: var(--cd);
      color: var(--tx);
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .match-qpill:hover:not(:disabled) {
      border-color: var(--pr);
      color: var(--pr);
      transform: translateY(-2px);
    }
    .match-qpill.sel {
      background: linear-gradient(135deg, var(--pr), var(--pr2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 3px 9px var(--pr-glow);
      transform: scale(1.06);
    }
    .match-qpill.ok {
      background: var(--ok) !important;
      color: #fff !important;
      border-color: var(--ok) !important;
    }
    .match-qpill.no {
      background: var(--no) !important;
      color: #fff !important;
      border-color: var(--no) !important;
    }
    .tf-tag.classify-tag {
      background: rgba(99, 102, 241, 0.12);
      color: #4f46e5;
      border-color: rgba(99, 102, 241, 0.35);
    }
    .tf-tag.match-tag {
      background: rgba(14, 124, 134, 0.12);
      color: var(--pr);
      border-color: rgba(14, 124, 134, 0.35);
    }
  `;
  document.head.appendChild(st40);

  // --- 1. CHUẨN HÓA THÔNG MINH CÁC NHÓM CÂU HỎI GHÉP CỘT (MATCH) & PHÂN LOẠI (CLASSIFY) ---
  function extractShortColBadge(optText, fallbackIdx){
    const s = String(optText || '').trim();
    if(!s) return ltr[fallbackIdx] || String(fallbackIdx + 1);
    // Nếu dạng "PG (Perfect Gerund)" hoặc "Perfect Gerund (PG)" -> lấy "PG"
    const parenMatch = s.match(/\(([A-Z0-9]{1,5})\)/);
    if(parenMatch) return parenMatch[1];
    const leadCode = s.match(/^([A-Z]{2,5})(?:\s*[-–:\(]|$)/);
    if(leadCode) return leadCode[1];
    if(s.length <= 6) return s.toUpperCase();
    return s.split(/\s+/)[0].slice(0, 6).toUpperCase();
  }

  function extractMatchLetter(optText, idx){
    const m = String(optText || '').trim().match(/^([a-zA-Z])[\.\)]/);
    if(m) return m[1].toLowerCase();
    return String.fromCharCode(97 + idx);
  }

  function stripMatchPrefix(optText){
    return String(optText || '').trim().replace(/^[a-zA-Z][\.\)]\s*/, '');
  }

  // Đồng bộ danh sách phương án trong cùng 1 nhóm Matching hoặc Classification
  function postProcessGroupsForNewTypes(ex){
    if(!ex || !ex.groups || !ex.qs) return;
    ex.groups.forEach((g, gi) => {
      const gQs = ex.qs.filter(q => q.g === gi);
      if(!gQs.length) return;
      const instrNorm = String(g.instr || '').toLowerCase();

      // A. Nhận diện nhóm Ghép cột (Column A - Column B) dựa trên instr hoặc câu hỏi trong nhóm
      const isMatchGroup = (
        /match\b.*column\s*a.*column\s*b|column\s*a.*column\s*b/i.test(instrNorm) ||
        gQs.some(q => q.type === 'match')
      );
      if(isMatchGroup){
        // Tìm mảng opts đầy đủ nhất trong nhóm (phòng trường hợp AI chỉ gắn đủ Column B ở câu đầu tiên)
        let longestOpts = [];
        for(const q of gQs){
          const valid = (q.opts || []).map(x => String(x ?? '').trim()).filter(Boolean);
          if(valid.length > longestOpts.length) longestOpts = valid;
        }
        if(longestOpts.length >= 2){
          const normalizedColB = longestOpts.map((x, idx) => {
            const ch = String.fromCharCode(97 + idx);
            return /^[a-z][\.\)]\s+/i.test(x) ? x : `${ch}. ${x}`;
          });
          gQs.forEach(q => {
            q.type = 'match';
            const curValid = (q.opts || []).map(x => String(x ?? '').trim()).filter(Boolean);
            if(curValid.length < normalizedColB.length){
              q.opts = normalizedColB.slice();
            } else {
              q.opts = curValid.map((x, idx) => {
                const ch = String.fromCharCode(97 + idx);
                return /^[a-z][\.\)]\s+/i.test(x) ? x : `${ch}. ${x}`;
              });
            }
            q.ans = resolveAnsIndex(q.ans, q.opts, q.correctText);
            q.correctText = q.opts[q.ans] || '';
          });
        }
        return;
      }

      // B. Nhận diện nhóm Phân loại cột bảng (PG / PP, Active / Passive, v.v.) — Loại trừ hoàn toàn bài Tự luận Viết lại câu (rewrite)
      const isRewriteInstr = /\brewrite\b|\bcomplete\s+the\s+(?:second\s+)?sentence|\bfinish\s+each\b|\bsentence\s+transformation/i.test(instrNorm);
      const isClassifyGroup = !isRewriteInstr && (
        /marking\s+the\s+appropriate\s+column|identify\s+whether\s+the\s+underlined\s+phrase|\(\s*pg\s*\).*\(\s*pp\s*\)/i.test(instrNorm) ||
        gQs.some(q => q.type === 'classify' && !/_{3,}|✍️/.test(String(q.q || '')))
      );
      if(isClassifyGroup){
        let defaultCols = ['PG (Perfect Gerund)', 'PP (Perfect Participle)'];
        for(const q of gQs){
          const valid = (q.opts || []).map(x => String(x ?? '').trim()).filter(Boolean);
          if(valid.length >= 2){ defaultCols = valid; break; }
        }
        gQs.forEach(q => {
          q.type = 'classify';
          const curValid = (q.opts || []).map(x => String(x ?? '').trim()).filter(Boolean);
          q.opts = curValid.length >= 2 ? curValid : defaultCols.slice();
          q.ans = resolveAnsIndex(q.ans, q.opts, q.correctText);
          q.correctText = q.opts[q.ans] || '';
          q.q = autoUnderlineParticiplePhrase(q.q || '');
        });
      }
    });
  }

  const origNormalizeParsedData39 = normalizeParsedData;
  normalizeParsedData = function(r){
    const res = origNormalizeParsedData39(r);
    postProcessGroupsForNewTypes(res);
    return res;
  };

  const origDraftToExam39 = draftToExam;
  draftToExam = function(draft){
    const ex = origDraftToExam39(draft);
    postProcessGroupsForNewTypes(ex);
    return ex;
  };

  // Không trộn thứ tự phương án (perm) khi câu hỏi thuộc dạng 'match' hoặc 'classify'
  const origStart39 = start;
  start = function(ei, min, sh, layoutMode){
    origStart39(ei, min, sh, layoutMode);
    if(V && V.ex && V.perm){
      V.perm = V.ex.qs.map((q, qi) => {
        if(q.type === 'match' || q.type === 'classify' || q.type === 'tf'){
          return getValidOptIndices(q);
        }
        return V.perm[qi];
      });
    }
  };

  // --- 2. HÀM DỰNG BẢNG TƯƠNG TÁC CHO DẠNG GHÉP CỘT (COLUMN A - COLUMN B) & PHÂN LOẠI (PG / PP) ---
  function isQuestionGradedV40(qi){
    if(!V || !V.ex) return false;
    const hasGradedMap = V.gradedQs && Object.keys(V.gradedQs).length > 0;
    if(V.rev){
      if(V.h?.partial && hasGradedMap && !V.showUngradedKey){
        return !!V.gradedQs[qi];
      }
      return true;
    }
    return !!(V.gradedQs && V.gradedQs[qi]);
  }

  function isQuestionOkV40(qi){
    const q = V?.ex?.qs?.[qi];
    if(!q) return false;
    return q.type === 'fill' ? isFillOk(q, V.ans?.[qi]) : V.ans?.[qi] === q.ans;
  }

  // A. Dựng Bảng Ghép Cột 3 Cột (Column A | Column B | Your Answer) y hệt Ảnh 1
  function buildMatchingGroupTableHtml(gi, qIndices, nmFn){
    if(!qIndices.length || !V?.ex) return '';
    const firstQ = V.ex.qs[qIndices[0]];
    const colBOpts = (firstQ?.opts || []);
    const rowCount = Math.max(qIndices.length, colBOpts.length);

    // Map xem mỗi phương án oi ở Column B đang được ghép với những câu nào ở Column A
    const usedByMap = new Map();
    qIndices.forEach(qi => {
      const a = V.ans?.[qi];
      if(a !== undefined && a !== null && a !== ''){
        if(!usedByMap.has(+a)) usedByMap.set(+a, []);
        usedByMap.get(+a).push(nmFn(qi));
      }
    });

    const rowsHtml = [];
    for(let r = 0; r < rowCount; r++){
      const qi = qIndices[r];
      const hasQ = qi !== undefined;
      const q = hasQ ? V.ex.qs[qi] : null;
      const qNum = hasQ ? nmFn(qi) : '';
      const qGraded = hasQ ? isQuestionGradedV40(qi) : false;
      const uAns = hasQ ? V.ans?.[qi] : undefined;
      const isCur = hasQ && V.cur === qi;

      // Cột 1: Column A
      const colAHtml = hasQ
        ? `<div style="cursor:pointer" id="L${qi}" data-a="fq" data-i="${qi}">
            <b style="color:var(--pr)">${qNum}.</b> ${seg(fmtArrangeText(q.q || ''), gi + ':s' + qi)}
          </div>`
        : '';

      // Cột 2: Column B
      const hasB = r < colBOpts.length;
      const bText = hasB ? colBOpts[r] : '';
      const bLet = hasB ? extractMatchLetter(bText, r) : '';
      const bBody = hasB ? stripMatchPrefix(bText) : '';
      const usedNums = usedByMap.get(r) || [];
      const colBHtml = hasB
        ? `<div class="match-col-b-item ${usedNums.length ? 'used' : ''}" data-a="match_pick_b" data-oi="${r}" title="Bấm để ghép vế (${bLet}) này cho câu đang chọn">
            <span><b style="color:var(--pr)">${esc(bLet)}.</b> ${seg(bBody, gi + ':mb' + r)}</span>
            ${usedNums.length ? `<span class="match-used-tag">🔗 Câu ${usedNums.join(', ')}</span>` : ''}
          </div>`
        : '';

      // Cột 3: Your Answer (71 - ___)
      let ansCellHtml = '';
      if(hasQ){
        const correctLet = extractMatchLetter(q.opts?.[q.ans] || '', q.ans);
        const userLet = (uAns !== undefined && uAns !== null) ? extractMatchLetter(q.opts?.[uAns] || '', +uAns) : '';
        if(qGraded){
          const pass = isQuestionOkV40(qi);
          ansCellHtml = `<span class="fill-in ${pass ? 'ok' : 'no'}" style="width:auto;min-width:82px;text-align:center">
            <b>${qNum} - ${esc(userLet || '___')}</b> ${pass ? '✓' : `✗ ➜ <b>${esc(correctLet)}</b>`}
          </span>`;
        } else {
          ansCellHtml = `<div style="display:inline-flex;align-items:center;gap:4px">
            <b>${qNum} -</b>
            <select class="match-ans-sel" data-a="match_sel_change" data-q="${qi}" ${V.rev ? 'disabled' : ''}>
              <option value="">___</option>
              ${(q.opts || []).map((op, oi) => {
                const l = extractMatchLetter(op, oi);
                return `<option value="${oi}" ${uAns === oi ? 'selected' : ''}>${esc(l)}</option>`;
              }).join('')}
            </select>
          </div>`;
        }
      }

      rowsHtml.push(`<tr class="${isCur ? 'tbl-row-cur' : ''}" ${hasQ ? `data-qrow="${qi}"` : ''}>
        <td style="width:42%">${colAHtml}</td>
        <td style="width:43%">${colBHtml}</td>
        <td class="match-ans-cell">${ansCellHtml}</td>
      </tr>`);
    }

    return `<div class="exam-interactive-tbl-wrap">
      <table class="exam-interactive-tbl">
        <thead>
          <tr>
            <th>Column A</th>
            <th>Column B</th>
            <th>Your Answer</th>
          </tr>
        </thead>
        <tbody>${rowsHtml.join('')}</tbody>
      </table>
    </div>`;
  }

  // B. Dựng Bảng Phân Loại Cột Tương Tác (Questions | PG | PP) y hệt Ảnh 2
  function buildClassifyGroupTableHtml(gi, qIndices, nmFn){
    if(!qIndices.length || !V?.ex) return '';
    const firstQ = V.ex.qs[qIndices[0]];
    const colOpts = firstQ?.opts || ['PG', 'PP'];
    const colBadges = colOpts.map((op, oi) => extractShortColBadge(op, oi));

    const rowsHtml = qIndices.map(qi => {
      const q = V.ex.qs[qi];
      const qNum = nmFn(qi);
      const qGraded = isQuestionGradedV40(qi);
      const uAns = V.ans?.[qi];
      const isCur = V.cur === qi;
      const hideRow = !!(V.filterUngraded && !V.rev && qGraded);

      const cellsHtml = colOpts.map((opTxt, oi) => {
        const isSel = uAns === oi;
        let boxCls = '';
        let boxSym = '';
        if(qGraded){
          if(oi === q.ans && isSel){ boxCls = 'ok'; boxSym = '✓'; }
          else if(isSel && oi !== q.ans){ boxCls = 'no'; boxSym = '✗'; }
          else if(oi === q.ans){ boxCls = 'ans-hint'; boxSym = '✓'; }
        } else if(isSel){
          boxCls = 'sel';
          boxSym = '✓';
        }
        return `<td class="cls-mark-cell" ${qGraded || V.rev ? '' : `data-a="pick" data-q="${qi}" data-o="${oi}"`} title="Đánh dấu cột ${esc(colBadges[oi])} (${esc(opTxt)}) cho Câu ${qNum}">
          <div class="cls-check-box ${boxCls}">${boxSym}</div>
        </td>`;
      }).join('');

      return `<tr class="${isCur ? 'tbl-row-cur' : ''} ${hideRow ? 'hide-by-ungraded-filter' : ''}" id="L${qi}" data-qrow="${qi}">
        <td style="cursor:pointer" data-a="fq" data-i="${qi}">
          <b style="color:var(--pr)">Question ${qNum}:</b> ${seg(fmtArrangeText(q.q || ''), gi + ':s' + qi)}
        </td>
        ${cellsHtml}
      </tr>`;
    }).join('');

    return `<div class="exam-interactive-tbl-wrap">
      <table class="exam-interactive-tbl">
        <thead>
          <tr>
            <th style="text-align:left">Questions</th>
            ${colBadges.map((b, oi) => `<th title="${esc(colOpts[oi])}">${esc(b)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  }

  // --- 3. NÂNG CẤP drawQ ĐỂ VẼ BẢNG TƯƠNG TÁC & THẺ CÂU HỎI CHO DẠNG MATCH VÀ CLASSIFY ---
  drawQ = function(){
    if(!V || !V.ex) return;
    postProcessGroupsForNewTypes(V.ex);
    if(!V.gradedQs || typeof V.gradedQs !== 'object') V.gradedQs = {};
    if(!Array.isArray(V.batches)) V.batches = [];

    const {ex, order, perm, ans, rev} = V;
    const L = $('#L'), R = $('#R');
    if(!L || !R) return;
    const ls = L.scrollTop, rs = R.scrollTop;
    const nm = qi => order.indexOf(qi) + 1;
    const ok = qi => isQuestionOkV40(qi);
    const gq = g => order.filter(i => ex.qs[i].g === g);
    const rng = g => {
      const a = gq(g).map(nm), x = Math.min(...a), y = Math.max(...a);
      return x === y ? `Câu ${x}` : `Nhóm câu hỏi ${x} - ${y}`;
    };
    const isVert = V.layout === 'vertical';
    const filterUngraded = !!(V.filterUngraded && !rev);

    const buildQuestionCard = (qi, gi, inVerticalMode) => {
      const q = ex.qs[qi], a = ans[qi], answered = isAnswered(q, a);
      const qGraded = isQuestionGradedV40(qi);
      const isPending = !qGraded && answered && !rev;
      const hideCard = filterUngraded && qGraded;

      // Luôn hiển thị mệnh đề câu hỏi trên thẻ #R đối với dạng match và classify để học sinh tiện nhìn cả 2 bên
      const showStem = inVerticalMode
        ? !!(q.q && String(q.q).trim() !== '')
        : !!((ex.groups[gi]?.passage || q.type === 'match' || q.type === 'classify') && q.q && String(q.q).trim() !== '');
      const stemKey = inVerticalMode ? (gi + ':s' + qi) : (gi + ':rq' + qi);
      const stemHtml = showStem ? `<div class="qstem">${seg(fmtArrangeText(q.q), stemKey)}</div>` : '';

      let statusTagHtml = '';
      if(qGraded){
        const pass = ok(qi);
        statusTagHtml = `<span class="graded-lock-tag ${pass ? 'ok' : 'no'}">${pass ? '✅ Đã chấm: Đúng' : (answered ? '❌ Đã chấm: Sai' : '⚪ Đã chấm: Bỏ trống')}</span>`;
      } else if(rev && V.h?.partial){
        statusTagHtml = `<span class="graded-lock-tag wait">⏳ Chưa làm (Để làm sau)</span>`;
      } else if(isPending){
        statusTagHtml = `<span class="graded-lock-tag wait">● Chờ chấm</span>`;
      }

      const actionBtnsHtml = `<span class="cn-actions">
        ${!rev && !qGraded ? `<button type="button" class="gh grade-one-btn ${answered ? 'show' : ''}" data-a="grade_one_q" data-q="${qi}" title="Chấm điểm ngay câu này và xem lời giải">✓ Chấm câu này</button>` : ''}
        ${!rev && !qGraded ? `<button type="button" class="gh clr-ans-btn ${answered ? 'show' : ''}" data-a="clr_ans" data-q="${qi}" title="${q.type === 'fill' ? 'Xóa nội dung vừa điền' : 'Hủy chọn đáp án câu này'}">${q.type === 'fill' ? '✕ Xóa trả lời' : '✕ Bỏ chọn'}</button>` : ''}
        <button type="button" class="gh" style="padding:2px 8px;font-size:12px" data-a="editq" data-q="${qi}" title="Sửa nhanh câu hỏi và đáp án này">✏️ Sửa câu</button>
      </span>`;

      if(q.type === 'fill'){
        const correctVal = q.correctText || (q.opts && q.opts[q.ans]) || '';
        const isCorrect = ok(qi);
        let expHtml = '';
        if(qGraded){
          expHtml = `<div class="exp">${!answered ? '⚪ Chưa trả lời. ' : isCorrect ? '✅ Chính xác. ' : '❌ Chưa đúng. '}Đáp án đúng: <b>${esc(correctVal)}</b>${q.exp ? `<br>💡 ${fmtRich(q.exp)}` : ''}${q.vi ? `<br>🌐 ${fmtRich(q.vi)}` : ''}</div>`;
        } else if(rev && V.h?.partial){
          expHtml = `<div class="exp" style="border-left:3px solid #f59e0b">⏳ <b>Câu này bạn để dành chưa làm.</b> Bấm nút <b>"▶ Làm tiếp các câu còn lại"</b> ở thanh trên cùng để làm và chấm tiếp!</div>`;
        }
        return `<div class="cd ${answered || qGraded ? 'dn' : ''} ${qGraded ? 'graded-locked' : ''} ${hideCard ? 'hide-by-ungraded-filter' : ''}" id="R${qi}" data-a="fq" data-i="${qi}">
          <div class="cn" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
            <span>Câu ${nm(qi)}. <small class="mu">(Tự luận điền đáp án)</small>${statusTagHtml}</span>
            ${actionBtnsHtml}
          </div>
          ${stemHtml}
          <input class="${qGraded ? (isCorrect ? 'fill-in ok' : 'fill-in no') : ''}" style="width:100%;margin-top:4px" ${(rev || qGraded) ? 'disabled' : ''} data-a="fill" data-q="${qi}" value="${esc(a || '')}" placeholder="Nhập đáp án của bạn vào đây...">
          ${expHtml}
        </div>`;
      }

      const isMatch = q.type === 'match';
      const isClassify = q.type === 'classify';
      const isTF = q.type === 'tf';
      const activePerm = (isMatch || isClassify || isTF)
        ? getValidOptIndices(q)
        : (perm[qi] || getValidOptIndices(q)).filter(oi => oi < q.opts.length && String(q.opts[oi] ?? '').trim() !== '');
      const finalPerm = activePerm.length ? activePerm : getValidOptIndices(q);

      // Nhãn loại câu hỏi chính xác (Không bao giờ gắn nhầm TRUE/FALSE cho bài PG/PP nữa)
      let typeTagHtml = '';
      if(isTF){
        typeTagHtml = `<span class="tf-tag">TRUE / FALSE</span>`;
      } else if(isClassify){
        const badgeNames = finalPerm.map(oi => extractShortColBadge(q.opts[oi], oi)).join(' / ');
        typeTagHtml = `<span class="tf-tag classify-tag">📊 PHÂN LOẠI (${esc(badgeNames)})</span>`;
      } else if(isMatch){
        typeTagHtml = `<span class="tf-tag match-tag">🔗 GHÉP CỘT (COLUMN A - B)</span>`;
      }

      // Thanh bấm nhanh chữ cái a, b, c, d, e, f... cho bài Ghép cột (Matching)
      let quickMatchBarHtml = '';
      if(isMatch){
        quickMatchBarHtml = `<div class="match-quick-pills">
          <small class="mu" style="font-weight:700;margin-right:4px">Chọn nhanh vế B:</small>
          ${finalPerm.map(oi => {
            const mLet = extractMatchLetter(q.opts[oi], oi);
            const c = qGraded
              ? (oi === q.ans ? 'ok' : oi === a ? 'no' : '')
              : (oi === a ? 'sel' : '');
            return `<button type="button" class="match-qpill ${c}" ${qGraded ? 'disabled' : `data-a="pick" data-q="${qi}" data-o="${oi}"`} title="${esc(q.opts[oi])}">${esc(mLet)}</button>`;
          }).join('')}
        </div>`;
      }

      const opsHtml = finalPerm.map((oi, pi) => {
        const c = qGraded
          ? (oi === q.ans ? 'ok' : oi === a ? 'no' : '')
          : (oi === a ? 'sel' : '');
        const badgeTxt = isMatch
          ? extractMatchLetter(q.opts[oi], oi)
          : isClassify
            ? extractShortColBadge(q.opts[oi], oi)
            : (ltr[pi] || (pi + 1));
        const dispOptText = isMatch ? stripMatchPrefix(q.opts[oi]) : q.opts[oi];
        const badgeStyle = (isClassify && badgeTxt.length >= 2) ? 'style="width:auto;min-width:28px;padding:0 6px"' : '';
        return `<div class="op ${c}" tabindex="0" ${qGraded ? '' : `data-a="pick" data-q="${qi}" data-o="${oi}"`}><i ${badgeStyle}>${esc(badgeTxt)}</i><span>${seg(dispOptText, gi + ':ro' + qi + '_' + oi)}</span></div>`;
      }).join('');

      const useGrid = isTF || isClassify || finalPerm.length <= 2;
      const wrappedOps = useGrid ? `<div class="tf-grid">${opsHtml}</div>` : opsHtml;

      const ansPos = finalPerm.indexOf(q.ans);
      const ansBadge = isMatch
        ? extractMatchLetter(q.opts[q.ans], q.ans)
        : isClassify
          ? extractShortColBadge(q.opts[q.ans], q.ans)
          : (ltr[ansPos >= 0 ? ansPos : q.ans] || 'A');
      const ansDispText = isMatch ? stripMatchPrefix(q.opts[q.ans]) : q.opts[q.ans];

      let expHtml = '';
      if(qGraded){
        expHtml = `<div class="exp">${a == null ? '⚪ Chưa trả lời. ' : ok(qi) ? '✅ Chính xác. ' : '❌ Chưa đúng. '}Đáp án: <b>${esc(ansBadge)}. ${fmtRich(ansDispText)}</b>${q.exp ? `<br>💡 ${fmtRich(q.exp)}` : ''}${q.vi ? `<br>🌐 ${fmtRich(q.vi)}` : ''}</div>`;
      } else if(rev && V.h?.partial){
        expHtml = `<div class="exp" style="border-left:3px solid #f59e0b">⏳ <b>Câu này bạn để dành chưa làm.</b> Bấm nút <b>"▶ Làm tiếp các câu còn lại"</b> ở thanh trên cùng để vào làm tiếp và gộp điểm!</div>`;
      }

      return `<div class="cd ${answered || qGraded ? 'dn' : ''} ${qGraded ? 'graded-locked' : ''} ${hideCard ? 'hide-by-ungraded-filter' : ''}" id="R${qi}" data-a="fq" data-i="${qi}">
        <div class="cn" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
          <span>Câu ${nm(qi)}.${typeTagHtml}${statusTagHtml}</span>
          ${actionBtnsHtml}
        </div>
        ${stemHtml}
        ${quickMatchBarHtml}
        ${wrappedOps}
        ${expHtml}
      </div>`;
    };

    const buildPassageHtml = (g, gi, extraCls) => {
      if(!g.passage) return '';
      return `<div class="ps ${extraCls || ''}">` + g.passage.split(/\[\[(\d+)\]\]/).map((t, i) => {
        if(i % 2 === 0) return seg(t, gi + ':' + i);
        const qi = +t - 1, q = ex.qs[qi];
        if(!q) return '(' + t + ')';
        const qGraded = isQuestionGradedV40(qi);
        if(q.type === 'fill'){
          const uVal = ans[qi] || '';
          const cVal = q.correctText || (q.opts && q.opts[q.ans]) || '';
          if(qGraded){
            const pass = ok(qi);
            return `<span class="fill-in ${pass ? 'ok' : 'no'}" id="L${qi}" data-a="fq" data-i="${qi}">(${t}) ${esc(uVal || '___')} ${pass ? '✓' : `➜ ${esc(cVal)}`}</span>`;
          }
          return `<span>(${t}) <input class="fill-in" id="L${qi}" ${(rev) ? 'disabled' : ''} data-a="fill" data-q="${qi}" value="${esc(uVal)}" placeholder="Điền từ..."></span>`;
        }
        const a = qGraded ? q.ans : ans[qi];
        const cls = qGraded ? (ok(qi) ? 'ok' : 'no') : (a != null ? 'dn pending' : '');
        return `<button class="bl ${cls}" id="L${qi}" data-a="fq" data-i="${qi}">(${t}) ${a != null ? esc(q.opts[a]) : '______'}</button>`;
      }).join('') + `</div>`;
    };

    const buildGroupLeftBody = (g, gi, inVert) => {
      const qIndices = gq(gi);
      const hasMatch = qIndices.some(qi => ex.qs[qi]?.type === 'match');
      const hasClassify = !hasMatch && qIndices.some(qi => ex.qs[qi]?.type === 'classify');

      if(hasMatch){
        return (g.passage ? buildPassageHtml(g, gi, inVert ? 'vert-ps' : '') : '') + buildMatchingGroupTableHtml(gi, qIndices, nm);
      }
      if(hasClassify){
        return (g.passage ? buildPassageHtml(g, gi, inVert ? 'vert-ps' : '') : '') + buildClassifyGroupTableHtml(gi, qIndices, nm);
      }
      if(g.passage){
        return buildPassageHtml(g, gi, inVert ? 'vert-ps' : '');
      }
      if(inVert) return '';
      return qIndices.map(qi => {
        const q = ex.qs[qi];
        const qGraded = isQuestionGradedV40(qi);
        const hideSt = filterUngraded && qGraded;
        return `<div class="st ${hideSt ? 'hide-by-ungraded-filter' : ''}" id="L${qi}" data-a="fq" data-i="${qi}"><b>Câu ${nm(qi)}.</b> ${seg(fmtArrangeText(q.q), gi + ':s' + qi)}</div>`;
      }).join('');
    };

    if(isVert){
      L.innerHTML = ex.groups.map((g, gi) => {
        const topHtml = buildGroupLeftBody(g, gi, true);
        const cardsHtml = gq(gi).map(qi => buildQuestionCard(qi, gi, true)).join('');
        return `<div class="grp" id="G${gi}"><div class="gh2">${rng(gi)}</div>${g.instr ? `<div class="ins">${seg(g.instr, gi + ':ins')}</div>` : ''}${topHtml}${cardsHtml}</div>`;
      }).join('');
      R.innerHTML = '';
      L.scrollTop = ls;
    } else {
      L.innerHTML = ex.groups.map((g, gi) => {
        const body = buildGroupLeftBody(g, gi, false);
        return `<div class="grp" id="G${gi}"><div class="gh2">${rng(gi)}</div>${g.instr ? `<div class="ins">${seg(g.instr, gi + ':ins')}</div>` : ''}${body}</div>`;
      }).join('');

      R.innerHTML = ex.groups.map((g, gi) => `<div class="rg">${rng(gi)}</div>` + gq(gi).map(qi => buildQuestionCard(qi, gi, false)).join('')).join('');
      L.scrollTop = ls;
      R.scrollTop = rs;
    }

    updateProgressText();
    if(V.cur != null) applyCurHighlight(V.cur);
  };

  // Đồng bộ cả bảng tương tác ở #L và các pill chữ cái khi chọn hoặc bỏ chọn đáp án
  const origPick39 = act.pick;
  act.pick = function(d){
    if(V.rev) return;
    const qi = +d.q;
    const q = V.ex?.qs?.[qi];
    origPick39(d);
    if(q && (q.type === 'match' || q.type === 'classify')){
      drawQ();
    }
  };

  const origClrAns39 = act.clr_ans;
  act.clr_ans = function(d){
    if(V.rev) return;
    const qi = +d.q;
    const q = V.ex?.qs?.[qi];
    origClrAns39(d);
    if(q && (q.type === 'match' || q.type === 'classify')){
      drawQ();
    }
  };

  // Bắt sự kiện chọn từ <select class="match-ans-sel"> trong cột Your Answer của Bảng Ghép Cột
  document.addEventListener('change', e => {
    const t = e.target;
    if(t && t.dataset?.a === 'match_sel_change' && V && V.view === 'exam' && !V.rev){
      const qi = +t.dataset.q;
      if(V.gradedQs && V.gradedQs[qi]) return;
      const val = t.value;
      if(val === ''){
        act.clr_ans({q: qi});
      } else {
        act.pick({q: qi, o: +val});
      }
    }
  });

  // Bấm vào 1 vế ở Column B trong bảng sẽ ghép ngay cho câu đang chọn (hoặc câu chưa làm đầu tiên trong nhóm)
  Object.assign(act, {
    match_pick_b(d){
      if(!V || V.view !== 'exam' || V.rev || !V.ex) return;
      const oi = +d.oi;
      let targetQi = V.cur;
      if(targetQi == null || V.ex.qs[targetQi]?.type !== 'match' || (V.gradedQs && V.gradedQs[targetQi])){
        targetQi = (V.order || []).find(qi => V.ex.qs[qi]?.type === 'match' && !(V.gradedQs && V.gradedQs[qi]) && !isAnswered(V.ex.qs[qi], V.ans?.[qi]))
                 ?? (V.order || []).find(qi => V.ex.qs[qi]?.type === 'match' && !(V.gradedQs && V.gradedQs[qi]));
      }
      if(targetQi !== undefined && targetQi !== null){
        act.pick({q: targetQi, o: oi});
      }
    }
  });

  // --- 4. NÂNG CẤP TRÌNH CHỈNH SỬA ĐỀ (renderEdit & editq) HỖ TRỢ DẠNG MATCH & CLASSIFY ---
  const origRenderEdit39 = renderEdit;
  renderEdit = function(m){
    origRenderEdit39(m);
    if(!V || V.view !== 'edit' || !V.draft || V.mode === 'json') return;

    // Bổ sung 2 tùy chọn 'classify' và 'match' vào tất cả các thẻ <select data-ed="qtype"> và vẽ khung phương án mở rộng
    m.querySelectorAll('select[data-ed="qtype"]').forEach(sel => {
      const gi = +sel.dataset.g, qi = +sel.dataset.q;
      const q = V.draft.groups[gi]?.questions?.[qi];
      if(!q) return;
      const tp = q.type || 'mc';
      if(!sel.querySelector('option[value="classify"]')){
        sel.insertAdjacentHTML('beforeend', `
          <option value="classify" ${tp === 'classify' ? 'selected' : ''}>📊 Phân loại cột bảng (VD: PG / PP)</option>
          <option value="match" ${tp === 'match' ? 'selected' : ''}>🔗 Ghép nối 2 cột (Column A & B: a, b, c, d...)</option>
        `);
      }
      sel.value = tp;

      if(tp === 'match' || tp === 'classify'){
        const card = sel.closest('.ed-q');
        const oldOptBox = card?.querySelector('.ed-opt-row')?.parentElement?.parentElement;
        if(oldOptBox){
          const optsList = (q.opts && q.opts.length >= 2) ? q.opts : (tp === 'classify' ? ['PG (Perfect Gerund)', 'PP (Perfect Participle)'] : ['a. ', 'b. ', 'c. ', 'd. ']);
          q.opts = optsList;
          oldOptBox.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
              <small class="mu">${tp === 'match' ? 'Danh sách các vế ở <b>Column B</b> (bấm chữ cái đầu dòng để chọn vế đúng cho câu này):' : 'Danh sách các <b>Cột phân loại</b> (ví dụ: PG, PP - bấm để chọn cột đúng):'}</small>
              <div class="row" style="margin:0">
                <button type="button" class="gh" style="padding:2px 8px;font-size:12px" data-a="ed_opt_add" data-g="${gi}" data-q="${qi}">＋ Thêm ${tp === 'match' ? 'vế Column B' : 'cột'}</button>
                ${optsList.length > 2 ? `<button type="button" class="gh" style="padding:2px 8px;font-size:12px" data-a="ed_opt_rem" data-g="${gi}" data-q="${qi}">− Bớt cuối</button>` : ''}
                <button type="button" class="gh" style="padding:2px 8px;font-size:12px;border-color:var(--pr);color:var(--pr)" data-a="ed_sync_grp_opts" data-g="${gi}" data-q="${qi}" title="Sao chép danh sách lựa chọn này cho toàn bộ các câu trong Nhóm ${gi+1}">🔄 Đồng bộ cho cả nhóm</button>
              </div>
            </div>
            <div>
              ${optsList.map((opVal, oi) => {
                const btnLbl = tp === 'match' ? String.fromCharCode(97 + oi) : extractShortColBadge(opVal, oi);
                return `<div class="ed-opt-row">
                  <button type="button" class="ed-ans-btn ${+q.ans === oi ? 'on' : ''}" style="width:auto;min-width:34px;padding:0 8px" data-a="ed_qans" data-g="${gi}" data-q="${qi}" data-o="${oi}">${esc(btnLbl)}</button>
                  <input data-ed="qopt" data-g="${gi}" data-q="${qi}" data-o="${oi}" value="${esc(opVal)}" placeholder="${tp === 'match' ? `${String.fromCharCode(97 + oi)}. Nội dung vế B...` : `Tên cột ${oi + 1} (VD: PG)...`}">
                </div>`;
              }).join('')}
            </div>
          `;
        }
      }
    });
  };

  document.addEventListener('change', e => {
    const ed = e.target.dataset?.ed;
    if(ed === 'qtype' && V.view === 'edit' && V.draft){
      const gi = +e.target.dataset.g, qi = +e.target.dataset.q;
      const q = V.draft.groups[gi]?.questions?.[qi];
      if(!q) return;
      const newTp = e.target.value;
      if(newTp === 'classify'){
        q.type = 'classify';
        q.opts = ['PG (Perfect Gerund)', 'PP (Perfect Participle)'];
        if(q.ans > 1) q.ans = 0;
        q.correctText = q.opts[q.ans];
        const sc = $('main').scrollTop;
        renderEdit($('#main'));
        $('main').scrollTop = sc;
      } else if(newTp === 'match'){
        q.type = 'match';
        const siblingMatch = V.draft.groups[gi]?.questions?.find(x => x !== q && x.type === 'match' && x.opts?.length >= 3);
        q.opts = siblingMatch ? siblingMatch.opts.slice() : ['a. ', 'b. ', 'c. ', 'd. '];
        q.ans = Math.min(q.ans || 0, q.opts.length - 1);
        q.correctText = q.opts[q.ans];
        const sc = $('main').scrollTop;
        renderEdit($('#main'));
        $('main').scrollTop = sc;
      }
    }
  });

  Object.assign(act, {
    ed_opt_add(d){
      const gi = +d.g, qi = +d.q;
      const q = V.draft?.groups?.[gi]?.questions?.[qi];
      if(!q) return;
      q.opts = q.opts || [];
      const nextIdx = q.opts.length;
      q.opts.push(q.type === 'match' ? `${String.fromCharCode(97 + nextIdx)}. ` : '');
      const sc = $('main').scrollTop;
      renderEdit($('#main'));
      $('main').scrollTop = sc;
    },
    ed_opt_rem(d){
      const gi = +d.g, qi = +d.q;
      const q = V.draft?.groups?.[gi]?.questions?.[qi];
      if(!q || !q.opts || q.opts.length <= 2) return;
      q.opts.pop();
      if(q.ans >= q.opts.length) q.ans = q.opts.length - 1;
      const sc = $('main').scrollTop;
      renderEdit($('#main'));
      $('main').scrollTop = sc;
    },
    ed_sync_grp_opts(d){
      const gi = +d.g, qi = +d.q;
      const g = V.draft?.groups?.[gi];
      const srcQ = g?.questions?.[qi];
      if(!g || !srcQ) return;
      g.questions.forEach(item => {
        item.type = srcQ.type;
        item.opts = (srcQ.opts || []).slice();
        if(item.ans >= item.opts.length) item.ans = 0;
        item.correctText = item.opts[item.ans] || '';
      });
      const sc = $('main').scrollTop;
      renderEdit($('#main'));
      $('main').scrollTop = sc;
    }
  });

  render();
})();


/* === BẢN NÂNG CẤP V42: TRÍ TUỆ NHẬN DIỆN CHUYÊN SÂU 2 DẠNG BÀI MỚI (GHÉP CỘT COLUMN A - COLUMN B & BẢNG PHÂN LOẠI PG / PP) TỪ ẢNH, PDF, WORD & VĂN BẢN === */
(function(){
  // 1. Hàm giải mã chỉ số đáp án siêu linh hoạt: hiểu cả số (0,1,2), chữ cái ("a", "b", "71 - b"), và mã cột ("PG", "PP", "Perfect Participle")
  window.resolveAnsIndex = function(ansVal, opts, correctText){
    const validOpts = Array.isArray(opts) ? opts : [];
    const maxIdx = Math.max(0, validOpts.length - 1);

    if(typeof ansVal === 'number' && !isNaN(ansVal)){
      return Math.max(0, Math.min(maxIdx, Math.round(ansVal)));
    }

    const candidates = [ansVal, correctText]
      .filter(x => x !== undefined && x !== null && String(x).trim() !== '')
      .map(x => String(x).trim());

    for(const raw of candidates){
      if(/^\d+$/.test(raw)){
        return Math.max(0, Math.min(maxIdx, +raw));
      }
      // Khớp dạng "71 - b", "71: b", "71. b"
      const mPair = raw.match(/^\d+\s*[-–:\.]\s*([a-zA-Z])\b/);
      if(mPair && validOpts.length > 0){
        const idx = mPair[1].toLowerCase().charCodeAt(0) - 97;
        if(idx >= 0 && idx < validOpts.length) return idx;
      }
      // Khớp trực tiếp tên cột phân loại (như "PG", "PP", "Perfect Gerund", "Perfect Participle")
      if(validOpts.length > 0){
        const rl = raw.toLowerCase();
        const colIdx = validOpts.findIndex(o => {
          const ol = String(o || '').trim().toLowerCase();
          if(!ol) return false;
          if(ol === rl || ol.startsWith(rl + ' ') || ol.startsWith(rl + '(') || ol.includes(`(${rl})`)) return true;
          if(rl === 'pg' && /perfect\s+gerund|^pg\b/i.test(ol)) return true;
          if(rl === 'pp' && /perfect\s+participle|^pp\b/i.test(ol)) return true;
          if(/perfect\s+gerund/i.test(rl) && (/^pg\b|perfect\s+gerund/i.test(ol))) return true;
          if(/perfect\s+participle/i.test(rl) && (/^pp\b|perfect\s+participle/i.test(ol))) return true;
          return false;
        });
        if(colIdx >= 0) return colIdx;
      }
      // Khớp chữ cái đơn 'a', 'b', 'c', 'd'... hoặc 'a. ...'
      const mLet = raw.match(/^([a-zA-Z])(?:[\.\)\s-]|$)/);
      if(mLet && validOpts.length > 0){
        const idx = mLet[1].toLowerCase().charCodeAt(0) - 97;
        if(idx >= 0 && idx < validOpts.length) return idx;
      }
      // Khớp chuỗi con nội dung phương án
      if(validOpts.length > 0){
        const rl = raw.toLowerCase().replace(/^[a-z][\.\)]\s*/i, '').trim();
        if(rl.length >= 3){
          const subIdx = validOpts.findIndex(o => {
            const ol = String(o || '').toLowerCase().replace(/^[a-z][\.\)]\s*/i, '').trim();
            return ol === rl || ol.includes(rl) || rl.includes(ol);
          });
          if(subIdx >= 0) return subIdx;
        }
      }
    }
    return 0;
  };

  // 2. Bộ phân tích ngữ pháp tự động nhận diện Perfect Gerund (PG) vs Perfect Participle (PP)
  // Giúp đảm bảo đáp án và lời giải luôn chính xác 100% ngay cả khi đề gốc không có đáp án!
  function analyzePgOrPpSentence(qText){
    const s = String(qText || '').replace(/\*\*|__|<u>|<\/u>|<b>|<\/b>/gi, '').trim();
    // Tìm vị trí cụm (not) having + V3/ed
    const m = s.match(/\b((?:not\s+)?having\s+(?:been\s+)?[a-z]+(?:ed|en|t|d|n|k|g|m|r|w))\b/i);
    if(!m) return null;
    const phrase = m[1];
    const idx = m.index || 0;
    const before = s.slice(0, idx).trim();

    // Nếu đứng ở đầu câu (hoặc chỉ sau "Question X:") và phía sau có dấu phẩy tách mệnh đề chính -> Perfect Participle (PP)
    if(!before || /^[,;—-]$/.test(before)){
      return {
        ans: 1, // PP
        code: 'PP',
        exp: `Cụm **"${phrase}"** đứng đầu câu làm mệnh đề phân từ hoàn thành rút gọn (Perfect Participle - **PP**) để diễn tả hành động xảy ra trước hành động ở mệnh đề chính.`
      };
    }
    // Nếu đứng sau giới từ (for, about, of, in, on, at, from, with, without, after, before, by) hoặc động từ (deny, admit, mention, recall, remember, regret, apologize, praise, accuse, blame, thank...) -> Perfect Gerund (PG)
    if(/\b(for|about|of|in|on|at|from|with|without|to|into|denied|admitted|mentioned|recalled|remembered|regretted|apologized|praised|accused|blamed|thanked|confessed|appreciated|avoided|considered|delayed|detested|discussed|enjoyed|finished|imagined|kept|minded|missed|postponed|practiced|quit|fancied|resented|resisted|risked|suggested| tolerated)\s*$/i.test(before)){
      return {
        ans: 0, // PG
        code: 'PG',
        exp: `Cụm **"${phrase}"** đóng vai trò làm danh động từ hoàn thành (Perfect Gerund - **PG**) đứng làm tân ngữ sau động từ/giới từ (**"${before.split(/\s+/).slice(-2).join(' ')}"**).`
      };
    }
    // Nếu có dấu phẩy ngay trước nó (mệnh đề phân từ ở cuối câu) -> PP
    if(/,\s*$/.test(before)){
      return {
        ans: 1,
        code: 'PP',
        exp: `Cụm **"${phrase}"** là phân từ hoàn thành (Perfect Participle - **PP**) bổ nghĩa cho chủ ngữ của mệnh đề chính.`
      };
    }
    return {
      ans: 0,
      code: 'PG',
      exp: `Cụm **"${phrase}"** đóng vai trò là danh động từ hoàn thành (Perfect Gerund - **PG**) trong câu.`
    };
  }

  // 3. Bộ tự động giải ghép nối Column A - Column B bằng ngữ pháp & ngữ nghĩa nếu câu hỏi chưa có đáp án
  function autoMatchColAWithColB(groupQs, colBOpts){
    if(!groupQs.length || !colBOpts.length) return;
    // Kiểm tra xem tất cả các câu trong nhóm có đang bị trùng 1 đáp án mặc định (0) do đề không kèm đáp án hay không
    const allZero = groupQs.length >= 3 && groupQs.every(q => (q.ans || 0) === 0 && !/^[aA]\b/.test(String(q._rawAns ?? '')));
    if(!allZero) return;

    const usedB = new Set();
    groupQs.forEach(q => {
      const aTxt = String(q.q || '').toLowerCase();
      let bestIdx = -1, bestScore = -999;

      colBOpts.forEach((bRaw, bIdx) => {
        if(usedB.has(bIdx)) return;
        const bTxt = String(bRaw || '').replace(/^[a-z][\.\)]\s*/i, '').trim();
        const bLow = bTxt.toLowerCase();
        let score = 0;

        // Quy tắc 1: Nếu Column A kết thúc bằng dấu phẩy (ví dụ: "Having been warned about the heavy rain,", "Having finished all the difficult math exercises,"), vế B phải là mệnh đề chính bắt đầu bằng chủ ngữ (we, he, she, they, the..., I...) chứ KHÔNG bắt đầu bằng giới từ (for, after, about...)
        const aEndsWithComma = /,\s*$/.test(aTxt);
        const bStartsWithPrep = /^(for|after|before|about|of|in|on|at|with|without|by|to)\b/i.test(bLow);
        if(aEndsWithComma){
          if(!bStartsWithPrep) score += 25;
          else score -= 30;
        } else {
          // Nếu Column A là mệnh đề chưa kết thúc có động từ/tính từ cần giới từ đi kèm (apologized to his brother -> for..., felt extremely proud -> after / of...)
          if(bStartsWithPrep) score += 20;
        }

        // Quy tắc 2: Sự tương hợp từ vựng & ngữ cảnh (Collocations & Semantic links)
        if(/rain|weather|storm|cold|forecast/i.test(aTxt) && /clothes|umbrella|coat|indoor|postpone|stay/i.test(bLow)) score += 50;
        if(/apologiz|sorry|blam|forgiv|scold/i.test(aTxt) && /^for\b/i.test(bLow)) score += 35;
        if(/brother|sister|child|kid|boy|girl/i.test(aTxt) && /toy|game|candy|bike|doll/i.test(bLow)) score += 45;
        if(/math|exercise|homework|exam|test|study|assignment/i.test(aTxt) && /rest|play|bed|sleep|watch|went out|relaxed|submitted|teacher/i.test(bLow)) score += 40;
        if(/proud|happy|excited|honored|delighted|thrilled/i.test(aTxt) && /select|win|award|prize|program|scholarship|pass/i.test(bLow)) score += 45;
        if(/proud/i.test(aTxt) && /^(after|of|to)\b/i.test(bLow)) score += 25;
        if(/hack|virus|data|system|computer|company/i.test(aTxt) && /security|software|update|password/i.test(bLow)) score += 45;

        if(score > bestScore){
          bestScore = score;
          bestIdx = bIdx;
        }
      });

      if(bestIdx >= 0){
        usedB.add(bestIdx);
        q.ans = bestIdx;
        q.correctText = colBOpts[bestIdx] || '';
      }
    });
  }

  // 4. Nâng cấp postProcessGroupsForNewTypes: Tự động phát hiện và chuyển đổi chuẩn xác cả khi AI trả về format biến thể
  function enhancedPostProcessGroups(ex){
    if(!ex || !ex.groups || !ex.qs) return;
    ex.groups.forEach((g, gi) => {
      const gQs = ex.qs.filter(q => q.g === gi);
      if(!gQs.length) return;
      const instrNorm = String(g.instr || '').toLowerCase();
      const pasNorm = String(g.passage || '');

      // --- TRƯỜNG HỢP A: NHẬN DIỆN BẢNG PHÂN LOẠI CỘT (PG / PP - CLASSIFICATION TABLE) — Loại trừ hoàn toàn bài Tự luận Viết lại câu (rewrite) ---
      const isRewriteInstr = /\brewrite\b|\bcomplete\s+the\s+(?:second\s+)?sentence|\bfinish\s+each\b|\bsentence\s+transformation/i.test(instrNorm);
      const hasPgPpInAnswers = !isRewriteInstr && gQs.every(q => /^(pg|pp|perfect\s+gerund|perfect\s+participle)$/i.test(String(q.correctText || q._rawAns || '').trim()));
      const isClassifyGroup = !isRewriteInstr && (
        /marking\s+the\s+appropriate\s+column|\(\s*pg\s*\).*\(\s*pp\s*\)|identify\s+whether\s+the\s+underlined\s+phrase/i.test(instrNorm) ||
        gQs.some(q => q.type === 'classify' && !/_{3,}|✍️/.test(String(q.q || ''))) ||
        (gQs.length >= 2 && hasPgPpInAnswers)
      );

      if(isClassifyGroup){
        let defaultCols = ['PG (Perfect Gerund)', 'PP (Perfect Participle)'];
        for(const q of gQs){
          const valid = (q.opts || []).map(x => String(x ?? '').trim()).filter(Boolean);
          if(valid.length >= 2 && !valid.every(x => /^(true|false)$/i.test(x))){
            defaultCols = valid.map(x => {
              if(/^pg$/i.test(x)) return 'PG (Perfect Gerund)';
              if(/^pp$/i.test(x)) return 'PP (Perfect Participle)';
              return x;
            });
            break;
          }
        }
        gQs.forEach(q => {
          const rawAnsHint = q._rawAns !== undefined ? q._rawAns : q.correctText;
          q.type = 'classify';
          q.opts = defaultCols.slice();
          q.q = autoUnderlineParticiplePhrase(q.q || '');

          // Giải mã đáp án từ rawAnsHint hoặc phân tích ngữ pháp tự động
          const autoInfo = analyzePgOrPpSentence(q.q);
          if(rawAnsHint !== undefined && rawAnsHint !== null && String(rawAnsHint).trim() !== '' && !(rawAnsHint === 0 && autoInfo)){
            q.ans = window.resolveAnsIndex(rawAnsHint, q.opts, q.correctText);
          } else if(autoInfo){
            q.ans = autoInfo.ans;
          } else {
            q.ans = window.resolveAnsIndex(q.ans, q.opts, q.correctText);
          }
          q.correctText = q.opts[q.ans] || '';
          if(!q.exp && autoInfo) q.exp = autoInfo.exp;
        });
        return;
      }

      // --- TRƯỜNG HỢP B: NHẬN DIỆN BẢNG GHÉP NỐI 2 CỘT (COLUMN A & COLUMN B - MATCHING) ---
      const isMatchGroup = (
        /match\b.*column\s*a.*column\s*b|column\s*a.*column\s*b|match\s+the\s+phrase/i.test(instrNorm) ||
        gQs.some(q => q.type === 'match')
      );

      if(isMatchGroup){
        // 1. Tìm danh sách các vế ở Column B từ:
        //    - Mảng opts dài nhất trong các câu hỏi của nhóm
        //    - Hoặc bóc tách từ g.passage nếu AI lỡ đặt Column B vào passage
        let colBList = [];
        for(const q of gQs){
          const valid = (q.opts || []).map(x => String(x ?? '').trim()).filter(Boolean);
          // Bỏ qua các mảng chỉ gồm chữ cái rỗng ["a", "b", "c", "d"]
          const hasRealContent = valid.some(x => x.replace(/^[a-z][\.\)]\s*/i, '').trim().length > 2);
          if(hasRealContent && valid.length > colBList.length){
            colBList = valid;
          }
        }

        // Nếu AI không để nội dung Column B trong q.opts mà để trong g.passage:
        if(colBList.length < 2 && pasNorm){
          const extractedFromPas = [];
          const lines = pasNorm.split(/\r?\n/);
          for(const ln of lines){
            const m = ln.trim().match(/^([a-z])[\.\)]\s+(.+)$/i);
            if(m) extractedFromPas.push(`${m[1].toLowerCase()}. ${m[2].trim()}`);
          }
          if(extractedFromPas.length >= 2){
            colBList = extractedFromPas;
            g.passage = ''; // Xóa khỏi passage vì đã đưa vào bảng tương tác Column B
          }
        }

        if(colBList.length >= 2){
          const normalizedColB = colBList.map((x, idx) => {
            const ch = String.fromCharCode(97 + idx);
            return /^[a-z][\.\)]\s+/i.test(x) ? x.replace(/^([a-z])([\.\)])/i, (_, c, p) => c.toLowerCase() + p) : `${ch}. ${x}`;
          });

          gQs.forEach(q => {
            const rawAnsHint = q._rawAns !== undefined ? q._rawAns : q.correctText;
            q.type = 'match';
            q.opts = normalizedColB.slice();
            q.ans = window.resolveAnsIndex(rawAnsHint !== undefined ? rawAnsHint : q.ans, q.opts, q.correctText);
            q.correctText = q.opts[q.ans] || '';
          });

          autoMatchColAWithColB(gQs, normalizedColB);
        }
      }
    });
  }

  // Ghi đè normalizeParsedData & draftToExam để luôn chạy bộ hậu xử lý chuyên sâu V42
  const prevNorm40 = normalizeParsedData;
  normalizeParsedData = function(r){
    const res = prevNorm40(r);
    enhancedPostProcessGroups(res);
    return res;
  };

  const prevDraft40 = draftToExam;
  draftToExam = function(draft){
    const ex = prevDraft40(draft);
    enhancedPostProcessGroups(ex);
    return ex;
  };

  // 5. Bộ Nhận Diện Trực Tiếp Văn Bản / Bảng Word (Smart Local Text Parser)
  // Hỗ trợ khi người dùng dán trực tiếp văn bản hoặc tải file Word (.docx) của 2 dạng bài này mà không cần tốn thời gian chờ AI
  function trySmartLocalParseNewTypes(rawText){
    const s = String(rawText || '').trim();
    if(!s || s.startsWith('{')) return null;

    // A. Kiểm tra xem văn bản có phải là bài Bảng phân loại PG / PP không
    if(/perfect\s+gerund\s*\(\s*pg\s*\).*perfect\s+participle\s*\(\s*pp\s*\)/i.test(s) && !/column\s*a.*column\s*b/i.test(s)){
      const lines = s.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let instr = 'Identify whether the underlined phrase is a Perfect Gerund (PG) or a Perfect Participle (PP) by marking the appropriate column.';
      const questions = [];

      for(const ln of lines){
        if(/for\s+questions\b.*identify\s+whether/i.test(ln)){
          instr = ln.replace(/^\s*\|?\s*|\s*\|?\s*$/g, '');
          continue;
        }
        const mQ = ln.match(/^(?:Question|Câu)\s*(\d+)\s*[\.:\)]\s*(.+)$/i);
        if(mQ){
          let qBody = mQ[2].replace(/\s*\|\s*(?:PG|PP)?\s*\|\s*(?:PG|PP)?\s*$/i, '').trim();
          let explicitAns = null;
          const mAnsEnd = qBody.match(/\s*(?:\||->|=>|-)\s*(PG|PP)\s*$/i);
          if(mAnsEnd){
            explicitAns = mAnsEnd[1].toUpperCase();
            qBody = qBody.slice(0, mAnsEnd.index).trim();
          }
          qBody = autoUnderlineParticiplePhrase(qBody);
          const autoInfo = analyzePgOrPpSentence(qBody);
          const ansIdx = explicitAns ? (explicitAns === 'PP' ? 1 : 0) : (autoInfo ? autoInfo.ans : 0);
          questions.push({
            q: qBody,
            type: 'classify',
            opts: ['PG (Perfect Gerund)', 'PP (Perfect Participle)'],
            ans: ansIdx,
            correctText: ansIdx === 1 ? 'PP (Perfect Participle)' : 'PG (Perfect Gerund)',
            exp: autoInfo ? autoInfo.exp : '',
            vi: ''
          });
        }
      }
      if(questions.length >= 2){
        return {groups: [{instr, passage: '', questions}]};
      }
    }

    // B. Kiểm tra xem văn bản có phải là bài Ghép nối 2 cột Column A & Column B đơn thuần không
    if(/match\s+the\s+phrase\s+in\s+column\s*a.*column\s*b/i.test(s) && !/perfect\s+gerund/i.test(s)){
      const lines = s.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let instr = 'Match the phrase in Column A with the most appropriate phrase in Column B to create a meaningful sentence.';
      const colAList = [];
      const colBList = [];
      const ansMap = {};

      for(const ln of lines){
        if(/for\s+questions\b.*match\s+the\s+phrase/i.test(ln)){
          instr = ln;
          continue;
        }
        // Nếu dòng từ bảng Word có dạng: "71. Having been warned... | a. for having broken... | 71 - ___"
        if(ln.includes('|')){
          const parts = ln.split('|').map(x => x.trim());
          const mA = (parts[0] || '').match(/^(\d+)[\.\)]\s*(.+)$/);
          const mB = (parts[1] || '').match(/^([a-z])[\.\)]\s*(.+)$/i);
          if(mA) colAList.push({num: +mA[1], text: mA[2].trim()});
          if(mB) colBList.push(`${mB[1].toLowerCase()}. ${mB[2].trim()}`);
          const mAns = (parts[2] || '').match(/(\d+)\s*[-–:]\s*([a-zA-Z])\b/);
          if(mAns) ansMap[+mAns[1]] = mAns[2].toLowerCase();
          continue;
        }
        const mA = ln.match(/^(\d+)[\.\)]\s+(.+)$/);
        if(mA){
          colAList.push({num: +mA[1], text: mA[2].trim()});
          continue;
        }
        const mB = ln.match(/^([a-z])[\.\)]\s+(.+)$/i);
        if(mB){
          colBList.push(`${mB[1].toLowerCase()}. ${mB[2].trim()}`);
          continue;
        }
      }

      if(colAList.length >= 2 && colBList.length >= 2){
        const questions = colAList.map(item => ({
          q: item.text,
          type: 'match',
          opts: colBList.slice(),
          ans: ansMap[item.num] ? (ansMap[item.num].charCodeAt(0) - 97) : 0,
          _rawAns: ansMap[item.num] || 0,
          correctText: '',
          exp: '',
          vi: ''
        }));
        return {groups: [{instr, passage: '', questions}]};
      }
    }

    return null;
  }

  // Tích hợp trySmartLocalParseNewTypes vào aiParse:
  // Nếu không có ảnh đính kèm và người dùng chưa cài API Key (hoặc dán trực tiếp văn bản thuần của 1 trong 2 dạng bài), có thể xử lý ngay lập tức!
  const origAiParse41 = aiParse;
  aiParse = async function(text, imgs){
    const gKey = (localStorage.getItem('gemini_api_key') || '').trim();
    if((!imgs || !imgs.length) && !gKey){
      const localRes = trySmartLocalParseNewTypes(text);
      if(localRes) return normalizeParsedData(localRes);
    }
    try {
      return await origAiParse41(text, imgs);
    } catch(err){
      if(!imgs || !imgs.length){
        const localFallback = trySmartLocalParseNewTypes(text);
        if(localFallback) return normalizeParsedData(localFallback);
      }
      throw err;
    }
  };

  // 6. Nâng cấp Hộp thoại Sửa nhanh câu hỏi (act.editq & act.saveq) để hỗ trợ đầy đủ 2 dạng bài 'match' và 'classify'
  let EQ_TEMP_OPTS = [];
  act.editq = function(d){

    const ex = V.ex;
    const q = ex?.qs?.[qi];

    const tp = q.type || 'mc';

    if(tp === 'classify'){
      EQ_TEMP_OPTS = rawOpts.length >= 2 ? rawOpts : ['PG (Perfect Gerund)', 'PP (Perfect Participle)'];
    } else if(tp === 'match'){

    } else if(tp === 'tf'){
      EQ_TEMP_OPTS = rawOpts.length >= 2 ? rawOpts : ['TRUE', 'FALSE'];
    } else {
      EQ_TEMP_OPTS = rawOpts.slice(0, 4);
      while(EQ_TEMP_OPTS.length < 4) EQ_TEMP_OPTS.push('');
    }

    const renderEqOptsRows = (curTp, curAns) => {
      if(curTp === 'fill') return '';

          : curTp === 'classify'

            : (ltr[oi] || (oi + 1));
        return `<div class="ed-opt-row" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

            <span>${esc(badgeLbl)}</span>
          </label>
          <input class="eq-opt-inp" data-oi="${oi}" value="${esc(val)}" placeholder="${curTp === 'match' ? `${String.fromCharCode(97 + oi)}. Nội dung vế Column B...` : `Phương án ${badgeLbl}...`}">
        </div>`;
      }).join('');
    };

    modal(`<h3>✏️ Chỉnh sửa nhanh Câu ${(V.order ? V.order.indexOf(qi) : qi) + 1}</h3>

          <option value="mc" ${tp === 'mc' ? 'selected' : ''}>Trắc nghiệm 4 đáp án (A, B, C, D)</option>

          <option value="arrange" ${tp === 'arrange' ? 'selected' : ''}>Sắp xếp câu / hội thoại</option>
          <option value="fill" ${tp === 'fill' ? 'selected' : ''}>Tự luận điền đáp án</option>
        </select>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <small class="mu">Nội dung câu hỏi (dùng <code>**chữ**</code> để in đậm, <code>__chữ__</code> để gạch chân):</small>
        <div class="ed-tb" style="margin:2px 0">
          <button type="button" data-a="ed_fmt" data-t="eq-q" data-m="b"><b>B</b></button>

      <textarea id="eq-q" style="min-height:70px;margin-top:2px" placeholder="Nội dung câu hỏi / Mệnh đề Column A...">${esc(q.q || '')}</textarea>

          <small class="mu">Các phương án / Các vế Column B / Các cột phân loại & Chọn đáp án đúng:</small>

        <button class="gh" data-a="close">Hủy</button>
      </div>`);

    const syncCurrentDomOpts = () => {

      } else if(newTp === 'mc' || newTp === 'arrange'){
        while(EQ_TEMP_OPTS.length < 4) EQ_TEMP_OPTS.push('');
        EQ_TEMP_OPTS = EQ_TEMP_OPTS.slice(0, 4);

      syncCurrentDomOpts();

      const nextIdx = EQ_TEMP_OPTS.length;

      syncCurrentDomOpts();
      if(EQ_TEMP_OPTS.length <= 2) return;
      EQ_TEMP_OPTS.pop();
      refreshEqOptsList();
    });
  };

  act.saveq = function(){
    const qi = EQ_IDX;
    const ex = V.ex;
    const q = ex?.qs?.[qi];
    if(!q) return;
    const tp = $('#eq-type')?.value || 'mc';
    q.type = tp;
    q.q = fmtArrangeText($('#eq-q')?.value || '');
    q.exp = $('#eq-exp')?.value.trim() || '';
    q.vi = $('#eq-vi')?.value.trim() || '';

    if(tp === 'fill'){
      q.opts = [];
      q.ans = 0;
      q.correctText = $('#eq-ct')?.value.trim() || '';
    } else {
      const raw = [...document.querySelectorAll('#eq-opts-list .eq-opt-inp')].map(inp => inp.value.trim());
      const checkedRadio = document.querySelector('input[name="eq-ans"]:checked');
      q.opts = raw;
      q.ans = checkedRadio ? +checkedRadio.value : 0;
      q._rawAns = q.ans;
      cleanOptsAndType(q);

      // Nếu là câu match hoặc classify, đồng bộ luôn danh sách vế B / cột cho các câu cùng nhóm
      if(q.type === 'match' || q.type === 'classify'){
        ex.qs.filter(x => x.g === q.g && x.type === q.type).forEach(sib => {
          sib.opts = q.opts.slice();
          if(sib.ans >= sib.opts.length) sib.ans = 0;
          sib.correctText = sib.opts[sib.ans] || '';
        });
      }
    }

    const grp = ex.groups[q.g];
    if(grp){
      grp.instr = $('#eq-ginstr')?.value.trim() || '';
      grp.passage = $('#eq-gpas')?.value || '';
      autoHighlightPassageWords(grp, ex.qs.filter(x => x.g === q.g));
    }
    if(V.perm) V.perm[qi] = getValidOptIndices(q);
    syncExamEverywhere(ex, ex.title);
    save();
    modal('');
    drawQ();
  };

  render();
})();

  // --- 1. BỘ GIẢI & KHÔI PHỤC ĐÁP ÁN TỰ ĐỘNG CHO BÀI VIẾT LẠI CÂU DÙNG PERFECT GERUND / PERFECT PARTICIPLE ---
  // Tách câu gốc (original sentence) và tiền tố gợi ý viết lại câu (rewritePrefix, ví dụ: "I apologize for", "The man denied"...)
  function parseRewriteQuestionParts(rawQ, isRewriteGroup){
    let s = String(rawQ || '').replace(/__/g, '').trim();
    // Gỡ bỏ tiền tố Question X: / Câu X: nếu còn sót
    s = s.replace(/^(?:Question|Câu)\s*\d+\s*[\.:\)]\s*/i, '').trim();

    let origSentence = s;
    let prefix = '';
    let hasBlankMarker = false;

    // Trường hợp 1: Đã có xuống dòng và ký hiệu ✍️ hoặc chỗ trống ______ ở dòng 2
    const lines = s.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lines.length >= 2){
      const lastLine = lines[lines.length - 1];
      if(/^(?:✍️|➜|->|=>)/.test(lastLine) || /_{3,}/.test(lastLine)){
        hasBlankMarker = true;
        origSentence = lines.slice(0, -1).join('\n').trim();
        prefix = lastLine
          .replace(/^(?:✍️|➜|->|=>)\s*/, '')
          .replace(/_{2,}[\.\s]*$/, '')
          .trim();
        return {origSentence, prefix, isRewrite: true};
      }
    }

    // Trường hợp 2: AI nối liền câu gốc và gợi ý viết lại trên cùng 1 dòng (như trong Ảnh 2: "...meeting yesterday. I apologize for ______")
    const inlineMatch = s.match(/^([\s\S]+?[\.!\?])\s+(?:✍️|➜|->|=>)?\s*([A-Z][^\.!\?\n]{1,65}?)\s*_{3,}[\.\s]*$/);
    if(inlineMatch){
      origSentence = inlineMatch[1].trim();
      prefix = inlineMatch[2].trim();
      return {origSentence, prefix, isRewrite: true};
    }

    // Trường hợp 3: Câu kết thúc bằng ✍️ ______ (không có từ gợi ý đầu câu)
    const blankEndMatch = s.match(/^([\s\S]+?[\.!\?])\s*(?:✍️|➜|->|=>)?\s*_{3,}[\.\s]*$/);
    if(blankEndMatch){
      origSentence = blankEndMatch[1].trim();
      prefix = '';
      return {origSentence, prefix, isRewrite: true};
    }

    // Trường hợp 4: Nằm trong nhóm Viết lại câu (isRewriteGroup) mà AI quên gắn ______ ở cuối câu có gợi ý bị cắt lửng (không có dấu chấm cuối)
    if(isRewriteGroup){
      const trailingCue = s.match(/^([\s\S]+?[\.!\?])\s+(?:✍️|➜|->|=>)?\s*([A-Z][^\.!\?\n]{2,55})$/);
      if(trailingCue){
        origSentence = trailingCue[1].trim();
        prefix = trailingCue[2].replace(/_{2,}[\.\s]*$/, '').trim();
        return {origSentence, prefix, isRewrite: true};
      }
      return {origSentence: s, prefix: '', isRewrite: true};
    }

    return {origSentence: s, prefix: '', isRewrite: hasBlankMarker};
  }

  function buildAutoRewriteSolution(origSentence, prefix){

        vi: 'Chúng tôi thực sự trân trọng việc bạn đã giúp nhóm chúng tôi hoàn thành dự án đúng hạn.'
      },
      {
        test: /after\s+the\s+old\s+bridge\s+had\s+been\s+checked\s+by\s+the\s+engineers/i,
        ans: 'Having been checked by the engineers, the old bridge was reopened to the public. / Having been checked by the engineers, it was reopened to the public.',
        exp: 'Hai mệnh đề cùng chủ ngữ (**the old bridge / it**), mệnh đề đầu ở thể bị động (*had been checked*) nên rút gọn bằng **Perfect Participle bị động (Having been + V3/ed)**: **Having been checked by the engineers, the old bridge was reopened to the public.**',
        vi: 'Sau khi được các kỹ sư kiểm tra, cây cầu cũ đã được mở cửa trở lại cho công chúng.'
      },
      {
        test: /he\s+regretted\s+that\s+he\s+had\s+not\s+spent\s+more\s+time\s+practicing/i,
        ans: 'He regretted not having spent more time practicing his guitar before the concert. / not having spent more time practicing his guitar before the concert / He regretted having not spent more time practicing his guitar before the concert.',
        exp: 'Sau động từ **regret** dùng **Perfect Gerund ở thể phủ định (not having + V3/ed)** để diễn tả sự hối tiếc về việc đã không làm trong quá khứ: **He regretted not having spent more time practicing his guitar before the concert.**',
        vi: 'Anh ấy hối tiếc vì đã không dành nhiều thời gian hơn để luyện tập đàn guitar trước buổi hòa nhạc.'
      },
      {
        test: /because\s+they\s+had\s+won\s+the\s+regional\s+championship/i,
        ans: 'Having won the regional championship, the players were given a warm welcome at the city hall.',
        exp: 'Hai mệnh đề cùng chủ ngữ (**they = the players**), rút gọn mệnh đề nguyên nhân xảy ra trước bằng **Perfect Participle (Having + V3/ed)**: **Having won the regional championship, the players were given a warm welcome at the city hall.**',
        vi: 'Vì đã giành chức vô địch khu vực, các cầu thủ đã được chào đón nồng nhiệt tại tòa thị chính.'
      },
      {
        test: /the\s+suspect\s+was\s+accused\s+because\s+he\s+had\s+leaked\s+private\s+information/i,
        ans: 'The suspect was accused of having leaked private information to the competitors. / having leaked private information to the competitors',
        exp: 'Cấu trúc **be accused of + having + V3/ed** (Perfect Gerund làm tân ngữ sau giới từ **of**): **The suspect was accused of having leaked private information to the competitors.**',

      if(r.test.test(normOrig)) return r;
    }

    // Quy tắc chuyển đổi tổng quát cho câu bắt đầu bằng After / Because / Since / As + S1 + had + (not) + (been) + V3..., S2 + V...
    const mPart = orig.match(/^(?:After|Because|Since|As|When)\s+([^,]+?)\s+had\s+(not\s+)?(been\s+)?([a-zA-Z]+(?:\s+[^,]+)?),\s+([a-zA-Z]+)\s+([\s\S]+)$/i);
    if(mPart && !pref){
      const s1 = mPart[1].trim();
      const neg = mPart[2] ? 'Not having ' : 'Having ';
      const been = mPart[3] ? 'been ' : '';
      const rest1 = mPart[4].trim();
      const s2 = mPart[5].trim();
      const rest2 = mPart[6].trim();
      const finalSubj = /^(he|she|it|they)$/i.test(s2) && !/^(he|she|it|they)$/i.test(s1) ? s1 : s2;

      const ans2 = `${neg}${been}${rest1}, ${s2} ${rest2}`;
      return {
        ans: ans1 !== ans2 ? `${ans1} / ${ans2}` : ans1,
        exp: `Rút gọn mệnh đề trạng ngữ cùng chủ ngữ xảy ra trước bằng **Perfect Participle (${neg.trim()} + ${been}V3/ed)**.`,
        vi: ''
      };
    }

    // Quy tắc chuyển đổi tổng quát khi có prefix gợi ý đầu câu + that + S + had + (not) + V3...
    if(pref){
      const mThat = orig.match(/\bthat\s+(?:he|she|it|they|I|we|you|[A-Za-z\s]+?)\s+had\s+(not\s+|never\s+)?([a-zA-Z]+[\s\S]+)$/i);
      if(mThat){
        const neg = mThat[1] ? 'not ' : '';
        const tail = mThat[2].trim();
        return {
          ans: `${pref} ${neg}having ${tail} / ${neg}having ${tail}`,
          exp: `Sử dụng **Perfect Gerund (${neg}having + V3/ed)** đứng sau động từ / giới từ **${pref}**.`,

        };

  // --- 2. HÀM TỰ ĐỘNG SỬA CHỮA CÁC BÀI TỰ LUẬN VIẾT LẠI CÂU ĐÃ BỊ LƯU NHẦM THÀNH 'CLASSIFY' (PG/PP) ---
  function repairMisclassifiedRewriteGroups(ex){
    if(!ex || !ex.groups || !ex.qs) return false;
    let fixedAny = false;

    ex.groups.forEach((g, gi) => {
      const gQs = ex.qs.filter(q => q.g === gi);
      if(!gQs.length) return;
      const instrNorm = String(g.instr || '').toLowerCase();

      // Kiểm tra xem nhóm này có phải là bài Viết lại câu (Sentence Rewriting) thực sự hay không
      // (Tuyệt đối không chạm vào các câu trắc nghiệm 4 đáp án có dấu gạch ngang ______)
      const isRewriteGroup = (
        /\brewrite\b|\bcomplete\s+the\s+(?:second\s+)?sentence|\bfinish\s+each\b|\bsentence\s+transformation/i.test(instrNorm) ||
        gQs.some(q => /✍️/.test(String(q.q || '')) && (q.type === 'fill' || q.type === 'classify' || !q.opts || !q.opts.length))
      );

      if(!isRewriteGroup) return;

      gQs.forEach(q => {
        // Nếu câu hỏi có đủ 3-4 phương án trắc nghiệm thực sự (không phải PG/PP) thì giữ nguyên
        const realMcOpts = (q.opts || []).map(x => String(x || '').trim()).filter(Boolean);
        if(q.type === 'mc' && realMcOpts.length >= 3 && !realMcOpts.some(x => /^(pg|pp|perfect\s+gerund)/i.test(x))){
          return;
        }

        const parsed = parseRewriteQuestionParts(q.q, true);
        q.RewriteInfo = parsed;

        // Chuẩn hóa lại q.q để câu gốc ở dòng 1 và ✍️ [prefix] ______ ở dòng 2
        const cleanOrig = parsed.origSentence.replace(/__/g, '');
        const cleanPref = parsed.prefix;
        const formattedQ = cleanPref
          ? `${cleanOrig}\n✍️ ${cleanPref} ______`
          : `${cleanOrig}\n✍️ ______`;

        if(q.q !== formattedQ){
          q.q = formattedQ;
          fixedAny = true;
        }

        // Nếu câu này đang bị gán nhầm type === 'classify' (PG/PP)
        if(q.type !== 'fill'){
          q.type = 'fill';
          q.opts = [];
          q.ans = 0;
          fixedAny = true;
        }

        // Nếu correctText đang trống hoặc đang bị lưu nhầm thành "PG (Perfect Gerund)" / "PP (Perfect Participle)"
        const curCT = String(q.correctText || '').trim();
        if(!curCT || /^(pg|pp|perfect\s+gerund|perfect\s+participle)/i.test(curCT)){
          const autoSol = buildAutoRewriteSolution(cleanOrig, cleanPref);
          if(autoSol){
            q.correctText = autoSol.ans;
            if(!q.exp || /đứng đầu câu làm mệnh đề phân từ|đứng làm tân ngữ sau động từ/i.test(q.exp)){
              q.exp = autoSol.exp;
            }
            if(!q.vi && autoSol.vi) q.vi = autoSol.vi;
            fixedAny = true;
          }
        } else if(cleanPref){
          // Nếu correctText chỉ mới lưu cả câu đầy đủ (ví dụ "I apologize for not having replied..."), tự động nối thêm phương án chỉ phần đuôi ("not having replied...") để học sinh gõ cách nào cũng đúng!
          const prefLow = cleanPref.toLowerCase();
          const parts = curCT.split(/\s*[\/|;]\s*/).map(s => s.trim()).filter(Boolean);
          const extraParts = [];
          for(const pt of parts){
            if(pt.toLowerCase().startsWith(prefLow)){
              const remainder = pt.slice(cleanPref.length).trim();
              if(remainder && !parts.some(x => x.toLowerCase() === remainder.toLowerCase())){
                extraParts.push(remainder);
              }
            } else {
              const full = `${cleanPref} ${pt}`;
              if(!parts.some(x => x.toLowerCase() === full.toLowerCase())){
                extraParts.push(full);
              }
            }
          }
          if(extraParts.length){
            q.correctText = [...parts, ...extraParts].join(' / ');
            fixedAny = true;
          }
        }
      });
    });

    return fixedAny;
  }

  // Quét và sửa ngay toàn bộ dữ liệu hiện có trong D.weeks, D.hist, D.savedSessions và V.ex
  function repairAllStoredDatabases(){
    const dbs = [D];
    if(window.SEC_DBS){
      for(const db of Object.values(window.SEC_DBS)){
        if(db && !dbs.includes(db)) dbs.push(db);
      }
    }
    let anyChanged = false;
    for(const db of dbs){
      (db.weeks || []).forEach(w => {
        (w.exams || []).forEach(e => {
          if(repairMisclassifiedRewriteGroups(e)) anyChanged = true;
        });
      });
      (db.hist || []).forEach(h => {
        if(h && h.ex && repairMisclassifiedRewriteGroups(h.ex)) anyChanged = true;
      });
      if(db.savedSessions){
        for(const s of Object.values(db.savedSessions)){
          if(s && s.ex && repairMisclassifiedRewriteGroups(s.ex)) anyChanged = true;
        }
      }
    }
    if(V && V.ex && repairMisclassifiedRewriteGroups(V.ex)){
      anyChanged = true;
    }
    if(anyChanged) save();
  }
  // Đợi IndexedDB nạp xong mới chạy kiểm tra để tuyệt đối không làm lệch mốc thời gian _ts của IndexedDB
  setTimeout(() => {
    repairAllStoredDatabases();
    if(V && V.view === 'exam') drawQ();
  }, 450);

  // Gắn vào normalizeParsedData và draftToExam để mọi đề mới tạo đều được chuẩn hóa
  const origNorm42 = normalizeParsedData;
  normalizeParsedData = function(r){
    const res = origNorm42(r);
    repairMisclassifiedRewriteGroups(res);
    return res;
  };

  const origDraft42 = draftToExam;
  draftToExam = function(draft){
    const ex = origDraft42(draft);
    repairMisclassifiedRewriteGroups(ex);
    return ex;
  };

  // --- 3. NÂNG CẤP HÀM CHẤM ĐIỂM TỰ LUẬN `isFillOk(q, userAns)` THÔNG MINH CHO CẢ ĐIỀN TỪ & VIẾT LẠI CÂU ---
  function normalizeFillSentenceForCompare(str){
    return String(str || '')
      .trim()
      .toLowerCase()
      .replace(/[’‘`]/g, "'")
      .replace(/\bhadn't\b/g, 'had not')
      .replace(/\bdidn't\b/g, 'did not')
      .replace(/\bwasn't\b/g, 'was not')
      .replace(/\bweren't\b/g, 'were not')
      .replace(/\bdon't\b/g, 'do not')
      .replace(/\bdoesn't\b/g, 'does not')
      .replace(/\bhaven't\b/g, 'have not')
      .replace(/\bhasn't\b/g, 'has not')
      .replace(/\bwon't\b/g, 'will not')
      .replace(/\bcan't\b/g, 'cannot')
      .replace(/\bhaving\s+not\b/g, 'not having')
      .replace(/^✍️\s*/, '')
      .replace(/[\.!\?;,]+\s*$/, '') // Bỏ dấu chấm câu ở cuối
      .replace(/\s*,\s*/g, ', ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  window.isFillOk = function(q, userAns){
    if(userAns === undefined || userAns === null) return false;
    const givenNorm = normalizeFillSentenceForCompare(userAns);
    if(!givenNorm) return false;

    const rawTarget = String(q.correctText || (q.opts && q.opts[q.ans]) || '').trim();
    if(!rawTarget) return false;

    const parsed = parseRewriteQuestionParts(q.q || '', /_{3,}|✍️/.test(String(q.q || '')));
    const prefNorm = normalizeFillSentenceForCompare(parsed.prefix || '');

    const rawList = rawTarget.split(/\s*[\/|;]\s*/).filter(Boolean);
    rawList.push(rawTarget);

    const candidateSet = new Set();
    for(const item of rawList){
      const n = normalizeFillSentenceForCompare(item);
      if(!n) continue;
      candidateSet.add(n);
      // Nếu câu có tiền tố gợi ý (ví dụ: "I apologize for"), chấp nhận cả câu đầy đủ lẫn chỉ phần đuôi sau gợi ý
      if(prefNorm){
        if(n.startsWith(prefNorm + ' ')){
          candidateSet.add(n.slice(prefNorm.length).trim());
        } else {
          candidateSet.add(`${prefNorm} ${n}`.trim());
        }
      }
      // Chấp nhận biến thể có hoặc không có "to" sau "help sb (to) V"
      if(/\bhelped\s+([^,]+?)\s+to\s+([a-z]+)\b/.test(n)){
        candidateSet.add(n.replace(/\b(helped\s+[^,]+?)\s+to\s+([a-z]+)\b/, '$1 $2'));
      } else if(/\bhelped\s+([a-z]+\s+[a-z]+)\s+([a-z]+)\b/.test(n)){
        candidateSet.add(n.replace(/\b(helped\s+[a-z]+\s+[a-z]+)\s+([a-z]+)\b/, '$1 to $2'));
      }
    }

    return candidateSet.has(givenNorm);
  };

  // --- 4. NÂNG CẤP HIỂN THỊ CÂU TỰ LUẬN VIẾT LẠI CÂU TRONG `drawQ` (CẢ CỘT TRÁI #L VÀ CỘT PHẢI #R) ---
  function formatLeftStemHtml(q, gi, qi, nmFn){
    const rawQ = String(q.q || '');
    if(q.type === 'fill' && /_{3,}|✍️/.test(rawQ)){
      const parsed = parseRewriteQuestionParts(rawQ, true);
      const origHtml = seg(fmtArrangeText(parsed.origSentence), gi + ':s' + qi);
      const prefHtml = parsed.prefix
        ? `<span class="rewrite-prompt-prefix">${seg(parsed.prefix, gi + ':sp' + qi)}</span>`
        : '';
      return `<b>Câu ${nmFn(qi)}.</b> ${origHtml}
        <div class="rewrite-prompt-line">
          <span>✍️</span>
          ${prefHtml}
          <span class="rewrite-blank-line"></span>
        </div>`;
    }
    return `<b>Câu ${nmFn(qi)}.</b> ${seg(fmtArrangeText(rawQ), gi + ':s' + qi)}`;
  }

  const origDrawQ42 = drawQ;
  drawQ = function(){
    if(V && V.ex) repairMisclassifiedRewriteGroups(V.ex);
    origDrawQ42();

    if(!V || !V.ex) return;
    const {ex, order, ans, rev} = V;
    const nm = qi => order.indexOf(qi) + 1;
    const isVert = V.layout === 'vertical';

    // Làm đẹp các câu tự luận viết lại câu ở cả Cột Trái (#L) và Cột Phải (#R)
    ex.qs.forEach((q, qi) => {
      if(q.type !== 'fill') return;
      const gi = q.g || 0;
      const rawQ = String(q.q || '');
      const isRewriteQ = /_{3,}|✍️/.test(rawQ) || /\brewrite\b/i.test(String(ex.groups?.[gi]?.instr || ''));

      // 1. Nâng cấp hiển thị câu hỏi ở Cột Trái (#L) khi ở giao diện Ngang (Split View)
      if(!isVert && !ex.groups?.[gi]?.passage){
        const lEl = document.querySelector(`#L .st#L${qi}`);
        if(lEl && isRewriteQ){
          lEl.innerHTML = formatLeftStemHtml(q, gi, qi, nm);
        }
      }

      // 2. Nâng cấp thẻ trả lời ở Cột Phải (#R) cho câu Tự luận Viết lại câu / Tự luận rời
      const rCard = document.getElementById('R' + qi);
      if(!rCard) return;

      const parsed = parseRewriteQuestionParts(rawQ, isRewriteQ);
      const inp = rCard.querySelector(`input[data-a="fill"][data-q="${qi}"]`);

      // Đổi nhãn "(Tự luận điền đáp án)" -> "✍️ VIẾT LẠI CÂU" nếu là câu viết lại
      if(isRewriteQ){
        const smallMu = rCard.querySelector('.cn small.mu');
        if(smallMu){
          smallMu.outerHTML = `<span class="tf-tag rewrite-tag">✍️ VIẾT LẠI CÂU</span>`;
        }
      }

      // Hiển thị câu gốc & thanh tiền tố gợi ý (ví dụ: "✍️ I apologize for ...") ngay trên thẻ trả lời #R
      let qstemEl = rCard.querySelector('.qstem');
      if(!qstemEl && parsed.origSentence && !ex.groups?.[gi]?.passage){
        qstemEl = document.createElement('div');
        qstemEl.className = 'qstem';
        qstemEl.style.fontSize = '14px';
        qstemEl.style.color = 'var(--mu)';
        qstemEl.innerHTML = seg(fmtArrangeText(parsed.origSentence), gi + ':rq' + qi);
        inp?.before(qstemEl);
      } else if(qstemEl && isRewriteQ){
        qstemEl.innerHTML = seg(fmtArrangeText(parsed.origSentence), gi + ':rq' + qi);
      }

      if(isRewriteQ && inp){
        let prefBar = rCard.querySelector('.rewrite-card-prefix-bar');
        if(parsed.prefix){
          if(!prefBar){
            prefBar = document.createElement('div');
            prefBar.className = 'rewrite-card-prefix-bar';
            inp.before(prefBar);
          }
          prefBar.innerHTML = `<span>✍️ Gợi ý đầu câu:</span> <b>${esc(parsed.prefix)} ...</b>`;
          inp.placeholder = `Nhập phần tiếp theo sau "${parsed.prefix} ..." (hoặc nhập cả câu)...`;
        } else {
          if(prefBar) prefBar.remove();
          inp.placeholder = '✍️ Nhập câu viết lại hoàn chỉnh của bạn vào đây...';
        }
      }
    });
  };

  render();
})();


/* === BẢN NÂNG CẤP V46: ĐỒNG BỘ TỨC THÌ KHI XÓA / DI CHUYỂN & BẢO VỆ TOÀN VẸN CÂY THƯ MỤC + ĐẦU MỤC + FILE === */
