        </div>
        <p><label style="display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer"><input type="checkbox" id="keep-imp-files" style="width:auto"> Đính kèm các file/ảnh đã chọn vào mục "📎 Tài liệu của bài" (Chỉ bật khi bạn muốn lưu kèm file gốc)</label></p>
        <p id="st" class="mu"></p>
        <div class="row"><button class="pri" id="go" data-a="ai">Lưu / Xử lý đề</button><button class="gh" data-a="close">Hủy</button></div>`);
      upd();
    },
    im_ren(d){
      const f=IM[+d.i];
      if(!f)return;
      const cur=f.customTitle||(f.name?f.name.replace(/\.[^.]+$/,''):'');
      const n=prompt('Nhập tên mới cho file đính kèm này:', cur);
      if(n!==null && n.trim()){
        f.customTitle=n.trim();
        const itInp=$('#it');
        if(itInp && !itInp.value.trim()) itInp.value=n.trim();
        upd();
      }
    },
    im_del(d){
      IM.splice(+d.i,1);
      upd();
    },
    async ai(){
      const st=$('#st'),b=$('#go');
      if(!$('#tx').value.trim()&&!IM.length){st.textContent='Hãy dán nội dung đề, mã JSON hoặc chọn file/ảnh.';return}
      b.disabled=true;st.textContent='⏳ Đang đọc dữ liệu từ file / ảnh và phân tích đề…';
      try{
        let extraText='';
        const keepFiles=!!$('#keep-imp-files')?.checked;
        const attachedFiles=[];
        const mediaFiles=[];
        for(const f of IM){
          const fObj=await processFileObject(f,'Đề gốc / Tài liệu');
          if(keepFiles) attachedFiles.push(fObj);
          if(fObj.ext==='json' && fObj.textPreview){
            extraText=fObj.textPreview;
          }else if(fObj.textPreview){
            extraText+=`\n\n--- NỘI DUNG TỪ FILE ${fObj.name} ---\n`+fObj.textPreview;
          }else{
            mediaFiles.push(f);
          }
        }
        const combinedText=($('#tx').value.trim()+'\n'+extraText).trim();
        const e=await aiParse(combinedText,mediaFiles);
        e.id=uid();
        const defaultTitle=IM[0]?(IM[0].customTitle||IM[0].name?.replace(/\.[^.]+$/,'')):('Bài '+(D.weeks[V.wi].exams.length+1));
        e.title=$('#it').value.trim()||defaultTitle||'Bài '+(D.weeks[V.wi].exams.length+1);
        e.files=attachedFiles;
        D.weeks[V.wi].exams.push(e);
        save();modal('');render();
      }catch(x){
        st.textContent='Lỗi: '+(x.message||'không xử lý được')+'.';
        b.disabled=false;
      }

    wfiles(){
      FM_CTX={type:'week', wi:V.wi};

      const ei=+d.i;
      FM_CTX={type:'exam', wi:V.wi, ei, ex:D.weeks[V.wi]?.exams?.[ei]};
      openFilesManagerModal();

    efiles_cur(){
      if(!V.ex)return;
      if(!V.ex.isRetry){
        for(const w of (D.weeks||[])){
          const idx = (w.exams||[]).findIndex(e => (V.ex.id && e.id===V.ex.id) || (V.ex.title && e.title===V.ex.title));
          if(idx >= 0){
            const canonical = w.exams[idx];
            canonical.files = canonical.files || [];
            V.ex.files = canonical.files;
            if(V.wi < 0) V.wi = D.weeks.indexOf(w);
            if(V.ei === undefined || V.ei < 0) V.ei = idx;

      const files=getCtxFiles();
      files.push({
        id:uid(),
        name:(title||'Ghi chú')+(url?'.link':'.md'),
        title:title||(url?'Link tài liệu':'Ghi chú Lý thuyết / Từ vựng'),
        cat,
        ext:url&&!txt?'link':'md',
        size:txt.length,
        ts:Date.now(),
        dataUrl:'',
        htmlPreview:'',
        textPreview:txt,
        url
      });

      openFilesManagerModal();
      render();

      const removed=files[+d.fi];
      if(removed && removed.id && typeof window._markDeletedId === 'function'){
        window._markDeletedId(removed.id);
      }
      files.splice(+d.fi,1);
      syncCtxFilesAndSave();
      if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      openFilesManagerModal();
      render();
    },
    delf_e(d){
      const ex=D.weeks[V.wi]?.exams?.[+d.ei];
      if(!ex || !Array.isArray(ex.files)) return;
      const removed=ex.files[+d.fi];
      if(removed && removed.id && typeof window._markDeletedId === 'function'){
        window._markDeletedId(removed.id);
      }
      ex.files.splice(+d.fi,1);
      syncExamEverywhere(ex, ex.title);
      save();
      if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      render();
    },
    viewf_w(d){
      const w=D.weeks[V.wi];
      FM_CTX={type:'week', wi:V.wi};
      openFileViewer(w?.files?.[+d.fi], false);
    },
    renf_w(d){
      const w=D.weeks[V.wi];
      FM_CTX={type:'week', wi:V.wi};
      openRenameFileModal(w?.files?.[+d.fi], 'week', false);
    },
    dlf_w(d){
      downloadFileObj(D.weeks[V.wi]?.files?.[+d.fi]);
    },
    delf_w(d){
      const w=D.weeks[V.wi];
      if(!w?.files)return;
      w.files.splice(+d.fi,1);
      save();render();
    },
    viewf_e(d){
      const ex=D.weeks[V.wi]?.exams?.[+d.ei];
      FM_CTX={type:'exam', wi:V.wi, ei:+d.ei, ex};
      openFileViewer(ex?.files?.[+d.fi], false);
    },
    renf_e(d){
      const ex=D.weeks[V.wi]?.exams?.[+d.ei];
      FM_CTX={type:'exam', wi:V.wi, ei:+d.ei, ex};
      openRenameFileModal(ex?.files?.[+d.fi], 'week', false);
    },
    fv_ren(){
      openRenameFileModal(window._curViewFile, 'viewer', window._curViewAllowBack);
    },
    rf_save(){
      finishRenameFileModal(true);
    },
    rf_cancel(){
      finishRenameFileModal(false);
    },
    fv_dl(){
      downloadFileObj(window._curViewFile);
    },
    fv_back(){
      openFilesManagerModal();
    }
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Enter' && e.target.id==='rf-title'){
      e.preventDefault();
      finishRenameFileModal(true);
    }
  });

  document.addEventListener('change',async e=>{
    if(e.target.id==='fm-inp' && e.target.files?.length){
      const stEl=$('#fm-st');
      const cat=$('#fm-cat')?.value||'Lý thuyết';
      if(stEl) stEl.textContent='⏳ Đang đọc và lưu vĩnh viễn file vào bộ nhớ Web...';
      const files=getCtxFiles();
      for(const f of e.target.files){
        const fObj=await processFileObject(f,cat);
        if(typeof window._saveFileToVault === 'function') await window._saveFileToVault(fObj);
        files.push(fObj);
      }
      syncCtxFilesAndSave();
      if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      openFilesManagerModal();
      render();
    }
  });
})();

  `;
  document.head.appendChild(st16);

  // Khởi tạo cấu trúc dữ liệu mới cho v16
  function ensureV16Data(){
    D.trash = D.trash || [];
    D.studyLog = D.studyLog || {};
    D.dailyGoalMin = D.dailyGoalMin || 30;
    D.mistakeStore = D.mistakeStore || {}; // Lưu bền vững các câu sai & trạng thái đã thuộc
  }
  ensureV16Data();

  // --- PHẦN A: HỆ THỐNG THEO DÕI THỜI GIAN HỌC & CHUỖI STREAK LỬA 🔥 ---
  function toDateKey(ts){
    const d = new Date(ts || Date.now());
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function fmtDurHM(sec){
    sec = Math.max(0, Math.round(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if(h > 0) return `${h} giờ ${String(m).padStart(2,'0')} phút`;
    if(m > 0) return `0 giờ ${m} phút`;
    if(s > 0) return `0 giờ 01 phút (${s}s)`;
    return `0 giờ 0 phút`;
  }

  function fmtDurShort(sec){
    sec = Math.max(0, Math.round(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if(h > 0) return `${h}g ${m}p`;
    if(m > 0) return `${m}p`;
    if(sec > 0) return `${sec}s`;
    return `0p`;
  }

  function getStudyDayMap(){
    ensureV16Data();
    const map = {};
    // 1. Lấy từ lịch sử làm bài D.hist
    for(const h of (D.hist || [])){
      if(!h || !h.ts) continue;
      const dk = toDateKey(h.ts);
      if(!map[dk]) map[dk] = {sec: 0, histSec: 0, exams: 0, totalPct: 0};
      map[dk].histSec += Math.max(0, +(h.used || 0));
      map[dk].exams += 1;
      map[dk].totalPct += (h.t ? Math.round(h.c / h.t * 100) : 0);
    }
    // 2. Kết hợp với D.studyLog (bộ đếm thời gian học thực tế trong ngày)
    for(const [dk, loggedSec] of Object.entries(D.studyLog || {})){
      if(!map[dk]) map[dk] = {sec: 0, histSec: 0, exams: 0, totalPct: 0};
      map[dk].sec = Math.max(+(loggedSec || 0), map[dk].histSec);
    }
    for(const dk of Object.keys(map)){
      map[dk].sec = Math.max(map[dk].sec, map[dk].histSec);
    }
    return map;
  }

  function calcStreakStats(){
    const dayMap = getStudyDayMap();
    const todayK = toDateKey(Date.now());
    const yestK = toDateKey(Date.now() - 86400000);
    const activeKeys = Object.keys(dayMap).filter(k => dayMap[k].sec > 0).sort();

    let bestStreak = 0, curRun = 0, prevTime = null;
    for(const k of activeKeys){
      const [y,m,d] = k.split('-').map(Number);
      const t = new Date(y, m-1, d).getTime();
      if(prevTime !== null && Math.round((t - prevTime) / 86400000) === 1){
        curRun += 1;
      }else{
        curRun = 1;
      }
      if(curRun > bestStreak) bestStreak = curRun;
      prevTime = t;
    }

    // Tính chuỗi hiện tại (tính từ hôm nay hoặc hôm qua nếu hôm nay chưa học)
    let curStreak = 0;
    let checkDate = new Date();
    checkDate.setHours(0,0,0,0);
    if(!(dayMap[todayK]?.sec > 0)){
      if(dayMap[yestK]?.sec > 0){
        checkDate = new Date(checkDate.getTime() - 86400000);
      }else{
        checkDate = null;
      }
    }
    while(checkDate){
      const ck = toDateKey(checkDate.getTime());
      if(dayMap[ck]?.sec > 0){
        curStreak += 1;
        checkDate = new Date(checkDate.getTime() - 86400000);
      }else{
        break;
      }
    }
    if(curStreak > bestStreak) bestStreak = curStreak;

    const todaySec = dayMap[todayK]?.sec || 0;
    const totalSec = activeKeys.reduce((a,k) => a + (dayMap[k]?.sec || 0), 0);
    const goalMin = Math.max(5, +(D.dailyGoalMin || 30));
    const goalPct = Math.min(100, Math.round((todaySec / (goalMin * 60)) * 100));

    return {
      curStreak,
      bestStreak,
      todaySec,
      totalSec,
      totalDays: activeKeys.length,
      goalMin,
      goalPct,
      todayK,
      dayMap
    };
  }

  // Bộ đếm thời gian học tự động mỗi giây (Tối ưu O(1), không bao giờ gây khựng khi đang gõ bài)
  let studyHeartbeatTicks = 0;
  setInterval(()=>{
    ensureV16Data();
    const isStudying = (V.view === 'exam' && !V.paused) || V.view === 'mistakes' || V.view === 'edit' || !!$('#modal .ov');
    if(!isStudying || document.hidden) return;
    const tk = toDateKey(Date.now());
    D.studyLog[tk] = (D.studyLog[tk] || 0) + 1;
    studyHeartbeatTicks++;
    if(V.view !== 'exam' && studyHeartbeatTicks % 30 === 0) save();
    if(V.view !== 'exam' && studyHeartbeatTicks % 5 === 0){
      const sideTimeEl = $('#side-today-time');
      const sideFillEl = $('#side-streak-fill');
      if(sideTimeEl || sideFillEl){
        const st = calcStreakStats();
        if(sideTimeEl) sideTimeEl.textContent = `Hôm nay: ${fmtDurHM(st.todaySec)}`;
        if(sideFillEl) sideFillEl.style.width = `${st.goalPct}%`;
      }
    }
  }, 1000);

  // --- PHẦN B: HỆ THỐNG SỔ TAY CÂU SAI & HAY SAI ---
  function extractClozeSentence(passage, blankNum){
    if(!passage) return `Câu hỏi điền khuyết vị trí (${blankNum})`;
    const tag = `[[${blankNum}]]`;
    const idx = passage.indexOf(tag);
    if(idx === -1) return passage.slice(0, 180) + (passage.length > 180 ? '...' : '');
    let start = Math.max(0, passage.lastIndexOf('.', idx - 1) + 1, passage.lastIndexOf('\n', idx - 1) + 1);
    let endDot = passage.indexOf('.', idx + tag.length);
    let endNl = passage.indexOf('\n', idx + tag.length);
    let end = passage.length;
    if(endDot !== -1 && endNl !== -1) end = Math.min(endDot + 1, endNl);
    else if(endDot !== -1) end = endDot + 1;
    else if(endNl !== -1) end = endNl;
    const snippet = passage.slice(start, end).trim();
    return snippet.replace(/\[\[(\d+)\]\]/g, (m, d) => +d === +blankNum ? `**__(${d}) ______ __**` : `(${d}) ___`);
  }

  // Kiểm tra xem Thư mục (Tuần) và Bài thi của câu hỏi có còn tồn tại trong danh sách Thư mục (D.weeks) hay không
  function isExamStillInWeeks(wid, weekName, examId, examTitle){
    const weeks = D.weeks || [];
    const wNameNorm = String(weekName || '').trim().toLowerCase();
    const eTitleNorm = String(examTitle || '').trim().toLowerCase();

    let folder = null;
    if(wid) folder = weeks.find(w => w.id === wid);
    if(!folder && wNameNorm) folder = weeks.find(w => String(w.name || '').trim().toLowerCase() === wNameNorm);
    if(!folder) return false;

    const exams = folder.exams || [];
    if(examId && !String(examId).startsWith('retry_') && exams.some(e => e.id === examId)) return true;
    if(eTitleNorm && exams.some(e => String(e.title || '').trim().toLowerCase() === eTitleNorm)) return true;
    return false;
  }

  // Kiểm tra xem Thư mục (Tuần) hoặc Bài thi có đang nằm tạm trong Thùng rác (chờ khôi phục) hay không
  function isExamInTrash(wid, weekName, examId, examTitle){
    const trash = D.trash || [];
    const wNameNorm = String(weekName || '').trim().toLowerCase();
    const eTitleNorm = String(examTitle || '').trim().toLowerCase();
    for(const item of trash){
      const p = item.payload || {};
      if(item.type === 'folder'){
        for(const f of (p.folders || [])){
          if((wid && f.id === wid) || (wNameNorm && String(f.name || '').trim().toLowerCase() === wNameNorm)) return true;
          for(const e of (f.exams || [])){
            if((examId && e.id === examId) || (eTitleNorm && String(e.title || '').trim().toLowerCase() === eTitleNorm)) return true;
          }
        }
      } else if(item.type === 'exam' && p.exam){
        const e = p.exam;
        if((examId && e.id === examId) || (eTitleNorm && String(e.title || '').trim().toLowerCase() === eTitleNorm)){
          if(!wid || !p.wid || wid === p.wid) return true;
        }
      }
    }
    return false;
  }

  // Tự động dọn sạch dữ liệu mồ côi (Lịch sử, Câu sai, Phiên tạm dừng) của những Tuần / Bài đã bị xóa vĩnh viễn khỏi Thùng rác
  function purgeOrphanedData(){
    ensureV16Data();
    let changed = false;

    // 1. Dọn dẹp D.hist của các Tuần / Bài đã xóa vĩnh viễn (không còn ở D.weeks và cũng không còn ở D.trash)
    if(Array.isArray(D.hist) && D.hist.length){
      const nextHist = [];
      for(const h of D.hist){
        const ex = h?.ex;
        if(!ex || !ex.qs){ changed = true; continue; }
        const isRetry = !!(ex.isRetry || String(ex.id || '').startsWith('retry_'));
        if(!isRetry){
          const wid = h.wid || '';
          const wName = h.week || '';
          const eId = ex.id || '';
          const eTitle = h.title || ex.title || '';
          if(!isExamStillInWeeks(wid, wName, eId, eTitle) && !isExamInTrash(wid, wName, eId, eTitle)){
            changed = true;
            continue;
          }
          nextHist.push(h);
        } else {
          // Với bài làm lại từ Sổ tay câu sai: kiểm tra xem còn câu hỏi nào thuộc Tuần/Bài đang tồn tại không
          const hasValidQ = ex.qs.some(q => {
            const qWid = q._origWid !== undefined ? q._origWid : (h.wid || '');
            const qWeek = q._origWeek || h.week || '';
            const qEId = q._origExamId || '';
            const qETitle = q._origExamTitle || '';
            return isExamStillInWeeks(qWid, qWeek, qEId, qETitle) || isExamInTrash(qWid, qWeek, qEId, qETitle);
          });
          if(!hasValidQ){
            changed = true;
            continue;
          }
          nextHist.push(h);
        }
      }
      if(nextHist.length !== D.hist.length){
        D.hist = nextHist;
        changed = true;
      }
    }

    // 2. Dọn dẹp D.mistakeStore của các Tuần / Bài đã xóa vĩnh viễn
    if(D.mistakeStore && typeof D.mistakeStore === 'object'){
      for(const [k, v] of Object.entries(D.mistakeStore)){
        if(!v){ delete D.mistakeStore[k]; changed = true; continue; }
        if(!isExamStillInWeeks(v.wid, v.weekName, v.examId, v.examTitle) && !isExamInTrash(v.wid, v.weekName, v.examId, v.examTitle)){
          delete D.mistakeStore[k];
          changed = true;
        }
      }
    }

    // 3. Dọn dẹp D.savedSessions (phiên làm bài tạm dừng) của các Tuần / Bài đã xóa
    if(D.savedSessions && typeof D.savedSessions === 'object'){
      for(const [sk, sv] of Object.entries(D.savedSessions)){
        if(!sv){ delete D.savedSessions[sk]; changed = true; continue; }
        const isRetry = !!(sv.ex?.isRetry || sv.fromMistakes);
        if(!isRetry && !isExamStillInWeeks(sv.wid, sv.weekName, sv.examId, sv.title)){
          delete D.savedSessions[sk];
          changed = true;
        }
      }
    }

    if(changed) save();
  }

  let _mistakesCache = null;
  let _mistakesCacheDirty = true;
  let _mistakesCacheRefD = null;
  window.markMistakesDirty = function(){ _mistakesCacheDirty = true; };
  window._resetSectionViewFilters = function(){
    MK_FILTER = {wid: '', examTitle: '', mode: 'all'};
    STK_TAB = 'day';
    STK_MONTH_OFFSET = 0;
    TR_TAB = 'all';
    _mistakesCacheDirty = true;
  };

  function syncMistakesFromHistory(forceRebuild){
    if(_mistakesCacheRefD !== D){ _mistakesCacheDirty = true; _mistakesCacheRefD = D; }
    if(!forceRebuild && !_mistakesCacheDirty && _mistakesCache) return _mistakesCache;
    ensureV16Data();
    purgeOrphanedData();
    const calcMap = {};
    const sortedHist = (D.hist || []).slice().sort((a,b) => (a.ts||0) - (b.ts||0));
    for(const h of sortedHist){
      const ex = h.ex;
      if(!ex || !ex.qs) continue;
      const ans = h.ans || {};
      ex.qs.forEach((q, qi) => {
        if(h.partial && h.gradedQs && !h.gradedQs[qi]) return;
        const mKey = q._origKey || `${h.wid||h.week||'w'}__${ex.id||h.title||'e'}__Q${qi}`;
        const grp = (ex.groups && ex.groups[q.g]) || {instr:'', passage:''};
        const origWid = q._origWid !== undefined ? q._origWid : (h.wid || '');
        const origWeek = q._origWeek || h.week || pathOf(origWid) || 'Chưa phân loại';
        const origExamId = q._origExamId || ex.id || '';
        const origExamTitle = q._origExamTitle || h.title || ex.title || 'Bài thi';
        const origQNum = q._origQNum || (qi + 1);

        // CHỈ tổng hợp câu sai nếu Tuần (Thư mục) và Bài thi đó hiện đang còn tồn tại trong D.weeks
        if(!isExamStillInWeeks(origWid, origWeek, origExamId, origExamTitle)) return;

        // Nếu người dùng đã chủ động xóa câu sai này khỏi Sổ tay, bỏ qua các lần làm bài cũ trước thời điểm xóa
        const prevStored = D.mistakeStore[mKey];
        if(prevStored && prevStored.deleted && (h.ts || 0) <= (prevStored.deletedAt || 0)) return;

        const isCorrect = q.type === 'fill' ? isFillOk(q, ans[qi]) : ans[qi] === q.ans;
        if(!isCorrect){
          if(!calcMap[mKey]){
            const folderObj = (D.weeks || []).find(w => (origWid && w.id === origWid) || String(w.name || '').trim().toLowerCase() === String(origWeek || '').trim().toLowerCase());
            const examObj = (folderObj?.exams || []).find(e => (origExamId && e.id === origExamId) || String(e.title || '').trim().toLowerCase() === String(origExamTitle || '').trim().toLowerCase());
            let displayQ = q.q || '';
            if(!displayQ.trim() && grp.passage){
              displayQ = extractClozeSentence(grp.passage, qi + 1);
            }
            calcMap[mKey] = {
              key: mKey,
              wid: folderObj ? folderObj.id : origWid,
              weekName: folderObj ? folderObj.name : origWeek,
              examId: examObj ? examObj.id : origExamId,
              examTitle: examObj ? examObj.title : origExamTitle,
              origQNum,
              qObj: JSON.parse(JSON.stringify(q)),
              displayQ,
              group: {instr: grp.instr || '', passage: grp.passage || ''},
              wrongCount: 0,
              correctCount: 0,
              lastWrongTs: 0,
              lastUserAns: null,
              lastWasCorrect: false,
              mastered: !!(prevStored && prevStored.mastered && !prevStored.deleted)
            };
          }
          const item = calcMap[mKey];
          item.wrongCount += 1;
          item.lastWrongTs = h.ts || Date.now();
          item.lastUserAns = ans[qi];
          item.lastWasCorrect = false;
          item.qObj = JSON.parse(JSON.stringify(q));
        } else if(calcMap[mKey]){
          calcMap[mKey].correctCount += 1;
          calcMap[mKey].lastWasCorrect = true;
        }
      });
    }

    // Lưu lại trạng thái đã thuộc (mastered) hoặc đã xóa thủ công (deleted) cho các câu thuộc Tuần/Bài còn tồn tại
    const nextStore = {};
    for(const [k, item] of Object.entries(calcMap)){
      nextStore[k] = item;
    }
    for(const [k, v] of Object.entries(D.mistakeStore || {})){
      if(v && v.deleted && !nextStore[k] && isExamStillInWeeks(v.wid, v.weekName, v.examId, v.examTitle)){
        nextStore[k] = v;
      }
    }
    D.mistakeStore = nextStore;
    _mistakesCache = Object.values(calcMap).sort((a,b) => (b.wrongCount - a.wrongCount) || (b.lastWrongTs - a.lastWrongTs));
    _mistakesCacheDirty = false;
    return _mistakesCache;
  }

  // Tạo đề thi "Làm lại câu sai" từ danh sách các mục câu sai đã lọc
  function buildRetryExamObject(mistakeItems, title, shuffleQuestions){
    let list = mistakeItems.slice();
    if(shuffleQuestions) list = shuf(list);

    // Gom nhóm những câu có cùng bài đọc (passage) để hiển thị mượt mà
    const pasMap = new Map();
    const standalone = [];
    for(const m of list){
      const pas = (m.group?.passage || '').trim();
      const instr = (m.group?.instr || '').trim();
      // Nếu là câu điền khuyết trong đoạn văn có [[...]] thì tách câu trích dẫn hoặc giữ đoạn văn đã điền sẵn các chỗ không hỏi
      const hasBlanks = /\[\[\d+\]\]/.test(pas);
      if(pas && !hasBlanks){
        const gKey = `${m.examId}::${pas.slice(0,80)}`;
        if(!pasMap.has(gKey)) pasMap.set(gKey, {instr, passage: pas, items: []});
        pasMap.get(gKey).items.push(m);
      }else{
        standalone.push(m);
      }
    }

    const gs = [], qs = [];
    // 1. Đưa các câu độc lập / câu điền khuyết (kèm câu ngữ cảnh) vào nhóm
    if(standalone.length){
      const gi = gs.length;
      const items = shuffleQuestions ? shuf(standalone.slice()) : standalone;
      for(const m of items){
        const qClone = JSON.parse(JSON.stringify(m.qObj));
        if(!qClone.q || !qClone.q.trim()){
          qClone.q = m.displayQ || `Câu số ${m.origQNum} (${m.examTitle})`;
        }
        qClone.g = gi;
        qClone._origKey = m.key;
        qClone._origWid = m.wid;
        qClone._origWeek = m.weekName;
        qClone._origExamId = m.examId;
        qClone._origExamTitle = m.examTitle;
        qClone._origQNum = m.origQNum;
        qs.push(qClone);
      }
      gs.push({
        instr: 'Complete the following questions from your Mistake Notebook (Câu hỏi tổng hợp từ Sổ tay câu sai):',
        passage: ''
      });
    }

    // 2. Đưa các nhóm đọc hiểu (Reading Comprehension / True-False) vào
    for(const grpData of pasMap.values()){
      const gi = gs.length;
      const items = shuffleQuestions ? shuf(grpData.items.slice()) : grpData.items;
      for(const m of items){
        const qClone = JSON.parse(JSON.stringify(m.qObj));
        qClone.g = gi;
        qClone._origKey = m.key;
        qClone._origWid = m.wid;
        qClone._origWeek = m.weekName;
        qClone._origExamId = m.examId;
        qClone._origExamTitle = m.examTitle;
        qClone._origQNum = m.origQNum;
        qs.push(qClone);
      }
      gs.push({
        instr: grpData.instr || 'Read the following passage and answer the questions:',
        passage: grpData.passage
      });
    }

    return {
      id: 'retry_' + uid(),
      isRetry: true,
      title: title || 'Ôn tập Sổ tay câu sai',
      groups: gs,
      qs,
      hl: [],
      files: []
    };
  }

  // --- PHẦN C: GIAO DIỆN SỔ TAY CÂU SAI (`V.view === 'mistakes'`) ---
  let MK_FILTER = {wid: '', examTitle: '', mode: 'all'}; // mode: 'all'|'hot'|'unfixed'|'fixed'|'mastered'
  let RETRY_POOL = [];
  let RETRY_TITLE = '';

  function renderMistakes(m){
    const allMistakes = syncMistakesFromHistory();
    const activeMistakes = allMistakes.filter(x => !x.mastered);
    const hotMistakes = activeMistakes.filter(x => x.wrongCount >= 2);
    const unfixedMistakes = activeMistakes.filter(x => !x.lastWasCorrect);
    const fixedMistakes = activeMistakes.filter(x => x.lastWasCorrect);
    const masteredMistakes = allMistakes.filter(x => x.mastered);

    // Thống kê theo từng Mục (Thư mục) và từng Bài thi
    const folderStats = new Map();
    const examStats = new Map();
    for(const item of activeMistakes){
      const fKey = item.wid || item.weekName || 'other';
      const fName = D.weeks.find(w => w.id === item.wid)?.name || item.weekName || 'Chưa phân loại';
      if(!folderStats.has(fKey)) folderStats.set(fKey, {wid: item.wid, name: fName, total: 0, hot: 0, items: []});
      const fs = folderStats.get(fKey);
      fs.total++;
      if(item.wrongCount >= 2) fs.hot++;
      fs.items.push(item);

      const eKey = `${fKey}::${item.examTitle}`;
      if(!examStats.has(eKey)) examStats.set(eKey, {wid: item.wid, weekName: fName, title: item.examTitle, total: 0, hot: 0, items: []});
      const es = examStats.get(eKey);
      es.total++;
      if(item.wrongCount >= 2) es.hot++;
      es.items.push(item);
    }

    // Tự động đặt lại bộ lọc nếu Tuần hoặc Bài đang chọn đã bị xóa hoặc không còn câu sai
    if(MK_FILTER.wid && !folderStats.has(MK_FILTER.wid) && !allMistakes.some(x => (x.wid || x.weekName) === MK_FILTER.wid)){
      MK_FILTER.wid = '';
      MK_FILTER.examTitle = '';
    }
    if(MK_FILTER.examTitle && !allMistakes.some(x => x.examTitle === MK_FILTER.examTitle)){
      MK_FILTER.examTitle = '';
    }

    // Lọc danh sách chi tiết
    let filtered = allMistakes.filter(item => {
      if(MK_FILTER.mode === 'mastered') return item.mastered;
      if(item.mastered) return false;
      if(MK_FILTER.wid && (item.wid || item.weekName) !== MK_FILTER.wid) return false;
      if(MK_FILTER.examTitle && item.examTitle !== MK_FILTER.examTitle) return false;
      if(MK_FILTER.mode === 'hot') return item.wrongCount >= 2;
      if(MK_FILTER.mode === 'unfixed') return !item.lastWasCorrect;
      if(MK_FILTER.mode === 'fixed') return item.lastWasCorrect;
      return true;
    });

    const folderOptions = [...folderStats.entries()].map(([k, v]) => `<option value="${esc(k)}" ${MK_FILTER.wid===k?'selected':''}>📁 ${esc(v.name)} (${v.total} câu sai)</option>`).join('');
    const examOptions = [...examStats.values()]
      .filter(e => !MK_FILTER.wid || (e.wid || e.weekName || 'other') === MK_FILTER.wid)
      .map(e => `<option value="${esc(e.title)}" ${MK_FILTER.examTitle===e.title?'selected':''}>📘 ${esc(e.title)} (${e.total} câu sai)</option>`).join('');

    m.innerHTML = `<div class="pg">
      <div class="hd">
        <div>
          <h1>📕 Sổ tay câu sai & Hệ thống câu hay sai</h1>
          <small class="mu">Tự động tổng hợp mọi câu bạn làm sai qua các lần luyện đề để ôn tập trúng trọng tâm và làm lại theo từng bài, từng mục.</small>
        </div>
        <div class="row">
          ${filtered.length ? `<button class="pri" data-a="mk_retry_filtered">🚀 Làm lại ${filtered.length} câu đang lọc</button>` : ''}
          ${hotMistakes.length ? `<button class="gh" style="color:#e65100;border-color:#ff6d00" data-a="mk_retry_hot">🔥 Làm lại ${hotMistakes.length} câu hay sai (≥2 lần)</button>` : ''}
          ${filtered.length ? `<button class="gh" style="color:var(--no);border-color:var(--no)" data-a="mk_del_filtered" title="Xóa các câu sai đang lọc khỏi Sổ tay">🗑 Xóa (${filtered.length})</button>` : ''}
        </div>
      </div>

      <div class="kp">
        <div><b style="color:var(--no)">${activeMistakes.length}</b>câu sai cần ôn</div>
        <div><b style="color:#e65100">🔥 ${hotMistakes.length}</b>câu hay sai (≥2 lần)</div>
        <div><b style="color:var(--pr)">${unfixedMistakes.length}</b>sai ở lần gần nhất</div>
        <div><b style="color:var(--ok)">${fixedMistakes.length}</b>đã sửa đúng gần đây</div>
      </div>

      ${activeMistakes.length ? `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:18px">
        <div class="ch" style="margin:0">
          <div class="hd" style="margin-bottom:10px"><b>📁 Làm lại câu sai theo từng Mục (${folderStats.size})</b></div>
          <div style="max-height:240px;overflow:auto">
            ${[...folderStats.entries()].map(([fKey, f]) => `<div class="card" style="padding:10px 12px;margin-bottom:8px">
              <div>
                <b>📁 ${esc(f.name)}</b><br>
                <small class="mu"><b>${f.total}</b> câu sai ${f.hot ? `· <span style="color:#e65100;font-weight:700">🔥 ${f.hot} câu hay sai</span>` : ''}</small>
              </div>
              <div class="row" style="margin:0">
                <button class="gh" style="padding:5px 10px;font-size:12.5px" data-a="mk_filter_f" data-f="${esc(fKey)}">🔍 Xem</button>
                <button class="pri" style="padding:5px 12px;font-size:12.5px" data-a="mk_retry_f" data-f="${esc(fKey)}">⚡ Làm lại (${f.total})</button>
                <button class="gh" style="padding:5px 9px;font-size:12.5px;color:var(--no)" data-a="mk_del_f" data-f="${esc(fKey)}" title="Xóa toàn bộ câu sai của mục này">🗑</button>
              </div>
            </div>`).join('')}
          </div>
        </div>

        <div class="ch" style="margin:0">
          <div class="hd" style="margin-bottom:10px"><b>📘 Làm lại câu sai theo từng Bài (${examStats.size})</b></div>
          <div style="max-height:240px;overflow:auto">
            ${[...examStats.entries()].map(([eKey, e]) => `<div class="card" style="padding:10px 12px;margin-bottom:8px">
              <div>
                <b>📘 ${esc(e.title)}</b><br>
                <small class="mu">${esc(e.weekName)} · <b>${e.total}</b> câu sai ${e.hot ? `· <span style="color:#e65100;font-weight:700">🔥 ${e.hot} hay sai</span>` : ''}</small>
              </div>
              <div class="row" style="margin:0">
                <button class="gh" style="padding:5px 10px;font-size:12.5px" data-a="mk_filter_e" data-f="${esc(e.wid||e.weekName||'other')}" data-e="${esc(e.title)}">🔍 Xem</button>
                <button class="pri" style="padding:5px 12px;font-size:12.5px" data-a="mk_retry_e" data-k="${esc(eKey)}">🎯 Làm lại (${e.total})</button>
                <button class="gh" style="padding:5px 9px;font-size:12.5px;color:var(--no)" data-a="mk_del_e" data-k="${esc(eKey)}" title="Xóa toàn bộ câu sai của bài này">🗑</button>
              </div>
            </div>`).join('')}
          </div>
        </div>
      </div>
      ` : ''}

      <div class="ch">
        <div class="row" style="margin-top:0;margin-bottom:12px;align-items:center">
          <select id="mk-sel-f" style="flex:1;min-width:180px">
            <option value="">📂 Tất cả các mục / thư mục</option>
            ${folderOptions}
          </select>
          <select id="mk-sel-e" style="flex:1;min-width:180px">
            <option value="">📘 Tất cả các bài thi</option>
            ${examOptions}
          </select>
          ${(MK_FILTER.wid || MK_FILTER.examTitle) ? `<button class="gh" data-a="mk_clear_filter">✕ Bỏ lọc</button>` : ''}
        </div>
        <div class="tabs" style="margin-bottom:0">
          <button class="${MK_FILTER.mode==='all'?'on':''}" data-a="mk_mode" data-m="all">Tất cả cần ôn (${activeMistakes.length})</button>
          <button class="${MK_FILTER.mode==='hot'?'on':''}" data-a="mk_mode" data-m="hot">🔥 Hay sai ≥ 2 lần (${hotMistakes.length})</button>
          <button class="${MK_FILTER.mode==='unfixed'?'on':''}" data-a="mk_mode" data-m="unfixed">❌ Đang sai gần nhất (${unfixedMistakes.length})</button>
          <button class="${MK_FILTER.mode==='fixed'?'on':''}" data-a="mk_mode" data-m="fixed">✅ Đã sửa đúng (${fixedMistakes.length})</button>
          <button class="${MK_FILTER.mode==='mastered'?'on':''}" data-a="mk_mode" data-m="mastered">📌 Đã thuộc (${masteredMistakes.length})</button>
        </div>
      </div>

      ${filtered.length ? filtered.map((item, idx) => {
        const q = item.qObj;
        const cAns = q.type === 'fill' ? (q.correctText || '') : `${ltr[q.ans] || 'A'}. ${q.opts?.[q.ans] || ''}`;
        const uAns = item.lastUserAns !== undefined && item.lastUserAns !== null && String(item.lastUserAns).trim() !== ''
          ? (q.type === 'fill' ? String(item.lastUserAns) : `${ltr[item.lastUserAns] || '?'}. ${q.opts?.[item.lastUserAns] || ''}`)
          : '(Bỏ trống)';
        const opsPreview = q.type !== 'fill' && q.opts?.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-top:8px">
          ${q.opts.filter(x=>String(x).trim()!=='').map((op, oi) => `<div style="padding:6px 10px;border-radius:8px;border:1px solid ${oi===q.ans?'var(--ok)':'var(--bd)'};background:${oi===q.ans?'var(--okb)':'var(--bg)'};font-size:13.5px">
            <b>${ltr[oi]}.</b> ${fmtRich(op)} ${oi===q.ans?'✅':''}
          </div>`).join('')}
        </div>` : '';

        return `<div class="mk-card ${item.lastWasCorrect?'fixed':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px">
            <div>
              <span class="mk-badge ${item.wrongCount>=2?'hot':''}">${item.wrongCount>=2?'🔥 Hay sai · ':''}Sai ${item.wrongCount} lần</span>
              ${item.lastWasCorrect ? `<span class="mk-badge ok" style="margin-left:6px">✅ Đã làm đúng ${item.correctCount} lần</span>` : ''}
              <span class="mu" style="font-size:13px;margin-left:8px">📁 ${esc(item.weekName)} › 📘 <b>${esc(item.examTitle)}</b> (Câu ${item.origQNum})</span>
            </div>
            <div class="row" style="margin:0">
              <button class="pri" style="padding:4px 10px;font-size:12.5px" data-a="mk_retry_one" data-k="${esc(item.key)}">⚡ Làm lại câu này</button>
              <button class="gh" style="padding:4px 10px;font-size:12.5px" data-a="mk_toggle_master" data-k="${esc(item.key)}">${item.mastered?'↩ Đưa lại vào cần ôn':'✅ Đánh dấu đã thuộc'}</button>
              <button class="gh" style="padding:4px 8px;font-size:12.5px;color:var(--no)" data-a="mk_del_one" data-k="${esc(item.key)}" title="Xóa khỏi sổ tay">🗑</button>
            </div>
          </div>
          <div style="font-size:15.5px;line-height:1.7;white-space:pre-line">${fmtRich(item.displayQ || q.q || '')}</div>
          ${opsPreview}
          <div class="exp" style="margin-top:10px">
            <span style="color:var(--no)">❌ Lần sai gần nhất chọn: <b>${fmtRich(uAns)}</b></span> ·
            <span style="color:var(--ok)">✅ Đáp án đúng: <b>${fmtRich(cAns)}</b></span>
            ${q.exp ? `<br>💡 ${fmtRich(q.exp)}` : ''}
            ${q.vi ? `<br>🌐 ${fmtRich(q.vi)}` : ''}
          </div>
        </div>`;
      }).join('') : `<div class="ch" style="text-align:center;padding:32px">
        <p style="font-size:16px">🎉 <b>Không có câu hỏi sai nào trong bộ lọc hiện tại!</b></p>
        <p class="mu">Khi bạn làm đề và nộp bài, bất kỳ câu nào trả lời sai hoặc bỏ trống sẽ tự động được lưu vào Sổ tay câu sai để bạn luyện lại.</p>
      </div>`}
    </div>`;

    $('#mk-sel-f')?.addEventListener('change', e => {
      MK_FILTER.wid = e.target.value;
      MK_FILTER.examTitle = '';
      renderMistakes($('#main'));
    });
    $('#mk-sel-e')?.addEventListener('change', e => {
      MK_FILTER.examTitle = e.target.value;
      renderMistakes($('#main'));
    });
  }

  function openRetryConfigModal(items, title){
    if(!items || !items.length){
      alert('Không có câu hỏi sai nào trong mục này để làm lại!');
      return;
    }
    RETRY_POOL = items;
    RETRY_TITLE = title || 'Ôn tập Sổ tay câu sai';
    const hotCount = items.filter(x => x.wrongCount >= 2).length;
    const curLy = localStorage.getItem('luyende_layout') || 'split';

    modal(`<h3>🎯 Cài đặt Làm lại câu sai</h3>
      <p>Phạm vi: <b>${esc(RETRY_TITLE)}</b> (${items.length} câu sai${hotCount ? `, gồm 🔥 ${hotCount} câu hay sai` : ''})</p>
      ${hotCount && hotCount < items.length ? `
        <p style="margin-top:8px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:#e65100">
          <input type="checkbox" id="rt-only-hot" style="width:auto"> 🔥 Chỉ lọc làm lại các câu HAY SAI (Sai ≥ 2 lần: ${hotCount} câu)

      ` : ''}

      <div class="v-grid" id="rt-ly" style="margin-bottom:10px">
        <div class="v-chip ${curLy!=='vertical'?'on':''}" data-ly="split">◫ Ngang (Chia đôi)</div>
        <div class="v-chip ${curLy==='vertical'?'on':''}" data-ly="vertical">▤ Dọc truyền thống</div>
      </div>
      <p><b>2. Thời gian làm bài:</b></p>
      <select id="rt-ts"><option value="0">Không giới hạn thời gian</option>${[10,15,20,30,45,60].map(x=>`<option value="${x}">${x} phút</option>`).join('')}</select>
      <p style="margin-top:10px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;color:var(--pr)">
        <input type="checkbox" id="rt-shuf" checked style="width:auto"> 🔀 Trộn lẫn thứ tự câu hỏi và đáp án (A, B, C, D)
      </label></p>
      <div class="row" style="margin-top:14px">
        <button class="pri" data-a="rt_start">🚀 Bắt đầu làm lại</button>
        <button class="gh" data-a="close">Hủy</button>
      </div>`);

    $('#modal').querySelectorAll('#rt-ly .v-chip').forEach(el=>el.addEventListener('click',()=>{
      $('#modal').querySelectorAll('#rt-ly .v-chip').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      localStorage.setItem('luyende_layout', el.dataset.ly);

  }

  // --- PHẦN D: GIAO DIỆN CHUỖI STREAK LỬA & TẦN SUẤT HỌC (`V.view === 'streak'`) ---
  let STK_TAB = 'day'; // 'day' | 'month' | 'year'
  let STK_MONTH_OFFSET = 0; // 0 = tháng hiện tại, -1 = tháng trước...
  let STK_YEAR = new Date().getFullYear();

  let STK_PRINT_ALL = false;

  function renderStreakWidgetInStats(hideInPrint=false){
    const st = calcStreakStats();
    return `<div class="stk-hero ${hideInPrint?'no-print':''}">
      <div style="display:flex;align-items:center;gap:14px">
        <span class="flame-ico ${st.curStreak>0?'':'off'}" style="font-size:44px">🔥</span>
        <div>
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <b style="font-size:22px;color:#d9480f">Chuỗi ${st.curStreak} ngày học liên tiếp</b>
            <span class="badge" style="background:#ff6d0022;color:#d9480f">🏆 Kỷ lục: ${st.bestStreak} ngày</span>

          <div style="font-size:14.5px;margin-top:4px">
            ⏱ Thời gian học hôm nay: <b style="color:var(--pr)">${fmtDurHM(st.todaySec)}</b>
            <span class="mu"> / Mục tiêu ${st.goalMin} phút (${st.goalPct}%)</span>

        <button class="pri" data-a="exppdf_stk_all" title="Xuất báo cáo PDF đầy đủ Chuỗi Streak & Tần suất theo Ngày, Tháng, Năm">📄 Xuất PDF Chuỗi & Streak</button>
        <button class="gh" data-a="stk_goal">🎯 Đặt mục tiêu ngày</button>
      </div>

  function buildStreakDayHtml(st, dayMap){
    const days14 = [];
    for(let i=13; i>=0; i--){
      const d = new Date(Date.now() - i * 86400000);
      const dk = toDateKey(d.getTime());
      const info = dayMap[dk] || {sec: 0, exams: 0, totalPct: 0};
      days14.push({
        dk,
        label: `${d.getDate()}/${d.getMonth()+1}`,
        fullDate: d.toLocaleDateString('vi-VN', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}),
        sec: info.sec || 0,
        exams: info.exams || 0,
        avg: info.exams ? Math.round(info.totalPct / info.exams) : 0,
        isToday: i === 0
      });
    }
    const maxSec = Math.max(1800, ...days14.map(x => x.sec));
    const barsHtml = days14.map(d => {
      const hPct = d.sec ? Math.max(8, Math.round((d.sec / maxSec) * 100)) : 3;
      return `<div class="bar-col" title="${d.fullDate}: ${fmtDurHM(d.sec)} (${d.exams} lần làm đề)">
        <small style="font-size:10.5px;font-weight:700;color:${d.sec?'#d9480f':'var(--mu)'};margin-bottom:4px">${d.sec ? '🔥 '+fmtDurShort(d.sec) : ''}</small>

            <td><b>${d.isToday ? '🌟 Hôm nay ('+d.label+')' : d.fullDate}</b></td>

            <td><b style="color:${d.sec>0?'var(--pr)':'var(--mu)'}">${fmtDurHM(d.sec)}</b></td>
            <td>${d.exams} lần</td>
            <td>${d.exams ? `<b>${d.avg}%</b>` : '—'}</td>
          </tr>`).join('')}
        </table>
      </div>
    </div>`;
  }

  function buildStreakMonthHtml(st, dayMap){
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() + STK_MONTH_OFFSET, 1);
    const y = target.getFullYear(), mo = target.getMonth();
    const daysInMonth = new Date(y, mo + 1, 0).getDate();
    const firstDayMon = (new Date(y, mo, 1).getDay() + 6) % 7;

    let monthSec = 0, monthActiveDays = 0, monthExams = 0;
    const cells = [];
    for(let i=0; i<firstDayMon; i++) cells.push(`<div class="cal-day empty"></div>`);
    for(let d=1; d<=daysInMonth; d++){
      const dk = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = dayMap[dk] || {sec: 0, exams: 0};
      if(info.sec > 0){
        monthSec += info.sec;
        monthActiveDays += 1;
      }
      monthExams += (info.exams || 0);
      const isToday = dk === st.todayK;
      cells.push(`<div class="cal-day ${info.sec>0?'active':''} ${isToday?'today':''}" title="Ngày ${d}/${mo+1}/${y}: ${fmtDurHM(info.sec)}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="color:${isToday?'var(--pr)':'var(--tx)'}">${d}</b>
          ${info.sec > 0 ? `<span>🔥</span>` : ''}
        </div>
        <div style="font-size:11px;font-weight:700;color:${info.sec>0?'#d9480f':'var(--mu)'};margin-top:4px">
          ${info.sec > 0 ? fmtDurShort(info.sec) : '—'}
        </div>
        ${info.exams ? `<small style="font-size:10px;color:var(--pr)">${info.exams} đề</small>` : ''}
      </div>`);
    }

    return `<div class="stk-page-sec">
      <div class="ch" style="margin-bottom:16px">
        <div class="hd" style="margin-bottom:10px">
          <div class="row" style="margin:0;align-items:center">
            <button class="gh no-print" data-a="stk_m_prev">◀ Tháng trước</button>
            <b style="font-size:17px;padding:0 6px">🗓 2. Lịch học Tháng ${mo+1} / ${y}</b>
            <button class="gh no-print" data-a="stk_m_next">Tháng sau ▶</button>
            ${STK_MONTH_OFFSET !== 0 ? `<button class="gh no-print" data-a="stk_m_now">Hôm nay</button>` : ''}
          </div>
          <div style="font-size:13.5px">
            Tổng tháng: <b style="color:var(--pr)">${fmtDurHM(monthSec)}</b> · Học <b style="color:#d9480f">${monthActiveDays}/${daysInMonth} ngày 🔥</b> (${monthExams} lần làm đề)
          </div>
        </div>
        <div class="cal-grid">
          ${['T2','T3','T4','T5','T6','T7','CN'].map(w => `<div class="cal-hd">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
      </div>
    </div>`;
  }

  function buildStreakYearHtml(st, dayMap){
    const months12 = [];
    let yearSec = 0, yearDays = 0, yearExams = 0;
    for(let mIdx=0; mIdx<12; mIdx++){
      const prefix = `${STK_YEAR}-${String(mIdx+1).padStart(2,'0')}-`;
      let mSec = 0, mDays = 0, mEx = 0;
      for(const [dk, info] of Object.entries(dayMap)){
        if(dk.startsWith(prefix)){
          if(info.sec > 0){ mSec += info.sec; mDays++; }
          mEx += (info.exams || 0);
        }
      }
      yearSec += mSec; yearDays += mDays; yearExams += mEx;
      months12.push({m: mIdx+1, sec: mSec, days: mDays, exams: mEx});
    }
    const maxMSec = Math.max(3600, ...months12.map(x => x.sec));
    const mBars = months12.map(x => {
      const hPct = x.sec ? Math.max(8, Math.round((x.sec / maxMSec) * 100)) : 3;
      return `<div class="bar-col" title="Tháng ${x.m}/${STK_YEAR}: ${fmtDurHM(x.sec)} (${x.days} ngày học)">
        <small style="font-size:10.5px;font-weight:700;color:${x.sec?'#d9480f':'var(--mu)'};margin-bottom:4px">${x.sec ? fmtDurShort(x.sec) : ''}</small>
        <div class="bar-fill ${x.sec?'':'zero'}" style="height:${hPct}%"></div>
        <small style="font-size:11.5px;margin-top:6px;font-weight:600">T${x.m}</small>
      </div>`;
    }).join('');

    return `<div class="stk-page-sec">
      <div class="ch">
        <div class="hd" style="margin-bottom:10px">
          <div class="row" style="margin:0;align-items:center">
            <button class="gh no-print" data-a="stk_y_prev">◀ Năm ${STK_YEAR-1}</button>
            <b style="font-size:17px;padding:0 6px">📊 3. Tần suất học Năm ${STK_YEAR}</b>
            <button class="gh no-print" data-a="stk_y_next">Năm ${STK_YEAR+1} ▶</button>
          </div>
          <div style="font-size:13.5px">
            Cả năm ${STK_YEAR}: <b style="color:var(--pr)">${fmtDurHM(yearSec)}</b> · <b style="color:#d9480f">🔥 ${yearDays} ngày học</b> · <b>${yearExams} lần làm đề</b>
          </div>
        </div>
        <div class="bar-chart">${mBars}</div>
      </div>
      <div class="sc">
        <table>
          <tr><th>Tháng</th><th>Số ngày duy trì học</th><th>Tổng thời gian học (Giờ & Phút)</th><th>Số lần làm đề</th></tr>
          ${months12.map(x => `<tr>
            <td><b>Tháng ${x.m} / ${STK_YEAR}</b></td>
            <td>${x.days ? `<span class="mk-badge hot">🔥 ${x.days} ngày</span>` : `<span class="mu">0 ngày</span>`}</td>
            <td><b style="color:${x.sec>0?'var(--pr)':'var(--mu)'}">${fmtDurHM(x.sec)}</b></td>
            <td>${x.exams} lần</td>
          </tr>`).join('')}
        </table>
      </div>
    </div>`;
  }

        <div><b style="color:var(--pr)">${fmtDurHM(st.todaySec)}</b>Thời gian học hôm nay</div>

      <div class="tabs no-print">

        <button class="${STK_TAB==='month'?'on':''}" data-a="stk_tab" data-t="month">🗓 Lịch học theo Tháng</button>
        <button class="${STK_TAB==='year'?'on':''}" data-a="stk_tab" data-t="year">📊 Thống kê theo Năm</button>

  // --- PHẦN E: HỆ THỐNG THÙNG RÁC (`🗑 Thùng rác` - Khôi phục hoặc Xóa vĩnh viễn) ---
  let TR_TAB = 'all'; // 'all' | 'folder' | 'exam' | 'file' | 'hist'

  function pushTrash(type, title, sub, payload){
    ensureV16Data();
    D.trash.unshift({
      id: uid(),
      type,
      title: title || 'Mục đã xóa',
      sub: sub || '',
      ts: Date.now(),
      payload
    });
    save();
  }

  function restoreTrashItem(trId){
    ensureV16Data();
    const idx = D.trash.findIndex(x => x.id === trId);
    if(idx === -1) return;
    const item = D.trash[idx];
    const p = item.payload || {};

    if(item.type === 'folder'){
      const folders = p.folders || [];
      for(const f of folders){
        if(typeof window._unmarkDeletedId === 'function'){
          window._unmarkDeletedId(f.id);
          (f.files || []).forEach(fl => window._unmarkDeletedId(fl?.id));
          (f.exams || []).forEach(ex => {
            window._unmarkDeletedId(ex?.id);
            (ex?.files || []).forEach(fl => window._unmarkDeletedId(fl?.id));
          });
        }
        if(!D.weeks.some(w => w.id === f.id)){
          if(f.id === p.rootId && f.pid && !D.weeks.some(w => w.id === f.pid)){
            f.pid = '';
          }
          D.weeks.push(f);
        }
      }
    } else if(item.type === 'exam'){
      if(p.exam && typeof window._unmarkDeletedId === 'function'){
        window._unmarkDeletedId(p.exam.id);
        (p.exam.files || []).forEach(fl => window._unmarkDeletedId(fl?.id));
      }
      let targetW = D.weeks.find(w => w.id === p.wid) || D.weeks.find(w => w.name === p.wName);
      if(!targetW){
        if(p.wid && typeof window._unmarkDeletedId === 'function') window._unmarkDeletedId(p.wid);
        targetW = {id: p.wid || uid(), name: p.wName || 'Thư mục khôi phục', pid: '', exams: [], files: []};
        D.weeks.push(targetW);
      }
      targetW.exams = targetW.exams || [];
      if(p.exam && !targetW.exams.some(e => e.id === p.exam.id)){
        targetW.exams.push(p.exam);
      }
    } else if(item.type === 'file'){
      if(p.file && typeof window._unmarkDeletedId === 'function') window._unmarkDeletedId(p.file.id);
      if(p.scope === 'exam'){
        let targetEx = null;
        for(const w of D.weeks){
          const found = (w.exams || []).find(e => e.id === p.examId || e.title === p.examTitle);
          if(found){ targetEx = found; break; }
        }
        if(targetEx){
          targetEx.files = targetEx.files || [];
          targetEx.files.push(p.file);
        }else{
          let targetW = D.weeks.find(w => w.id === p.wid) || D.weeks[0];
          if(!targetW){ targetW = {id: uid(), name: p.wName || 'Thư mục khôi phục', exams: [], files: []}; D.weeks.push(targetW); }
          targetW.files = targetW.files || [];
          targetW.files.push(p.file);
        }
      }else{
        let targetW = D.weeks.find(w => w.id === p.wid) || D.weeks.find(w => w.name === p.wName) || D.weeks[0];
        if(!targetW){ targetW = {id: p.wid || uid(), name: p.wName || 'Thư mục khôi phục', exams: [], files: []}; D.weeks.push(targetW); }
        targetW.files = targetW.files || [];
        targetW.files.push(p.file);
      }
    } else if(item.type === 'hist'){
      const items = p.items || [];
      for(const h of items){
        if(!D.hist.some(x => x.id === h.id)) D.hist.push(h);
      }
      D.hist.sort((a,b) => (a.ts||0) - (b.ts||0));
    }

    D.trash.splice(idx, 1);
    save();
    if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
  }

  function renderTrash(m){
    ensureV16Data();
    const all = D.trash;
    const fCnt = all.filter(x => x.type === 'folder').length;
    const eCnt = all.filter(x => x.type === 'exam').length;
    const flCnt = all.filter(x => x.type === 'file').length;
    const hCnt = all.filter(x => x.type === 'hist').length;

    const list = TR_TAB === 'all' ? all : all.filter(x => x.type === TR_TAB);
    const typeLabel = t => t==='folder'?'📁 Thư mục':t==='exam'?'📘 Bài thi':t==='file'?'📎 File tài liệu':'📈 Lịch sử làm bài';

    m.innerHTML = `<div class="pg">
      <div class="hd">
        <div>
          <h1>🗑 Thùng rác (${all.length})</h1>
          <small class="mu">Các thư mục, bài thi, file tài liệu và lịch sử đã xóa được lưu tại đây. Bạn có thể khôi phục lại nguyên vẹn hoặc xóa vĩnh viễn.</small>
        </div>
        ${all.length ? `<div class="row">
          <button class="pri" data-a="tr_res_all">♻️ Khôi phục tất cả (${all.length})</button>
          <button class="gh" style="color:var(--no);border-color:var(--no)" data-a="tr_empty">🔥 Dọn sạch thùng rác</button>

      <div class="tabs">
        <button class="${TR_TAB==='all'?'on':''}" data-a="tr_tab" data-t="all">Tất cả (${all.length})</button>
        <button class="${TR_TAB==='folder'?'on':''}" data-a="tr_tab" data-t="folder">📁 Thư mục (${fCnt})</button>
        <button class="${TR_TAB==='exam'?'on':''}" data-a="tr_tab" data-t="exam">📘 Bài thi (${eCnt})</button>
        <button class="${TR_TAB==='file'?'on':''}" data-a="tr_tab" data-t="file">📎 File tài liệu (${flCnt})</button>
        <button class="${TR_TAB==='hist'?'on':''}" data-a="tr_tab" data-t="hist">📈 Lịch sử (${hCnt})</button>
      </div>

      ${list.length ? list.map(item => `<div class="card">
        <div style="flex:1;min-width:220px">
          <b>${esc(item.title)}</b> <span class="f-cat-tag">${typeLabel(item.type)}</span><br>
          <small class="mu">${esc(item.sub)} · Đã xóa lúc ${new Date(item.ts).toLocaleString('vi-VN')}</small>
        </div>
        <div class="row" style="margin:0">
          <button class="pri" style="padding:6px 12px;font-size:13px" data-a="tr_res" data-id="${item.id}">♻️ Khôi phục</button>
          <button class="gh" style="padding:6px 12px;font-size:13px;color:var(--no);border-color:var(--no)" data-a="tr_del" data-id="${item.id}">✕ Xóa vĩnh viễn</button>
        </div>
      </div>`).join('') : `<div class="ch" style="text-align:center;padding:36px">
        <p style="font-size:16px">✨ <b>Thùng rác đang trống!</b></p>
        <p class="mu">Mọi mục bạn xóa (thư mục, đề thi, file đính kèm, lịch sử làm bài) sẽ được đưa vào đây để tránh mất dữ liệu do bấm nhầm.</p>
      </div>`}
    </div>`;
  }

  // --- PHẦN F: GHI ĐÈ & MỞ RỘNG CÁC HÀM ĐIỀU HƯỚNG VÀ XÓA SANG THÙNG RÁC ---
  const origRenderSide = renderSide;
  renderSide = function(){
    origRenderSide();
    const side = $('#side');
    if(!side) return;
    const st = calcStreakStats();
    const mistakes = syncMistakesFromHistory().filter(x => !x.mastered);
    const hotCnt = mistakes.filter(x => x.wrongCount >= 2).length;
    const trashCnt = (D.trash || []).length;

    // Chèn Widget Chuỗi Streak Lửa 🔥 và 2 mục Sổ tay câu sai + Thùng rác vào đầu Sidebar
    const h2 = side.querySelector('h2');
    const statsBtn = side.querySelector('button[data-a="stats"]');
    if(h2 && statsBtn){
      const streakHtml = `<div class="streak-side" data-a="streak_view" title="Bấm để xem chi tiết Chuỗi Streak & Tần suất học theo Ngày / Tháng / Năm">
        <span class="flame-ico ${st.curStreak>0?'':'off'}">🔥</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <b style="font-size:14.5px;color:#d9480f">Streak: ${st.curStreak} ngày</b>
            <small style="font-size:11px;color:var(--mu)">Kỷ lục: ${st.bestStreak}</small>
          </div>
          <div style="font-size:12px;font-weight:600;margin-top:2px" id="side-today-time">Hôm nay: ${fmtDurHM(st.todaySec)}</div>
          <div class="stk-bar"><div id="side-streak-fill" style="width:${st.goalPct}%"></div></div>

      const extraNavHtml = `

          <span>🔥 Chuỗi Streak & Tần suất</span>
          <span class="nav-cnt">${st.curStreak}d</span>
        </button>
        <button class="nv ${V.view==='mistakes'?'on':''}" data-a="mistakes">
          <span>📕 Sổ tay câu sai</span>
          <span class="nav-cnt" style="${mistakes.length&&V.view!=='mistakes'?'background:var(--nob);color:var(--no)':''}">${mistakes.length}${hotCnt?` (🔥${hotCnt})`:''}</span>
        </button>
        <button class="nv ${V.view==='trash'?'on':''}" data-a="trash">

          <span class="nav-cnt">${trashCnt}</span>
        </button>
      `;
      statsBtn.insertAdjacentHTML('afterend', extraNavHtml);
    }
  };

  const origRenderStats = renderStats;
  renderStats = function(m){
    origRenderStats(m);
    const pg = m.querySelector('.pg');
    const hd = pg?.querySelector('.hd');
    if(hd){
      hd.insertAdjacentHTML('afterend', renderStreakWidgetInStats());
    }
  };

  render = function(){
    if(V.view !== 'exam'){ clearInterval(TI); setFs(false); }
    renderSide();
    const m = $('#main');
    if(V.view === 'exam') renderExam(m);
    else if(V.view === 'edit') renderEdit(m);
    else if(V.view === 'week') renderWeek(m);
    else if(V.view === 'mistakes') renderMistakes(m);
    else if(V.view === 'trash') renderTrash(m);
    else if(V.view === 'streak') renderStreakPage(m);
    else renderStats(m);
  };

  // Cập nhật submit() để đồng bộ thời gian học và sổ tay câu sai
  const origSubmit = submit;
  submit = function(){
    if(V.rev) return;
    const used = Math.min(getUsedSec(), V.limit || 1e9);
    const tk = toDateKey(Date.now());
    origSubmit();
    // Đảm bảo thời gian làm bài được ghi nhận vào studyLog trong ngày
    const dayMap = getStudyDayMap();
    D.studyLog[tk] = Math.max(D.studyLog[tk] || 0, dayMap[tk]?.histSec || 0, used);
    syncMistakesFromHistory();
    save();
  };

  Object.assign(act, {
    // Điều hướng sang các trang mới
    mistakes(){ V = {view: 'mistakes'}; render(); },
    trash(){ V = {view: 'trash'}; render(); },
    streak_view(){ V = {view: 'streak'}; render(); },

    // Điều khiển trang Chuỗi Streak & Tần suất học
    stk_tab(d){ STK_TAB = d.t || 'day'; renderStreakPage($('#main')); },
    exppdf_stk_all(){
      const prevView = V.view;
      V.view = 'streak';
      STK_PRINT_ALL = true;
      render();
      setTimeout(() => {
        window.print();
        STK_PRINT_ALL = false;
        if(prevView !== 'streak') V.view = prevView;
        render();
      }, 120);
    },
    stk_m_prev(){ STK_MONTH_OFFSET -= 1; renderStreakPage($('#main')); },
    stk_m_next(){ STK_MONTH_OFFSET += 1; renderStreakPage($('#main')); },
    stk_m_now(){ STK_MONTH_OFFSET = 0; renderStreakPage($('#main')); },
    stk_y_prev(){ STK_YEAR -= 1; renderStreakPage($('#main')); },
    stk_y_next(){ STK_YEAR += 1; renderStreakPage($('#main')); },
    stk_goal(){
      const cur = D.dailyGoalMin || 30;
      modal(`<h3>🎯 Đặt mục tiêu thời gian học mỗi ngày</h3>
        <p class="mu">Chọn số phút bạn muốn chinh phục mỗi ngày để lấp đầy thanh năng lượng Streak 🔥:</p>
        <div class="v-grid" id="stk-goal-grid" style="margin:10px 0">
          ${[15, 30, 45, 60, 90, 120].map(m => `<div class="v-chip ${+cur===m?'on':''}" data-gm="${m}">${m>=60 ? (m/60)+' giờ ('+m+'p)' : m+' phút'}</div>`).join('')}
        </div>
        <p>Hoặc tự nhập số phút mục tiêu mỗi ngày:</p>
        <input id="stk-goal-inp" type="number" min="5" max="720" value="${cur}">
        <div class="row" style="margin-top:14px">
          <button class="pri" data-a="stk_goal_save">💾 Lưu mục tiêu</button>
          <button class="gh" data-a="close">Đóng</button>
        </div>`);
      $('#modal').querySelectorAll('#stk-goal-grid .v-chip').forEach(el => el.addEventListener('click', () => {
        $('#modal').querySelectorAll('#stk-goal-grid .v-chip').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
        $('#stk-goal-inp').value = el.dataset.gm;
      }));
    },
    stk_goal_save(){
      const v = Math.max(5, +($('#stk-goal-inp')?.value || 30));
      D.dailyGoalMin = v;
      save(); modal(''); render();
    },

    // Điều khiển Sổ tay câu sai & Làm lại câu sai
    mk_mode(d){ MK_FILTER.mode = d.m || 'all'; renderMistakes($('#main')); },
    mk_clear_filter(){ MK_FILTER.wid = ''; MK_FILTER.examTitle = ''; renderMistakes($('#main')); },
    mk_filter_f(d){
      MK_FILTER.wid = d.f || '';
      MK_FILTER.examTitle = '';
      MK_FILTER.mode = 'all';
      renderMistakes($('#main'));
    },
    mk_filter_e(d){
      MK_FILTER.wid = d.f || '';
      MK_FILTER.examTitle = d.e || '';
      MK_FILTER.mode = 'all';
      renderMistakes($('#main'));
    },
    mk_retry_f(d){
      const fKey = d.f;
      const all = syncMistakesFromHistory().filter(x => !x.mastered && (x.wid || x.weekName || 'other') === fKey);
      const fName = D.weeks.find(w => w.id === fKey)?.name || all[0]?.weekName || 'Thư mục';
      openRetryConfigModal(all, `Làm lại câu sai — Mục: ${fName}`);
    },
    mk_retry_e(d){
      const eKey = d.k;
      const all = syncMistakesFromHistory().filter(x => !x.mastered && `${x.wid || x.weekName || 'other'}::${x.examTitle}` === eKey);
      const eTitle = all[0]?.examTitle || 'Bài thi';
      openRetryConfigModal(all, `Làm lại câu sai — Bài: ${eTitle}`);
    },
    mk_retry_hot(){
      const hot = syncMistakesFromHistory().filter(x => !x.mastered && x.wrongCount >= 2);
      openRetryConfigModal(hot, `Ôn tập các câu HAY SAI (Sai ≥ 2 lần)`);
    },
    mk_retry_filtered(){
      const allMistakes = syncMistakesFromHistory();
      const filtered = allMistakes.filter(item => {
        if(MK_FILTER.mode === 'mastered') return item.mastered;
        if(item.mastered) return false;
        if(MK_FILTER.wid && (item.wid || item.weekName) !== MK_FILTER.wid) return false;
        if(MK_FILTER.examTitle && item.examTitle !== MK_FILTER.examTitle) return false;
        if(MK_FILTER.mode === 'hot') return item.wrongCount >= 2;
        if(MK_FILTER.mode === 'unfixed') return !item.lastWasCorrect;
        if(MK_FILTER.mode === 'fixed') return item.lastWasCorrect;
        return true;
      });
      const subTitle = MK_FILTER.examTitle ? `Bài: ${MK_FILTER.examTitle}` : MK_FILTER.wid ? `Theo mục đã chọn` : `Tất cả câu đang lọc`;
      openRetryConfigModal(filtered, `Làm lại câu sai (${subTitle})`);
    },
    mk_retry_one(d){
      const item = syncMistakesFromHistory().find(x => x.key === d.k);
      if(!item) return;
      openRetryConfigModal([item], `Làm lại Câu ${item.origQNum} (${item.examTitle})`);
    },
    rt_start(){
      const onlyHot = !!$('#rt-only-hot')?.checked;
      const sh = !!$('#rt-shuf')?.checked;
      const min = +($('#rt-ts')?.value || 0);
      const lyEl = $('#rt-ly .v-chip.on');
      const ly = lyEl ? lyEl.dataset.ly : (localStorage.getItem('luyende_layout') || 'split');
      localStorage.setItem('luyende_layout', ly);

      let pool = RETRY_POOL.slice();
      if(onlyHot) pool = pool.filter(x => x.wrongCount >= 2);
      if(!pool.length){ alert('Không có câu hỏi nào thỏa mãn điều kiện!'); return; }

      const retryEx = buildRetryExamObject(pool, RETRY_TITLE, sh);
      const order = retryEx.qs.map((_, i) => i);
      const perm = retryEx.qs.map(q => {
        const base = getValidOptIndices(q);
        if(sh && q.type !== 'fill' && q.type !== 'tf' && base.length > 2) return shuf(base.slice());
        return base;
      });

      modal('');
      const firstWid = pool[0]?.wid || '';
      const wiIdx = D.weeks.findIndex(w => w.id === firstWid);
      V = {
        view: 'exam',
        wi: wiIdx,
        ei: -1,
        ex: retryEx,
        order,
        perm,
        ans: {},
        limit: min * 60,
        t0: Date.now(),
        elapsed: 0,
        paused: false,
        rev: false,
        cur: null,
        layout: ly,
        fromMistakes: true
      };
      render();
    },
    mk_toggle_master(d){
      ensureV16Data();
      const k = d.k;
      syncMistakesFromHistory();
      if(D.mistakeStore[k]){
        D.mistakeStore[k].mastered = !D.mistakeStore[k].mastered;
        save();
        renderMistakes($('#main'));
        renderSide();
      }
    },
    mk_del_one(d){
      ensureV16Data();
      const k = d.k;
      syncMistakesFromHistory();
      if(D.mistakeStore[k]){
        D.mistakeStore[k] = {...D.mistakeStore[k], deleted: true, deletedAt: Date.now()};
        save();
        renderMistakes($('#main'));
        renderSide();
      }
    },
    mk_del_f(d){
      const fKey = d.f;
      const items = syncMistakesFromHistory().filter(x => !x.mastered && (x.wid || x.weekName || 'other') === fKey);
      if(!items.length) return;
      const fName = D.weeks.find(w => w.id === fKey)?.name || items[0]?.weekName || 'Thư mục';
      V._mkDelKeys = items.map(x => x.key);
      modal(`<h3>🗑 Xóa câu sai của mục “${esc(fName)}”?</h3>
        <p>Bạn sắp xóa <b>${items.length} câu sai</b> thuộc mục <b>${esc(fName)}</b> khỏi Sổ tay câu sai.</p>
        <div class="row" style="margin-top:12px">
          <button class="pri" style="background:var(--no);border-color:var(--no)" data-a="mk_del_batch_go">🗑 Xác nhận xóa (${items.length} câu)</button>
          <button class="gh" data-a="close">Hủy</button>
        </div>`);
    },
    mk_del_e(d){
      const eKey = d.k;
      const items = syncMistakesFromHistory().filter(x => !x.mastered && `${x.wid || x.weekName || 'other'}::${x.examTitle}` === eKey);
      if(!items.length) return;
      const eTitle = items[0]?.examTitle || 'Bài thi';
      V._mkDelKeys = items.map(x => x.key);
      modal(`<h3>🗑 Xóa câu sai của bài “${esc(eTitle)}”?</h3>
        <p>Bạn sắp xóa <b>${items.length} câu sai</b> thuộc bài <b>${esc(eTitle)}</b> khỏi Sổ tay câu sai.</p>
        <div class="row" style="margin-top:12px">
          <button class="pri" style="background:var(--no);border-color:var(--no)" data-a="mk_del_batch_go">🗑 Xác nhận xóa (${items.length} câu)</button>
          <button class="gh" data-a="close">Hủy</button>
        </div>`);
    },
    mk_del_filtered(){
      const allMistakes = syncMistakesFromHistory();
      const filtered = allMistakes.filter(item => {
        if(MK_FILTER.mode === 'mastered') return item.mastered;
        if(item.mastered) return false;
        if(MK_FILTER.wid && (item.wid || item.weekName) !== MK_FILTER.wid) return false;
        if(MK_FILTER.examTitle && item.examTitle !== MK_FILTER.examTitle) return false;
        if(MK_FILTER.mode === 'hot') return item.wrongCount >= 2;
        if(MK_FILTER.mode === 'unfixed') return !item.lastWasCorrect;
        if(MK_FILTER.mode === 'fixed') return item.lastWasCorrect;
        return true;
      });
      if(!filtered.length) return;
      V._mkDelKeys = filtered.map(x => x.key);
      modal(`<h3>🗑 Xóa ${filtered.length} câu sai đang lọc?</h3>
        <p>Bạn sắp xóa <b>${filtered.length} câu sai</b> đang hiển thị trong bộ lọc hiện tại khỏi Sổ tay câu sai.</p>
        <div class="row" style="margin-top:12px">
          <button class="pri" style="background:var(--no);border-color:var(--no)" data-a="mk_del_batch_go">🗑 Xác nhận xóa (${filtered.length} câu)</button>
          <button class="gh" data-a="close">Hủy</button>
        </div>`);
    },
    mk_del_batch_go(){
      ensureV16Data();
      syncMistakesFromHistory();
      const now = Date.now();
      for(const k of (V._mkDelKeys || [])){
        if(D.mistakeStore[k]){
          D.mistakeStore[k] = {...D.mistakeStore[k], deleted: true, deletedAt: now};
        }
      }
      V._mkDelKeys = [];
      save();
      modal('');
      render();
    },

    // --- GHI ĐÈ CÁC HÀM XÓA ĐỂ ĐƯA VÀO THÙNG RÁC (CÓ THỂ KHÔI PHỤC HOẶC XÓA VĨNH VIỄN) ---
    delw(){
      const w = D.weeks[V.wi];
      if(!w) return;
      modal(`<h3>🗑 Chuyển thư mục “${esc(w.name)}” vào Thùng rác?</h3>
        <p>Thư mục này cùng các bài thi và thư mục con bên trong sẽ được chuyển vào <b>🗑 Thùng rác</b>. Bạn có thể khôi phục lại bất cứ lúc nào.</p>
        <div class="row"><button class="pri" style="background:var(--no);border-color:var(--no)" data-a="delw2">🗑 Chuyển vào Thùng rác</button><button class="gh" data-a="close">Hủy</button></div>`);
    },
    delw2(){
      const w = D.weeks[V.wi];
      if(!w) return;
      const t = desc(w.id);
      const removedFolders = D.weeks.filter(x => t.has(x.id));
      if(typeof window._markDeletedId === 'function'){
        removedFolders.forEach(rf => {
          window._markDeletedId(rf.id);
          (rf.files || []).forEach(fl => window._markDeletedId(fl?.id));
          (rf.exams || []).forEach(ex => {
            window._markDeletedId(ex?.id);
            (ex?.files || []).forEach(fl => window._markDeletedId(fl?.id));
          });
        });
      }
      const examCnt = removedFolders.reduce((a, f) => a + (f.exams?.length || 0), 0);
      pushTrash('folder', w.name, `${removedFolders.length} thư mục · ${examCnt} bài thi`, {
        rootId: w.id,
        folders: JSON.parse(JSON.stringify(removedFolders))
      });
      D.weeks = D.weeks.filter(x => !t.has(x.id));
      save();
      if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      modal(''); V = {view: 'stats'}; SF = ''; render();
    },
    dele(d){
      V.di = +d.i;
      const ex = D.weeks[V.wi]?.exams?.[V.di];
      modal(`<h3>🗑 Chuyển bài “${esc(ex?.title || '')}” vào Thùng rác?</h3>
        <p class="mu">Bạn có thể khôi phục lại bài thi này trong mục <b>🗑 Thùng rác</b> bất cứ lúc nào.</p>
        <div class="row"><button class="pri" style="background:var(--no);border-color:var(--no)" data-a="dele2">🗑 Chuyển vào Thùng rác</button><button class="gh" data-a="close">Hủy</button></div>`);
    },
    dele2(){
      const w = D.weeks[V.wi];
      const ex = w?.exams?.[V.di];
      if(ex){
        if(typeof window._markDeletedId === 'function'){
          window._markDeletedId(ex.id);
          (ex.files || []).forEach(fl => window._markDeletedId(fl?.id));
        }
        pushTrash('exam', ex.title, `Thư mục: ${w.name} · ${ex.qs?.length || 0} câu`, {
          wid: w.id,
          wName: w.name,
          exam: JSON.parse(JSON.stringify(ex))
        });
        w.exams.splice(V.di, 1);
        save();
        if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      }
      modal(''); render();
    },
    delf_w(d){
      const w = D.weeks[V.wi];
      const f = w?.files?.[+d.fi];
      if(!f) return;
      if(f.id && typeof window._markDeletedId === 'function') window._markDeletedId(f.id);
      pushTrash('file', f.title || f.name, `Tài liệu thư mục: ${w.name}`, {
        scope: 'week',
        wid: w.id,
        wName: w.name,
        file: JSON.parse(JSON.stringify(f))
      });
      w.files.splice(+d.fi, 1);
      save();
      if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      render();
    },
    delh2(){
      const h = D.hist.find(x => x.id === V.dhi);
      if(h){
        pushTrash('hist', `Lịch sử: ${h.title}`, `Kết quả: ${h.c}/${h.t} câu (${pc(h)}%) · ${new Date(h.ts).toLocaleString('vi-VN')}`, {
          items: [JSON.parse(JSON.stringify(h))]
        });
      }
      D.hist = D.hist.filter(x => x.id !== V.dhi);
      save(); modal(''); render();
    },
    clrh2(){
      const ds = SF ? desc(SF) : SC ? cset(SC) : null;
      const removed = ds ? D.hist.filter(h => ds.has(h.wid)) : D.hist.slice();
      if(removed.length){
        pushTrash('hist', `Nhóm ${removed.length} lịch sử làm bài`, `Đã xóa từ trang Thống kê`, {
          items: JSON.parse(JSON.stringify(removed))
        });
      }
      if(ds) D.hist = D.hist.filter(h => !ds.has(h.wid));
      else D.hist = [];
      save(); modal(''); render();
    },
    clrhall(){
      if(D.hist.length){
        pushTrash('hist', `Toàn bộ ${D.hist.length} lịch sử làm bài`, `Đã xóa toàn bộ lịch sử`, {
          items: JSON.parse(JSON.stringify(D.hist))
        });
      }
      D.hist = [];
      save(); modal(''); render();
    },

    // Các hành động trong Thùng rác
    tr_tab(d){ TR_TAB = d.t || 'all'; renderTrash($('#main')); },
    tr_res(d){
      restoreTrashItem(d.id);
      render();
    },
    tr_res_all(){
      const ids = (D.trash || []).map(x => x.id);
      for(const id of ids) restoreTrashItem(id);
      render();
    },
    tr_del(d){
      V.trDelId = d.id;
      const item = (D.trash || []).find(x => x.id === d.id);
      if(!item) return;
      modal(`<h3>⚠️ Xóa vĩnh viễn mục này?</h3>
        <p>Bạn sắp xóa vĩnh viễn <b>“${esc(item.title)}”</b> khỏi Thùng rác. Hành động này <b>không thể hoàn tác</b>.</p>
        <div class="row" style="margin-top:12px">
          <button class="pri" style="background:var(--no);border-color:var(--no)" data-a="tr_del2">✕ Xóa vĩnh viễn</button>
          <button class="gh" data-a="close">Hủy</button>
        </div>`);
    },
    tr_del2(){
      D.trash = (D.trash || []).filter(x => x.id !== V.trDelId);
      purgeOrphanedData();
      syncMistakesFromHistory();
      save(); modal(''); render();
    },
    tr_empty(){
      if(!(D.trash || []).length) return;
      modal(`<h3>🔥 Dọn sạch Thùng rác (Xóa vĩnh viễn ${D.trash.length} mục)?</h3>
        <p>Tất cả <b>${D.trash.length} mục</b> trong Thùng rác cùng dữ liệu câu sai & lịch sử của các mục đã xóa sẽ bị xóa vĩnh viễn và không thể khôi phục lại.</p>
        <div class="row" style="margin-top:12px">
          <button class="pri" style="background:var(--no);border-color:var(--no)" data-a="tr_empty2">🔥 Xác nhận xóa vĩnh viễn tất cả</button>
          <button class="gh" data-a="close">Hủy</button>
        </div>`);
    },
    tr_empty2(){
      D.trash = [];
      purgeOrphanedData();
      syncMistakesFromHistory();
      save(); modal(''); render();
    }
  });

  // Ghi đè nút Quay lại khi đang làm bài từ Sổ tay câu sai
  const origBack = act.back;
  act.back = function(){
    if(V.fromMistakes){
      V = {view: 'mistakes'};
      render();
      return;
    }
    origBack();
  };
})();

  // --- 1. QUẢN LÝ CHỦ ĐỀ MÀU SẮC (COLOR THEME SWITCHER) ---
  function getCurThemeKey(){
    const k = localStorage.getItem('luyende_color_theme') || 'ocean';

  }

  function applyColorTheme(key){
    const t = THEMES[key] || THEMES.ocean;
    localStorage.setItem('luyende_color_theme', key);
    const root = document.documentElement;
    if(t.dark){
      root.setAttribute('data-theme', 'dark');
    }else{
      root.setAttribute('data-theme', 'light');
    }
    root.style.setProperty('--pr', t.pr);
    root.style.setProperty('--pr2', t.pr2);
    root.style.setProperty('--pr-glow', t.glow);
    root.style.setProperty('--bg', t.bg);
    root.style.setProperty('--cd', t.cd);
    root.style.setProperty('--tx', t.tx);
    root.style.setProperty('--mu', t.mu);
    root.style.setProperty('--bd', t.bd);
    root.style.setProperty('--hl', t.hl);
    root.style.setProperty('--mesh', t.mesh);
  }
  applyColorTheme(getCurThemeKey());

  // --- 2. TRÌNH XEM TÀI LIỆU NÂNG CẤP: THU PHÓNG (ZOOM), CHỈNH KÍCH CỠ CỬA SỔ & TOÀN MÀN HÌNH ---
  let FV_STATE = {
    zoom: +(localStorage.getItem('luyende_fv_zoom') || 100),
    size: localStorage.getItem('luyende_fv_size') || 'lg', // 'md' | 'lg' | 'max' | 'dock'
    blobUrl: ''
  };

  function getFileIcon(ext){
    if(ext==='pdf')return '📕';
    if(ext==='docx'||ext==='doc')return '📘';
    if(['png','jpg','jpeg','webp','gif'].includes(ext))return '🖼';
    if(ext==='link')return '🔗';
    return '📝';
  }

  function makeBlobUrl(dataUrl, forceMime){
    try{
      if(FV_STATE.blobUrl && FV_STATE.blobUrl.startsWith('blob:')){
        try{ URL.revokeObjectURL(FV_STATE.blobUrl); }catch(e){}
      }
      const commaIdx = dataUrl.indexOf(',');
      if(commaIdx === -1) return dataUrl;
      const header = dataUrl.slice(0, commaIdx);
      const b64 = dataUrl.slice(commaIdx + 1).replace(/\s+/g, '');
      const mimeMatch = header.match(/data:([^;,]+)/i);
      const mime = forceMime || (mimeMatch ? mimeMatch[1] : 'application/pdf');
      const bstr = atob(b64);
      const n = bstr.length;
      const u8 = new Uint8Array(n);
      for(let i = 0; i < n; i++) u8[i] = bstr.charCodeAt(i);
      return URL.createObjectURL(new Blob([u8], {type: mime}));
    }catch(e){return dataUrl;}
  }

  function applyFvZoomAndSize(){
    const z = Math.max(40, Math.min(300, FV_STATE.zoom || 100));
    FV_STATE.zoom = z;
    localStorage.setItem('luyende_fv_zoom', z);
    localStorage.setItem('luyende_fv_size', FV_STATE.size);

    const lbl = $('#fv-zoom-lbl');
    if(lbl) lbl.textContent = z + '%';
    const rng = $('#fv-zoom-rng');
    if(rng && +rng.value !== z) rng.value = z;

    // 1. Áp dụng kích cỡ cửa sổ (.fv-box)
    const box = $('#fv-box');
    const ov = box?.closest('.ov');
    if(box){
      box.classList.remove('sz-md', 'sz-lg', 'sz-max', 'sz-dock');
      box.classList.add('sz-' + FV_STATE.size);
      // Xóa inline width/height nếu người dùng bấm chọn preset mới
      if(FV_STATE._presetClicked){
        box.style.width = '';
        box.style.height = '';
        FV_STATE._presetClicked = false;
      }
    }
    if(ov){
      ov.classList.toggle('fv-dock-ov', FV_STATE.size === 'dock');
    }
    document.querySelectorAll('[data-a="fv_sz"]').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.s === FV_STATE.size);
    });

    // 2. Áp dụng độ thu phóng (Zoom) cho nội dung tài liệu
    const docEl = $('#fv-doc-content');
    const imgEl = $('#fv-img-content');
    const pdfWrap = $('#fv-pdf-wrap');
    if(docEl){
      docEl.style.fontSize = Math.round(15.5 * (z / 100)) + 'px';
      docEl.style.zoom = (z / 100);
    }
    if(imgEl){
      imgEl.style.width = z + '%';
      imgEl.style.maxWidth = 'none';
    }
    if(pdfWrap){
      pdfWrap.style.width = '100%';
      pdfWrap.style.height = '100%';
      pdfWrap.style.transform = 'none';
    }
  }

  function renderEnhancedFileViewer(f, allowBackToManager){

    let stageInner = '';

            ${(f.ext==='pdf'||f.dataUrl||f.url)?`<button class="gh" style="padding:5px 10px;font-size:12.5px" data-a="fv_newtab" title="Mở tài liệu sang một Tab trình duyệt mới">↗ Mở Tab mới</button>`:''}

    const gain = ctx.createGain();
    osc.type = type || 'sine';

    if(slideToFreq){

    gain.gain.linearRampToValueAtTime(Math.max(0.001, vol), startTime + Math.min(0.025, duration * 0.25));
