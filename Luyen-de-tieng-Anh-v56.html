        smoothScrollContainer($('#L'), rEl || lEl, true, fromInsideL);
      } else {
        smoothScrollContainer($('#L'), lEl, lEl?.id?.startsWith('L'), sourcePane === 'L');
        smoothScrollContainer($('#R'), rEl, true, sourcePane === 'R');
      }
      smoothScrollContainer($('#QB'), qEl, true, false);
    }
  };

  // 4. Nâng cấp drawQBar & updateProgressText: Cập nhật tại chỗ (In-place) không phá hủy DOM + Thanh tiến độ mượt
  drawQBar = function(justAnsweredQi){
    const qb = $('#QB');
    if(!qb || !V.ex) return;
    const {ex, order, ans, rev, cur} = V;
    const ok = qi => ex.qs[qi].type === 'fill' ? isFillOk(ex.qs[qi], ans[qi]) : ans[qi] === ex.qs[qi].ans;

    // Đảm bảo có thanh tiến độ trực quan ngay phía trên #QB
    let progTrack = $('#exam-prog-track');
    if(!progTrack){
      qb.insertAdjacentHTML('beforebegin', `<div class="exam-prog-track" id="exam-prog-track"><div class="exam-prog-fill" id="exam-prog-fill"></div></div>`);
      progTrack = $('#exam-prog-track');
    }
    const progFill = $('#exam-prog-fill');
    if(progFill){
      const total = ex.qs.length || 1;
      const doneCnt = rev ? ex.qs.filter((q, i) => ok(i)).length : ex.qs.filter((q, i) => isAnswered(q, ans[i])).length;
      progFill.style.width = Math.round((doneCnt / total) * 100) + '%';
    }

    const existingBtns = qb.querySelectorAll('button.qb');
    if(existingBtns.length === order.length){
      // Cập nhật từng nút tại chỗ để giữ nguyên hiệu ứng chuyển màu & vị trí cuộn
      order.forEach((qi, idx) => {
        const btn = document.getElementById('Q' + qi);
        if(!btn) return;
        const q = ex.qs[qi];
        const done = isAnswered(q, ans[qi]);
        const wasDone = btn.classList.contains('done');
        btn.classList.toggle('done', rev ? ok(qi) : done);
        btn.classList.toggle('wrong', !!(rev && !ok(qi)));
        btn.classList.toggle('cur', cur === qi);
        const sym = rev ? (ok(qi) ? ' ✓' : ' ✗') : (done ? ' ✓' : '');
        const wantedTxt = `${idx + 1}${sym}`;
        if(btn.textContent !== wantedTxt) btn.textContent = wantedTxt;
        if(!rev && done && (!wasDone || justAnsweredQi === qi)){
          btn.classList.remove('qb-pop');
          void btn.offsetWidth;
          btn.classList.add('qb-pop');
        }
      });
      return;
    }

    // Lần đầu tiên vẽ thanh câu hỏi
    qb.innerHTML = `<span class="qbar-lbl">Câu hỏi (${order.length}):</span>` + order.map((qi, idx) => {
      const q = ex.qs[qi];
      const done = isAnswered(q, ans[qi]);
      let cls = '';
      let sym = '';
      if(rev){
        cls = ok(qi) ? 'done' : 'wrong';
        sym = ok(qi) ? ' ✓' : ' ✗';
      } else if(done){
        cls = 'done';
        sym = ' ✓';
      }
      if(cur === qi) cls += ' cur';
      return `<button class="qb ${cls.trim()}" id="Q${qi}" data-a="fq" data-i="${qi}" title="Nhấn để chuyển đến Câu ${idx+1}">${idx+1}${sym}</button>`;
    }).join('');
  };

  updateProgressText = function(justAnsweredQi){
    const pg = $('#pg');
    if(!pg || !V.ex) return;
    const {ex, ans, rev} = V;
    const t = ex.qs.length;
    const ok = qi => ex.qs[qi].type === 'fill' ? isFillOk(ex.qs[qi], ans[qi]) : ans[qi] === ex.qs[qi].ans;
    if(rev){
      const c = ex.qs.filter((q, i) => ok(i)).length;
      pg.textContent = `✅ ${c} đúng, ❌ ${t-c} sai / ${t} câu (${Math.round(c/t*100)}%)`;
    } else {
      const done = ex.qs.filter((q, i) => isAnswered(q, ans[i])).length;
      pg.textContent = `Đã làm ${done}/${t} câu (${Math.round(done/(t||1)*100)}%)`;
    }
    drawQBar(justAnsweredQi);
  };

  // 5. Nâng cấp act.pick: Chọn đáp án mượt tức thì (In-place DOM update + Spring Pop + Cloze Blank Morph)
  act.pick = function(d){
    if(V.rev) return;
    const qi = +d.q, oi = +d.o;
    const q = V.ex?.qs?.[qi];
    if(!q) return;

    if(window.SFX) window.SFX.pick();
    V.ans[qi] = oi;
    V.cur = qi;

    const rCard = document.getElementById('R' + qi);
    if(rCard){
      // 1. Cập nhật trạng thái thẻ câu hỏi #R{qi}
      rCard.classList.add('dn');
      rCard.classList.remove('cd-picked-pulse');
      void rCard.offsetWidth;
      rCard.classList.add('cd-picked-pulse');

      // 2. Cập nhật mượt các phương án .op bên trong thẻ câu hỏi
      rCard.querySelectorAll(`.op[data-q="${qi}"]`).forEach(opEl => {
        const isSel = (+opEl.dataset.o === oi);
        opEl.classList.toggle('sel', isSel);
        opEl.classList.remove('op-just-picked');
        const badge = opEl.querySelector('i');
        badge?.classList.remove('badge-pop');
        if(isSel){
          void opEl.offsetWidth;
          opEl.classList.add('op-just-picked');
          badge?.classList.add('badge-pop');
        }
      });

      // 3. Nếu câu hỏi có ô trống điền khuyết trong bài đọc (button.bl#L{qi}), điền từ với hiệu ứng nảy mượt
      const blBtn = document.querySelector(`button.bl#L${qi}`);
      if(blBtn){
        const mNum = (blBtn.textContent || '').match(/^\((\d+)\)/);
        const dispNum = mNum ? mNum[1] : (qi + 1);
        blBtn.textContent = `(${dispNum}) ${q.opts[oi] || ''}`;
        blBtn.classList.add('dn');
        blBtn.classList.remove('bl-pop');
        void blBtn.offsetWidth;
        blBtn.classList.add('bl-pop');
      }

      // 4. Cập nhật thanh câu hỏi & thanh tiến độ tại chỗ
      updateProgressText(qi);
      focusQ(qi, false, 'R');

      // 5. Lưu nháp tự động
      if(D.savedSessions && V.ex){
        D.savedSessions[V.sessionKey || V.ex.id || 'cur'] = {
          key: V.sessionKey || V.ex.id || 'cur',
          examId: V.ex.id || '',
          title: V.ex.title || 'Bài thi',
          wid: V.wid || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].id : ''),
          weekName: V.weekName || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].name : ''),
          wi: V.wi ?? -1,
          ei: V.ei ?? -1,
          ex: V.ex,
          order: V.order,
          perm: V.perm,
          ans: V.ans,
          elapsed: getUsedSec(),
          limit: V.limit || 0,
          cur: V.cur,
          layout: V.layout || 'split',
          fromMistakes: !!V.fromMistakes,
          doneCount: V.ex.qs.filter((x, idx) => isAnswered(x, V.ans[idx])).length,
          totalCount: V.ex.qs.length,
          savedAt: Date.now()
        };
        save();
      }
    } else {
      drawQ();
      focusQ(qi);
    }
  };

  // 6. Hỗ trợ phím tắt mượt mà khi đang làm bài (Mũi tên Lên/Xuống chuyển câu, phím A/B/C/D hoặc 1/2/3/4 chọn đáp án)
  document.addEventListener('keydown', e => {
    if(V.view !== 'exam' || $('#modal .ov:not(.closing)')) return;
    const tag = (e.target?.tagName || '').toUpperCase();
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable) return;
    if(e.ctrlKey || e.altKey || e.metaKey) return;

    const order = V.order || [];
    if(!order.length) return;

    if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){
      e.preventDefault();
      const curPos = V.cur != null ? order.indexOf(V.cur) : -1;
      const nextQi = order[Math.min(order.length - 1, curPos + 1)];
      if(nextQi !== undefined) focusQ(nextQi, false, 'QB');
    } else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
      e.preventDefault();
      const curPos = V.cur != null ? order.indexOf(V.cur) : 1;
      const prevQi = order[Math.max(0, curPos - 1)];
      if(prevQi !== undefined) focusQ(prevQi, false, 'QB');
    } else if(!V.rev && V.cur != null){
      const k = e.key.toUpperCase();
      const idx = 'ABCD'.indexOf(k) >= 0 ? 'ABCD'.indexOf(k) : ('1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : -1);
      if(idx >= 0){
        const rCard = document.getElementById('R' + V.cur);
        const opEls = rCard ? rCard.querySelectorAll(`.op[data-q="${V.cur}"]`) : [];
        if(opEls[idx]){
          e.preventDefault();
          act.pick({q: V.cur, o: opEls[idx].dataset.o});
        }
      }
    }
  });

  // 7. Gắn hiệu ứng xuất hiện tuần tự (Staggered Cascade) cho danh sách thẻ khi chuyển trang
  function applyStaggerAnimation(){
    const main = $('#main');
    if(!main) return;
    const items = main.querySelectorAll('.kp > div, .pg > .card, .mk-card, .pie-box, .resume-card, .cd');
    items.forEach((el, idx) => {
      if(idx < 18){
        el.style.setProperty('--stagger-i', idx);
        el.classList.add('stagger-item');
      }
    });
  }

  const origRender24 = render;
  render = function(){
    origRender24();
    applyStaggerAnimation();
  };

  // 8. Hiệu ứng pháo giấy chúc mừng (Confetti Burst) mượt 60fps khi nộp bài đạt kết quả tốt
  function launchConfetti(){
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:98';
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    const colors = ['#0e7c86', '#2563eb', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
    const particles = Array.from({length: 65}, () => ({
      x: cv.width * (0.25 + Math.random() * 0.5),
      y: cv.height * 0.35,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 12 - 4,
      size: Math.random() * 7 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.25,
      alpha: 1
    }));

    const t0 = performance.now();
    function frame(now){
      const elapsed = now - t0;
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = false;
      for(const p of particles){
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.38; // trọng lực
        p.vx *= 0.985;
        p.rot += p.vrot;
        if(elapsed > 1100) p.alpha = Math.max(0, 1 - (elapsed - 1100) / 600);
        if(p.alpha > 0 && p.y < cv.height + 20){
          alive = true;
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
          ctx.restore();
        }
      }
      if(alive && elapsed < 1800) requestAnimationFrame(frame);
      else cv.remove();
    }
    requestAnimationFrame(frame);
  }

  const origSubmit24 = submit;
  submit = function(){
    if(V.rev) return;
    origSubmit24();
    if(V.h && pc(V.h) >= 50){
      launchConfetti();
    }
  };
})();

      try {
        const c = JSON.parse(localStorage.getItem('luyende_sfx_cfg') || '{}');
        if(c.enabled === false || c.pick === false) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        if(!window._unpickCtx) window._unpickCtx = new AC();
        const ctx = window._unpickCtx;
        if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const vol = (c.volume ?? 0.75) * 0.18;
        const t = ctx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, t);
        osc.frequency.exponentialRampToValueAtTime(310, t + 0.075);

        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.095);
      } catch(e){}
    };
  }

    ensureCardClearBtn(qi);
    updateProgressText(qi);
    syncClearAllBtnOnQBar();
    if(focusAfter) focusQ(qi, true, 'R');
    syncDraftAfterAnswerChange();
  }

  // Ghi đè drawQ và updateProgressText để luôn gắn nút "✕ Bỏ chọn"
  const origDrawQ25 = drawQ;
  drawQ = function(){
    origDrawQ25();
    syncAllCardClearButtons();
  };

  const origUpdateProg25 = updateProgressText;
  updateProgressText = function(justAnsweredQi){
    origUpdateProg25(justAnsweredQi);
    if(justAnsweredQi !== undefined) ensureCardClearBtn(justAnsweredQi);
    syncClearAllBtnOnQBar();
  };

  // Nâng cấp act.pick: Nếu bấm vào đáp án ĐANG CHỌN thì tự động HỦY CHỌN (Toggle Off)
  const origPick25 = act.pick;
  act.pick = function(d){
    if(V.rev) return;
    const qi = +d.q, oi = +d.o;
    if(V.ans && V.ans[qi] === oi){
      clearSingleQuestionAnswer(qi, true);
      return;
    }
    origPick25(d);
    ensureCardClearBtn(qi);
    syncClearAllBtnOnQBar();
  };

  // (Đã nâng cấp đồng bộ nút xóa trả lời O(1) ở V31)

  // Hỗ trợ bấm phím Backspace hoặc Delete để xóa nhanh đáp án của câu đang chọn (khi không gõ trong ô input)
  document.addEventListener('keydown', e => {
    if(V.view !== 'exam' || V.rev || $('#modal .ov:not(.closing)')) return;
    const tag = (e.target?.tagName || '').toUpperCase();
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable) return;
    if((e.key === 'Backspace' || e.key === 'Delete') && V.cur != null){
      const q = V.ex?.qs?.[V.cur];
      if(q && isAnswered(q, V.ans?.[V.cur])){
        e.preventDefault();
        clearSingleQuestionAnswer(V.cur, true);
      }
    }
  });

  Object.assign(act, {
    clr_ans(d){
      clearSingleQuestionAnswer(+d.q, true);
    },
    clr_all_ans(){
      if(V.rev || !V.ex) return;
      const doneCnt = (V.ex.qs || []).filter((q, i) => isAnswered(q, V.ans?.[i])).length;
      if(!doneCnt) return;
      modal(`<h3>🔄 Xóa toàn bộ câu trả lời đã chọn?</h3>
        <p>Bạn đang làm <b>${doneCnt}/${V.ex.qs.length} câu</b> trong bài <b>${esc(V.ex.title || '')}</b>.</p>

        <p style="margin-top:10px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--pr)">
          <input type="checkbox" id="clr-reset-timer" style="width:auto"> ⏱ Đặt lại đồng hồ thời gian làm bài về từ đầu
        </label></p>
        <div class="row" style="margin-top:14px">
          <button class="pri" style="background:var(--no);border-color:var(--no)" data-a="clr_all_ans_go">🗑 Xác nhận xóa (${doneCnt} câu)</button>
          <button class="gh" data-a="close">Hủy</button>
        </div>`);
    },
    clr_all_ans_go(){
      if(V.rev || !V.ex) return;
      const resetTimer = !!$('#clr-reset-timer')?.checked;
      V.ans = {};
      if(resetTimer){
        V.elapsed = 0;
        V.t0 = Date.now();
        V._warned180 = false;
        V._warned60 = false;
        V._lastTickSec = -1;
        tick();
      }
      if(window.SFX) window.SFX.trash();
      modal('');
      drawQ();
      syncDraftAfterAnswerChange();
    }
  });
})();

(function(){

  const popEl = document.getElementById('pop');
  if(popEl){
    popEl.addEventListener('mousedown', e => {
      e.preventDefault();
    });
  }

  // Theo dõi thao tác kéo chuột bôi đen (drag-select) hoặc nhấp đúp (double-click) trên câu hỏi & đáp án
  let ptrDown = {x: 0, y: 0, t: 0, target: null};
  let ptrUp = {x: 0, y: 0, dist: 0, t: 0};
  let prevAnsSnapshot = null; // Lưu trạng thái đáp án trước click #1 để hoàn tác nếu người dùng nhấp đúp (double-click) bôi từ

  document.addEventListener('pointerdown', e => {
    ptrDown = {x: e.clientX, y: e.clientY, t: Date.now(), target: e.target};
    // Lưu trạng thái đáp án trước khi click vào .op phòng trường hợp người dùng nhấp đúp (double-click) để bôi đen 1 từ
    const opEl = e.target.closest?.('.op[data-a="pick"]');
    if(opEl && V && V.view === 'exam' && !V.rev){
      const qi = +opEl.dataset.q;
      if(!prevAnsSnapshot || prevAnsSnapshot.qi !== qi || (Date.now() - prevAnsSnapshot.t > 450)){
        prevAnsSnapshot = {
          qi,
          hadAns: (V.ans && Object.prototype.hasOwnProperty.call(V.ans, qi)),
          val: V.ans ? V.ans[qi] : undefined,
          t: Date.now()
        };
      }
    }
  }, true);

  document.addEventListener('pointerup', e => {
    const tg = e.target?.tagName;
    if(tg === 'INPUT' || tg === 'TEXTAREA') return;
    const dist = Math.hypot(e.clientX - ptrDown.x, e.clientY - ptrDown.y);
    ptrUp = {x: e.clientX, y: e.clientY, dist, t: Date.now()};
    if(dist > 3 || e.detail >= 2) setTimeout(showPopForSelection, 25);
  }, true);

  // Khôi phục trạng thái đáp án êm ái (không chạm vào text node đang bôi đen) khi người dùng nhấp đúp vào từ trong đáp án
  function restoreAnsSilently(snap){
    if(!snap || !V || V.view !== 'exam' || V.rev || !V.ex) return;
    const qi = snap.qi;
    const q = V.ex.qs?.[qi];
    if(!q) return;
    if(snap.hadAns) V.ans[qi] = snap.val;
    else delete V.ans[qi];

    const rCard = document.getElementById('R' + qi);

      rCard.classList.toggle('dn', answered);
      rCard.classList.remove('cd-picked-pulse', 'cd-cleared');

      const clrBtn = rCard.querySelector(`.clr-ans-btn[data-q="${qi}"]`);

    }
    const blBtn = document.querySelector(`button.bl#L${qi}`);
    if(blBtn){
      const mNum = (blBtn.textContent || '').match(/^\((\d+)\)/);
      const dispNum = mNum ? mNum[1] : (qi + 1);
      blBtn.textContent = answered ? `(${dispNum}) ${q.opts[V.ans[qi]] || ''}` : `(${dispNum}) ______`;
      blBtn.classList.toggle('dn', answered);
      blBtn.classList.remove('bl-pop');
    }
    updateProgressText(qi);
  }

  // Chặn sự kiện click chọn đáp án (pick) hoặc cuộn câu hỏi (fq) nếu người dùng đang bôi đen văn bản để dịch
  document.addEventListener('click', e => {
    if(!V || V.view !== 'exam') return;
    const b = e.target.closest?.('[data-a]');
    if(!b) return;
    const a = b.dataset.a;
    if(a !== 'pick' && a !== 'fq') return;

    // Nếu người dùng bấm trực tiếp vào ô chữ cái A, B, C, D (.op > i) thì luôn cho phép chọn đáp án
    if(a === 'pick' && e.target.closest?.('.op > i')) return;

    const sel = window.getSelection?.();
    const selTxt = (sel && !sel.isCollapsed) ? sel.toString().trim() : '';
    const isDragSelect = selTxt.length >= 2 && (Date.now() - ptrUp.t < 450) && ptrUp.dist > 14;
    const isDblClickWord = e.detail >= 2 && selTxt.length > 0;

    if(isDblClickWord && a === 'pick' && prevAnsSnapshot && prevAnsSnapshot.qi === +b.dataset.q){
      e.stopPropagation();
      e.stopImmediatePropagation();
      restoreAnsSilently(prevAnsSnapshot);
      setTimeout(showPopForSelection, 15);
      return;
    }

    if(selTxt.length >= 2 || isDragSelect){
      // Đang có vùng văn bản được bôi đen -> Không kích hoạt chọn đáp án hay cuộn nhảy câu
      e.stopPropagation();
      e.stopImmediatePropagation();
      setTimeout(showPopForSelection, 15);
      return;
    }
  }, true);

  document.addEventListener('dblclick', e => {
    if(!V || V.view !== 'exam') return;
    const opEl = e.target.closest?.('.op[data-a="pick"]');
    if(opEl && !e.target.closest?.('.op > i') && prevAnsSnapshot && prevAnsSnapshot.qi === +opEl.dataset.q){
      restoreAnsSilently(prevAnsSnapshot);
    }
    setTimeout(showPopForSelection, 20);
  }, true);

  // Hàm hiển thị thanh công cụ Dịch / Nghe / Highlight (#pop) chuẩn xác cho cả cột Trái (#L) và cột Phải (#R)
  function showPopForSelection(){
    const p = $('#pop');
    const g = window.getSelection?.();
    if(!p || !g || V.view !== 'exam' || !g.rangeCount || g.isCollapsed || $('#modal .ov:not(.closing)')){
      if(p) p.style.display = 'none';
      return;
    }
    const txt = g.toString().trim();
    if(!txt){
      p.style.display = 'none';
      return;
    }
    const r = g.getRangeAt(0);
    const startEl = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
    const endEl = r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement;
    const inMain = startEl?.closest?.('#main') || endEl?.closest?.('#main');
    if(!inMain){
      p.style.display = 'none';
      return;
    }

    ST = txt;
    LAST_TR = '';
    const sp = startEl?.closest?.('[data-k]');
    if(sp && sp.contains(r.endContainer)){
      const pre = document.createRange();
      pre.selectNodeContents(sp);
      pre.setEnd(r.startContainer, r.startOffset);
      const st = pre.toString().length;
      PS = {k: sp.dataset.k, s: st, e: st + r.toString().length};
      $('#p-hlc').style.display = '';
      $('#p-hln').style.display = '';
    } else {
      PS = null;
      $('#p-hlc').style.display = 'none';
      $('#p-hln').style.display = 'none';
    }

    let b = r.getBoundingClientRect();
    if((!b || (b.width === 0 && b.height === 0)) && r.getClientRects().length){
      b = r.getClientRects()[0];
    }
    p.style.display = 'flex';
    const popW = p.offsetWidth || 380;
    const popH = p.offsetHeight || 40;
    const rawLeft = (b && (b.left || b.width)) ? b.left : (ptrUp.x - 60);
    const left = Math.max(8, Math.min(window.innerWidth - popW - 10, rawLeft));
    const top = (b && b.top > popH + 14) ? (b.top - popH - 8) : ((b ? b.bottom : ptrUp.y) + 8);
    p.style.left = Math.round(left) + 'px';
    p.style.top = Math.round(Math.max(8, Math.min(window.innerHeight - popH - 8, top))) + 'px';
  }
})();

    const isGlyph = PT_CFG.studySymbols && (Math.random() < (mode === 'scholar' ? 0.36 : 0.16));
    const glyph = isGlyph ? STUDY_GLYPHS[Math.floor(Math.random() * STUDY_GLYPHS.length)] : '';

    let vx = (Math.random() - 0.5) * 0.65;
    let vy = (Math.random() - 0.5) * 0.65;
    if(mode === 'scholar'){
      vx = (Math.random() - 0.5) * 0.35;
      vy = -Math.random() * 0.45 - 0.15; // Bay nhẹ lên như bụi sáng tri thức
    } else if(mode === 'sakura'){
      vx = Math.random() * 0.5 + 0.2;
      vy = Math.random() * 0.55 + 0.25; // Bay chéo nhẹ nhàng
    } else if(mode === 'fireflies'){
      vx = (Math.random() - 0.5) * 0.4;
      vy = (Math.random() - 0.5) * 0.4;
    }

    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : (mode === 'scholar' ? H + 20 : -20),
      vx,
      vy,
      r: isGlyph ? (Math.random() * 3 + 9.5) : (Math.random() * 2.4 + 1.6),
      color: col,
      alpha: isGlyph ? (Math.random() * 0.22 + 0.18) : (Math.random() * 0.42 + 0.22),
      phase: Math.random() * Math.PI * 2,
      phaseSpd: Math.random() * 0.03 + 0.01,
      glyph,
      rot: (Math.random() - 0.5) * 0.5,
      vrot: (Math.random() - 0.5) * 0.008,
      fg: Math.random() < 0.32 // 32% hạt hiển thị mờ tinh tế trên lớp kính để luôn thấy ngay cả khi mở khung làm bài rộng
    };
  }

  function initAmbientPool(){
    PAL = getThemePalette();
    const targetCnt = Math.max(15, Math.min(130, +(PT_CFG.count || 58)));
    ambientParticles = Array.from({length: targetCnt}, () => createAmbientParticle(true));
  }
  initAmbientPool();

  // Sinh hạt vệt chuột (Cursor Stardust Trail)
  function spawnCursorTrail(x, y, count = 2){
    if(!PT_CFG.enabled || !PT_CFG.cursorTrail) return;
    if(fxParticles.length > 180) return;
    const colors = [PAL.c1, PAL.c2, PAL.c3, PAL.c4];
    for(let i = 0; i < count; i++){
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 1.4 + 0.3;
      fxParticles.push({
        kind: 'trail',
        x: x + (Math.random() - 0.5) * 8,
        y: y + (Math.random() - 0.5) * 8,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.25,
        r: Math.random() * 2.4 + 1.2,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 0.78,
        decay: Math.random() * 0.022 + 0.018,
        gravity: -0.01,
        star: Math.random() < 0.35
      });
    }
  }

  // Sinh chùm hạt bùng nổ (Interactive Particle Burst) khi chọn đáp án, click hoặc đạt Streak
  function spawnParticleBurst(x, y, customColor, glyphList, count = 22){
    if(!PT_CFG.enabled || !PT_CFG.clickBurst) return;
    const colors = customColor ? [customColor, PAL.c1, PAL.c2, '#fbbf24'] : [PAL.c1, PAL.c2, PAL.c3, PAL.c4];
    const glyphs = glyphList && glyphList.length ? glyphList : ['★', '✓', '✨', 'A+'];
    for(let i = 0; i < count; i++){
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
      const spd = Math.random() * 4.8 + 1.6;
      const isG = PT_CFG.studySymbols && (i % 5 === 0);
      fxParticles.push({
        kind: 'burst',
        x,
        y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.8,
        r: isG ? 11 : (Math.random() * 3.2 + 1.8),
        color: colors[i % colors.length],
        alpha: 0.95,
        decay: isG ? 0.016 : (Math.random() * 0.018 + 0.015),
        gravity: 0.08,
        glyph: isG ? glyphs[Math.floor(Math.random() * glyphs.length)] : '',
        star: !isG && (i % 2 === 0)
      });
    }
  }
  window.spawnParticleBurst = spawnParticleBurst;

  // Vẽ ngôi sao 4 cánh lấp lánh (Sparkle Star)
  function drawSparkleStar(ctx, x, y, r, color, alpha){
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.fillStyle = color;
    ctx.beginPath();
    for(let i = 0; i < 4; i++){
      const a1 = (i * Math.PI) / 2;
      const a2 = a1 + Math.PI / 4;
      ctx.lineTo(x + Math.cos(a1) * r * 1.6, y + Math.sin(a1) * r * 1.6);
      ctx.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Vẽ cánh hoa Sakura / Tinh thể học tập
  function drawPetal(ctx, p, alpha){
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot + Math.sin(p.phase) * 0.3);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 1.6, p.r * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function renderSingleAmbientParticle(ctx, p, alphaScale){
    const pulse = 0.78 + 0.22 * Math.sin(p.phase);
    const a = p.alpha * pulse * alphaScale;
    if(a <= 0.01) return;

    if(p.glyph){
      ctx.save();
      ctx.globalAlpha = Math.min(0.65, a * 1.15);
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.phase * 0.5) * 0.12);
      ctx.font = `700 ${Math.round(p.r)}px "Segoe UI", system-ui, sans-serif`;
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.glyph, 0, 0);
      ctx.restore();
    } else if(PT_CFG.mode === 'sakura'){
      drawPetal(ctx, p, a);
    } else if(PT_CFG.mode === 'fireflies'){
      ctx.save();
      ctx.globalAlpha = a;
      const grad = ctx.createRadialGradient(p.x, p.y, 0.2, p.x, p.y, p.r * 3.2);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  let _fxWasDirty = false;
  // Vòng lặp hoạt ảnh thông minh: tự động nhường 100% CPU/GPU khi người dùng đang gõ chữ hoặc xóa chữ
  function animateParticles(){
    requestAnimationFrame(animateParticles);
    if(!PT_CFG.enabled || document.hidden) return;
    if(window._typingActiveUntil && performance.now() < window._typingActiveUntil) return;
    const actEl = document.activeElement;
    if(actEl && (actEl.tagName === 'INPUT' || actEl.tagName === 'TEXTAREA') && V.view === 'exam'){
      // Khi con trỏ đang nằm trong ô nhập đáp án, chỉ vẽ nếu có hiệu ứng nổ hạt, hoàn toàn không vẽ lại nền đè lên ô input
      if(!fxParticles.length){
        if(_fxWasDirty){ fxCtx.clearRect(0, 0, W, H); _fxWasDirty = false; }
        return;
      }
    }

    bgCtx.clearRect(0, 0, W, H);
    if(fxParticles.length > 0 || _fxWasDirty){
      fxCtx.clearRect(0, 0, W, H);
      _fxWasDirty = fxParticles.length > 0;
    }

    const spdMul = +(PT_CFG.speed || 1.0);
    const mode = PT_CFG.mode || 'constellation';
    const mMode = PT_CFG.mouseMode || 'grab';
    const mouseRecent = mouse.active && (Date.now() - mouse.lastMoveTs < 4000);

    // 1. Cập nhật vị trí và vẽ các hạt nền (Ambient Particles)
    for(let i = 0; i < ambientParticles.length; i++){
      const p = ambientParticles[i];
      p.phase += p.phaseSpd * spdMul;
      p.rot += p.vrot * spdMul;

      if(mode === 'fireflies'){
        p.x += (p.vx + Math.sin(p.phase) * 0.25) * spdMul;
        p.y += (p.vy + Math.cos(p.phase * 0.8) * 0.25) * spdMul;
      } else {
        p.x += p.vx * spdMul;
        p.y += p.vy * spdMul;
      }

      // Tương tác vật lý với con trỏ chuột (Interactive Mouse Physics)
      if(mouseRecent){
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        const interactR = 145;
        if(dist > 1 && dist < interactR){
          const force = (1 - dist / interactR);
          if(mMode === 'repel'){
            p.x += (dx / dist) * force * 2.4;
            p.y += (dy / dist) * force * 2.4;
          } else if(mMode === 'attract'){
            p.x -= (dx / dist) * force * 1.5;
            p.y -= (dy / dist) * force * 1.5;
          } else {
            // Chế độ 'grab': đẩy nhẹ ở tâm rất gần (< 55px) để chữ dễ đọc và nối dây tri thức xung quanh
            if(dist < 55){
              p.x += (dx / dist) * force * 1.1;
              p.y += (dy / dist) * force * 1.1;
            } else if(mode === 'cosmos'){
              // Xoay nhẹ quanh chuột ở chế độ Ngân hà
              p.x += (-dy / dist) * force * 1.1;
              p.y += (dx / dist) * force * 1.1;
            }
          }
        }
      }

      // Giới hạn biên màn hình (Wrap-around mượt mà)
      const pad = 28;
      if(p.x < -pad) p.x = W + pad;
      else if(p.x > W + pad) p.x = -pad;
      if(p.y < -pad) p.y = H + pad;
      else if(p.y > H + pad) p.y = -pad;

      // Vẽ toàn bộ hạt nền trên bgCtx (phía sau #app) để không bao giờ gây重绘 (repaint) đè lên ô input đang gõ
      renderSingleAmbientParticle(bgCtx, p, 1.0);
    }

    // 2. Vẽ các đường nối mạng lưới tri thức (Constellation Lines) giữa các hạt và tới con trỏ chuột
    if(mode === 'constellation' || mode === 'cosmos' || mMode === 'grab'){
      const linkDist = mode === 'constellation' ? 118 : 92;
      bgCtx.lineWidth = 0.85;
      for(let i = 0; i < ambientParticles.length; i++){
        const p1 = ambientParticles[i];
        // Nối giữa các hạt gần nhau
        if(mode === 'constellation'){
          for(let j = i + 1; j < ambientParticles.length; j++){
            const p2 = ambientParticles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            if(Math.abs(dx) > linkDist || Math.abs(dy) > linkDist) continue;
            const d = Math.hypot(dx, dy);
            if(d < linkDist){
              const lineAlpha = (1 - d / linkDist) * 0.22;
              bgCtx.strokeStyle = `rgba(${PAL.rgb1}, ${lineAlpha.toFixed(3)})`;
              bgCtx.beginPath();
              bgCtx.moveTo(p1.x, p1.y);
              bgCtx.lineTo(p2.x, p2.y);
              bgCtx.stroke();
            }
          }
        }

        // Nối từ các hạt quanh trỏ chuột tới chính con trỏ chuột trên bgCtx
        if(mouseRecent){
          const mdx = p1.x - mouse.x;
          const mdy = p1.y - mouse.y;
          const md = Math.hypot(mdx, mdy);
          const mouseLinkDist = 155;
          if(md < mouseLinkDist){
            const mAlpha = (1 - md / mouseLinkDist) * 0.38;
            bgCtx.strokeStyle = `rgba(${PAL.rgb2}, ${mAlpha.toFixed(3)})`;
            bgCtx.lineWidth = 1.05;
            bgCtx.beginPath();
            bgCtx.moveTo(p1.x, p1.y);
            bgCtx.lineTo(mouse.x, mouse.y);
            bgCtx.stroke();
          }
        }
      }
    }

    // 3. Cập nhật và vẽ các hạt hiệu ứng tương tác (Cursor Trail & Click/Pick Bursts) trên fxCtx
    for(let i = fxParticles.length - 1; i >= 0; i--){
      const fp = fxParticles[i];
      fp.x += fp.vx;
      fp.y += fp.vy;
      fp.vy += (fp.gravity || 0);
      fp.vx *= 0.97;
      fp.alpha -= fp.decay;

      if(fp.alpha <= 0.01){
        fxParticles.splice(i, 1);
        continue;
      }

      if(fp.glyph){
        fxCtx.save();
        fxCtx.globalAlpha = Math.min(1, fp.alpha);
        fxCtx.font = `800 ${Math.round(fp.r)}px "Segoe UI", system-ui, sans-serif`;
        fxCtx.fillStyle = fp.color;
        fxCtx.textAlign = 'center';
        fxCtx.textBaseline = 'middle';
        fxCtx.fillText(fp.glyph, fp.x, fp.y);
        fxCtx.restore();
      } else if(fp.star){
        drawSparkleStar(fxCtx, fp.x, fp.y, fp.r, fp.color, fp.alpha);
      } else {
        fxCtx.save();
        fxCtx.globalAlpha = Math.min(1, fp.alpha);
        fxCtx.fillStyle = fp.color;
        fxCtx.beginPath();
        fxCtx.arc(fp.x, fp.y, fp.r, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }
    }
  }
  requestAnimationFrame(animateParticles);

  // Lắng nghe chuyển động chuột để kích hoạt Interactive Particles & Cursor Trail
  let lastTrailTs = 0;
  window.addEventListener('pointermove', e => {
    const now = performance.now();
    mouse.vx = e.clientX - mouse.x;
    mouse.vy = e.clientY - mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    mouse.lastMoveTs = Date.now();

    if(now - lastTrailTs > 22 && Math.hypot(mouse.vx, mouse.vy) > 3){
      lastTrailTs = now;
      spawnCursorTrail(e.clientX, e.clientY, 1);
    }
  }, {passive: true});

  window.addEventListener('pointerleave', () => {
    mouse.active = false;
  });

  // Kích hoạt chùm hạt khi bấm vào các phương án trả lời (.op) hoặc các nút chính
  document.addEventListener('pointerdown', e => {
    if(!PT_CFG.enabled || !PT_CFG.clickBurst) return;
    const opEl = e.target.closest?.('.op[data-a="pick"]');
    if(opEl && V && V.view === 'exam' && !V.rev){
      const badgeTxt = opEl.querySelector('i')?.textContent?.trim() || '✓';
      spawnParticleBurst(e.clientX, e.clientY, PAL.c1, [badgeTxt, '✓', '★', '✨'], 20);
      return;
    }
    const priBtn = e.target.closest?.('button.pri, .streak-side, .nv.on');
    if(priBtn){
      spawnParticleBurst(e.clientX, e.clientY, PAL.c2, ['✨', '★', '🎓'], 14);
    }
  }, {passive: true});

  // Đồng bộ bảng màu hạt khi người dùng đổi Chủ đề màu sắc (set_theme)
  const origSetTheme28 = act.set_theme;
  if(origSetTheme28){
    act.set_theme = function(d){
      origSetTheme28(d);
      initAmbientPool();
    };
  }

        btn.textContent = `${idx + 1}${done ? ' ✓' : ''}`;
      }
    }

    let doneCnt = 0;
    for(let i = 0; i < ex.qs.length; i++){
      if(rev ? ok(i) : isAnswered(ex.qs[i], ans[i])) doneCnt++;

    const pct = Math.round((doneCnt / total) * 100);

    }

        btnAll.remove();
      }
    }
    return doneCnt;
  }

      sub: 'Sóng âm Alpha tĩnh lặng tăng khả năng ghi nhớ',
      builtin: true
    },
    {
      id: 'forest_zen',
      ico: '🌿',
      title: 'Forest Stream & Wind Chimes',
      sub: 'Tiếng suối rừng & chuông gió thanh tịnh',
      builtin: true
    }
  ];

  const DEFAULT_BGM_CFG = {
    playing: false,
    trackId: 'lofi_chill',
    volume: 0.45,
    loopMode: 'loop', // 'loop' | 'next'
    customTracks: []  // [{id, title, sub, url, isIdb}]
  };

  function getBgmCfg(){
    try {
      return {...DEFAULT_BGM_CFG, ...(JSON.parse(localStorage.getItem('luyende_bgm_cfg')) || {})};
    } catch(e){
      return {...DEFAULT_BGM_CFG};
    }
  }
  function saveBgmCfg(cfg){
    try { localStorage.setItem('luyende_bgm_cfg', JSON.stringify(cfg)); } catch(e){}
  }

  let BGM_CFG = getBgmCfg();
  BGM_CFG.playing = false; // Không tự phát khi vừa mở trang để tôn trọng trình duyệt, bấm Play là chạy ngay

  // IndexedDB lưu trữ file nhạc MP3/WAV người dùng tải lên
  let _bgmIdbPromise = null;
  function openBgmIDB(){
    if(_bgmIdbPromise) return _bgmIdbPromise;
    _bgmIdbPromise = new Promise((res, rej) => {
      if(!('indexedDB' in window)){ _bgmIdbPromise = null; return rej(); }
      const req = indexedDB.open('luyende_bgm_tracks_idb', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks');
      };
      req.onsuccess = e => res(e.target.result);
      req.onerror = () => { _bgmIdbPromise = null; rej(); };
    });
    return _bgmIdbPromise;
  }
  async function saveTrackBlobToIDB(id, blob){
    try {
      const db = await openBgmIDB();
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(blob, id);
    } catch(e){}
  }
  async function loadTrackBlobFromIDB(id){
    try {
      const db = await openBgmIDB();
      return await new Promise(res => {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').get(id);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      });
    } catch(e){ return null; }
  }
  async function deleteTrackBlobFromIDB(id){
    try {
      const db = await openBgmIDB();
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').delete(id);
    } catch(e){}
  }

  // Bộ tổng hợp Nhạc nền Web Audio API + HTML5 Audio cho nhạc tùy chọn
  let bgmCtx = null;
  let bgmMasterGain = null;
  let bgmLoopTimer = null;
  let bgmNoiseNode = null;
  let bgmAudioEl = new Audio();
  bgmAudioEl.preload = 'auto';

  function getAllTracks(){
    return [...BUILTIN_TRACKS, ...(BGM_CFG.customTracks || [])];
  }
  function getCurTrackObj(){
    const all = getAllTracks();
    return all.find(t => t.id === BGM_CFG.trackId) || all[0];
  }

  function ensureBgmAudioCtx(){
    if(!bgmCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        bgmCtx = new AC();
        bgmMasterGain = bgmCtx.createGain();
        bgmMasterGain.gain.value = BGM_CFG.volume ?? 0.45;
        bgmMasterGain.connect(bgmCtx.destination);
      }
    }
    if(bgmCtx && bgmCtx.state === 'suspended'){
      bgmCtx.resume().catch(()=>{});
    }
    return bgmCtx;
  }

  function stopSynthNodes(){
    if(bgmLoopTimer){ clearInterval(bgmLoopTimer); bgmLoopTimer = null; }
    if(bgmNoiseNode){
      try { bgmNoiseNode.stop(); bgmNoiseNode.disconnect(); } catch(e){}
      bgmNoiseNode = null;
    }
  }

  // Tạo tiếng mưa / đĩa than ấm áp bằng Filtered Pink Noise
  function startAmbientNoise(filterFreq, gainLevel){
    const ctx = ensureBgmAudioCtx();
    if(!ctx || !bgmMasterGain) return;
    stopSynthNodes();
    const bufSize = ctx.sampleRate * 3;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    for(let i = 0; i < bufSize; i++){
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.025;
      b6 = white * 0.115926;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const flt = ctx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = filterFreq || 950;

    const g = ctx.createGain();
    g.gain.value = gainLevel || 0.25;

    src.connect(flt);
    flt.connect(g);
    g.connect(bgmMasterGain);
    src.start();
    bgmNoiseNode = src;
  }

  function playWarmNote(freq, type, startTime, dur, vol){
    if(!bgmCtx || !bgmMasterGain) return;
    const osc = bgmCtx.createOscillator();
    const flt = bgmCtx.createBiquadFilter();
    const g = bgmCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(1400, startTime);

    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.linearRampToValueAtTime(vol, startTime + Math.min(0.18, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

    osc.connect(flt);
    flt.connect(g);
    g.connect(bgmMasterGain);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }

  function playSoftKickOrHat(isKick, startTime){
    if(!bgmCtx || !bgmMasterGain) return;
    const osc = bgmCtx.createOscillator();
    const g = bgmCtx.createGain();
    if(isKick){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(115, startTime);
      osc.frequency.exponentialRampToValueAtTime(38, startTime + 0.14);
      g.gain.setValueAtTime(0.16, startTime);
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.16);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(3200, startTime);
      g.gain.setValueAtTime(0.018, startTime);
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.045);
    }
    osc.connect(g);
    g.connect(bgmMasterGain);
    osc.start(startTime);
    osc.stop(startTime + 0.18);
  }

  function startBuiltinSynth(trackId){
    const ctx = ensureBgmAudioCtx();
    if(!ctx) return;
    stopSynthNodes();

    if(trackId === 'lofi_chill'){
      startAmbientNoise(750, 0.09); // Tiếng đĩa than lách tách ấm
      const chords = [
        [261.63, 329.63, 392.00, 493.88], // Cmaj7
        [220.00, 261.63, 329.63, 392.00], // Am7
        [293.66, 349.23, 440.00, 523.25], // Dm7
        [196.00, 246.94, 293.66, 349.23]  // G7
      ];
      let step = 0;
      const playBar = () => {
        if(!BGM_CFG.playing || BGM_CFG.trackId !== 'lofi_chill') return;
        const now = ctx.currentTime + 0.05;
        const ch = chords[step % chords.length];
        ch.forEach((f, idx) => {
          playWarmNote(f, 'triangle', now + idx * 0.04, 2.5, 0.055);
          playWarmNote(f * 0.5, 'sine', now, 2.6, 0.04);
        });
        // Giai điệu nhẹ phía trên
        const mel = ch[(step * 2) % ch.length] * 2;
        playWarmNote(mel, 'sine', now + 0.7, 1.1, 0.035);
        playWarmNote(ch[1] * 2, 'sine', now + 1.6, 0.9, 0.03);
        // Nhịp Lofi nhẹ
        playSoftKickOrHat(true, now);
        playSoftKickOrHat(false, now + 0.65);
        playSoftKickOrHat(true, now + 1.3);
        playSoftKickOrHat(false, now + 1.95);
        step++;
      };
      playBar();
      bgmLoopTimer = setInterval(playBar, 2600);
    } else if(trackId === 'piano_rain'){
      startAmbientNoise(920, 0.22); // Tiếng mưa hiên nhà
      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      let step = 0;
      const playPianoPhrase = () => {
        if(!BGM_CFG.playing || BGM_CFG.trackId !== 'piano_rain') return;
        const now = ctx.currentTime + 0.05;
        const base = scale[step % 4] * 0.5;
        playWarmNote(base, 'sine', now, 3.0, 0.07);
        for(let i = 0; i < 4; i++){
          const note = scale[(step + i * 2) % scale.length];
          playWarmNote(note, 'triangle', now + i * 0.72, 1.8, 0.055);
        }
        step++;
      };
      playPianoPhrase();
      bgmLoopTimer = setInterval(playPianoPhrase, 3000);
    } else if(trackId === 'cozy_rain'){
      startAmbientNoise(820, 0.34);
      const pads = [[174.61, 220.00, 261.63], [196.00, 246.94, 293.66]];
      let step = 0;
      const playPad = () => {
        if(!BGM_CFG.playing || BGM_CFG.trackId !== 'cozy_rain') return;
        const now = ctx.currentTime + 0.05;
        pads[step % pads.length].forEach(f => playWarmNote(f, 'sine', now, 3.8, 0.04));
        step++;
      };
      playPad();
      bgmLoopTimer = setInterval(playPad, 3800);
    } else if(trackId === 'alpha_focus'){
      startAmbientNoise(500, 0.08);
      const playDrone = () => {
        if(!BGM_CFG.playing || BGM_CFG.trackId !== 'alpha_focus') return;
        const now = ctx.currentTime + 0.05;
        playWarmNote(216, 'sine', now, 4.2, 0.055);
        playWarmNote(226, 'sine', now, 4.2, 0.055); // 10Hz Alpha wave beat
        playWarmNote(324, 'sine', now + 0.5, 3.5, 0.035);
      };
      playDrone();
      bgmLoopTimer = setInterval(playDrone, 4000);
    } else if(trackId === 'forest_zen'){
      startAmbientNoise(1150, 0.16);
      const pent = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
      const playChime = () => {
        if(!BGM_CFG.playing || BGM_CFG.trackId !== 'forest_zen') return;
        const now = ctx.currentTime + 0.05;
        const f1 = pent[Math.floor(Math.random() * pent.length)];
        const f2 = pent[Math.floor(Math.random() * pent.length)];
        playWarmNote(f1, 'sine', now, 2.2, 0.045);
        playWarmNote(f2, 'triangle', now + 0.9, 2.0, 0.035);
      };
      playChime();
      bgmLoopTimer = setInterval(playChime, 2400);
    }
  }

  async function startBgmPlayback(){
    const tr = getCurTrackObj();
    if(!tr) return;
    BGM_CFG.playing = true;
    BGM_CFG.trackId = tr.id;
    saveBgmCfg(BGM_CFG);

    // Dừng nguồn phát cũ
    stopSynthNodes();
    try { bgmAudioEl.pause(); } catch(e){}

    if(tr.builtin){
      ensureBgmAudioCtx();
      if(bgmMasterGain) bgmMasterGain.gain.value = BGM_CFG.volume ?? 0.45;
      startBuiltinSynth(tr.id);
    } else {
      let srcUrl = tr.url || '';
      if(tr.isIdb){
        const blob = await loadTrackBlobFromIDB(tr.id);
        if(blob){
          if(tr._blobUrl) try { URL.revokeObjectURL(tr._blobUrl); } catch(e){}
          tr._blobUrl = URL.createObjectURL(blob);
          srcUrl = tr._blobUrl;
        }
      }
      if(!srcUrl){
        alert('Không tìm thấy dữ liệu file nhạc này. Hệ thống sẽ chuyển về nhạc Lofi mặc định.');
        BGM_CFG.trackId = 'lofi_chill';
        return startBgmPlayback();
      }
      bgmAudioEl.src = srcUrl;
      bgmAudioEl.volume = Math.max(0, Math.min(1, BGM_CFG.volume ?? 0.45));
      bgmAudioEl.loop = (BGM_CFG.loopMode !== 'next');
      bgmAudioEl.play().catch(() => {});
    }
    syncBgmUI();
  }

  function pauseBgmPlayback(){
    BGM_CFG.playing = false;
    saveBgmCfg(BGM_CFG);
    stopSynthNodes();
    try { bgmAudioEl.pause(); } catch(e){}
    syncBgmUI();
  }

  function stepBgmTrack(dir){
    const all = getAllTracks();
    if(!all.length) return;
    const idx = all.findIndex(t => t.id === BGM_CFG.trackId);
    const nextIdx = (idx + dir + all.length) % all.length;
    BGM_CFG.trackId = all[nextIdx].id;
    saveBgmCfg(BGM_CFG);
    if(BGM_CFG.playing) startBgmPlayback();
    else syncBgmUI();
  }

  bgmAudioEl.addEventListener('ended', () => {
    if(BGM_CFG.loopMode === 'next') stepBgmTrack(1);
    else if(BGM_CFG.playing) bgmAudioEl.play().catch(()=>{});
  });

  function setBgmVolume(v){
    BGM_CFG.volume = Math.max(0, Math.min(1, +v));
    saveBgmCfg(BGM_CFG);
    if(bgmMasterGain) bgmMasterGain.gain.value = BGM_CFG.volume;
    bgmAudioEl.volume = BGM_CFG.volume;
  }

  function syncBgmUI(){
    const tr = getCurTrackObj();
    const sideTitle = document.getElementById('bgm-side-title');
    const sidePlayBtn = document.getElementById('bgm-side-play');
    const sideEq = document.getElementById('bgm-side-eq');
    if(sideTitle && tr) sideTitle.textContent = `${tr.ico || '🎵'} ${tr.title}`;
    if(sidePlayBtn) sidePlayBtn.textContent = BGM_CFG.playing ? '⏸' : '▶';
    if(sideEq) sideEq.classList.toggle('playing', !!BGM_CFG.playing);

    const ehBtn = document.getElementById('bgm-eh-btn');
    if(ehBtn && tr){
      ehBtn.innerHTML = `${BGM_CFG.playing ? '🎵 Đang phát' : '🎧 Nhạc nền'}`;
      ehBtn.style.borderColor = BGM_CFG.playing ? 'var(--pr)' : '';
      ehBtn.style.color = BGM_CFG.playing ? 'var(--pr)' : '';
    }
  }

      <div class="card" style="background:linear-gradient(135deg, rgba(14,124,134,0.12), rgba(99,102,241,0.1));border-color:var(--pr);padding:12px 15px;margin:10px 0">

          <div class="bgm-eq ${BGM_CFG.playing ? 'playing' : ''}"><span></span><span></span><span></span></div>

          </div>
        </div>
        <div class="row" style="margin:0;align-items:center">

          <button type="button" class="pri" style="padding:6px 16px" data-a="bgm_toggle">${BGM_CFG.playing ? '⏸ Tạm dừng' : '▶ Phát nhạc'}</button>

      <div class="row" style="align-items:center;gap:14px;margin:10px 0">

          <div class="v-range">

      BGM_CFG.customTracks = BGM_CFG.customTracks || [];

          id,
          ico: '🎧',

          sub: `File nhạc cá nhân (${(f.size / 1048576).toFixed(1)} MB)`,
          isIdb: true
        });

        BGM_CFG.trackId = lastId;
        saveBgmCfg(BGM_CFG);
        await startBgmPlayback();
        openBgmModal();
        renderSide();

    });

  let COL_SET = new Set();
  try {
    COL_SET = new Set(JSON.parse(localStorage.getItem('luyende_col_set') || '[]'));
  } catch(e){}

  function saveColSet(){
    try { localStorage.setItem('luyende_col_set', JSON.stringify([...COL_SET])); } catch(e){}
  }
  function isSidebarCollapsed(){
    return localStorage.getItem('luyende_side_collapsed') === '1';

  function enhanceCollapsibleUI(){
    applySidebarCollapsedState();
    const side = document.getElementById('side');
    if(side){
      // 1. Nút Thu gọn Sidebar ngay cạnh tiêu đề Luyện đề
      const h2 = side.querySelector('h2');
      if(h2 && !h2.querySelector('[data-a="tgl_sidebar"]')){
        h2.style.display = 'flex';
        h2.style.justifyContent = 'space-between';
        h2.style.alignItems = 'center';

      // 2. Chèn Mini-Player Nhạc nền Lofi / Chill vào Sidebar (ngay dưới hộp Streak)
      if(!side.querySelector('#bgm-side-box')){
        const curTr = getCurTrackObj();
        const anchor = side.querySelector('.resume-side-box') || side.querySelector('.streak-side') || h2;
        if(anchor){
          const bgmMinimized = COL_SET.has('side_bgm_min');
          const bgmHtml = `<div class="bgm-side-card" id="bgm-side-box">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
              <div style="display:flex;align-items:center;min-width:0;flex:1;cursor:pointer" data-a="bgm_modal" title="Bấm để mở danh sách Nhạc nền Lofi / Chill & Thêm nhạc">

              </div>
              <div style="display:flex;align-items:center;gap:3px;flex:none">
                <button type="button" class="gh" id="bgm-side-play" style="padding:2px 7px;font-size:11.5px" data-a="bgm_toggle" title="Phát / Tạm dừng nhạc nền">${BGM_CFG.playing ? '⏸' : '▶'}</button>
                <button type="button" class="gh" style="padding:2px 6px;font-size:11.5px" data-a="bgm_next" title="Đổi bài nhạc khác">⏭</button>
                <button type="button" class="nv-ren" style="opacity:0.85" data-a="tgl_bgm_min" title="Thu gọn / Mở rộng ô nhạc">${bgmMinimized ? '▸' : '▾'}</button>
              </div>
            </div>
            <div id="bgm-side-body" class="${bgmMinimized ? 'is-collapsed' : ''}" style="margin-top:6px;padding-top:6px;border-top:1px dashed rgba(14,124,134,0.28);display:flex;align-items:center;gap:6px">
              <span style="font-size:11px;color:var(--mu)">🔊</span>
              <input type="range" id="bgm-side-vol" min="0" max="1" step="0.02" value="${BGM_CFG.volume ?? 0.45}" style="flex:1;padding:0;accent-color:var(--pr);cursor:pointer;height:14px">
              <button type="button" class="gh" style="padding:2px 7px;font-size:11px" data-a="bgm_modal">➕ Chọn nhạc</button>
            </div>
          </div>`;
          anchor.insertAdjacentHTML('afterend', bgmHtml);
          side.querySelector('#bgm-side-vol')?.addEventListener('input', e => setBgmVolume(+e.target.value));
        }
      }

      // 3. Biến 2 khu vực ".lb" (Thư mục theo tuần & An toàn dữ liệu / Cài đặt) thành khu vực thu gọn được
      const lbs = [...side.querySelectorAll('.lb:not(.col-hdr)')];
      lbs.forEach((lb, idx) => {
        const key = idx === 0 ? 'side_sec_folders' : 'side_sec_settings';
        const wrap = document.createElement('div');
        wrap.className = 'col-sec' + (COL_SET.has(key) ? ' is-collapsed' : '');
        wrap.dataset.colKey = key;

        const hdr = document.createElement('div');
        hdr.className = 'lb col-hdr';
        hdr.dataset.a = 'tgl_col';
        hdr.dataset.k = key;
        hdr.title = 'Bấm để Thu gọn / Mở rộng mục này';
        hdr.innerHTML = `<span><b>${esc(lb.textContent)}</b></span><span class="col-chev">▾</span>`;

        const body = document.createElement('div');
        body.className = 'col-body';

        lb.replaceWith(wrap);
        wrap.appendChild(hdr);
        wrap.appendChild(body);

        let next = wrap.nextElementSibling;
        while(next && !next.classList.contains('lb') && !next.classList.contains('col-sec')){
          const mv = next;
          next = next.nextElementSibling;
          body.appendChild(mv);
        }

        // Thêm nút mở Danh ngôn / Caption động lực vào mục Cài đặt
        if(key === 'side_sec_settings' && !body.querySelector('[data-a="motiv_modal"]')){
          body.insertAdjacentHTML('beforeend', `<button class="gh" style="width:100%;margin-top:6px;font-size:12.5px" data-a="motiv_modal" title="Xem & cài đặt Caption danh ngôn tiếng Anh truyền động lực">💬 Caption Động lực & Danh ngôn</button>`);
        }
      });

      // 4. Cho phép thu gọn từng Đầu mục phân loại (.cl) trong cây thư mục cột trái
      side.querySelectorAll('.cl').forEach((clEl, idx) => {
        if(clEl.dataset.colReady) return;
        clEl.dataset.colReady = '1';
        const catId = clEl.dataset.c || ('cat_' + idx);
        const key = 'side_cat_' + catId;
        const chev = document.createElement('button');
        chev.type = 'button';
        chev.className = 'nv-ren';
        chev.style.opacity = '1';
        chev.dataset.a = 'tgl_cat_side';
        chev.dataset.k = key;
        chev.title = 'Thu gọn / Mở rộng đầu mục này';
        chev.textContent = COL_SET.has(key) ? '▸' : '▾';
        clEl.insertBefore(chev, clEl.firstChild);

        const groupWrap = document.createElement('div');
        groupWrap.className = 'col-body' + (COL_SET.has(key) ? ' is-collapsed' : '');
        groupWrap.id = 'SCAT_' + key;
        clEl.after(groupWrap);
        let nx = groupWrap.nextElementSibling;
        while(nx && nx.classList.contains('nv-wrap')){
          const mv = nx;
          nx = nx.nextElementSibling;
          groupWrap.appendChild(mv);
        }
      });
    }

    // 5. Gắn chức năng Thu gọn cho khung chính (#main)
    const main = document.getElementById('main');
    if(!main) return;

    if(V.view === 'exam'){
      const eh = main.querySelector('.eh');
      if(eh){
        if(!eh.querySelector('#bgm-eh-btn')){
          const ptBtn = eh.querySelector('button[data-a="pt_modal"]') || eh.querySelector('button[data-a="vset"]');
          const bgmBtnHtml = `<button type="button" class="gh" id="bgm-eh-btn" data-a="bgm_modal" title="Bật/Tắt hoặc đổi Nhạc nền Lofi / Chill">${BGM_CFG.playing ? '🎵 Đang phát' : '🎧 Nhạc nền'}</button>`;
          if(ptBtn) ptBtn.insertAdjacentHTML('afterend', bgmBtnHtml);
          else eh.insertAdjacentHTML('beforeend', bgmBtnHtml);
        }
        if(!eh.querySelector('[data-a="tgl_exambar"]')){
          const isCol = document.body.classList.contains('exam-bar-collapsed');
          eh.insertAdjacentHTML('beforeend', `<button type="button" class="gh" data-a="tgl_exambar" title="Thu gọn hoặc mở rộng thanh danh sách câu hỏi">${isCol ? '▾ Mở thanh câu' : '▴ Thu gọn thanh'}</button>`);
          if(V.rev){
            const expCol = document.body.classList.contains('exam-exp-collapsed');
            eh.insertAdjacentHTML('beforeend', `<button type="button" class="gh" data-a="tgl_examexp" title="Ẩn/Hiện toàn bộ lời giải chi tiết">${expCol ? '💡 Hiện giải' : '💡 Ẩn giải'}</button>`);
          }
        }
      }
      // Bấm vào tiêu đề nhóm câu hỏi (.gh2) để thu gọn/mở rộng nhóm đó
      main.querySelectorAll('.grp .gh2').forEach((gh2, gi) => {
        if(gh2.dataset.colReady) return;
        gh2.dataset.colReady = '1';
        const key = `exam_grp_${gi}`;
        gh2.classList.add('col-hdr');
        gh2.dataset.a = 'tgl_grp_exam';
        gh2.dataset.k = key;
        gh2.innerHTML = `<span>${gh2.innerHTML}</span><span class="col-chev" title="Bấm để Thu gọn / Mở rộng nhóm này">▾</span>`;
      });
      return;
    }

    const pg = main.querySelector('.pg');
    if(!pg) return;

    const hd = pg.querySelector('.hd');
    if(hd && !hd.querySelector('[data-a="col_all_main"]')){
      let row = hd.querySelector('.row');
      if(!row){
        row = document.createElement('div');
        row.className = 'row no-print';
        hd.appendChild(row);
      }
      row.insertAdjacentHTML('afterbegin', `
        <button type="button" class="gh" style="padding:5px 10px;font-size:12.5px" data-a="col_all_main" title="Thu gọn tất cả các ô chức năng trên trang này">🗂 Thu gọn các ô</button>
        <button type="button" class="gh" style="padding:5px 10px;font-size:12.5px" data-a="exp_all_main" title="Mở rộng tất cả các ô chức năng">📂 Mở hết</button>
      `);
    }

    // Không bọc thu gọn các khối Thư mục con & Tài liệu trong trang Thư mục tuần (V.view === 'week') để tránh bị ẩn nhầm File / Folder
    if(V.view === 'week') return;

    // Bọc các khối thống kê (.stk-hero, .resume-banner, .pie-grid, .ch, .ed-grp, .sc) nhưng KHÔNG bọc danh sách Đầu mục phân loại
    const blocks = [...pg.children].filter(el =>
      !el.classList.contains('hd') &&
      !el.classList.contains('print-only') &&
      !el.classList.contains('tabs') &&
      !el.classList.contains('row') &&
      !el.classList.contains('blk-col-bar') &&
      (
        el.classList.contains('stk-hero') ||
        el.classList.contains('resume-banner') ||
        el.classList.contains('pie-grid') ||
        el.classList.contains('ch') ||
        el.classList.contains('ed-grp') ||
        el.classList.contains('sc')
      )
    );

    blocks.forEach((blk, idx) => {
      if(blk.dataset.colWrapped) return;
      blk.dataset.colWrapped = '1';
      const key = `${V.view}_blk_${idx}`;
      let titleTxt = '';
      if(blk.classList.contains('kp')) titleTxt = '📊 Các chỉ số tổng quan (KPI)';
      else if(blk.classList.contains('pie-grid')) titleTxt = '🎯 Biểu đồ tròn Tỷ lệ Đúng/Sai & Phân loại';
      else if(blk.classList.contains('sc')) titleTxt = '📋 Bảng dữ liệu chi tiết';
      else {
        const tEl = blk.querySelector('b, h3, small');
        titleTxt = tEl ? tEl.textContent.trim().slice(0, 68) : `Ô chức năng #${idx + 1}`;
      }

      const isCol = COL_SET.has(key);
      const bar = document.createElement('div');
      bar.className = 'blk-col-bar no-print' + (isCol ? ' is-collapsed' : '');
      bar.dataset.a = 'tgl_blk';
      bar.dataset.k = key;
      bar.innerHTML = `<span>${esc(titleTxt)}</span><span class="col-chev">${isCol ? '▸ Mở rộng' : '▾ Thu gọn'}</span>`;

      blk.before(bar);
      blk.dataset.blkKey = key;
      blk.classList.add('col-body');
      if(isCol) blk.classList.add('is-collapsed');
    });
  }

  const DEFAULT_MOTIV_CFG = {
    enabled: true,
    intervalMin: 3 // Hiện ngẫu nhiên mỗi 3 phút hoặc khi bấm xem
  };
  function getMotivCfg(){
    try { return {...DEFAULT_MOTIV_CFG, ...(JSON.parse(localStorage.getItem('luyende_motiv_cfg')) || {})}; }
    catch(e){ return {...DEFAULT_MOTIV_CFG}; }
  }
  function saveMotivCfg(cfg){
    try { localStorage.setItem('luyende_motiv_cfg', JSON.stringify(cfg)); } catch(e){}
  }

  let MOTIV_CFG = getMotivCfg();
  let curQuoteIdx = Math.floor(Math.random() * MOTIV_QUOTES.length);
  let motivHideTimer = null;
  let motivIntervalTimer = null;

  const motivEl = document.createElement('div');
  motivEl.id = 'motiv-pop';
  document.body.appendChild(motivEl);

  function showMotivCaption(forceNew = true){
    if(!MOTIV_CFG.enabled && !forceNew) return;
    if(forceNew){
      let nextIdx = Math.floor(Math.random() * MOTIV_QUOTES.length);
      if(nextIdx === curQuoteIdx) nextIdx = (nextIdx + 1) % MOTIV_QUOTES.length;
      curQuoteIdx = nextIdx;
    }
    const q = MOTIV_QUOTES[curQuoteIdx] || MOTIV_QUOTES[0];
    motivEl.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="motiv-author">${q.ico} ${esc(q.author)} · <small class="mu">Caption Động lực</small></span>
        <div style="display:flex;align-items:center;gap:4px">

      <div class="motiv-quote-vi">💬 ${esc(q.vi)}</div>

    clearTimeout(motivHideTimer);

      motivEl.classList.remove('show');

  function restartMotivTimer(){
    clearInterval(motivIntervalTimer);

      if(!document.hidden && !$('#modal .ov:not(.closing)')){
        showMotivCaption(true);
      }
    }, ms);
  }

  // =========================================================================
  const activeColAnims = new WeakMap();

  function animateCollapseElement(el, toCollapsed, dur = 290){
    if(!el) return;
    if(activeColAnims.has(el)){
      try { activeColAnims.get(el).cancel(); } catch(e){}
      activeColAnims.delete(el);
    }

    if(toCollapsed){
      // Đang mở -> Thu gọn mượt mà
      const startH = el.offsetHeight;
      if(startH <= 0){
        el.classList.add('is-collapsed');
        return;
      }
      const cs = window.getComputedStyle(el);
      const startPT = cs.paddingTop;
      const startPB = cs.paddingBottom;
      const startMT = cs.marginTop;
      const startMB = cs.marginBottom;

      el.style.overflow = 'hidden';
      if(el.animate){
        const anim = el.animate([
          {
            height: startH + 'px',
            opacity: 1,
            transform: 'translateY(0) scale(1)',
            paddingTop: startPT,
            paddingBottom: startPB,
            marginTop: startMT,
            marginBottom: startMB
          },
          {
            height: '0px',
            opacity: 0,
            transform: 'translateY(-6px) scale(0.985)',
            paddingTop: '0px',
            paddingBottom: '0px',
            marginTop: '0px',
            marginBottom: '0px'
          }
        ], {
          duration: dur,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
        });
        activeColAnims.set(el, anim);
        anim.onfinish = () => {
          el.classList.add('is-collapsed');
          el.style.overflow = '';
          activeColAnims.delete(el);
        };
        anim.oncancel = () => {
          el.style.overflow = '';
          activeColAnims.delete(el);
        };
      } else {
        el.classList.add('is-collapsed');
      }
    } else {
      // Đang thu gọn -> Mở rộng mượt mà
      el.classList.remove('is-collapsed');
      const endH = el.offsetHeight;
      if(endH <= 0) return;

      const cs = window.getComputedStyle(el);
      const endPT = cs.paddingTop;
      const endPB = cs.paddingBottom;
      const endMT = cs.marginTop;
      const endMB = cs.marginBottom;

      el.style.overflow = 'hidden';
      if(el.animate){
        const anim = el.animate([
          {
            height: '0px',
            opacity: 0,
            transform: 'translateY(-6px) scale(0.985)',
            paddingTop: '0px',
            paddingBottom: '0px',
            marginTop: '0px',
            marginBottom: '0px'

            height: endH + 'px',
            opacity: 1,
            transform: 'translateY(0) scale(1)',
            paddingTop: endPT,
            paddingBottom: endPB,
            marginTop: endMT,
            marginBottom: endMB
          }
        ], {
          duration: dur + 30,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
        });
        activeColAnims.set(el, anim);
        anim.onfinish = () => {
          el.style.overflow = '';
          activeColAnims.delete(el);
        };
        anim.oncancel = () => {
          el.style.overflow = '';
          activeColAnims.delete(el);
        };
      }
    }
  }

          </div>
        </div>`;
        ptBtn.insertAdjacentHTML('afterend', sideEzHtml);
      }

  window.addEventListener('wheel', e => {

        applyExamZoom(100, true);

    }

  function switchActiveSection(targetSec){
    if(!SEC_CFG[targetSec] || targetSec === ACTIVE_SEC) return;

    // 1. Nếu đang làm dở bài thi ở phần hiện tại, tự động lưu nháp vào savedSessions của phần hiện tại trước khi chuyển

      const doneCnt = (V.ex.qs || []).filter((q, i) => isAnswered(q, V.ans?.[i])).length;
      if(doneCnt > 0 || getUsedSec() >= 5 || D.savedSessions[sKey]){
        D.savedSessions[sKey] = {
          key: sKey,
          examId: V.ex.id || '',
          title: V.ex.title || 'Bài thi',
          wid: V.wid || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].id : ''),
          weekName: V.weekName || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].name : ''),
          wi: V.wi ?? -1,
          ei: V.ei ?? -1,
          ex: {...V.ex, files: []},
          order: V.order,
          perm: V.perm,
          ans: V.ans,
          elapsed: getUsedSec(),
          limit: V.limit || 0,
          cur: V.cur,
          layout: V.layout || 'split',
          fromMistakes: !!V.fromMistakes,
          doneCount: doneCnt,
          totalCount: V.ex.qs.length,
          savedAt: Date.now()
        };
        save();
      }
      clearInterval(TI);
      stopSpeech();
    }

    // 2. Lưu ngay lập tức dữ liệu của phần hiện tại xuống localStorage & IndexedDB trước khi rời đi
    if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);

    // 3. Cất trạng thái màn hình (V, SF, SC) của phần cũ
    SEC_NAV_STATE[ACTIVE_SEC] = {
      V: (V && V.view !== 'exam' && V.view !== 'edit') ? {...V} : {view: 'stats'},
      SF: SF || '',
      SC: SC || ''
    };

    // 4. Chuyển sang phần mới
    ACTIVE_SEC = targetSec;
    window.ACTIVE_SEC = ACTIVE_SEC;
    localStorage.setItem('luyende_active_sec', ACTIVE_SEC);

    // 5. Trỏ D vào kho dữ liệu độc lập của phần mới và khôi phục trạng thái xem của phần mới
    D = SEC_DBS[ACTIVE_SEC];
    const restored = SEC_NAV_STATE[ACTIVE_SEC] || { V: {view: 'stats'}, SF: '', SC: '' };
    V = restored.V || {view: 'stats'};
    SF = restored.SF || '';
    SC = restored.SC || '';

    // Kiểm tra nếu thư mục wi đang mở không còn tồn tại thì đưa về trang stats
    if(V.view === 'week' && (V.wi < 0 || !D.weeks[V.wi])){
      V = {view: 'stats'};
    }

    // 6. Làm mới bộ lọc và cache Sổ tay câu sai của phần mới
    if(typeof window._resetSectionViewFilters === 'function') window._resetSectionViewFilters();

  }

  // Nâng cấp chức năng Sao lưu (expd) và Khôi phục (#impf) phân mảnh chống tràn bộ nhớ 100%
  function stripRedundantFilesInHistAndSessions(secObj, stripAllHeavyFiles){
    if(!secObj || typeof secObj !== 'object') return {weeks:[], hist:[], cats:[]};
    const cleanFileArr = (filesArr, forceStrip) => {
      if(!Array.isArray(filesArr)) return [];
      return filesArr.map(f => {
        if(!f || typeof f !== 'object') return f;
        if(forceStrip && f.dataUrl) return {...f, dataUrl: ''};
        return f;
      });
    };
    const cleanExamForHist = ex => {
      if(!ex || typeof ex !== 'object') return ex;
      // Trong lịch sử làm bài (hist) và phiên lưu tạm (savedSessions), không nhân bản lại dataUrl nặng của file
      return {...ex, files: cleanFileArr(ex.files, true)};
    };
    return {
      ...secObj,
      weeks: (secObj.weeks || []).map(w => ({
        ...w,
        files: cleanFileArr(w.files, stripAllHeavyFiles),
        exams: (w.exams || []).map(ex => ({
          ...ex,
          files: cleanFileArr(ex.files, stripAllHeavyFiles)
        }))
      })),
      hist: (secObj.hist || []).map(h => h ? {...h, ex: cleanExamForHist(h.ex)} : h),
      savedSessions: Object.fromEntries(
        Object.entries(secObj.savedSessions || {}).map(([k, s]) => [k, s ? {...s, ex: cleanExamForHist(s.ex)} : s])
      ),
      trash: stripAllHeavyFiles ? [] : (secObj.trash || [])
    };
  }

  // Đóng gói JSON theo từng mảnh (Chunked Blob) để không bao giờ bị lỗi RangeError: Invalid string length khi có nhiều file PDF/Word nặng
  function serializeSectionToBlobParts(secObj, stripAllHeavyFiles){
    const cleaned = stripRedundantFilesInHistAndSessions(secObj, stripAllHeavyFiles);
    const parts = ['{'];
    parts.push('"cats":', JSON.stringify(cleaned.cats || []), ',');
    parts.push('"dailyGoalMin":', JSON.stringify(cleaned.dailyGoalMin || 30), ',');
    parts.push('"studyLog":', JSON.stringify(cleaned.studyLog || {}), ',');
    parts.push('"_ts":', JSON.stringify(cleaned._ts || Date.now()), ',');

    // Tuần & Bài thi (ghi từng tuần một để không tạo chuỗi đơn quá lớn)
    parts.push('"weeks":[');
    const wks = cleaned.weeks || [];
    for(let i = 0; i < wks.length; i++){
      if(i > 0) parts.push(',');
      parts.push(JSON.stringify(wks[i]));
    }
    parts.push('],');

    // Lịch sử làm bài (ghi từng bản ghi một)
    parts.push('"hist":[');
    const hst = cleaned.hist || [];
    for(let i = 0; i < hst.length; i++){
      if(i > 0) parts.push(',');
      parts.push(JSON.stringify(hst[i]));
    }
    parts.push('],');

    parts.push('"mistakeStore":', JSON.stringify(cleaned.mistakeStore || {}), ',');
    parts.push('"savedSessions":', JSON.stringify(cleaned.savedSessions || {}), ',');
    parts.push('"trash":', JSON.stringify(cleaned.trash || []));
    parts.push('}');
    return parts;
  }

  function buildBackupBlob(mode, stripHeavyFiles){
    SEC_DBS[ACTIVE_SEC] = D;
    if(mode === 'cur'){
      const parts = serializeSectionToBlobParts(D, stripHeavyFiles);
      return new Blob(parts, {type: 'application/json;charset=utf-8'});
    }
    const parts = ['{"multiSectionBackup":true,"exportedAt":' + Date.now() + ',"sections":{'];
    const keys = ['luyende', 'toan', 'ly', 'van'];
    keys.forEach((k, idx) => {
      if(idx > 0) parts.push(',');
      parts.push(JSON.stringify(k) + ':');
      const secParts = serializeSectionToBlobParts(SEC_DBS[k] || createEmptySecData(), stripHeavyFiles);
      parts.push(...secParts);
    });
    parts.push('}}');
    return new Blob(parts, {type: 'application/json;charset=utf-8'});
  }

  async function triggerReliableBlobDownload(blob, filename, useSavePicker){
    if(useSavePicker && typeof window.showSaveFilePicker === 'function'){
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{
            description: 'File Sao lưu JSON (.json)',
            accept: {'application/json': ['.json']}
          }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        if(window.SFX) window.SFX.ding();
        modal('');
        alert('✅ Đã lưu file sao lưu "' + filename + '" thành công!');
        return;
      } catch(err){
        if(err && err.name === 'AbortError') return;
        // Nếu trình duyệt từ chối showSaveFilePicker thì tự động chuyển sang tải xuống trực tiếp bên dưới
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    if(window.SFX) window.SFX.ding();
    setTimeout(() => {
      a.remove();
      try { URL.revokeObjectURL(url); } catch(e){}
    }, 60000);
  }

  function downloadJsonBlob(obj, filename){
    try {
      const b = (obj && obj.multiSectionBackup)
        ? buildBackupBlob('all4', false)
        : buildBackupBlob('cur', false);
      triggerReliableBlobDownload(b, filename, false);
    } catch(err){
      const bLight = (obj && obj.multiSectionBackup)
        ? buildBackupBlob('all4', true)
        : buildBackupBlob('cur', true);
      triggerReliableBlobDownload(bLight, filename, false);
    }
  }

  window._handleImportBackupFile = async function(file){
    if(!file) return;
    try {
      if(typeof window._clearDeletedIdsRegistry === 'function') window._clearDeletedIdsRegistry();
      const stEl = $('#st');
      if(stEl) stEl.textContent = '⏳ Đang quét và phân tích file khổng lồ... (Vui lòng không tắt máy)';
      
      // Xử lý file siêu lớn (> 256MB) bằng kỹ thuật chia cắt Blob (Zero-RAM Parsing)
      if(file.size > 150 * 1024 * 1024) { 
        alert('File sao lưu của bạn rất lớn (' + (file.size/1024/1024).toFixed(1) + ' MB). Hệ thống đang dùng thuật toán cắt lớp đặc biệt. Quá trình này có thể mất 1-3 phút, vui lòng giữ màn hình sáng!');
        
        const CHUNK_SIZE = 5 * 1024 * 1024;
        let offset = 0;
        let depth = 0;
        let inString = false;
        let escapeNext = false;
        
        let currentSectionName = '';
        let sectionStartOffset = -1;
        
        const sections = {};
        let keyBuffer = [];
        
        while(offset < file.size) {
          const chunk = file.slice(offset, offset + CHUNK_SIZE);
          const buf = await chunk.arrayBuffer();
          const bytes = new Uint8Array(buf);
          
          for(let i=0; i<bytes.length; i++){
            const b = bytes[i];
            
            if(escapeNext) {
              escapeNext = false;
              continue;
            }
            
            if(b === 92) { // '\'
              escapeNext = true;
              continue;
            }
            
            if(b === 34) { // '"'
              inString = !inString;
              if(depth === 2 && !inString && keyBuffer.length > 0) {
                 currentSectionName = new TextDecoder().decode(new Uint8Array(keyBuffer));
                 keyBuffer = [];
              }
              continue;
            }
            
            if(inString) {
              if(depth === 2) {
                 // Đang thu thập tên section (ví dụ "luyende")
                 keyBuffer.push(b);
              }
              continue;
            }
            
            if(b === 123) { // '{'
              depth++;
              if(depth === 3 && currentSectionName) {
                sectionStartOffset = offset + i; // Bao gồm cả dấu '{'
              }
            } else if(b === 125) { // '}'
              if(depth === 3 && currentSectionName && sectionStartOffset !== -1) {
                const sectionEndOffset = offset + i + 1; // Bao gồm cả dấu '}'
                sections[currentSectionName] = { start: sectionStartOffset, end: sectionEndOffset };
                currentSectionName = '';
                sectionStartOffset = -1;
              }
              depth--;
            }
          }
          offset += CHUNK_SIZE;
        }
        
        const secKeys = Object.keys(sections);
        if(secKeys.length === 0) throw new Error('Không tìm thấy cấu trúc dữ liệu!');
        
        for (const secName of secKeys) {
          const s = sections[secName];
          const secBlob = file.slice(s.start, s.end);
          const secText = await secBlob.text();
          const secData = JSON.parse(secText);
          
          SEC_DBS[secName] = normalizeSecData(secData);
          SEC_DBS[secName]._ts = Date.now();
          if(typeof window._saveLightCopyToLocalStorage === 'function'){
            window._saveLightCopyToLocalStorage(SEC_CFG[secName].lsKey, SEC_DBS[secName]);
          }
          if(typeof window._saveToIDB === 'function') await window._saveToIDB(SEC_DBS[secName], SEC_CFG[secName].idbKey);
        }
        
        D = SEC_DBS[ACTIVE_SEC];
        if(typeof window.markMistakesDirty === 'function') window.markMistakesDirty();
        V = {view: 'stats'}; SF = ''; SC = '';
        if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
        if(stEl) stEl.textContent = '';
        render();
        alert('✅ Đã khôi phục thành công dữ liệu siêu lớn (hơn ' + (file.size/1024/1024).toFixed(0) + ' MB)!');
        return;
      }
      
      // Xử lý file < 150MB bình thường (nhanh hơn)
      const imported = await new Response(file).json();
      
      // Trường hợp 1: File sao lưu trọn bộ cả 4 Phần
      if(imported && imported.multiSectionBackup && imported.sections){
        for(const k of ['luyende', 'toan', 'ly', 'van']){
          if(imported.sections[k]){
            SEC_DBS[k] = normalizeSecData(imported.sections[k]);
            SEC_DBS[k]._ts = Date.now();
            if(typeof window._saveLightCopyToLocalStorage === 'function'){
              window._saveLightCopyToLocalStorage(SEC_CFG[k].lsKey, SEC_DBS[k]);
            }
            if(typeof window._saveToIDB === 'function') await window._saveToIDB(SEC_DBS[k], SEC_CFG[k].idbKey);
          }
        }
        D = SEC_DBS[ACTIVE_SEC];
        if(typeof window.markMistakesDirty === 'function') window.markMistakesDirty();
        V = {view: 'stats'}; SF = ''; SC = '';
        if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
        if(stEl) stEl.textContent = '';
        render();
        alert('✅ Đã khôi phục thành công toàn bộ dữ liệu của cả 4 Phần (Luyện đề, Toán, Lý, Văn)!');
        return;
      }
      
      // Trường hợp 2: File sao lưu 1 phần
      if(!imported || !imported.weeks || !imported.hist) throw new Error('Invalid');
      const norm = normalizeSecData(imported);
      norm._ts = Date.now();
      SEC_DBS[ACTIVE_SEC] = norm;
      D = SEC_DBS[ACTIVE_SEC];
      if(typeof window.markMistakesDirty === 'function') window.markMistakesDirty();
      V = {view: 'stats'}; SF = ''; SC = '';
      if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      else save();
      if(stEl) stEl.textContent = '';
      render();
      alert(`✅ Đã khôi phục dữ liệu thành công vào phần "${SEC_CFG[ACTIVE_SEC].title}"!`);
    } catch(err) {
      alert('❌ Lỗi khôi phục: File không hợp lệ hoặc bộ nhớ máy đã đầy. Chi tiết: ' + err.message);
      const stEl = $('#st');
      if(stEl) stEl.textContent = '';
    }
  };

      cur = D.weeks.find(x => x.id === cur.pid);
    }
    return set;

  // Đếm tổng số bài thi trong thư mục và toàn bộ thư mục con của nó
  function getSubtreeExamCount(folderId){

    let total = 0;
    for(const w of (D.weeks || [])){
      if(ids.has(w.id)) total += (w.exams?.length || 0);

  function matchesTreeSearch(w, qNorm){

    if(String(w.name || '').toLowerCase().includes(qNorm)) return true;

    const isExpanded = !!(qNorm || EXP_FOLDERS.has(w.id) || (activeAncestors && activeAncestors.has(w.id)));

    const directExams = w.exams?.length || 0;
    const totalExams = hasKids ? getSubtreeExamCount(w.id) : directExams;

      ? (totalExams > 0 ? `${totalExams}` : `${ch.length} mục`)

  // - Nếu đang đứng sẵn ở chính thư mục đó mà bấm lần nữa -> Đóng/Mở nhánh con của nó!
  const origWeekAct = act.week;

      }

  const origNf2 = act.nf2;

  Object.assign(act, {

    tgl_folder_tree(d){

      const body = document.getElementById('TFOLD_' + fid);

      if(!body) return;
      const isCurrentlyCollapsed = body.classList.contains('is-collapsed');
      const nextCollapsed = !isCurrentlyCollapsed;

      if(nextCollapsed) EXP_FOLDERS.delete(fid);
      else EXP_FOLDERS.add(fid);
      saveExpFolders();

      btn?.classList.toggle('collapsed', nextCollapsed);

          body.style.overflow = 'hidden';
          const anim = body.animate([
            {height: h + 'px', opacity: 1},
            {height: '0px', opacity: 0}
          ], {duration: 220, easing: 'cubic-bezier(0.22, 1, 0.36, 1)'});

  // --- PHẦN 1: BỘ DỌN SẠCH KÝ HIỆU THỪA & CHUYỂN ĐỔI MARKDOWN SANG HTML SẠCH ĐẸP ---
  function sanitizeLookupInput(raw){
    let s = String(raw ?? '');
    // Loại bỏ ký tự lỗi Unicode (), zero-width spaces, control chars
    s = s.replace(/[\uFFFD\u200B-\u200D\uFEFF]/g, '');

  function renderCleanMarkdown(rawText){

      if(/^([-*_])\1{2,}$/.test(line)) continue;

      // 1. Tiêu đề Markdown: ### 1. Dịch nghĩa... hoặc ## ...
      const hMatch = line.match(/^#{1,6}\s*(.+)$/);

      const boldHdMatch = line.match(/^\*\*(\d+[\.\)]\s*[^\*]+?)\*\*:?\s*$/);

        out.push(`<div class="ai-sec-hd">${formatInlineClean(boldHdMatch[1])}</div>`);

      const bulletMatch = line.match(/^(?:[\*\-•\+]|\d+[\.\)])\s+(.+)$/);
      if(bulletMatch){
        const body = bulletMatch[1].trim();
        // Nếu là mục con (có thụt đầu dòng ở dòng gốc)

  const origParseRichText = parseRichText;

  const POS_VI_MAP = {
