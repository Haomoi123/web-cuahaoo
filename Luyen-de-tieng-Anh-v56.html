/* === BẢN NÂNG CẤP V48: KHO LƯU TRỮ FILE VĨNH VIỄN TRONG WEB + TRÌNH ĐỌC PDF TRỰC TIẾP TRÊN WEB BẰNG CANVAS (KHÔNG CẦN FILE TRÊN MÁY) === */
(function(){
  const VAULT_DB_NAME = 'luyende_file_vault_v47_idb';
  const VAULT_STORE = 'files';
  let _vaultDbPromise = null;
  const _memFileVault = new Map();

  function normFileKey(name){
    return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function hasValidFileData(f){
    if(!f || typeof f !== 'object') return false;
    return !!((f.dataUrl && f.dataUrl.length > 80) || (f.htmlPreview && f.htmlPreview.length > 0) || (f.textPreview && f.textPreview.length > 0));
  }
  window._hasValidFileData = hasValidFileData;

  function openVaultIDB(){
    if(_vaultDbPromise) return _vaultDbPromise;
    _vaultDbPromise = new Promise((res, rej) => {
      if(!('indexedDB' in window)){ _vaultDbPromise = null; return rej(new Error('No IDB')); }
      const req = indexedDB.open(VAULT_DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(VAULT_STORE)) db.createObjectStore(VAULT_STORE);
      };
      req.onsuccess = e => {
        const db = e.target.result;
        db.onclose = () => { _vaultDbPromise = null; };
        res(db);
      };
      req.onerror = e => { _vaultDbPromise = null; rej(req.error); };
    });
    return _vaultDbPromise;
  }

  function cacheFileInRam(f){
    if(!hasValidFileData(f)) return;
    const entry = {
      id: f.id || '',
      name: f.name || f.title || '',
      title: f.title || f.name || '',
      mime: f.mime || '',
      ext: f.ext || '',
      size: f.size || 0,
      dataUrl: f.dataUrl || '',
      htmlPreview: f.htmlPreview || '',
      textPreview: f.textPreview || '',
      ts: Date.now()
    };
    if(f.id) _memFileVault.set('id:' + f.id, entry);
    const nk = normFileKey(f.name || f.title);
    if(nk) _memFileVault.set('nm:' + nk, entry);
    const nkNoExt = normFileKey(String(f.name || f.title || '').replace(/\.[^.]+$/, ''));
    if(nkNoExt) _memFileVault.set('title:' + nkNoExt, entry);
    return entry;
  }

  // Hàm đồng bộ tức thì từ RAM trước khi lưu xuống IndexedDB để không bao giờ ghi đè mất dataUrl
  window._restoreMissingDataUrlsFromMemory = function(dbObj){
    if(!dbObj || !Array.isArray(dbObj.weeks)) return;
    const checkAndRestore = f => {
      if(!f || typeof f !== 'object') return;
      if(hasValidFileData(f)){
        cacheFileInRam(f);
      } else {
        const nk = normFileKey(f.name || f.title);
        const nkNoExt = normFileKey(String(f.name || f.title || '').replace(/\.[^.]+$/, ''));
        const cached = (f.id && _memFileVault.get('id:' + f.id)) ||
                       (nk && _memFileVault.get('nm:' + nk)) ||
                       (nkNoExt && _memFileVault.get('title:' + nkNoExt));
        if(cached && hasValidFileData(cached)){
          if(!f.dataUrl && cached.dataUrl) f.dataUrl = cached.dataUrl;
          if(!f.htmlPreview && cached.htmlPreview) f.htmlPreview = cached.htmlPreview;
          if(!f.textPreview && cached.textPreview) f.textPreview = cached.textPreview;
          if(!f.size && cached.size) f.size = cached.size;
          if(!f.mime && cached.mime) f.mime = cached.mime;
        }
      }
    };
    for(const w of dbObj.weeks){
      if(!w) continue;
      for(const f of (w.files || [])) checkAndRestore(f);
      for(const ex of (w.exams || [])){
        if(!ex) continue;
        for(const f of (ex.files || [])) checkAndRestore(f);
      }
    }
  };

  async function saveFileToVault(f){
    const entry = cacheFileInRam(f);
    if(!entry) return;
    try {
      const db = await openVaultIDB();
      await new Promise((res) => {
        const tx = db.transaction(VAULT_STORE, 'readwrite');
        const st = tx.objectStore(VAULT_STORE);
        if(entry.id) st.put(entry, 'id:' + entry.id);
        const nk = normFileKey(entry.name || entry.title);
        if(nk) st.put(entry, 'nm:' + nk);
        const nkNoExt = normFileKey(String(entry.name || entry.title || '').replace(/\.[^.]+$/, ''));
        if(nkNoExt) st.put(entry, 'title:' + nkNoExt);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      });
    } catch(e){}
  }
  window._saveFileToVault = saveFileToVault;

  async function getFileFromVault(f){
    if(!f) return null;
    const idKey = f.id ? ('id:' + f.id) : '';
    const nk = normFileKey(f.name || f.title);
    const nmKey = nk ? ('nm:' + nk) : '';
    const nkNoExt = normFileKey(String(f.name || f.title || '').replace(/\.[^.]+$/, ''));
    const titleKey = nkNoExt ? ('title:' + nkNoExt) : '';

    if(idKey && _memFileVault.has(idKey)) return _memFileVault.get(idKey);
    if(nmKey && _memFileVault.has(nmKey)) return _memFileVault.get(nmKey);
    if(titleKey && _memFileVault.has(titleKey)) return _memFileVault.get(titleKey);

    try {
      const db = await openVaultIDB();
      const readKey = k => new Promise(res => {
        if(!k) return res(null);
        const tx = db.transaction(VAULT_STORE, 'readonly');
        const req = tx.objectStore(VAULT_STORE).get(k);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      });
      let found = idKey ? await readKey(idKey) : null;
      if(!hasValidFileData(found) && nmKey) found = await readKey(nmKey);
      if(!hasValidFileData(found) && titleKey) found = await readKey(titleKey);
      if(hasValidFileData(found)){
        cacheFileInRam(found);
        return found;
      }
    } catch(e){}
    return null;
  }
  window._getFileFromVault = getFileFromVault;

  async function hydrateSectionFromVault(secDb, idbKey){
    if(!secDb || typeof secDb !== 'object') return false;
    let changed = false;
    const refs = [];
    for(const w of (secDb.weeks || [])){
      if(!w) continue;
      for(const f of (w.files || [])) if(f) refs.push(f);
      for(const ex of (w.exams || [])){
        if(!ex) continue;
        for(const f of (ex.files || [])) if(f) refs.push(f);
      }
    }
    for(const tr of (secDb.trash || [])){
      const p = tr?.payload;
      if(!p) continue;
      if(tr.type === 'file' && p.file) refs.push(p.file);
      if(tr.type === 'exam' && p.exam?.files) refs.push(...p.exam.files);
      if(tr.type === 'folder' && p.folders){
        for(const fw of p.folders){
          if(fw?.files) refs.push(...fw.files);
          for(const fex of (fw?.exams || [])){
            if(fex?.files) refs.push(...fex.files);
          }
        }
      }
    }

    for(const f of refs){
      if(hasValidFileData(f)){
        await saveFileToVault(f);
      }
    }
    for(const f of refs){
      if(!hasValidFileData(f)){
        const cached = await getFileFromVault(f);
        if(cached && hasValidFileData(cached)){
          if(!f.dataUrl && cached.dataUrl) f.dataUrl = cached.dataUrl;
          if(!f.htmlPreview && cached.htmlPreview) f.htmlPreview = cached.htmlPreview;
          if(!f.textPreview && cached.textPreview) f.textPreview = cached.textPreview;
          if(!f.size && cached.size) f.size = cached.size;
          if(!f.mime && cached.mime) f.mime = cached.mime;
          changed = true;
        }
      }
    }
    if(changed && idbKey && typeof window._saveToIDB === 'function'){
      await window._saveToIDB(secDb, idbKey);
    }
    return changed;
  }
  window._hydrateSectionFromVault = hydrateSectionFromVault;

  // Chuyển đổi DataURL sang Uint8Array và Blob nhị phân chuẩn xác
  function dataUrlToUint8AndBlob(dataUrl, fallbackMime){
    try {
      const str = String(dataUrl || '');
      const commaIdx = str.indexOf(',');
      if(commaIdx === -1) return null;
      const header = str.slice(0, commaIdx);
      const b64 = str.slice(commaIdx + 1).replace(/\s+/g, '');
      if(!b64) return null;
      const mimeMatch = header.match(/data:([^;,]+)/i);
      const mime = fallbackMime || (mimeMatch ? mimeMatch[1] : 'application/pdf');
      const bstr = atob(b64);
      const n = bstr.length;
      if(!n) return null;
      const u8 = new Uint8Array(n);
      for(let i = 0; i < n; i++) u8[i] = bstr.charCodeAt(i);
      return { u8, blob: new Blob([u8], {type: mime}), mime };
    } catch(e){
      return null;
    }
  }

  // =========================================================================
  // TRÌNH ĐỌC PDF TRỰC TIẾP TRÊN WEB BẰNG CANVAS (PDF.JS) - KHÔNG CẦN FILE TRÊN MÁY, KHÔNG BỊ CHẶN BỞI CHROME
  // =========================================================================
  let _pdfJsPromise = null;
  function loadPdfJsLibrary(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if(_pdfJsPromise) return _pdfJsPromise;
    _pdfJsPromise = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.onload = () => {
        if(window.pdfjsLib){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          res(window.pdfjsLib);
        } else {
          _pdfJsPromise = null;
          rej(new Error('Không tải được PDF.js'));
        }
      };
      sc.onerror = err => {
        _pdfJsPromise = null;
        rej(err);
      };
      document.head.appendChild(sc);
    });
    return _pdfJsPromise;
  }

  let _activePdfRenderTask = 0;
  let _pdfViewMode = localStorage.getItem('luyende_pdf_mode') || 'canvas'; // 'canvas' | 'native'

  async function renderPdfDirectlyOnWebStage(f, stageEl, zoomPct){
    const renderId = ++_activePdfRenderTask;
    const parsed = dataUrlToUint8AndBlob(f.dataUrl, 'application/pdf');
    if(!parsed || !parsed.u8){
      return false;
    }
    const blobUrl = URL.createObjectURL(parsed.blob);
    window._curPdfBlobUrl = blobUrl;

    // Nếu người dùng chọn chế độ Khung PDF gốc của trình duyệt
    if(_pdfViewMode === 'native'){
      stageEl.innerHTML = `
        <div id="fv-pdf-wrap" style="flex:1;width:100%;height:100%;display:flex;flex-direction:column">
          <iframe id="fv-pdf-iframe" src="${blobUrl}#zoom=${zoomPct || 100}&toolbar=1" style="width:100%;height:100%;flex:1;border:0;background:#525659"></iframe>
        </div>
      `;
      return true;
    }

    // Chế độ mặc định ('canvas'): Vẽ trực tiếp từng trang PDF lên thẻ <canvas> ngay trong Web (tương thích 100% mọi trình duyệt & không bao giờ tự tải file)
    stageEl.innerHTML = `
      <div id="fv-pdf-canvas-scroll" style="flex:1;width:100%;height:100%;overflow:auto;background:#525659;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:16px">
        <div id="fv-pdf-loading" style="color:#fff;font-weight:700;padding:30px;text-align:center">
          ⏳ Đang dựng trực tiếp các trang PDF lên màn hình Web...
        </div>
      </div>
    `;
    const scrollBox = document.getElementById('fv-pdf-canvas-scroll');

    try {
      const pdfjsLib = await loadPdfJsLibrary();
      if(renderId !== _activePdfRenderTask) return true;
      const pdfDoc = await pdfjsLib.getDocument({ data: parsed.u8.slice() }).promise;
      if(renderId !== _activePdfRenderTask) return true;

      const totalPages = pdfDoc.numPages;
      const pageBadge = document.getElementById('fv-pdf-page-count');
      if(pageBadge) pageBadge.textContent = `${totalPages} trang`;

      if(scrollBox) scrollBox.innerHTML = '';
      const scale = 1.45 * ((zoomPct || 100) / 100);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      for(let pNum = 1; pNum <= totalPages; pNum++){
        if(renderId !== _activePdfRenderTask) return true;
        const page = await pdfDoc.getPage(pNum);
        const viewport = page.getViewport({ scale });

        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.style.cssText = `background:#fff;box-shadow:0 8px 28px rgba(0,0,0,0.38);border-radius:6px;overflow:hidden;position:relative;max-width:98%;flex:none`;

        const pageTag = document.createElement('div');
        pageTag.style.cssText = 'position:absolute;top:8px;right:10px;background:rgba(15,23,42,0.72);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:2;pointer-events:none';
        pageTag.textContent = `Trang ${pNum} / ${totalPages}`;

        const cv = document.createElement('canvas');
        cv.width = Math.floor(viewport.width * dpr);
        cv.height = Math.floor(viewport.height * dpr);
        cv.style.width = Math.floor(viewport.width) + 'px';
        cv.style.height = Math.floor(viewport.height) + 'px';
        cv.style.display = 'block';
        cv.style.maxWidth = '100%';
        cv.style.height = 'auto';

        pageCard.appendChild(pageTag);
        pageCard.appendChild(cv);
        scrollBox?.appendChild(pageCard);

        const ctx = cv.getContext('2d');
        ctx.scale(dpr, dpr);
        await page.render({ canvasContext: ctx, viewport }).promise;
      }
      return true;
    } catch(err){
      // Fallback sang iframe chuẩn nếu không có kết nối mạng lần đầu để tải thư viện PDF.js
      if(scrollBox){
        scrollBox.style.padding = '0';
        scrollBox.innerHTML = `<iframe id="fv-pdf-iframe" src="${blobUrl}#zoom=${zoomPct || 100}" style="width:100%;height:100%;flex:1;border:0;background:#fff"></iframe>`;
      }
      return true;
    }
  }

  // Hàm nạp 1 hoặc nhiều file từ máy vào thẳng Kho Vĩnh Viễn (File Vault) & tự động khớp tên cho toàn bộ file
  async function importFilesIntoVaultAndHydrate(fileList, targetFileObj){
    if(!fileList || !fileList.length) return false;
    const allFileObjs = [];
    const dbs = window.SEC_DBS ? Object.values(window.SEC_DBS) : [D];
    if(!dbs.includes(D)) dbs.push(D);

    for(const db of dbs){
      for(const w of (db?.weeks || [])){
        for(const wf of (w?.files || [])) if(wf) allFileObjs.push(wf);
        for(const ex of (w?.exams || [])){
          for(const ef of (ex?.files || [])) if(ef) allFileObjs.push(ef);
        }
      }
    }

    let matchedTarget = false;
    for(const rawFile of fileList){
      const ext = (rawFile.name?.includes('.') ? rawFile.name.split('.').pop() : '').toLowerCase();
      const dUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(rawFile);
      });
      const rawKey = normFileKey(rawFile.name);
      const rawKeyNoExt = normFileKey(rawFile.name.replace(/\.[^.]+$/, ''));

      for(const item of allFileObjs){
        const itemKey = normFileKey(item.name || item.title);
        const itemKeyNoExt = normFileKey(String(item.name || item.title || '').replace(/\.[^.]+$/, ''));
        if(itemKey === rawKey || (rawKeyNoExt && itemKeyNoExt === rawKeyNoExt)){
          item.dataUrl = dUrl;
          item.size = rawFile.size || item.size;
          item.mime = rawFile.type || (ext === 'pdf' ? 'application/pdf' : item.mime);
          if(ext) item.ext = ext;
          await saveFileToVault(item);
          if(targetFileObj && (item === targetFileObj || item.id === targetFileObj.id)){
            matchedTarget = true;
          }
        }
      }

      if(targetFileObj && fileList.length === 1 && !matchedTarget){
        targetFileObj.dataUrl = dUrl;
        targetFileObj.size = rawFile.size || targetFileObj.size;
        targetFileObj.mime = rawFile.type || (ext === 'pdf' ? 'application/pdf' : targetFileObj.mime);
        if(ext) targetFileObj.ext = ext;
        await saveFileToVault(targetFileObj);
        matchedTarget = true;
      }
    }

    save();
    if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
    if(window.SEC_DBS && window.SEC_CFG){
      for(const [k, cfg] of Object.entries(window.SEC_CFG)){
        if(window.SEC_DBS[k] && typeof window._saveToIDB === 'function'){
          await window._saveToIDB(window.SEC_DBS[k], cfg.idbKey);
        }
      }
    }
    return true;
  }

  // Ghi đè Trình Xem Tài Liệu (_renderEnhancedFileViewer)
  const origRenderViewer46 = window._renderEnhancedFileViewer;
  window._renderEnhancedFileViewer = async function(f, allowBackToManager){
    if(!f) return;
    window._curViewFile = f;
    window._curViewAllowBack = !!allowBackToManager;

    // 1. Tự động khôi phục từ File Vault nếu f.dataUrl đang trống
    if(!hasValidFileData(f)){
      const recovered = await getFileFromVault(f);
      if(recovered && hasValidFileData(recovered)){
        f.dataUrl = recovered.dataUrl || f.dataUrl || '';
        f.htmlPreview = recovered.htmlPreview || f.htmlPreview || '';
        f.textPreview = recovered.textPreview || f.textPreview || '';
        if(!f.size && recovered.size) f.size = recovered.size;
        if(!f.mime && recovered.mime) f.mime = recovered.mime;
        save();
        if(typeof window.flushSaveNow === 'function') window.flushSaveNow(true);
      }
    } else {
      await saveFileToVault(f);
    }

    // 2. Vẽ khung cửa sổ trình xem
    origRenderViewer46(f, allowBackToManager);

    const ext = (f.ext || (f.name?.includes('.') ? f.name.split('.').pop() : '') || '').toLowerCase();
    const isPdf = ext === 'pdf' || f.mime === 'application/pdf' || (f.dataUrl || '').startsWith('data:application/pdf');

    // Luôn đảm bảo có nút "⬇ Tải file về máy" trên góc phải
    const topRow = document.querySelector('#fv-box > .hd > .row');
    if(topRow){
      let dlBtn = topRow.querySelector('[data-a="fv_dl"]');
      if(!dlBtn){
        const closeBtn = topRow.querySelector('[data-a="fv_close"]');
        const dlBtnHtml = `<button class="gh" style="padding:5px 10px;font-size:12.5px;border-color:var(--ok);color:var(--ok);font-weight:700" data-a="fv_dl">⬇ Tải file gốc</button>`;
        if(closeBtn) closeBtn.insertAdjacentHTML('beforebegin', dlBtnHtml);
        else topRow.insertAdjacentHTML('beforeend', dlBtnHtml);
      }
    }

    // 3. Nếu là PDF và đã có dữ liệu trong Web: Hiển thị trực tiếp bằng Canvas PDF.js (hoặc khung PDF gốc)
    if(isPdf && hasValidFileData(f)){
      const toolbarFirstGrp = document.querySelector('#fv-box .fv-toolbar .fv-grp');
      if(toolbarFirstGrp && !document.getElementById('fv-pdf-mode-btn')){
        toolbarFirstGrp.insertAdjacentHTML('beforeend', `
          <span class="f-cat-tag" id="fv-pdf-page-count" style="margin-left:4px">PDF</span>
          <button type="button" class="fv-btn ${_pdfViewMode === 'canvas' ? 'on' : ''}" id="fv-pdf-mode-btn" data-a="fv_toggle_pdf_mode" title="Chuyển đổi giữa Xem trang trực tiếp trên Web (Canvas) và Khung PDF trình duyệt">
            ${_pdfViewMode === 'canvas' ? '📖 Chế độ: Xem Trang Trực Tiếp' : '📕 Chế độ: Khung Trình Duyệt'}
          </button>
        `);
      }
      const stage = document.getElementById('fv-stage');
      const z = +(localStorage.getItem('luyende_fv_zoom') || 100);
      if(stage){
        await renderPdfDirectlyOnWebStage(f, stage, z);
      }
      return;
    }

    // 4. Nếu file từ phiên bản cũ bị mất dữ liệu nhị phân (0 B): Hiện hộp Khôi phục 1 lần vào Bộ nhớ Vĩnh viễn của Web
    if(!hasValidFileData(f)){
      const stage = document.getElementById('fv-stage');
      if(stage){
        stage.innerHTML = `
          <div class="doc-viewer" id="fv-reattach-dropzone" style="text-align:center;padding:34px 22px;border:2px dashed var(--pr);border-radius:14px;margin:14px;background:color-mix(in srgb, var(--hl) 32%, var(--cd));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
            <div style="font-size:44px;line-height:1">📕</div>
            <h3 style="margin:0;font-size:18px;color:var(--tx)">${esc(f.name || f.title)}</h3>
            <div style="background:var(--nob);color:var(--no);padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700">
              ⚠️ File này được tải lên từ phiên bản cũ nên chỉ còn lưu tên file (0 B), chưa có ruột file trong trình duyệt.
            </div>
            <p class="mu" style="max-width:600px;margin:0;font-size:14px;line-height:1.6">
              Bạn chỉ cần bấm nút bên dưới để <b>nạp lại file này đúng 1 lần duy nhất</b> vào <b>Kho Lưu Trữ Vĩnh Viễn của Web (V48)</b>. Ngay sau khi nạp xong, toàn bộ các trang tài liệu sẽ được lưu cứng bên trong trình duyệt — <b>bạn có thể xóa hẳn file trên máy tính mà vẫn mở xem trực tiếp trên web và tải về máy đầy đủ dung lượng bất cứ lúc nào!</b>
            </p>
            <div class="row" style="justify-content:center;margin-top:6px">
              <label class="btn" style="background:linear-gradient(135deg, var(--pr), var(--pr2));color:#fff;border:0;padding:11px 22px;font-weight:700;font-size:14px;box-shadow:0 4px 14px var(--pr-glow);cursor:pointer">
                📤 Chọn File từ máy để Lưu Vĩnh Viễn vào Web & Xem Trực Tiếp Ngay
                <input type="file" id="fv-reattach-inp" accept=".pdf,.doc,.docx,.txt,.md,.html,image/*" multiple hidden>
              </label>
            </div>
            <small class="mu">💡 Bạn có thể bôi chọn <b>nhiều file PDF cùng lúc</b> (ví dụ chọn cả 2 file TDMXX23_FGC và TDMXX23_ĐTL), hệ thống sẽ tự động khớp tên và lưu vĩnh viễn toàn bộ!</small>
          </div>
        `;

        const onFilesPicked = async (files) => {
          if(!files || !files.length) return;
          const dz = document.getElementById('fv-reattach-dropzone');
          if(dz) dz.innerHTML = `<div style="padding:40px;font-weight:700;color:var(--pr)">⏳ Đang lưu vĩnh viễn ruột file vào bộ nhớ Web và dựng trang...</div>`;
          await importFilesIntoVaultAndHydrate(files, f);
          render();
          window._renderEnhancedFileViewer(f, allowBackToManager);
          if(window.SFX) window.SFX.ding();
        };

        document.getElementById('fv-reattach-inp')?.addEventListener('change', e => onFilesPicked(e.target.files));
        const dz = document.getElementById('fv-reattach-dropzone');
        if(dz){
          dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = 'var(--ok)'; });
          dz.addEventListener('drop', e => { e.preventDefault(); onFilesPicked(e.dataTransfer?.files); });
        }
      }
    }
  };

  // Hiển thị nhãn trạng thái trực quan ("✅ Xem trực tiếp trên Web" hoặc "⚠️ Cần nạp lại 1 lần") trên danh sách file của thư mục
  const origRenderWeek47 = renderWeek;
  renderWeek = function(m){
    origRenderWeek47(m);
    const w = D.weeks[V.wi];
    if(!w || !Array.isArray(w.files) || !w.files.length) return;
    const pg = m.querySelector('.pg');
    if(!pg) return;
    pg.querySelectorAll('button[data-a="viewf_w"]').forEach(btn => {
      const fi = +btn.dataset.fi;
      const f = w.files[fi];
      if(!f) return;
      const card = btn.closest('.card');
      const infoDiv = card?.querySelector('div:first-child');
      if(infoDiv && !infoDiv.querySelector('.web-vault-status')){
        const ok = hasValidFileData(f);
        infoDiv.insertAdjacentHTML('beforeend', ok
          ? `<span class="web-vault-status" style="display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--ok);background:var(--okb);padding:1px 8px;border-radius:999px">✅ Đã lưu trong Web (Xem & Tải trực tiếp)</span>`
          : `<span class="web-vault-status" style="display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--no);background:var(--nob);padding:1px 8px;border-radius:999px;cursor:pointer" data-a="viewf_w" data-fi="${fi}">⚠️ Thiếu ruột file từ bản cũ — Bấm để nạp 1 lần vào Web</span>`
        );
      }
    });
  };

  // Nâng cấp Tải file (dlf_w, fm_dl, fv_dl) & Thu phóng PDF trực tiếp
  async function smartDownloadFileV48(f){
    if(!f) return;
    if(f.url && !f.dataUrl){ window.open(f.url, '_blank'); return; }
    if(!hasValidFileData(f)){
      const recovered = await getFileFromVault(f);
      if(recovered && hasValidFileData(recovered)){
        f.dataUrl = recovered.dataUrl || '';
        f.htmlPreview = recovered.htmlPreview || '';
        f.textPreview = recovered.textPreview || '';
        if(!f.size && recovered.size) f.size = recovered.size;
      }
    }
    if(!hasValidFileData(f)){
      window._renderEnhancedFileViewer(f, false);
      return;
    }

    const ext = (f.ext || (f.name?.includes('.') ? f.name.split('.').pop() : '') || '').toLowerCase();
    let blob = null;
    if(f.dataUrl && f.dataUrl.length > 80){
      const defMime = ext === 'pdf' ? 'application/pdf' : (f.mime || 'application/octet-stream');
      const parsed = dataUrlToUint8AndBlob(f.dataUrl, defMime);
      if(parsed) blob = parsed.blob;
    } else {
      blob = new Blob([f.textPreview || f.htmlPreview || ''], {type: 'text/plain;charset=utf-8'});
    }
    if(!blob || blob.size === 0){
      window._renderEnhancedFileViewer(f, false);
      return;
    }

    const bUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = bUrl;
    a.download = f.name || ((f.title || 'tai-lieu') + (ext ? '.' + ext : '.pdf'));
    document.body.appendChild(a);
    a.click();
    if(window.SFX) window.SFX.ding();
    setTimeout(() => {
      a.remove();
      try { URL.revokeObjectURL(bUrl); } catch(e){}
    }, 45000);
  }

  Object.assign(act, {
    dlf_w(d){ smartDownloadFileV48(D.weeks[V.wi]?.files?.[+d.fi]); },
    fm_dl(d){
      const files = window._getCtxFiles ? window._getCtxFiles() : [];
      smartDownloadFileV48(files[+d.fi]);
    },
    fv_dl(){ smartDownloadFileV48(window._curViewFile); },
    fv_toggle_pdf_mode(){
      _pdfViewMode = (_pdfViewMode === 'canvas') ? 'native' : 'canvas';
      localStorage.setItem('luyende_pdf_mode', _pdfViewMode);
      if(window._curViewFile){
        window._renderEnhancedFileViewer(window._curViewFile, !!window._curViewAllowBack);
      }
    },
    fv_pdf_fit(){
      if(window._curViewFile){
        const stage = document.getElementById('fv-stage');
        const z = +(localStorage.getItem('luyende_fv_zoom') || 100);
        if(stage) renderPdfDirectlyOnWebStage(window._curViewFile, stage, z);
      }
    },
    async fv_newtab(){
      const f = window._curViewFile;
      if(!f) return;
      if(!hasValidFileData(f)){
        const recovered = await getFileFromVault(f);
        if(recovered && hasValidFileData(recovered)) f.dataUrl = recovered.dataUrl || '';
      }
      if(f.dataUrl && f.dataUrl.length > 80){
        const ext = (f.ext || (f.name?.includes('.') ? f.name.split('.').pop() : '') || '').toLowerCase();
        const parsed = dataUrlToUint8AndBlob(f.dataUrl, ext === 'pdf' ? 'application/pdf' : (f.mime || 'application/pdf'));
        if(parsed && parsed.blob){
          window.open(URL.createObjectURL(parsed.blob), '_blank');
          return;
        }
      }
      if(f.url){ window.open(f.url, '_blank'); return; }
      window._renderEnhancedFileViewer(f, !!window._curViewAllowBack);
    }
  });
})();

  // Khởi tạo nút Menu di động ngay đầu thanh #top-sec-nav và lớp phủ đóng/mở Drawer
  let backdrop = document.getElementById('mobile-backdrop');
  if(!backdrop){
    backdrop = document.createElement('div');
    backdrop.id = 'mobile-backdrop';
    document.body.appendChild(backdrop);
  }

  function setMobileMenuOpen(open){
    const next = open !== undefined ? !!open : !document.body.classList.contains('mobile-menu-open');
    document.body.classList.toggle('mobile-menu-open', next);
  }
  window._setMobileMenuOpen = setMobileMenuOpen;

  backdrop.addEventListener('click', () => setMobileMenuOpen(false));

  function injectMobileControls(){
    // 1. Gắn nút '☰ Menu' vào đầu thanh #top-sec-nav để không bị bất kỳ nút nổi nào của trình duyệt che khuất
    const topNav = document.getElementById('top-sec-nav');
    if(topNav && !document.getElementById('mobile-menu-btn')){
      const btn = document.createElement('button');
      btn.id = 'mobile-menu-btn';
      btn.type = 'button';
      btn.title = 'Mở danh sách Thư mục, Sổ tay câu sai & Cài đặt';
      btn.innerHTML = '☰ Menu';
      btn.addEventListener('click', e => {
        e.stopPropagation();
        setMobileMenuOpen();
      });
      topNav.insertBefore(btn, topNav.firstChild);
    }

    // 2. Gắn nút '✕ Đóng' vào góc phải tiêu đề trong Sidebar Drawer trên điện thoại
    const side = document.getElementById('side');
    if(side){
      const h2 = side.querySelector('h2');
      if(h2 && !document.getElementById('mobile-side-close')){
        const closeBtn = document.createElement('button');
        closeBtn.id = 'mobile-side-close';
        closeBtn.type = 'button';
        closeBtn.className = 'gh';
        closeBtn.innerHTML = '✕ Đóng';
        closeBtn.addEventListener('click', e => {
          e.stopPropagation();
          setMobileMenuOpen(false);
        });
        h2.appendChild(closeBtn);
      }
    }
  }

  // Bọc hàm render() để luôn duy trì nút Menu di động
  const origRender48 = render;
  render = function(){
    origRender48();
    injectMobileControls();
  };
  injectMobileControls();

  // Tự động đóng ngăn kéo Menu di động sau khi người dùng chọn thư mục, môn học hoặc mục thống kê
  document.addEventListener('click', e => {
    const navTarget = e.target.closest?.('[data-a]');
    if(!navTarget) return;
    const a = navTarget.dataset.a;
    const autoCloseActions = [
      'week', 'stats', 'mistakes', 'trash', 'streak_view',
      'switch_sec', 'sc', 'sf', 'resume_saved', 'cfg',
      'theme_modal', 'vset', 'sfx_modal', 'pt_modal', 'bgm_modal', 'aiset', 'expd'
    ];
    if(autoCloseActions.includes(a) && document.body.classList.contains('mobile-menu-open')){
      setMobileMenuOpen(false);
    }
  });
})();

render();
