<body><div id="app"><aside id="side"></aside><main id="main"></main></div><div id="modal"></div><div id="pop"><button data-a="tr">🌐 Dịch</button><button data-a="tts">🔊 Nghe Anh</button><button data-a="ttsvi">🔊 Đọc dịch</button><button id="p-hlc" data-a="hlc">🖍 Highlight</button><button id="p-hln" data-a="hln">📝 Ghi chú</button></div>
<script>
let D={weeks:[],hist:[],cats:[]},V={view:'stats'},IM=[],TI;
try{D=JSON.parse(localStorage.getItem('luyende1'))||D}catch(e){}
// Tự động ngắt dòng cho câu hỏi sắp xếp và tự động tô đậm/in nghiêng từ khóa mục tiêu
function fmtArrangeText(str){
  if(!str) return '';
  let s = String(str).replace(/^(?:Câu\s*\d+[\.:]\s*)?(?:Question\s*\d+[\.:]\s*)/i, '');
  if(/\([a-b]\)/i.test(s)){
    s = s.replace(/\s+(\([a-g]\)\s)/gi, '\n$1');
    s = s.replace(/\s+(Best regards,|Warm regards,|Yours sincerely,|Sincerely,|Love,)/gi, '\n$1');
  }
  // Tự động in đậm từ được hỏi trong mẫu "The word/phrase X in line/paragraph..." nếu chưa được đánh dấu **
  s = s.replace(/\b([Tt]he\s+(?:word|phrase|expression)\s+)(?!\*|_)(["“']?[A-Za-z0-9-]+["”']?)(\s+in\s+(?:line|paragraph|passage)\b)/g, '$1**$2**$3');
  // Tự động in nghiêng từ/cụm từ đồng nghĩa ở cuối câu True/False hoặc từ vựng ("mostly means standard.", "can be best replaced by build up.")
  s = s.replace(/\b(mostly\s+means|can\s+be\s+(?:best\s+)?replaced\s+by)\s+(?!\*|_|____)([A-Za-z0-9][A-Za-z0-9\s-]{0,25}?)(?=[.,;?!]|$)/gi, '$1 *$2*');
  // Tự động làm nổi bật các từ khóa phủ định/trọng tâm viết hoa (NOT, OPPOSITE, CLOSEST)
  s = s.replace(/(^|[^\*A-Za-z])(NOT|OPPOSITE|CLOSEST)(?![\*A-Za-z])/g, '$1**$2**');
  return s.trim();
}

function resolveAnsIndex(ansVal, opts, correctText){
  if(typeof ansVal === 'number' && !isNaN(ansVal)){
    return Math.max(0, Math.min(Math.max(0, opts.length - 1), Math.round(ansVal)));
  }
  const s = String(ansVal ?? correctText ?? '').trim();
  if(/^\d+$/.test(s)){
    return Math.max(0, Math.min(Math.max(0, opts.length - 1), +s));
  }
  const mLet = s.match(/^([a-zA-Z])(?:[\.\)\s]|$)/);
  if(mLet && opts.length > 0){
    const ch = mLet[1].toLowerCase();
    const idx = ch.charCodeAt(0) - 97;
    const exactCol = opts.findIndex(o => String(o).trim().toLowerCase() === s.toLowerCase() || String(o).trim().toLowerCase().startsWith(s.toLowerCase() + ' '));
    if(exactCol >= 0) return exactCol;
    if(idx >= 0 && idx < opts.length) return idx;
  }
  if(s && opts.length > 0){
    const sl = s.toLowerCase();
    const found = opts.findIndex(o => {
      const ol = String(o).trim().toLowerCase();
      return ol === sl || ol.startsWith(sl) || sl.startsWith(ol);
    });
    if(found >= 0) return found;
  }
  return 0;
}

function autoUnderlineParticiplePhrase(qStr){
  if(!qStr) return '';
  let s = String(qStr);
  if(/__[^_]+__|<u>[\s\S]+?<\/u>/i.test(s)) return s;
  return s.replace(/\b((?:[Nn]ot\s+)?[Hh]aving\s+(?:been\s+)?[a-zA-Z]+(?:ed|en|t|d|n|k|g|m|r|w))\b/, '__$1__');
}

function cleanOptsAndType(q){
  const rawOpts=(q.opts||[]).map(x=>String(x??'').trim());
  const nonEmpty=rawOpts.filter(Boolean);
  const rawType=String(q.type||'').trim().toLowerCase();

  // 1. Dạng TRUE / FALSE / NOT GIVEN
  const isTF=rawType==='tf'||(
    rawType!=='classify' && rawType!=='match' &&
    nonEmpty.length>=2&&nonEmpty.length<=3&&
    nonEmpty.every(x=>/^(true|false|not\s*given|t|f|ng|đúng|sai)$/i.test(x))
  );
  if(isTF){
    q.type='tf';
    q.opts=nonEmpty.length>=2?nonEmpty.map(x=>{
      const u=x.toUpperCase();
      if(u==='T'||u==='TRUE')return 'TRUE';
      if(u==='F'||u==='FALSE')return 'FALSE';
      if(u==='NG'||u==='NOT GIVEN')return 'NOT GIVEN';
      return x;
    }):['TRUE','FALSE'];
    q.ans=resolveAnsIndex(q.ans, q.opts, q.correctText);
    q.correctText=q.opts[q.ans]||'';
    return;
  }

  // 2. Dạng BẢNG PHÂN LOẠI CỘT (Classification Table: ví dụ PG vs PP, Active vs Passive...)
  const qStrCheck = String(q.q || '');
  const hasRewriteBlank = /_{3,}|✍️|➜/.test(qStrCheck);
  const looksLikeClassify = !hasRewriteBlank && (
    rawType==='classify' || rawType==='pgpp' || (
      rawType!=='match' && rawType!=='arrange' && rawType!=='fill' &&
      nonEmpty.length>=2 && nonEmpty.length<=3 &&
      nonEmpty.every(x=>x.length <= 35) &&
      nonEmpty.some(x=>/^(pg|pp|perfect\s+gerund|perfect\s+participle)\b/i.test(x))
    )
  );
  if(looksLikeClassify){
    q.type='classify';
    q.opts=nonEmpty.length>=2 ? nonEmpty : ['PG (Perfect Gerund)', 'PP (Perfect Participle)'];
    q.ans=resolveAnsIndex(q.ans, q.opts, q.correctText);
    q.correctText=q.opts[q.ans]||'';
    q.q=autoUnderlineParticiplePhrase(q.q||'');
    return;
  }

  // 3. Dạng GHÉP NỐI 2 CỘT: COLUMN A & COLUMN B (Matching: a, b, c, d, e, f, g, h, i, j...)
  const looksLikeMatch = rawType==='match' || rawType==='matching' || (
    rawType!=='fill' && rawType!=='arrange' && (
      nonEmpty.length > 4 ||
      (nonEmpty.length >= 3 && nonEmpty.every(x => /^[a-z][\.\)]\s+/i.test(x)))
    )
  );
  if(looksLikeMatch){
    q.type='match';
    const op = nonEmpty.length ? nonEmpty.map((x, idx) => {
      const letChar = String.fromCharCode(97 + idx);
      return /^[a-z][\.\)]\s+/i.test(x) ? x : `${letChar}. ${x}`;
    }) : ['a. ', 'b. ', 'c. ', 'd. '];
    q.opts = op;
    q.ans = resolveAnsIndex(q.ans, q.opts, q.correctText);
    q.correctText = q.opts[q.ans] || '';
    return;
  }

  // 4. Các dạng còn lại: fill, arrange, mc
  const hasOpts=nonEmpty.length>0;
  const tp=rawType==='fill'||(!hasOpts&&q.correctText)?'fill':(rawType==='arrange'?'arrange':'mc');
  q.type=tp;
  if(tp==='fill'){
    q.opts=[];
    q.ans=0;
    q.correctText=String(q.correctText||rawOpts[0]||'').trim();
  }else{
    const op=(nonEmpty.length>=2&&nonEmpty.length<4)?nonEmpty:rawOpts.slice(0,4);
    if(!nonEmpty.length){while(op.length<4)op.push('');}
    q.opts=op;
    q.ans=resolveAnsIndex(q.ans, q.opts, q.correctText);
    if(q.correctText===undefined||q.correctText==='') q.correctText=q.opts[q.ans]||'';
  }
}

function autoHighlightPassageWords(g, groupQs){
  if(!g||!g.passage)return;
  let pas=g.passage;
  for(const q of groupQs){
    q.q=fmtArrangeText(q.q||'');
    const m=q.q.match(/\b[Tt]he\s+(?:word|phrase|expression)\s+\*\*["“']?([A-Za-z0-9-]+)["”']?\*\*/);
    if(m&&m[1]){
      const w=m[1];
      const escapedW=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const alreadyMarked=new RegExp('(\\*\\*|__|<b>|<u>)\\s*'+escapedW+'\\s*(\\*\\*|__|</b>|</u>)','i');
      if(!alreadyMarked.test(pas)){
        const wordRe=new RegExp('\\b'+escapedW+'\\b','gi');
        const matches=[...pas.matchAll(wordRe)];
        if(matches.length===1){
          const idx=matches[0].index, found=matches[0][0];
          pas=pas.slice(0,idx)+`**__${found}__**`+pas.slice(idx+found.length);
        }
      }
    }
  }
  g.passage=pas;
}

QUY TẮC BẮT BUỘC VỀ ĐỊNH DẠNG CHỮ TÔ ĐẬM / GẠCH CHÂN / IN NGHIÊNG Y HỆT ẢNH ĐỀ:
- Quan sát kỹ ảnh hoặc văn bản đề thi: bất kỳ từ, cụm từ hoặc câu nào được TÔ ĐẬM, GẠCH CHÂN hoặc IN NGHIÊNG trong bài đọc (passage), câu hỏi (q) hay phương án (opts) thì BẮT BUỘC phải giữ nguyên định dạng y hệt bằng ký hiệu Markdown:
  + Dùng **__từ hoặc câu__** cho phần vừa IN ĐẬM vừa GẠCH CHÂN trong ảnh (ví dụ: từ vựng/đại từ được hỏi trong bài đọc như **__benchmark__**, **__solidify__**, **__blurred__**, **__they__**, **__integral__**, hoặc cả câu được in đậm gạch chân như **__Technology is also changing how we look at rare and ancient objects that are usually kept behind thick glass.__**).
  + Dùng **từ hoặc cụm từ** cho phần IN ĐẬM (ví dụ: trong câu hỏi "The word **benchmark** in line 3...", "The word **they** in line 8...", hoặc từ khóa **NOT**, **OPPOSITE**, **CLOSEST**, **TRUE**, **FALSE**).
  + Dùng *từ hoặc cụm từ* cho phần IN NGHIÊNG (ví dụ: "...mostly means *standard*.", "...can be best replaced by *build up*.").
  + Dùng __từ hoặc cụm từ__ cho phần chỉ GẠCH CHÂN đơn thuần.

QUY TẮC TRÍCH XUẤT CHO TỪNG DẠNG BÀI:
1. DẠNG BÀI TRUE / FALSE (HOẶC TRUE / FALSE / NOT GIVEN):
   - instr: Yêu cầu của bài (ví dụ: "For questions 57-60, read the following passage and determine if each statement is TRUE or FALSE.").
   - passage: Chép ĐẦY ĐỦ toàn bộ bài đọc (giữ nguyên các từ in đậm/gạch chân bằng **__từ__** hoặc **từ**). KHÔNG đặt [[số]] vào bài đọc.
   - questions: Mỗi mệnh đề là 1 phần tử có type="tf", trường "q" là nội dung mệnh đề (giữ nguyên các từ in đậm **...** và in nghiêng *...*), opts=["TRUE", "FALSE"] (chỉ gồm đúng 2 phương án, hoặc 3 nếu đề có "NOT GIVEN"; TUYỆT ĐỐI KHÔNG thêm phương án rỗng C, D), ans=0 nếu TRUE, ans=1 nếu FALSE (ans=2 nếu NOT GIVEN).

2. DẠNG ĐỌC HIỂU TRẢ LỜI CÂU HỎI 4 LỰA CHỌN (Reading Comprehension):
   - instr: Yêu cầu của bài đọc.
   - passage: Chép ĐẦY ĐỦ toàn bộ bài đọc (giữ nguyên chia đoạn bằng \\n\\n và các từ/câu được tô đậm/gạch chân bằng **__...__** hoặc **...**). KHÔNG đặt [[số]] vào bài đọc hiểu nếu không phải chỗ trống điền khuyết.
   - questions: Trường "q" chứa đầy đủ câu hỏi (giữ nguyên từ in đậm **...**), type="mc", opts gồm 4 phương án (không kèm A. B. C. D.), ans là chỉ số 0-3.

3. DẠNG ĐỌC ĐIỀN KHUYẾT (Cloze Test - Trắc nghiệm hoặc Tự luận):
   - passage: Chép đầy đủ đoạn văn, mỗi chỗ trống thay bằng [[số]] theo thứ tự xuất hiện (ví dụ [[1]], [[2]]...).
   - Nếu có 4 đáp án A, B, C, D: type="mc", q="", opts=["...","...","...","..."], ans=0..3.
   - Nếu là bài TỰ LUẬN ĐIỀN TỪ vào chỗ trống (không có A,B,C,D): type="fill", q="", opts=[], correctText="đáp án đúng" (nếu có nhiều đáp án đúng thì ngăn cách bằng dấu /, ví dụ "of / about").

4. DẠNG SẮP XẾP CÂU / HỘI THOẠI / LÁ THƯ (Sentence Arrangement):
   - passage: "".
   - type="arrange", trường "q" ghi lời chào và các câu (a), (b), (c), (d), (e), mỗi câu xuống dòng bằng \\n. opts gồm 4 phương án thứ tự, ans=0..3.

5. DẠNG TỰ LUẬN VIẾT LẠI CÂU (SENTENCE REWRITING) / ĐIỀN TỪ RỜI:
   - Khi đề yêu cầu viết lại câu (ví dụ: "For questions 61-70, rewrite the following sentences using a Perfect Gerund or a Perfect Participle. Ensure the meaning remains the same as the original sentence."):
     + BẮT BUỘC dùng type="fill", opts=[], passage="" (TUYỆT ĐỐI KHÔNG dùng type="classify" cho bài viết lại câu dù đề có chữ Perfect Gerund or Perfect Participle).
     + Trường "q": Dòng 1 ghi câu gốc; sau đó xuống dòng bằng \n và dòng 2 ghi biểu tượng "✍️ " kèm từ gợi ý đầu câu (nếu trong ảnh đề có in sẵn từ gợi ý như "I apologize for", "The man denied", "We really appreciate your", "He regretted", "The suspect was accused of"...) rồi đến " ______". Nếu câu đó không có từ gợi ý đầu câu mà chỉ có dòng kẻ trống thì dòng 2 ghi "✍️ ______".
       Ví dụ 1: "After the students had finished the final presentation in their English class, they felt a great sense of relief.\n✍️ ______"
       Ví dụ 2: "I am really sorry that I did not reply to your urgent email about the meeting yesterday.\n✍️ I apologize for ______"
     + Trường "correctText": Ghi câu viết lại hoàn chỉnh. Nếu câu có từ gợi ý đầu câu (như "I apologize for"), hãy ghi cả câu đầy đủ VÀ phần điền vào chỗ trống ngăn cách bởi dấu " / " (ví dụ: "I apologize for not having replied to your urgent email about the meeting yesterday. / not having replied to your urgent email about the meeting yesterday").

6. DẠNG GHÉP NỐI 2 CỘT: COLUMN A & COLUMN B (Matching Phrases / Sentences - ví dụ: "match the phrase in Column A with the most appropriate phrase in Column B"):
   - instr: Chép đầy đủ câu yêu cầu của bài (ví dụ: "For questions 71-80, match the phrase in Column A with the most appropriate phrase in Column B to create a meaningful sentence. Write your answers in the space provided.").
   - passage: "".
   - questions: Mỗi mục ở Column A (ví dụ câu 71, 72, 73, 74...) là 1 phần tử có:
     + type="match".
     + q: Nội dung mệnh đề ở Column A (không ghi số thứ tự đầu câu; ví dụ: "Having been warned about the heavy rain,").
     + opts: Mảng chứa ĐẦY ĐỦ TẤT CẢ các vế ở Column B theo đúng thứ tự từ a, b, c, d... đến hết bảng (ví dụ: ["a. for having broken his favorite toy yesterday.", "b. we decided to bring extra warm clothes and umbrellas.", "c. after having been selected for the international exchange program.", "d. for not having updated the security software on time."]). BẮT BUỘC giữ tiền tố "a. ", "b. ", "c. ", "d. "... và truyền đầy đủ mảng opts này cho mọi câu trong nhóm.
     + ans: Chỉ số của vế ghép đúng trong mảng opts (0 ứng với a, 1 ứng với b, 2 ứng với c, 3 ứng với d...).
     + exp: Giải thích chi tiết vì sao vế ở Column A ghép với vế đó ở Column B (về cấu trúc ngữ pháp và nghĩa).
     + vi: Bản dịch tiếng Việt của cả câu hoàn chỉnh sau khi ghép.

7. DẠNG BẢNG PHÂN LOẠI / ĐÁNH DẤU CỘT (Classification Table - ví dụ: phân biệt Perfect Gerund (PG) hay Perfect Participle (PP) bằng cách đánh dấu cột PG | PP):
   - instr: Chép đầy đủ yêu cầu của bài (ví dụ: "For questions 1-10, identify whether the underlined phrase is a Perfect Gerund (PG) or a Perfect Participle (PP) by marking the appropriate column.").
   - passage: "".
   - questions: Mỗi dòng câu hỏi trong bảng là 1 phần tử có:
     + type="classify".
     + q: Nội dung câu hỏi (không ghi "Question 1:" ở đầu), BẮT BUỘC giữ nguyên cụm từ được gạch chân bằng ký hiệu __cụm từ__ (ví dụ: "__Having completed__ the final audit, Mr. Harrison submitted the results to the board.", "Liam denied __having shared__ the private link with anyone outside the team.").
     + opts: Danh sách tên các cột phân loại theo đúng thứ tự cột trong bảng (ví dụ: ["PG (Perfect Gerund)", "PP (Perfect Participle)"] hoặc ["PG", "PP"]).
     + ans: Chỉ số cột đúng (0 nếu là cột thứ nhất như PG, 1 nếu là cột thứ hai như PP).
     + exp: Giải thích rõ vì sao cụm gạch chân thuộc cột đó (ví dụ: đứng đầu câu làm mệnh đề phân từ rút gọn cùng chủ ngữ -> PP; hay đứng làm tân ngữ sau động từ/giới từ -> PG).
     + vi: Bản dịch tiếng Việt của câu.

function normalizeParsedData(r){
  const gs=[],qs=[];
  for(const g of r.groups||[{instr:'',passage:r.passage,colB:r.colB||r.columnB||r.columns,questions:r.questions}]){
    const off=qs.length,gi=gs.length;let j=0;
    const grpSharedOpts = Array.isArray(g.colB) ? g.colB : (Array.isArray(g.columnB) ? g.columnB : (Array.isArray(g.columns) ? g.columns : (Array.isArray(g.options) ? g.options : null)));
    const ql=(g.questions||[]).map(q=>{
      const rawOpts = (Array.isArray(q.opts) && q.opts.length) ? q.opts : (Array.isArray(q.options) && q.options.length ? q.options : (grpSharedOpts ? grpSharedOpts.slice() : []));
      const rawAns = q.ans !== undefined ? q.ans : (q.answer !== undefined ? q.answer : 0);
      const item={
        q:fmtArrangeText(q.q||q.stem||q.columnA||''),
        type:q.type||'',
        opts:rawOpts,
        ans:rawAns,
        _rawAns:rawAns,
        correctText:q.correctText!==undefined ? q.correctText : (typeof rawAns==='string' ? rawAns : ''),
        exp:q.exp||q.explanation||'',
        vi:q.vi||q.translation||'',
        g:gi
      };
      cleanOptsAndType(item);
      return item;
    });
    if(!ql.length)continue;
    let pas = g.passage||'';
    if(/\[\[\d+\]\]/.test(pas)){
      pas = pas.replace(/\[\[\d+\]\]/g,()=>`[[${off+(++j)}]]`);
    }
    const grpObj={instr:g.instr||'',passage:pas};
    autoHighlightPassageWords(grpObj,ql);
    qs.push(...ql);
    gs.push(grpObj);
  }
  if(!qs.length)throw new Error('Không nhận ra câu hỏi nào trong dữ liệu. Hãy kiểm tra lại nội dung.');
  return{groups:gs,qs,hl:[]};
}

// Nén ảnh tự động trên trình duyệt để gửi 5-10 ảnh qua API cực nhanh không bị treo
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1600;
        let w=img.width, h=img.height;
        if(w>MAX||h>MAX){
          if(w>h){h=Math.round(h*MAX/w);w=MAX;}
          else{w=Math.round(w*MAX/h);h=MAX;}
        }
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=cv.toDataURL('image/jpeg',0.85);
        res({inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}});
      };
      img.onerror=()=>{
        const b64=reader.result.split(',')[1];
        res({inline_data:{mime_type:file.type||'image/png',data:b64}});
      };
      img.src=reader.result;
    };
    reader.onerror=rej;
    reader.readAsDataURL(file);
  });
}

function cleanModelName(m){
  return String(m || '').trim().replace(/^models\//i, '');

function parseJsonFromAiText(raw){
  const s = String(raw || '').trim();
  const cleaned = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
  try {
    return JSON.parse(cleaned);
  } catch(e){
    const firstBrace = cleaned.indexOf('{');
    const lastBrace = cleaned.lastIndexOf('}');
    if(firstBrace !== -1 && lastBrace > firstBrace){
      return JSON.parse(cleaned.slice(firstBrace, lastBrace + 1));
    }
    throw e;
  }
}

async function discoverAvailableGeminiModels(apiKey){
  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
    if(!resp.ok) return [];
    const data = await resp.json();
    const list = (data.models || [])
      .filter(m => {
        const methods = m.supportedGenerationMethods || [];
        const name = cleanModelName(m.name);
        return methods.includes('generateContent') &&
               /^gemini/i.test(name) &&
               !/embedding|imagen|veo|tts|audio|aqa|robotics|computer-use/i.test(name) &&
               !RETIRED_GEMINI_MODELS.has(name);
      })
      .map(m => cleanModelName(m.name));

    // Ưu tiên dòng flash và phiên bản số cao nhất lên đầu
    list.sort((a, b) => {
      const aFlash = /flash/i.test(a) && !/lite/i.test(a) ? 1 : 0;
      const bFlash = /flash/i.test(b) && !/lite/i.test(b) ? 1 : 0;
      if(aFlash !== bFlash) return bFlash - aFlash;
      const aVer = parseFloat((a.match(/gemini-(\d+(?:\.\d+)?)/i) || [])[1] || '0');
      const bVer = parseFloat((b.match(/gemini-(\d+(?:\.\d+)?)/i) || [])[1] || '0');
      if(aVer !== bVer) return bVer - aVer;
      return a.localeCompare(b);
    });
    return list;
  } catch(e){
    return [];
  }
}

async function callGeminiModel(model, parts, apiKey, wantJson = true){
  const m = cleanModelName(model);
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const bodyObj = { contents: [{ parts }] };
  if(wantJson) bodyObj.generationConfig = { responseMimeType: 'application/json' };

  let resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(bodyObj)
  });
  let data = await resp.json().catch(() => ({}));

  // Nếu model không hỗ trợ responseMimeType: application/json thì tự động gọi lại ở chế độ văn bản thường
  if(!resp.ok && wantJson && resp.status === 400 && /responseMimeType|mime_type|generationConfig/i.test(data?.error?.message || '')){
    resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts }] })
    });
    data = await resp.json().catch(() => ({}));
  }
  return { ok: resp.ok, status: resp.status, data, model: m };
}

  const rawPref = cleanModelName(localStorage.getItem('gemini_model') || 'gemini-3.8-flash');
  const preferred = RETIRED_GEMINI_MODELS.has(rawPref) ? 'gemini-3.8-flash' : (rawPref || 'gemini-3.8-flash');
  const candidates = [preferred, ...DEFAULT_GEMINI_CANDIDATES].filter((v, i, a) => v && !RETIRED_GEMINI_MODELS.has(v) && a.indexOf(v) === i);
  const tried = new Set();
  let discovered = false;
  let lastErr = '';

  for(let i = 0; i < candidates.length; i++){
    const m = cleanModelName(candidates[i]);
    if(!m || tried.has(m)) continue;
    tried.add(m);

    if(onStatus) onStatus(m);
    const res = await callGeminiModel(m, parts, apiKey, wantJson);
    if(res.ok){
      const raw = res.data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
      if(raw.trim()){
        localStorage.setItem('gemini_model', m);
        return { raw, model: m };
      }
    }

    const errMsg = res.data?.error?.message || `Lỗi gọi Gemini API (${res.status})`;
    lastErr = errMsg;

    // Nếu API Key không hợp lệ thì dừng ngay để báo cho người dùng kiểm tra Key
    if(/API_KEY_INVALID|API key not valid/i.test(errMsg)) break;

    // Trích xuất TẤT CẢ các tên model xuất hiện trong thông báo lỗi (đặc biệt là model thay thế ở vế sau "use models/gemini-3.8-flash")
    const allSuggested = [...errMsg.matchAll(/models\/([a-zA-Z0-9._-]+)/g)].map(x => cleanModelName(x[1]));
    for(let sIdx = allSuggested.length - 1; sIdx >= 0; sIdx--){
      const sug = allSuggested[sIdx];
      if(sug && !tried.has(sug) && !RETIRED_GEMINI_MODELS.has(sug)){
        const existPos = candidates.indexOf(sug);
        if(existPos > i) candidates.splice(existPos, 1);
        if(!candidates.slice(i + 1).includes(sug)){
          candidates.splice(i + 1, 0, sug);
        }
      }
    }

    // Nếu sắp hết danh sách ứng viên mà vẫn lỗi, tự động truy vấn danh sách model thực tế từ Google API
    if(i === candidates.length - 1 && !discovered){
      discovered = true;
      const liveModels = await discoverAvailableGeminiModels(apiKey);
      for(const lm of liveModels){
        if(lm && !tried.has(lm) && !candidates.includes(lm)){
          candidates.push(lm);
        }
      }
    }
  }
  throw new Error(lastErr || 'Không kết nối được Gemini API.');
}

async function geminiParse(text,imgs,apiKey){
  const parts=[{text:PROMPT+'\n\nNỘI DUNG:\n'+(text||'(xem ảnh đính kèm)')}];
  for(const img of imgs){
    parts.push(await fileToBase64(img));
  }
  const { raw } = await callGeminiWithSmartFallback(parts, apiKey, true, m => {
    const st = $('#st');
    if(st) st.textContent = `⏳ Đang phân tích đề bằng AI (${m})...`;
  });
  return parseJsonFromAiText(raw);
}

async function aiParse(text,imgs){
  const direct=tryParseDirectJSON(text);
  if(direct&&!imgs.length){
    return normalizeParsedData(direct);
  }
  const gKey=(localStorage.getItem('gemini_api_key')||'').trim();
  if(gKey){
    const r=await geminiParse(text,imgs,gKey);
    return normalizeParsedData(r);
  }
  const s=await window.claude?.use('sample');
  if(!s)throw new Error('Chưa cài Gemini API Key và không ở trong Claude. Hãy bấm "⚙ Cài đặt AI" ở cột trái để nhập Gemini Key miễn phí, hoặc bấm "📋 Copy Prompt" nhờ AI ngoài tạo JSON rồi dán vào đây!');
  const o={};
  if(imgs.length){const l=await s.limits();if(!l.images)throw new Error('Môi trường này chưa hỗ trợ đọc ảnh. Hãy dán văn bản hoặc cài Gemini API Key.');o.images=imgs}
  const r=await s.json(PROMPT+'\n\nNỘI DUNG:\n'+(text||'(xem ảnh đính kèm)'),o);
  return normalizeParsedData(r);
}

// Bộ phân tích định dạng chữ in đậm (**...**), gạch chân (__...__), vừa đậm vừa gạch chân (**__...__**), in nghiêng (*...*)
function parseRichText(raw){
  let s=String(raw??'');
  if(!s)return {plain:'',styles:[]};
  s=s.replace(/\*\*__([^_\n]+?)__\*\*/g,'<b><u>$1</u></b>');
  s=s.replace(/__\*\*([^\*\n]+?)\*\*__/g,'<u><b>$1</b></u>');
  s=s.replace(/\*\*([^\*\n]+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^_A-Za-z0-9])__([^_\s][^_\n]*?[^_\s]|[^_\s])__(?![_A-Za-z0-9])/g,'$1<u>$2</u>');
  s=s.replace(/(^|[^\*])\*([^\*\s][^\*\n]*?[^\*\s]|[^\*\s])\*(?!\*)/g,'$1<i>$2</i>');
  const tagRe=/<(\/?)(b|strong|u|i|em)>/gi;
  let plain='', styles=[], bCnt=0, uCnt=0, iCnt=0, pos=0, m;
  while((m=tagRe.exec(s))!==null){
    const chunk=s.slice(pos,m.index);
    if(chunk){
      const mask=(bCnt>0?1:0)|(uCnt>0?2:0)|(iCnt>0?4:0);
      plain+=chunk;
      for(let k=0;k<chunk.length;k++) styles.push(mask);
    }
    const delta=m[1]==='/'?-1:1;
    const tg=m[2].toLowerCase();
    if(tg==='b'||tg==='strong') bCnt=Math.max(0,bCnt+delta);
    else if(tg==='u') uCnt=Math.max(0,uCnt+delta);
    else if(tg==='i'||tg==='em') iCnt=Math.max(0,iCnt+delta);
    pos=m.index+m[0].length;
  }
  const tail=s.slice(pos);
  if(tail){
    const mask=(bCnt>0?1:0)|(uCnt>0?2:0)|(iCnt>0?4:0);
    plain+=tail;
    for(let k=0;k<tail.length;k++) styles.push(mask);
  }
  return {plain,styles};
}

function wrapRichStyle(textEsc, mask){
  if(!mask)return textEsc;
  let res=textEsc;
  if(mask&4) res=`<em class="em-i">${res}</em>`;
  if((mask&3)===3) res=`<strong class="em-bu">${res}</strong>`;
  else if(mask&1) res=`<strong class="em-b">${res}</strong>`;
  else if(mask&2) res=`<u class="em-u">${res}</u>`;
  return res;
}

function renderStyledSlice(plain, styles, start, end){
  if(start>=end)return '';
  let out='', curMask=styles[start], runStart=start;
  for(let i=start+1;i<end;i++){
    if(styles[i]!==curMask){
      out+=wrapRichStyle(esc(plain.slice(runStart,i)),curMask);
      curMask=styles[i];
      runStart=i;
    }
  }
  out+=wrapRichStyle(esc(plain.slice(runStart,end)),curMask);
  return out;
}

function fmtRich(str){
  const {plain,styles}=parseRichText(str);
  return renderStyledSlice(plain,styles,0,plain.length);
}

function seg(t,k){
  const {plain,styles}=parseRichText(t);
  const L=plain.length;
  let o='',p=0;
  for(const h of(V.ex.hl||[]).filter(h=>h.k===k).sort((a,b)=>a.s-b.s)){
    const s=Math.max(0,Math.min(L,h.s)), e=Math.max(s,Math.min(L,h.e));
    if(s<p||s>=e)continue;
    o+=renderStyledSlice(plain,styles,p,s);
    o+=`<mark data-a="hn" data-id="${h.id}" class="${h.n?'n':''}" title="${esc(h.n)}">${renderStyledSlice(plain,styles,s,e)}</mark>`;
    p=e;
  }
  o+=renderStyledSlice(plain,styles,p,L);
  return`<span data-k="${k}">${o}</span>`;
}

function isFillOk(q,userAns){
  if(userAns===undefined||userAns===null) return false;
  const given = String(userAns).trim().toLowerCase().replace(/\s+/g,' ');
  if(!given) return false;
  const rawTarget = String(q.correctText || (q.opts&&q.opts[q.ans]) || '').trim().toLowerCase();
  if(!rawTarget) return false;
  // Hỗ trợ đáp án có nhiều phương án cách nhau bởi dấu / hoặc ; (ví dụ: "of / about")
  const targets = rawTarget.split(/\s*[\/|;]\s*/).map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean);
  targets.push(rawTarget.replace(/\s+/g,' '));
  return targets.includes(given);
}

function isAnswered(q, val){
  if(q.type==='fill') return val!==undefined && val!==null && String(val).trim()!=='';
  return val!==undefined && val!==null;
}

  }).join('')).join('');
  
  L.scrollTop=ls;R.scrollTop=rs;

  if(V.cur!=null) applyCurHighlight(V.cur);
}

const scrollAnim=new WeakMap();
function scrollContainerTo(container, targetEl, alignCenter=true){
  if(!container||!targetEl)return;
  const cRect=container.getBoundingClientRect();
  const tRect=targetEl.getBoundingClientRect();
  let desiredTop;
  if(alignCenter && tRect.height < cRect.height*0.75){
    desiredTop=container.scrollTop+(tRect.top-cRect.top)-(cRect.height/2)+(tRect.height/2);
  }else{
    desiredTop=container.scrollTop+(tRect.top-cRect.top)-14;
  }
  const maxScroll=Math.max(0,container.scrollHeight-container.clientHeight);
  desiredTop=Math.max(0,Math.min(maxScroll,desiredTop));
  const startTop=container.scrollTop;
  const diff=desiredTop-startTop;
  if(Math.abs(diff)<2)return;
  if(scrollAnim.has(container)) cancelAnimationFrame(scrollAnim.get(container));
  const t0=performance.now(), dur=260;
  function step(now){
    const p=Math.min(1,(now-t0)/dur);
    const ease=p<0.5?2*p*p:-1+(4-2*p)*p;
    container.scrollTop=startTop+diff*ease;
    if(p<1) scrollAnim.set(container,requestAnimationFrame(step));
    else scrollAnim.delete(container);
  }
  scrollAnim.set(container,requestAnimationFrame(step));
}

function applyCurHighlight(i){
  document.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));
  const qEl=$('#Q'+i), rEl=$('#R'+i);
  let lEl=$('#L'+i);
  qEl?.classList.add('cur');
  rEl?.classList.add('cur');
  lEl?.classList.add('cur');
  if(!lEl && V.layout!=='vertical' && V.ex && V.ex.qs[i]){
    lEl=$('#G'+V.ex.qs[i].g);
  }
  return {qEl, rEl, lEl};
}

function focusQ(i, skipScroll){
  V.cur=i;
  const {qEl, rEl, lEl} = applyCurHighlight(i);
  if(!skipScroll){
    scrollContainerTo($('#L'), lEl, lEl?.id?.startsWith('L'));
    scrollContainerTo($('#R'), rEl, true);
    scrollContainerTo($('#QB'), qEl, true);
  }
}
function getUsedSec(){
  if(!V||V.view!=='exam')return 0;
  const cur=V.paused?0:Math.max(0,Math.floor((Date.now()-V.t0)/1000));

}

function tick(){
  clearInterval(TI);const t=$('#tm');if(V.rev){if(t)t.textContent='';return}
  const f=()=>{
    const t=$('#tm');if(!t)return clearInterval(TI);
    const e=getUsedSec();
    const pTxt=V.paused?' (Tạm dừng)':'';
    const icon=V.paused?'⏸ ':'⏱ ';
    if(V.limit){
      const r=V.limit-e;
      t.textContent=icon+fmt(Math.max(r,0))+pTxt;
      if(r<=0&&!V.paused)submit();
    }else{
      t.textContent=icon+fmt(e)+pTxt;
    }
  };
  f();
  if(!V.paused) TI=setInterval(f,1000);
}
function submit(){
  if(V.rev)return;clearInterval(TI);
  const{ex,ans}=V,used=Math.min(getUsedSec(),V.limit||1e9);
  const c=ex.qs.filter((q,i)=>{
    if(q.type==='fill') return isFillOk(q, ans[i]);

  const h={id:uid(),ts:Date.now(),title:ex.title,week:D.weeks[V.wi]?.name||'',wid:D.weeks[V.wi]?.id||'',c,t:ex.qs.length,used,limit:V.limit,ex,order:V.order,perm:V.perm,ans};
  D.hist.push(h);save();V.rev=true;V.h=h;V.cur=null;render();
}

const DEFAULT_VC={rate:0.95,gender:'female',accent:'en-US',pitch:1.0,autoPitch:true,enVoice:'',viVoice:'',autoReadVi:false};
function getVoiceCfg(){
  try{return {...DEFAULT_VC,...(JSON.parse(localStorage.getItem('luyende_voice_cfg'))||{})};}
  catch(e){return {...DEFAULT_VC};}
}
function saveVoiceCfg(cfg){
  try{localStorage.setItem('luyende_voice_cfg',JSON.stringify(cfg));}catch(e){}
}

const FEMALE_HINTS=/female|nữ|zira|aria|jenny|michelle|ana|sonia|libby|natasha|clara|molly|samantha|victoria|karen|moira|tessa|allison|ava|susan|siri|hoaimy|linh|google us english$/i;
const MALE_HINTS=/\bmale\b|\bnam\b|david|mark|guy|christopher|eric|roger|steffan|ryan|thomas|liam|william|daniel|alex|fred|oliver|aaron|arthur|namminh/i;

function getAllVoices(){
  if(!('speechSynthesis' in window))return [];
  return window.speechSynthesis.getVoices()||[];
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=()=>{getAllVoices();};
}

function pickVoice(lang, vc){
  const voices=getAllVoices();
  if(!voices.length)return {voice:null,matchedGender:false};
  const isVi=lang.toLowerCase().startsWith('vi');
  const prefURI=isVi?vc.viVoice:vc.enVoice;
  if(prefURI){
    const exact=voices.find(v=>v.voiceURI===prefURI||v.name===prefURI);
    if(exact)return {voice:exact,matchedGender:true};
  }
  const langPrefix=isVi?'vi':'en';
  let pool=voices.filter(v=>(v.lang||'').toLowerCase().startsWith(langPrefix));
  if(!pool.length)return {voice:null,matchedGender:false};

  const wantGender=vc.gender||'female';
  const targetAccent=(vc.accent||'en-US').toLowerCase();

  let best=null, bestScore=-999, bestMatchedGender=false;
  for(const v of pool){
    let score=0;
    const nm=`${v.name} ${v.voiceURI}`;
    const vLang=(v.lang||'').toLowerCase().replace('_','-');
    if(!isVi && vLang===targetAccent) score+=15;
    else if(!isVi && vLang.startsWith(targetAccent.slice(0,2))) score+=5;

    const isFem=FEMALE_HINTS.test(nm);
    const isMal=MALE_HINTS.test(nm);
    let mGen=false;
    if(wantGender==='female'){
      if(isFem){score+=30;mGen=true;}
      if(isMal)score-=25;
    }else if(wantGender==='male'){
      if(isMal){score+=30;mGen=true;}
      if(isFem)score-=25;
    }else if(wantGender==='child'){
      if(isFem){score+=20;mGen=true;}
    }
    if(/natural|online|google|neural|premium/i.test(nm)) score+=8;
    if(score>bestScore){bestScore=score;best=v;bestMatchedGender=mGen;}
  }
  return {voice:best||pool[0], matchedGender:bestMatchedGender};
}

function stopSpeech(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  if(CUR_AUDIO){try{CUR_AUDIO.pause();CUR_AUDIO=null;}catch(e){}}
}

function speakText(txt, langMode){
  if(!txt)return;
  stopSpeech();
  const vc=getVoiceCfg();
  const lang=langMode==='vi'?'vi-VN':(vc.accent||'en-US');
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(txt);
    const {voice,matchedGender}=pickVoice(lang,vc);
    if(voice){u.voice=voice;u.lang=voice.lang||lang;}
    else{u.lang=lang;}
    u.rate=Math.max(0.5,Math.min(2.0,+vc.rate||0.95));
    let pitch=+vc.pitch||1.0;
    if(vc.autoPitch){
      if(vc.gender==='male') pitch=matchedGender?0.94:0.78;
      else if(vc.gender==='female') pitch=matchedGender?1.04:1.18;
      else if(vc.gender==='child') pitch=1.35;
    }
    u.pitch=Math.max(0.5,Math.min(1.6,pitch));
    window.speechSynthesis.speak(u);
  }
}

async function fetchGoogleTranslate(txt){
  const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&dt=bd&dj=1&q=${encodeURIComponent(txt)}`;
  const r=await fetch(url);
  if(!r.ok)throw new Error('Không kết nối được máy chủ dịch');
  return await r.json();
}

const COL=['#0e7c86','#e07a1f','#7b4fd1','#c62828','#2e8b3d','#c2185b','#1f6fd1','#8a6d00'];
const pc=h=>h.t?Math.round(h.c/h.t*100):0;

function chart(P,cm){
  const W=640,Ht=200,y=p=>Ht-30-p/100*(Ht-50);
  const pts=P.map((h,i)=>[P.length>1?44+i*(W-64)/(P.length-1):W/2,y(pc(h)),h]);
  return`<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;min-width:480px">${[0,50,100].map(p=>`<line x1="40" x2="${W-10}" y1="${y(p)}" y2="${y(p)}" stroke="var(--bd)"/><text x="4" y="${y(p)+4}" font-size="11" fill="var(--mu)">${p}%</text>`).join('')}
  <polyline fill="none" stroke="${cm?'var(--mu)':'var(--pr)'}" stroke-width="2" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>
  ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="${cm?cm[p[2].title]:'var(--pr)'}"><title>${esc(p[2].title)} · ${new Date(p[2].ts).toLocaleString('vi-VN')}: ${p[2].c}/${p[2].t}</title></circle>`).join('')}</svg>`;
}

// Vẽ biểu đồ tròn SVG nhiều phần (multi-slice donut chart)
function svgDonut(slices, centerTop, centerSub){
  const total = slices.reduce((a,s)=>a+s.val,0);
  if(!total) return '<p class="mu">Chưa có dữ liệu</p>';
  let acc = 0;
  const R = 15.9155;
  const circles = slices.filter(s=>s.val>0).map(s=>{
    const pct = (s.val / total) * 100;
    const dash = `${pct} ${100 - pct}`;
    const offset = 25 - acc;
    acc += pct;
    return `<circle cx="21" cy="21" r="${R}" fill="transparent" stroke="${s.color}" stroke-width="5.5" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"></circle>`;
  }).join('');
  return `<svg viewBox="0 0 42 42" style="width:125px;height:125px;flex:none">
    <circle cx="21" cy="21" r="${R}" fill="transparent" stroke="var(--bd)" stroke-width="5.5"></circle>
    ${circles}
    <text x="21" y="20" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:var(--tx)">${esc(centerTop)}</text>
    <text x="21" y="26.5" text-anchor="middle" style="font-size:4.2px;fill:var(--mu)">${esc(centerSub)}</text>
  </svg>`;
}

function renderPieCharts(H){
  let totalCorrect=0, totalQuestions=0;
  let exc=0, good=0, avg=0, low=0;
  H.forEach(h=>{
    totalCorrect += h.c;
    totalQuestions += h.t;
    const p = pc(h);
    if(p>=80) exc++;
    else if(p>=65) good++;
    else if(p>=50) avg++;
    else low++;
  });
  const totalWrong = Math.max(0, totalQuestions - totalCorrect);
  const accPct = totalQuestions ? Math.round(totalCorrect/totalQuestions*100) : 0;

  const pie1 = svgDonut([
    {val: totalCorrect, color: '#15803d'},
    {val: totalWrong, color: '#c62828'}
  ], `${accPct}%`, 'Chính xác');

  const pie2 = svgDonut([
    {val: exc, color: '#15803d'},
    {val: good, color: '#0e7c86'},
    {val: avg, color: '#e07a1f'},
    {val: low, color: '#c62828'}
  ], `${H.length} đề`, 'Đã hoàn thành');

  return `<div class="pie-grid">
    <div class="pie-box">
      ${pie1}
      <div style="font-size:13.5px;line-height:1.7">
        <b style="font-size:15px">🎯 Tỷ lệ Đúng / Sai các câu</b><br>
        <span style="color:var(--ok)">● <b>Đúng:</b> ${totalCorrect} câu (${accPct}%)</span><br>
        <span style="color:var(--no)">● <b>Sai / Trống:</b> ${totalWrong} câu (${100-accPct}%)</span><br>
        <span class="mu">Tổng cộng: ${totalQuestions} câu đã làm</span>
      </div>
    </div>
    <div class="pie-box">
      ${pie2}
      <div style="font-size:13.5px;line-height:1.65">
        <b style="font-size:15px">🏆 Phân loại kết quả đề</b><br>
        <span style="color:#15803d">● <b>Xuất sắc (≥80%):</b> ${exc} lần</span><br>
        <span style="color:#0e7c86">● <b>Khá (65-79%):</b> ${good} lần</span><br>
        <span style="color:#e07a1f">● <b>Trung bình (50-64%):</b> ${avg} lần</span><br>
        <span style="color:#c62828">● <b>Cần cố gắng (&lt;50%):</b> ${low} lần</span>
      </div>
    </div>
  </div>`;
}

  let cm=null,lg='',pe='';

    pe=`<div class="sc" style="margin-bottom:14px"><table><tr><th>Bài thi</th><th>Số lần làm</th><th>Lần đầu</th><th>Cao nhất</th><th>Gần nhất</th><th>Tiến bộ</th></tr>${ts.map(t=>{const a=H.filter(h=>h.title===t).map(pc),d=a[a.length-1]-a[0];return`<tr><td><i class="dot" style="background:${cm[t]}"></i><b>${esc(t)}</b></td><td>${a.length}</td><td>${a[0]}%</td><td><b>${Math.max(...a)}%</b></td><td>${a[a.length-1]}%</td><td style="color:${d>0?'var(--ok)':d<0?'var(--no)':'var(--mu)'};font-weight:700">${a.length<2?'—':(d>0?'▲ +':d<0?'▼ ':'= ')+d+'%'}</td></tr>`}).join('')}</table></div>`;
  }
  const ch=[];for(let c=sf;c;c=D.weeks.find(x=>x.id===c.pid))ch.unshift(c);
  const unc=catRoots('_none');
  const tabs=SF?`<div class="tabs"><button data-a="sc" data-c="">Tất cả</button>${ch.map((c,i)=>`<button class="${i===ch.length-1?'on':''}" data-a="sf" data-f="${c.id}">📁 ${esc(c.name)}</button>`).join('')}</div>`
   :`<div class="tabs"><button class="${SC?'':'on'}" data-a="sc" data-c="">Tất cả</button>${D.cats.map(c=>`<button class="${SC===c.id?'on':''}" data-a="sc" data-c="${c.id}">🏷 ${esc(c.name)}</button>`).join('')}${unc.length&&D.cats.length?`<button class="${SC==='_none'?'on':''}" data-a="sc" data-c="_none">Chưa phân loại</button>`:''}</div>`;
  const clrBtn=n?`<button class="gh" style="color:var(--no);border-color:var(--no)" data-a="clrh">🗑 Xóa lịch sử (${n})</button>`:'';
  const ops=SF?`<div class="row no-print" style="margin:0 0 14px"><button class="gh" data-a="renw" data-f="${SF}">✏️ Đổi tên mục</button>${sf.pid?'':`<button class="gh" data-a="fcat" data-f="${SF}">🏷 Phân loại thư mục này</button>`}<button class="gh" data-a="mv" data-f="${SF}">Di chuyển thư mục này</button><button class="pri" data-a="exppdf">📄 Xuất PDF Thống kê</button>${clrBtn}</div>`

  ${n?`${renderPieCharts(H)}
  <div class="ch sc"><small>📈 Biểu đồ tiến bộ qua các lần làm gần nhất (${P.length} lần)</small>${chart(P,cm)}${lg}</div>
  ${pe}
  <div class="sc"><table><tr><th>Ngày giờ</th><th>Bài thi</th><th>Kết quả (Đúng / Tổng)</th><th>Điểm</th><th>Thời gian</th><th class="hide-col-print">Thao tác</th></tr>

  :`<p class="mu">${SF||SC?'Chưa có lần làm bài nào ở đây.':'Chưa có lần làm bài nào. Tạo thư mục ở cột trái, thêm bài rồi bắt đầu làm.'}</p>`}</div>`;
}

let NP,MV;
function hasValidParentWeek(w){
  if(!w || !w.pid || w.pid === w.id) return false;
  const weeks = D.weeks || [];
  let cur = weeks.find(x => x && x.id === w.pid);
  if(!cur) return false;
  const seen = new Set([w.id]);
  while(cur){
    if(seen.has(cur.id)) return false;
    seen.add(cur.id);
    cur = cur.pid ? weeks.find(x => x && x.id === cur.pid) : null;
  }
  return true;
}
const kids=p=>(D.weeks||[]).map((w,i)=>[w,i]).filter(([w])=>{
  if(!w) return false;
  const effPid = hasValidParentWeek(w) ? w.pid : '';
  return effPid === (p || '');
});
function desc(id){const t=new Set([id]);let c=1;while(c){c=0;for(const w of (D.weeks||[]))if(w&&w.pid&&t.has(w.pid)&&!t.has(w.id)){t.add(w.id);c=1}}return t}
const pathOf=id=>{const a=[];const seen=new Set();let w=(D.weeks||[]).find(x=>x&&x.id===id);while(w&&!seen.has(w.id)){seen.add(w.id);a.unshift(w.name);w=w.pid?(D.weeks||[]).find(x=>x&&x.id===w.pid):null;}return a.join(' › ')};
function node(w,i,d){return`<div class="nv-wrap"><button class="nv ${V.view==='week'&&V.wi===i?'on':''}" style="padding-left:${10+d*16}px" draggable="true" data-id="${w.id}" data-a="week" data-i="${i}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📁 ${esc(w.name)}</span><small>${w.exams.length}</small></button><button class="nv-ren" data-a="renw" data-f="${w.id}" title="Đổi tên thư mục">✏️</button></div>${tree(w.id,d+1)}`}
function tree(p,d){return kids(p).map(([w,i])=>node(w,i,d)).join('')}
function sideTree(){
  if(!D.cats.length)return tree('',0);
  const g=(c,name,real)=>`<div class="cl" style="display:flex;justify-content:space-between;align-items:center" data-a="sc" data-c="${c}" data-dc="${real?c:''}"><span>🏷 ${esc(name)}</span>${real?`<button class="nv-ren" data-a="cr" data-c="${c}" title="Đổi tên đầu mục">✏️</button>`:''}</div>`+catRoots(c).map(w=>node(w,D.weeks.indexOf(w),0)).join('');
  return D.cats.map(c=>g(c.id,c.name,1)).join('')+g('_none','Chưa phân loại',0);
}
function setCat(id,c){const w=D.weeks.find(x=>x.id===id);if(!w)return;w.pid='';w.cat=c||'';save();render()}
function moveF(id,t){const w=D.weeks.find(x=>x.id===id);if(!w||id===t||(t&&desc(id).has(t)))return;w.pid=t||'';if(t)w.cat='';save();render()}
act.nf=d=>{NP=d.p||'';modal(`<h3>Thêm thư mục${NP?' con':''}</h3><input id="nfn" placeholder="Tên thư mục"><div class="row" style="margin-top:12px"><button class="pri" data-a="nf2">Tạo</button><button class="gh" data-a="close">Hủy</button></div>`);setTimeout(()=>$('#nfn')?.focus(),0)};
act.nf2=()=>{const n=$('#nfn').value.trim();if(!n)return;D.weeks.push({id:uid(),name:n,pid:NP,exams:[]});save();modal('');render()};
act.mv=d=>{MV=d.f;const self=desc(MV),cur=D.weeks.find(w=>w.id===MV),o=[['','📂 Ngoài cùng (không nằm trong thư mục nào)',0]];
  const walk=(p,dp)=>kids(p).forEach(([w])=>{if(self.has(w.id))return;o.push([w.id,'📁 '+w.name,dp]);walk(w.id,dp+1)});walk('',1);
  modal(`<h3>Di chuyển “${esc(cur.name)}” vào…</h3>${o.map(([id,t,dp])=>`<div class="op ${(cur.pid||'')===id?'sel':''}" style="margin-left:${dp*14}px" data-a="mv2" data-t="${id}"><span>${esc(t)}</span></div>`).join('')}<div class="row"><button class="gh" data-a="close">Hủy</button></div>`)};
act.mv2=d=>{moveF(MV,d.t);modal('')};
act.sf=d=>{SF=d.f||'';render()};
document.addEventListener('dragstart',e=>{const b=e.target.closest?.('.nv[data-id]');if(b)e.dataTransfer.setData('text/plain',b.dataset.id)});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.nv[data-id],.cl[data-dc],#side'))e.preventDefault()});
document.addEventListener('drop',e=>{const t=e.target.closest?.('.nv[data-id],.cl[data-dc],#side');if(!t)return;e.preventDefault();(t.dataset.dc!==undefined?setCat:moveF)(e.dataTransfer.getData('text/plain'),t.dataset.dc??t.dataset.id??'')});
let SC='',CC,CF;
const catRoots=c=>(D.weeks||[]).filter(w=>{
  if(!w || hasValidParentWeek(w)) return false;
  const hasValidCat = !!(w.cat && (D.cats||[]).some(ct => ct && ct.id === w.cat));
  if(c === '_none') return !hasValidCat;
  return hasValidCat && w.cat === c;
});
function cset(c){const t=new Set();for(const w of catRoots(c))desc(w.id).forEach(i=>t.add(i));return t}
const inp=(id,v)=>`<input id="${id}" value="${esc(v||'')}" placeholder="Ví dụ: Bài đọc điền khuyết">`,btns=(a,t)=>`<div class="row" style="margin-top:12px"><button class="pri" data-a="${a}">${t}</button><button class="gh" data-a="close">Hủy</button></div>`;

  cf(d){CC=d.c;const catObj=D.cats.find(c=>c.id===CC);if(!catObj)return;const r=[],walk=(p,dp)=>kids(p).forEach(([w])=>{const curCatName=w.cat?(D.cats.find(x=>x.id===w.cat)?.name||''):'';r.push(`<label class="op" style="margin-left:${dp*14}px"><input type="checkbox" data-w="${w.id}" ${(!hasValidParentWeek(w)&&w.cat===CC)?'checked':''} style="width:auto"><span>📁 ${esc(w.name)} ${dp>0?'<small class="mu">(Thư mục con — tích chọn sẽ đưa ra làm thư mục gốc của đầu mục này)</small>':(curCatName&&w.cat!==CC?`<small class="mu">(Đang ở: ${esc(curCatName)})</small>`:'')}</span></label>`);walk(w.id,dp+1)});walk('',0);
    modal(`<h3>Chọn folder cho “${esc(catObj.name)}”</h3>${r.join('')||'<p class="mu">Chưa có folder nào.</p>'}${btns('cf2','Lưu')}`)},
  cf2(){document.querySelectorAll('#modal input[data-w]').forEach(i=>{const w=D.weeks.find(x=>x.id===i.dataset.w);if(!w)return;if(i.checked){w.pid='';w.cat=CC;}else if(w.cat===CC){w.cat='';}});save();if(typeof window.flushSaveNow==='function')window.flushSaveNow(true);modal('');render()},
  fcat(d){CF=d.f;const w=D.weeks.find(x=>x.id===CF);if(!w)return;modal(`<h3>Phân loại “${esc(w.name)}”</h3>${[{id:'',name:'Chưa phân loại'},...D.cats].map(c=>`<div class="op ${(w.cat||'')===c.id?'sel':''}" data-a="fcat2" data-c="${c.id}"><span>${c.id?'🏷 ':''}${esc(c.name)}</span></div>`).join('')}${D.cats.length?'':'<p class="mu">Chưa có đầu mục. Đóng hộp này và bấm “＋ Thêm đầu mục phân loại” ở trang Tất cả.</p>'}<div class="row"><button class="gh" data-a="close">Đóng</button></div>`)},
  fcat2(d){const w=D.weeks.find(x=>x.id===CF);if(w){w.pid='';w.cat=d.c||'';}save();if(typeof window.flushSaveNow==='function')window.flushSaveNow(true);modal('');render()}
});

function examToDraft(ex){
  const groups=(ex.groups||[]).map((g,gi)=>({
    instr:g.instr||'',
    passage:g.passage||'',
    questions:(ex.qs||[]).filter(q=>q.g===gi).map(q=>({
      q:q.q||'',
      type:q.type||'mc',
      opts:(q.opts||[]).slice(),
      ans:+q.ans||0,
      correctText:q.correctText||'',
      exp:q.exp||'',
      vi:q.vi||''
    }))
  }));
  if(!groups.length) groups.push({instr:'',passage:'',questions:[]});
  return {
    id:ex.id||uid(),
    title:ex.title||'Bài thi',
    groups,
    hl:JSON.parse(JSON.stringify(ex.hl||[]))
  };
}

function draftToExam(draft){
  const gs=[],qs=[];
  for(const g of (draft.groups||[])){
    const off=qs.length,gi=gs.length;let j=0;
    const ql=(g.questions||[]).map(q=>{
      const item={
        q:fmtArrangeText(q.q||''),
        type:q.type||'mc',
        opts:(q.opts||[]).slice(),
        ans:q.ans!==undefined ? q.ans : 0,
        _rawAns:q._rawAns!==undefined ? q._rawAns : q.ans,
        correctText:q.correctText||'',
        exp:q.exp||'',
        vi:q.vi||'',
        g:gi
      };
      cleanOptsAndType(item);
      return item;
    });
    if(!ql.length && !(g.passage||'').trim() && !(g.instr||'').trim()) continue;
    let pas=g.passage||'';
    if(/\[\[\d+\]\]/.test(pas)){
      pas=pas.replace(/\[\[\d+\]\]/g,()=>`[[${off+(++j)}]]`);
    }
    const grpObj={instr:g.instr||'',passage:pas};
    autoHighlightPassageWords(grpObj,ql);
    qs.push(...ql);
    gs.push(grpObj);
  }
  if(!gs.length){
    gs.push({instr:'',passage:''});
  }
  return {
    id:draft.id||uid(),
    title:(draft.title||'').trim()||'Bài thi',
    groups:gs,
    qs,
    hl:draft.hl||[]
  };
}

function syncExamEverywhere(updatedEx, oldTitle){
  for(const w of D.weeks){
    const idx=(w.exams||[]).findIndex(x=>x.id===updatedEx.id);
    if(idx>=0) w.exams[idx]=updatedEx;
  }
  D.hist.forEach(h=>{
    if((h.ex&&h.ex.id===updatedEx.id) || (oldTitle&&h.title===oldTitle&&h.wid===(D.weeks[V.wi]?.id||''))){
      h.title=updatedEx.title;
      h.ex=updatedEx;
      if(h.ans){
        const ok=qi=>updatedEx.qs[qi].type==='fill'?isFillOk(updatedEx.qs[qi],h.ans[qi]):h.ans[qi]===updatedEx.qs[qi].ans;
        h.c=updatedEx.qs.filter((q,i)=>ok(i)).length;
        h.t=updatedEx.qs.length;
      }
    }
  });
}

function wrapTextareaSelection(ta, prefix, suffix){
  if(!ta)return;
  const s=ta.selectionStart??ta.value.length, e=ta.selectionEnd??ta.value.length;
  const sel=ta.value.slice(s,e)||'văn bản';
  const rep=prefix+sel+suffix;
  ta.value=ta.value.slice(0,s)+rep+ta.value.slice(e);
  ta.focus();
  ta.setSelectionRange(s+prefix.length, s+prefix.length+sel.length);
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}

document.addEventListener('input',e=>{
  const ed=e.target.dataset?.ed;
  if(!ed||V.view!=='edit'||!V.draft)return;
  if(ed==='title'){V.draft.title=e.target.value;return;}
  const gi=+e.target.dataset.g;
  const g=V.draft.groups[gi];
  if(!g)return;
  if(ed==='ginstr'){g.instr=e.target.value;return;}
  if(ed==='gpas'){g.passage=e.target.value;return;}
  const qi=+e.target.dataset.q;
  const q=g.questions[qi];
  if(!q)return;
  if(ed==='qq') q.q=e.target.value;
  else if(ed==='qopt'){
    const oi=+e.target.dataset.o;
    while((q.opts||[]).length<=oi) q.opts.push('');
    q.opts[oi]=e.target.value;
    if(+q.ans===oi) q.correctText=e.target.value;
  }
  else if(ed==='qct') q.correctText=e.target.value;
  else if(ed==='qexp') q.exp=e.target.value;
  else if(ed==='qvi') q.vi=e.target.value;
});

document.addEventListener('change',e=>{
  const ed=e.target.dataset?.ed;
  if(ed==='qtype'&&V.view==='edit'&&V.draft){
    const gi=+e.target.dataset.g, qi=+e.target.dataset.q;
    const q=V.draft.groups[gi]?.questions?.[qi];

  const IDB_NAME='luyende_v13_idb', IDB_STORE='state';
  let _idbCachePromise = null;
  function openIDB(){
    if(_idbCachePromise) return _idbCachePromise;
    _idbCachePromise = new Promise((res,rej)=>{
      if(!('indexedDB' in window)){_idbCachePromise=null;return rej(new Error('No IDB'));}
      const req=indexedDB.open(IDB_NAME,1);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess=e=>{
        const db=e.target.result;
        db.onclose=()=>{_idbCachePromise=null;};
        res(db);
      };
      req.onerror=e=>{_idbCachePromise=null;rej(req.error);};
    });

  // Hàm chuẩn hóa và bảo vệ cấu trúc Cây Thư mục (Folder), Đầu mục (Cats) và File
  function sanitizeDatabaseTree(db){
    if(!db || typeof db !== 'object') return db;
    // 1. Làm sạch danh sách Đầu mục (cats)
    const seenCats = new Set();
    db.cats = (Array.isArray(db.cats) ? db.cats : []).filter(c => {
      if(!c || !c.id || !String(c.name || '').trim()) return false;
      if(_DELETED_IDS.has(String(c.id)) || seenCats.has(c.id)) return false;
      seenCats.add(c.id);
      return true;
    });
    const validCatIds = new Set(db.cats.map(c => c.id));

    // 2. Làm sạch danh sách Thư mục (weeks), Bài thi (exams) và File (files)
    // Đồng thời dọn bỏ bài tập 'ex_pgpp_full_restored' và 'w_tuan3_restored' nếu do bản v44/v45 tự tạo
    const seenWeeks = new Set();
    db.weeks = (Array.isArray(db.weeks) ? db.weeks : []).filter(w => {
      if(!w || !w.id) return false;
      if(_DELETED_IDS.has(String(w.id)) || seenWeeks.has(w.id)) return false;
      seenWeeks.add(w.id);

      // Lọc danh sách file của thư mục
      const seenWFiles = new Set();
      w.files = (Array.isArray(w.files) ? w.files : []).filter(f => {
        if(!f) return false;
        if(!f.id) f.id = uid();
        if(_DELETED_IDS.has(String(f.id)) || seenWFiles.has(f.id)) return false;
        seenWFiles.add(f.id);
        return true;
      });

      // Lọc danh sách bài thi của thư mục
      const seenExams = new Set();
      w.exams = (Array.isArray(w.exams) ? w.exams : []).filter(e => {
        if(!e) return false;
        if(!e.id) e.id = uid();
        if(e.id === 'ex_pgpp_full_restored') return false;
        if(_DELETED_IDS.has(String(e.id)) || seenExams.has(e.id)) return false;
        seenExams.add(e.id);

        // Lọc danh sách file đính kèm trong từng bài thi
        const seenEFiles = new Set();
        e.files = (Array.isArray(e.files) ? e.files : []).filter(f => {
          if(!f) return false;
          if(!f.id) f.id = uid();
          if(_DELETED_IDS.has(String(f.id)) || seenEFiles.has(f.id)) return false;
          seenEFiles.add(f.id);
          return true;
        });
        return true;
      });

      // Nếu là thư mục 'w_tuan3_restored' tự sinh ở bản cũ mà không có bài thi/file nào của người dùng thì bỏ đi
      if(w.id === 'w_tuan3_restored' && !w.exams.length && !w.files.length) return false;
      return true;
    });

    // 3. Kiểm tra tính toàn vẹn của liên kết cha-con (pid) và đầu mục (cat) để KHÔNG BAO GIỜ MẤT FOLDER
    const validWeekIds = new Set(db.weeks.map(w => w.id));
    db.weeks.forEach(w => {
      if(w.pid && (w.pid === w.id || !validWeekIds.has(w.pid))){
        w.pid = '';
      }
      if(w.pid){
        const visited = new Set([w.id]);
        let cur = db.weeks.find(x => x.id === w.pid);
        while(cur && cur.pid){
          if(visited.has(cur.pid)){
            w.pid = '';
            break;
          }
          visited.add(cur.id);
          cur = db.weeks.find(x => x.id === cur.pid);
        }
      }
      // Nếu là thư mục con (có pid hợp lệ) thì xóa w.cat để tránh xung đột hiển thị
      if(w.pid){
        w.cat = '';
      } else if(w.cat && !validCatIds.has(w.cat)){
        // Nếu đầu mục phân loại không còn tồn tại, tự động đưa folder về "Chưa phân loại" thay vì làm ẩn mất folder
        w.cat = '';
      }
    });

    return db;
  }

  // Đồng bộ chuẩn xác giữa localStorage (lsDb) và IndexedDB (idbDb):
  // - Lấy bản có mốc thời gian _ts mới hơn làm gốc (authoritative), TUYỆT ĐỐI KHÔNG tự ý gộp (union) các file/bài/thư mục đã xóa quay trở lại!
  // - Chỉ khôi phục nội dung dataUrl của những file ĐANG TỒN TẠI trong bản gốc (nếu bản gốc là localStorage bị lược bớt dataUrl do giới hạn 5MB).
  function reconcileStorageDatabases(lsDb, idbDb){
    if(!idbDb || typeof idbDb !== 'object') return sanitizeDatabaseTree(lsDb);
    if(!lsDb || typeof lsDb !== 'object') return sanitizeDatabaseTree(idbDb);

    const lsTs = +(lsDb._ts || 0);
    const idbTs = +(idbDb._ts || 0);
    const lsEmpty = !(lsDb.weeks && lsDb.weeks.length) && !(lsDb.cats && lsDb.cats.length);
    const idbHasData = !!(idbDb.weeks && idbDb.weeks.length) || !!(idbDb.cats && idbDb.cats.length);

    // Ưu tiên idbDb khi idbTs >= lsTs vì idbDb giữ nguyên dataUrl đầy đủ của file PDF/Word
    const primary = (lsEmpty && idbHasData) ? idbDb : ((idbTs >= lsTs && idbHasData) ? idbDb : lsDb);
    const secondary = (primary === lsDb) ? idbDb : lsDb;

    // Thu hoạch toàn bộ dữ liệu nhị phân (dataUrl/htmlPreview/textPreview) từ cả 2 nguồn theo cả id và tên file
    const richFileMap = new Map();
    const normFk = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const collectFilesFromDb = srcDb => {
      if(!srcDb || !Array.isArray(srcDb.weeks)) return;
      for(const w of srcDb.weeks){
        if(!w) continue;
        for(const f of (w.files || [])){
          if(f && (f.dataUrl || f.htmlPreview || f.textPreview)){
            if(f.id) richFileMap.set('id:' + f.id, f);
            const nk = normFk(f.name || f.title);
            if(nk) richFileMap.set('nm:' + nk, f);
            if(typeof window._saveFileToVault === 'function') window._saveFileToVault(f);
          }
        }
        for(const ie of (w.exams || [])){
          if(!ie) continue;
          for(const f of (ie.files || [])){
            if(f && (f.dataUrl || f.htmlPreview || f.textPreview)){
              if(f.id) richFileMap.set('id:' + f.id, f);
              const nk = normFk(f.name || f.title);
              if(nk) richFileMap.set('nm:' + nk, f);
              if(typeof window._saveFileToVault === 'function') window._saveFileToVault(f);
            }
          }
        }
      }
    };
    collectFilesFromDb(idbDb);
    collectFilesFromDb(lsDb);

    // Khôi phục dataUrl/htmlPreview/textPreview cho mọi file đang có mặt trong primary
    for(const pw of (primary.weeks || [])){
      if(!pw) continue;
      for(const f of (pw.files || [])){
        if(!f) continue;
        const src = (f.id && richFileMap.get('id:' + f.id)) || richFileMap.get('nm:' + normFk(f.name || f.title));
        if(src){
          if(!f.dataUrl && src.dataUrl) f.dataUrl = src.dataUrl;
          if(!f.htmlPreview && src.htmlPreview) f.htmlPreview = src.htmlPreview;
          if(!f.textPreview && src.textPreview) f.textPreview = src.textPreview;
          if(!f.size && src.size) f.size = src.size;
        }
      }
      for(const pe of (pw.exams || [])){
        if(!pe) continue;
        for(const f of (pe.files || [])){
          if(!f) continue;
          const src = (f.id && richFileMap.get('id:' + f.id)) || richFileMap.get('nm:' + normFk(f.name || f.title));
          if(src){
            if(!f.dataUrl && src.dataUrl) f.dataUrl = src.dataUrl;
            if(!f.htmlPreview && src.htmlPreview) f.htmlPreview = src.htmlPreview;
            if(!f.textPreview && src.textPreview) f.textPreview = src.textPreview;
            if(!f.size && src.size) f.size = src.size;
          }
        }
      }
    }

    return sanitizeDatabaseTree(primary);
  }

  // 2. Bộ giải nén & đọc trực tiếp file Word (.docx) ngay trên trình duyệt
  async function extractZipEntryText(arrayBuffer, targetPath){
    const bytes=new Uint8Array(arrayBuffer);
    const view=new DataView(arrayBuffer);
    let eocd=-1;
    for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65558);i--){
      if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}
    }
    if(eocd===-1)throw new Error('File không đúng chuẩn DOCX');
    const total=view.getUint16(eocd+10,true);
    let pos=view.getUint32(eocd+16,true);
    const dec=new TextDecoder('utf-8');
    for(let i=0;i<total;i++){
      if(pos+46>bytes.length||view.getUint32(pos,true)!==0x02014b50)break;
      const method=view.getUint16(pos+10,true);
      const compSize=view.getUint32(pos+20,true);
      const fnLen=view.getUint16(pos+28,true);
      const exLen=view.getUint16(pos+30,true);
      const cmLen=view.getUint16(pos+32,true);
      const localOff=view.getUint32(pos+42,true);
      const fn=dec.decode(bytes.subarray(pos+46,pos+46+fnLen));
      if(fn===targetPath){
        const lFnLen=view.getUint16(localOff+26,true);
        const lExLen=view.getUint16(localOff+28,true);
        const start=localOff+30+lFnLen+lExLen;
        const compSlice=bytes.subarray(start,start+compSize);
        if(method===0)return dec.decode(compSlice);
        if(method===8 && typeof DecompressionStream!=='undefined'){
          const ds=new DecompressionStream('deflate-raw');
          const writer=ds.writable.getWriter();
          writer.write(compSlice);writer.close();
          return await new Response(ds.readable).text();
        }
      }
      pos+=46+fnLen+exLen+cmLen;
    }
    throw new Error('Không tìm thấy word/document.xml');
  }

  async function parseDocxBuffer(arrayBuffer){
    try{
      const xmlStr=await extractZipEntryText(arrayBuffer,'word/document.xml');
      const doc=new DOMParser().parseFromString(xmlStr,'application/xml');
      const body=doc.getElementsByTagNameNS('*','body')[0]||doc.documentElement;
      let htmlParts=[], textParts=[];
      const parseParagraph=pNode=>{
        let pHtml='', pTxt='';
        const runs=pNode.getElementsByTagNameNS('*','r');
        for(const r of runs){
          let rTxt='';
          for(const ch of r.childNodes){
            const ln=ch.localName||ch.nodeName.replace(/^.*:/,'');
            if(ln==='t') rTxt+=ch.textContent||'';
            else if(ln==='tab') rTxt+='\t';
            else if(ln==='br') rTxt+='\n';
          }
          if(!rTxt)continue;
          const rPr=r.getElementsByTagNameNS('*','rPr')[0];
          let isB=false, isU=false, isI=false;
          if(rPr){
            const bEl=rPr.getElementsByTagNameNS('*','b')[0];
            if(bEl && bEl.getAttribute('w:val')!=='0' && bEl.getAttribute('w:val')!=='false') isB=true;
            const uEl=rPr.getElementsByTagNameNS('*','u')[0];
            if(uEl && uEl.getAttribute('w:val')!=='none' && uEl.getAttribute('w:val')!=='0') isU=true;
            const iEl=rPr.getElementsByTagNameNS('*','i')[0];
            if(iEl && iEl.getAttribute('w:val')!=='0' && iEl.getAttribute('w:val')!=='false') isI=true;
          }
          let hEsc=esc(rTxt);
          if(isI) hEsc=`<em class="em-i">${hEsc}</em>`;
          if(isB&&isU) hEsc=`<strong class="em-bu">${hEsc}</strong>`;
          else if(isB) hEsc=`<strong class="em-b">${hEsc}</strong>`;
          else if(isU) hEsc=`<u class="em-u">${hEsc}</u>`;
          pHtml+=hEsc;

          const m=rTxt.match(/^(\s*)([\s\S]*?)(\s*)$/);
          const core=m?m[2]:rTxt;
          if(!core){pTxt+=rTxt;}
          else{
            let mk=core;
            if(isB&&isU) mk=`**__${core}__**`;
            else if(isB) mk=`**${core}**`;
            else if(isU) mk=`__${core}__`;
            else if(isI) mk=`*${core}*`;
            pTxt+=(m?m[1]:'')+mk+(m?m[3]:'');
          }
        }
        return {pHtml, pTxt};
      };

      for(const node of body.childNodes){
        const ln=node.localName||node.nodeName.replace(/^.*:/,'');
        if(ln==='p'){
          const {pHtml,pTxt}=parseParagraph(node);
          if(pTxt.trim()){
            htmlParts.push(`<p style="margin:6px 0">${pHtml}</p>`);
            textParts.push(pTxt);
          }
        }else if(ln==='tbl'){
          const rows=node.getElementsByTagNameNS('*','tr');
          let trHtml=[];
          for(const r of rows){
            const cells=r.getElementsByTagNameNS('*','tc');
            let tdHtml=[], tdTxt=[];
            for(const c of cells){
              const ps=c.getElementsByTagNameNS('*','p');
              let cH=[], cT=[];
              for(const p of ps){
                const res=parseParagraph(p);
                if(res.pTxt.trim()){cH.push(res.pHtml);cT.push(res.pTxt);}
              }
              tdHtml.push(`<td>${cH.join('<br>')}</td>`);
              tdTxt.push(cT.join(' '));
            }
            trHtml.push(`<tr>${tdHtml.join('')}</tr>`);
            if(tdTxt.some(Boolean)) textParts.push(tdTxt.join(' | '));
          }
          if(trHtml.length) htmlParts.push(`<table>${trHtml.join('')}</table>`);
        }
      }
      return {htmlPreview:htmlParts.join('\n'), textPreview:textParts.join('\n')};
    }catch(e){
      return {htmlPreview:'', textPreview:''};
    }
  }

  function fileToDataURL(file){
    return new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=rej;
      r.readAsDataURL(file);
    });
  }

  async function processFileObject(file, cat='Lý thuyết / Từ vựng'){
    const rawName=file.name||'Tai-lieu';
    const ext=(rawName.includes('.')?rawName.split('.').pop():'').toLowerCase();
    const baseTitle=(file.customTitle||rawName.replace(/\.[^.]+$/,'')).trim()||'Tài liệu';
    const finalName=ext?(baseTitle.toLowerCase().endsWith('.'+ext)?baseTitle:`${baseTitle}.${ext}`):baseTitle;
    const dataUrl=await fileToDataURL(file);
    let htmlPreview='', textPreview='';
    if(ext==='docx'){
      const buf=await file.arrayBuffer();
      const parsed=await parseDocxBuffer(buf);
      htmlPreview=parsed.htmlPreview;
      textPreview=parsed.textPreview;
    }else if(['txt','md','csv','json','html','htm'].includes(ext)){
      textPreview=await file.text();
      if(ext==='html'||ext==='htm') htmlPreview=textPreview;
    }
    const newFileObj = {
      id:uid(),
      name:finalName,
      title:baseTitle,
      cat,
      mime:file.type||(ext==='pdf'?'application/pdf':''),
      ext,
      size:file.size||0,
      ts:Date.now(),
      dataUrl,
      htmlPreview,
      textPreview
    };
    if(typeof window._saveFileToVault === 'function'){
      await window._saveFileToVault(newFileObj);
    }
    return newFileObj;
  }

  function fmtSize(bytes){
    if(!bytes)return '';
    if(bytes<1024)return bytes+' B';
    if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
    return (bytes/1048576).toFixed(2)+' MB';
  }
  function fileIcon(ext){
    if(ext==='pdf')return '📕';
    if(ext==='docx'||ext==='doc')return '📘';
    if(['png','jpg','jpeg','webp','gif'].includes(ext))return '🖼';
    if(ext==='link')return '🔗';
    return '📝';
  }

  // Nâng cấp hàm chuyển file sang dữ liệu cho Gemini API (Hỗ trợ cả PDF, Word, Text, Ảnh)
  const origFileToBase64 = fileToBase64;
  fileToBase64 = async function(file){
    const ext=(file.name?.split('.').pop()||'').toLowerCase();
    if(file.type==='application/pdf'||ext==='pdf'){
      const dUrl=await fileToDataURL(file);
      return {inline_data:{mime_type:'application/pdf',data:dUrl.split(',')[1]}};
    }
    if(ext==='docx'){
      const buf=await file.arrayBuffer();
      const {textPreview}=await parseDocxBuffer(buf);
      return {text:`\n--- NỘI DUNG FILE WORD (${file.name}) ---\n`+(textPreview||'')};
    }
    if(['txt','md','html','htm','csv','json'].includes(ext)){
      const txt=await file.text();
      return {text:`\n--- NỘI DUNG FILE (${file.name}) ---\n`+txt};
    }
    return await origFileToBase64(file);
  };

  upd = function(){
    const e=$('#im');
    if(!e)return;
    if(!IM.length){e.textContent='Chưa chọn file/ảnh.';return;}
    e.innerHTML=IM.map((f,idx)=>{
      const ext=(f.name?.split('.').pop()||'').toLowerCase();
      const dispName=f.customTitle||f.name||('Ảnh dán '+(idx+1));
      return `<span class="f-pill" style="cursor:default">
        ${fileIcon(ext)} <b>${esc(dispName)}</b>
        <span class="f-act" data-a="im_ren" data-i="${idx}" title="Đổi tên file này">✏️</span>
        <span class="f-act" style="color:var(--no)" data-a="im_del" data-i="${idx}" title="Bỏ file này">✕</span>
      </span>`;
    }).join('');
  };

  // 3. Giao diện làm bài Dọc truyền thống vs Ngang chia đôi
  function getLayoutPref(){
    return localStorage.getItem('luyende_layout')||'split';
  }
  function setLayoutPref(ly){
    localStorage.setItem('luyende_layout',ly);
  }

  start = function(ei,min,sh,layoutMode){
    const ex=D.weeks[V.wi].exams[ei],order=[];
    ex.groups.forEach((g,gi)=>{const a=ex.qs.map((q,i)=>i).filter(i=>ex.qs[i].g===gi);order.push(...(sh&&!g.passage?shuf(a):a))});
    const perm=ex.qs.map(q=>{
      const base=getValidOptIndices(q);
      if(sh && q.type!=='fill' && q.type!=='tf' && base.length>2) return shuf(base.slice());
      return base;
    });
    const ly=layoutMode||getLayoutPref();
    V={view:'exam',wi:V.wi,ei,ex,order,perm,ans:{},limit:min*60,t0:Date.now(),elapsed:0,paused:false,rev:false,cur:null,layout:ly};
    render();
  };

  renderExam = function(m){
    if(!V.layout) V.layout=getLayoutPref();
    const fCount=(V.ex.files||[]).length;
    const isVert=V.layout==='vertical';
    m.innerHTML=`<div class="eh">
      <b>${esc(V.ex.title)} <button class="nv-ren" style="opacity:0.8;font-size:13px" data-a="rene_cur" title="Đổi tên bài thi này">✏️</button></b>
      <span class="mu" id="pg"></span>
      <span class="tm" id="tm"></span>
      ${V.rev?'':`<button class="gh" id="pb" data-a="pause" title="Tạm dừng hoặc tiếp tục bộ đếm thời gian"></button>`}
      <button class="gh" data-a="tgl_layout" title="Chuyển đổi cách làm bài Ngang (chia đôi) hoặc Dọc truyền thống">${isVert?'▤ Giao diện: Dọc':'◫ Giao diện: Ngang'}</button>
      <button class="gh" data-a="efiles_cur" title="Xem hoặc tải lên File lý thuyết, từ vựng của bài này">📎 Tài liệu ${fCount?`(${fCount})`:''}</button>

      ${V.rev?'<button class="gh" data-a="back">Quay lại</button>':'<button class="gh" style="color:var(--no);border-color:var(--no)" data-a="cancel">✕ Hủy làm bài</button><button class="pri" data-a="sub">Nộp bài</button>'}

  const origDrawQ = drawQ;
  drawQ = function(){
    if(V.layout!=='vertical') return origDrawQ();
    const{ex,order,perm,ans,rev}=V,L=$('#L'),R=$('#R'),ls=L.scrollTop;
    const nm=qi=>order.indexOf(qi)+1;
    const ok=qi=>ex.qs[qi].type==='fill'?isFillOk(ex.qs[qi],ans[qi]):ans[qi]===ex.qs[qi].ans;
    const gq=g=>order.filter(i=>ex.qs[i].g===g),rng=g=>{const a=gq(g).map(nm),x=Math.min(...a),y=Math.max(...a);return x===y?`Câu ${x}`:`Nhóm câu hỏi ${x} - ${y}`};

    const renderCard=(qi,gi)=>{
      const q=ex.qs[qi],a=ans[qi],answered=isAnswered(q,a);
      const qTxt=fmtArrangeText(q.q||'');
      const stemHtml=qTxt?`<div class="qstem">${seg(qTxt,gi+':s'+qi)}</div>`:'';
      if(q.type==='fill'){
        const correctVal=q.correctText||(q.opts&&q.opts[q.ans])||'';
        const isCorrect=ok(qi);
        const e=rev?`<div class="exp">${!answered?'⚪ Chưa trả lời. ':isCorrect?'✅ Chính xác. ':'❌ Chưa đúng. '}Đáp án đúng: <b>${esc(correctVal)}</b>${q.exp?`<br>💡 ${fmtRich(q.exp)}`:''}${q.vi?`<br>🌐 ${fmtRich(q.vi)}`:''}</div>`:'';
        return `<div class="cd ${answered?'dn':''}" id="R${qi}" data-a="fq" data-i="${qi}">
          <div class="cn" style="display:flex;justify-content:space-between;align-items:center"><span>Câu ${nm(qi)}. <small class="mu">(Tự luận điền đáp án)</small></span><button class="gh" style="padding:2px 8px;font-size:12px" data-a="editq" data-q="${qi}">✏️ Sửa câu</button></div>
          ${stemHtml}
          <input class="${rev?(isCorrect?'fill-in ok':'fill-in no'):''}" style="width:100%;margin-top:4px" ${rev?'disabled':''} data-a="fill" data-q="${qi}" value="${esc(a||'')}" placeholder="Nhập đáp án của bạn vào đây...">
          ${e}
        </div>`;
      }
      const activePerm=(perm[qi]||getValidOptIndices(q)).filter(oi=>oi<q.opts.length&&String(q.opts[oi]??'').trim()!=='');
      const finalPerm=activePerm.length?activePerm:getValidOptIndices(q);
      const isTF=q.type==='tf'||finalPerm.length<=2;
      const opsHtml=finalPerm.map((oi,pi)=>{
        const c=rev?(oi===q.ans?'ok':oi===a?'no':''):(oi===a?'sel':'');
        return`<div class="op ${c}" tabindex="0" data-a="pick" data-q="${qi}" data-o="${oi}"><i>${ltr[pi]||pi+1}</i><span>${seg(q.opts[oi],gi+":ro"+qi+"_"+oi)}</span></div>`;
      }).join('');
      const wrappedOps=isTF?`<div class="tf-grid">${opsHtml}</div>`:opsHtml;
      const ansPos=finalPerm.indexOf(q.ans);
      const ansLetter=ltr[ansPos>=0?ansPos:q.ans]||'A';
      const e=rev?`<div class="exp">${a==null?'⚪ Chưa trả lời. ':ok(qi)?'✅ Chính xác. ':'❌ Chưa đúng. '}Đáp án: <b>${ansLetter}. ${fmtRich(q.opts[q.ans])}</b>${q.exp?`<br>💡 ${fmtRich(q.exp)}`:''}${q.vi?`<br>🌐 ${fmtRich(q.vi)}`:''}</div>`:'';
      return `<div class="cd ${answered?'dn':''}" id="R${qi}" data-a="fq" data-i="${qi}">
        <div class="cn" style="display:flex;justify-content:space-between;align-items:center"><span>Câu ${nm(qi)}.${isTF?'<span class="tf-tag">TRUE / FALSE</span>':''}</span><button class="gh" style="padding:2px 8px;font-size:12px" data-a="editq" data-q="${qi}">✏️ Sửa câu</button></div>
        ${stemHtml}${wrappedOps}${e}
      </div>`;
    };

    L.innerHTML=ex.groups.map((g,gi)=>{
      let pasHtml='';
      if(g.passage){
        pasHtml='<div class="ps vert-ps">'+g.passage.split(/\[\[(\d+)\]\]/).map((t,i)=>{
          if(i%2===0)return seg(t,gi+':'+i);
          const qi=+t-1,q=ex.qs[qi];if(!q)return'('+t+')';
          if(q.type==='fill'){
            const uVal=ans[qi]||'';
            const cVal=q.correctText||(q.opts&&q.opts[q.ans])||'';
            if(rev){
              const pass=ok(qi);
              return `<span class="fill-in ${pass?'ok':'no'}" id="L${qi}" data-a="fq" data-i="${qi}">(${t}) ${esc(uVal||'___')} ${pass?'✓':`➜ ${esc(cVal)}`}</span>`;
            }
            return `<span>(${t}) <input class="fill-in" id="L${qi}" data-a="fill" data-q="${qi}" value="${esc(uVal)}" placeholder="Điền từ..."></span>`;
          }
          const a=rev?q.ans:ans[qi];
          return`<button class="bl ${rev?(ok(qi)?'ok':'no'):a!=null?'dn':''}" id="L${qi}" data-a="fq" data-i="${qi}">(${t}) ${a!=null?esc(q.opts[a]):'______'}</button>`;
        }).join('')+'</div>';
      }
      const cardsHtml=gq(gi).map(qi=>renderCard(qi,gi)).join('');
      return `<div class="grp" id="G${gi}"><div class="gh2">${rng(gi)}</div>${g.instr?`<div class="ins">${seg(g.instr,gi+":ins")}</div>`:''}${pasHtml}${cardsHtml}</div>`;
    }).join('');
    R.innerHTML='';
    L.scrollTop=ls;
    updateProgressText();
    if(V.cur!=null) applyCurHighlight(V.cur);
  };

  focusQ = function(i, skipScroll){

        scrollContainerTo($('#L'), lEl, lEl?.id?.startsWith('L'));

      }
      scrollContainerTo($('#QB'), qEl, true);
    }
  };

          ${w.pid?'':`<button class="gh" data-a="fcat" data-f="${w.id}">🏷 Phân loại</button>`}
          <button class="gh" data-a="mv" data-f="${w.id}">Di chuyển</button>
          <button class="gh" data-a="delw">Xóa</button>
        </div>
      </div>
      ${ks.length?`<div class="kp">${ks.map(([k,i])=>`<div style="cursor:pointer;position:relative" data-a="week" data-i="${i}"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:4px"><span>📁 ${esc(k.name)}</span><button class="nv-ren" style="opacity:0.85" data-a="renw" data-f="${k.id}" title="Đổi tên thư mục">✏️</button></div><small>${k.exams.length} bài, ${kids(k.id).length} thư mục con</small></div>`).join('')}</div>`:''}
      ${wFilesHtml}
      ${w.exams.length?w.exams.map((e,i)=>{
        e.files=e.files||[];
        const pills=e.files.map((f,fi)=>`<span class="f-pill" data-a="viewf_e" data-ei="${i}" data-fi="${fi}" title="Bấm để mở tài liệu này">${fileIcon(f.ext)} ${esc(f.title||f.name)} <span class="f-act" data-a="renf_e" data-ei="${i}" data-fi="${fi}" title="Đổi tên file này">✏️</span><span class="f-act" style="color:var(--no)" data-a="delf_e" data-ei="${i}" data-fi="${fi}" title="Xóa file đính kèm này">✕</span></span>`).join('');

    if(!FM_CTX)return [];

  function finishRenameFileModal(doSave){
    const st=REN_FILE_STATE;
    if(!st||!st.fileObj){modal('');return;}
    const f=st.fileObj;
    if(doSave){
      const newTitle=($('#rf-title')?.value||'').trim();
      if(!newTitle){alert('Tên file không được để trống!');return;}
      f.title=newTitle;
      const ext=(f.ext||'').toLowerCase();
      if(ext && ext!=='link'){
        f.name=newTitle.toLowerCase().endsWith('.'+ext)?newTitle:`${newTitle}.${ext}`;

      if($('#rf-cat')) f.cat=$('#rf-cat').value||'Tài liệu';

      if($('#rf-txt')){
        f.textPreview=$('#rf-txt').value;

      syncCtxFilesAndSave();

    REN_FILE_STATE=null;
    if(st.returnTo==='manager'){
      openFilesManagerModal();
      render();

      render();
      openFileViewer(f, st.allowBackToManager);

  function dataURLToBlobUrl(dataUrl){
    try{
      const arr=dataUrl.split(',');
      const mime=arr[0].match(/:(.*?);/)[1];
      const bstr=atob(arr[1]);
      let n=bstr.length;
      const u8=new Uint8Array(n);
      while(n--) u8[n]=bstr.charCodeAt(n);
      return URL.createObjectURL(new Blob([u8],{type:mime}));
    }catch(e){return dataUrl;}
  }

  function downloadFileObj(f){
    if(!f)return;
    if(f.url && !f.dataUrl){window.open(f.url,'_blank');return;}
    let bUrl = '';
    if(f.dataUrl){
      bUrl = dataURLToBlobUrl(f.dataUrl);
    }else{
      const blob=new Blob([f.textPreview||f.htmlPreview||''],{type:'text/plain;charset=utf-8'});
      bUrl = URL.createObjectURL(blob);
    }
    const a=document.createElement('a');
    a.style.display='none';
    a.href=bUrl;
    a.download=f.name||(f.title||'tai-lieu')+'.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      a.remove();
      if(bUrl && bUrl.startsWith('blob:')){try{URL.revokeObjectURL(bUrl);}catch(e){}}
    }, 30000);
  }

  window._getCtxFiles = getCtxFiles;
  window._setFmCtx = c => { FM_CTX = c; };
  function openFileViewer(f, allowBackToManager){
    if(!f)return;
    window._curViewFile = f;
    window._curViewAllowBack = !!allowBackToManager;
    if(typeof window._renderEnhancedFileViewer === 'function'){
      return window._renderEnhancedFileViewer(f, allowBackToManager);
    }
    let bodyHtml='';
    if(f.ext==='pdf' && f.dataUrl){
      const bUrl=dataURLToBlobUrl(f.dataUrl);
      bodyHtml=`<iframe src="${bUrl}" style="flex:1;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff"></iframe>`;
    }else if(['png','jpg','jpeg','webp','gif'].includes(f.ext) && f.dataUrl){
      bodyHtml=`<div class="doc-viewer" style="text-align:center"><img src="${f.dataUrl}" style="max-width:100%;height:auto;border-radius:8px"></div>`;
    }else if(f.htmlPreview){
      bodyHtml=`<div class="doc-viewer">${f.htmlPreview}</div>`;
    }else if(f.textPreview){
      bodyHtml=`<div class="doc-viewer">${fmtRich(f.textPreview)}</div>`;
    }else if(f.url){
      bodyHtml=`<div class="doc-viewer" style="text-align:center;padding:40px">
        <p>🔗 Tài liệu liên kết ngoài:</p>
        <p><a href="${esc(f.url)}" target="_blank" style="color:var(--pr);font-weight:700;font-size:17px">${esc(f.url)}</a></p>
      </div>`;
    }else{
      bodyHtml=`<div class="doc-viewer" style="text-align:center;padding:40px">
        <p>File <b>${esc(f.name)}</b> (${fmtSize(f.size)}).</p>
        <p class="mu">Hãy bấm nút <b>"⬇ Tải file gốc"</b> bên dưới để mở trực tiếp trên thiết bị của bạn.</p>
      </div>`;
    }

    $('#modal').innerHTML=`<div class="ov"><div class="box wide">
      <div class="hd" style="margin-bottom:10px">
        <div>
          <b style="font-size:18px">${fileIcon(f.ext)} ${esc(f.title||f.name)}</b>

        </div>
        <div class="row" style="margin:0">
          <button class="gh" data-a="fv_ren" title="Đổi tên hoặc sửa file này">✏️ Đổi tên</button>
          ${f.url?`<a class="btn" href="${esc(f.url)}" target="_blank">↗ Mở Link gốc</a>`:''}
          ${f.dataUrl?`<button class="gh" data-a="fv_dl">⬇ Tải file gốc</button>`:''}

    window._curViewAllowBack = !!allowBackToManager;

  Object.assign(act,{
    tgl_layout(){

    cfg(d){

      const curLy=getLayoutPref();
      modal(`<h3>Cài đặt làm bài</h3>
        <p><b>1. Cách hiển thị giao diện làm bài:</b></p>
        <div class="v-grid" id="cfg-ly" style="margin-bottom:12px">

        <div class="row"><button class="pri" data-a="go">Bắt đầu làm bài</button><button class="gh" data-a="close">Hủy</button></div>`);
      $('#modal').querySelectorAll('#cfg-ly .v-chip').forEach(el=>el.addEventListener('click',()=>{

    go(){

      modal('');

    },
    imp(){
      IM=[];
      const hasKey=!!(localStorage.getItem('gemini_api_key')||'').trim();
      modal(`<h3>Thêm bài vào ${esc(D.weeks[V.wi].name)}</h3>
        <input id="it" placeholder="Tên bài, ví dụ: Đề KSCL Đầu Vào">
        <p><b>Cách 1 (0 tốn token):</b> Bấm <button class="gh" style="padding:2px 8px;font-size:13px" data-a="cprompt">📋 Copy Prompt</button> rồi gửi kèm đề cho Gemini / ChatGPT bên ngoài, sau đó <b>dán mã JSON</b> vào ô dưới.<br>
        <b>Cách 2 (Tự động từ Văn bản / Ảnh / File PDF, Word, Docs):</b> Dán đề hoặc chọn file PDF, Word (.docx), Txt, Ảnh vào dưới ${hasKey?'<span class="badge">Đang dùng Gemini API (Đọc được PDF, Word, Ảnh, Đọc hiểu, True/False, Ghép cột Column A-B, Bảng phân loại PG/PP, Sắp xếp, Tự luận)</span>':'(dùng Gemini API hoặc Claude)'}.</p>
        <textarea id="tx" placeholder="Dán mã JSON HOẶC dán nội dung đề & đáp án vào đây..."></textarea>
        <p><span id="im" class="mu"></span></p>
        <div class="row">
          <label class="btn" style="border-color:var(--pr);color:var(--pr)">📎 Chọn File Đề / Ảnh (PDF, Word, Docs, Ảnh...)<input type="file" id="fi" accept="image/*,.pdf,.doc,.docx,.txt,.md,.html,.json" multiple hidden></label>
