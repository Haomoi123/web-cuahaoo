  document.head.appendChild(st39);

  // --- CÁC HÀM TIỆN ÍCH KIỂM TRA TRẠNG THÁI CHẤM TỪNG PHẦN ---
  function ensureGradedState(){
    if(!V || !V.ex) return;
    if(!V.gradedQs || typeof V.gradedQs !== 'object') V.gradedQs = {};
    if(!Array.isArray(V.batches)) V.batches = [];
    if(V.lastGradedElapsed === undefined) V.lastGradedElapsed = 0;
  }

  function isQuestionCorrect(ex, ans, qi){
    const q = ex?.qs?.[qi];
    if(!q) return false;
    return q.type === 'fill' ? isFillOk(q, ans?.[qi]) : ans?.[qi] === q.ans;
  }

  // Kiểm tra câu qi đã được chấm điểm hay chưa:
  // - Nếu đang làm bài (!V.rev): câu đã nằm trong V.gradedQs[qi]
  // - Nếu đang xem lại (V.rev): nếu là bài chấm 1 phần (V.h?.partial) và chưa bật showUngradedKey thì chỉ hiện đáp án cho các câu đã nằm trong V.gradedQs[qi]
  function isQuestionGradedInView(qi){
    if(!V || !V.ex) return false;
    const hasGradedMap = V.gradedQs && Object.keys(V.gradedQs).length > 0;
    if(V.rev){
      if(V.h?.partial && hasGradedMap && !V.showUngradedKey){
        return !!V.gradedQs[qi];
      }
      return true;
    }
    return !!(V.gradedQs && V.gradedQs[qi]);
  }

  function getExamGradingSummary(){
    if(!V || !V.ex) return {total:0, gradedCnt:0, gradedCorrect:0, gradedWrong:0, ungradedAnsweredCnt:0, ungradedBlankCnt:0, remainingCnt:0};
    ensureGradedState();
    const {ex, ans, gradedQs} = V;
    const total = (ex.qs || []).length;
    let gradedCnt = 0, gradedCorrect = 0, ungradedAnsweredCnt = 0, ungradedBlankCnt = 0;

    for(let i = 0; i < total; i++){
      const q = ex.qs[i];
      const isGr = !!(gradedQs && gradedQs[i]);
      if(isGr){
        gradedCnt++;
        if(isQuestionCorrect(ex, ans, i)) gradedCorrect++;
      } else {
        if(isAnswered(q, ans?.[i])) ungradedAnsweredCnt++;
        else ungradedBlankCnt++;
      }
    }
    const gradedWrong = gradedCnt - gradedCorrect;
    const remainingCnt = total - gradedCnt;
    return {
      total,
      gradedCnt,
      gradedCorrect,
      gradedWrong,
      ungradedAnsweredCnt,
      ungradedBlankCnt,
      remainingCnt
    };
  }

  // Tìm bản ghi lịch sử hiện có của bài này trong D.hist để gộp vào 1 bài duy nhất
  function findOrCreateConsolidatedHistRecord(){
    D.hist = D.hist || [];
    if(V.histId){
      const found = D.hist.find(x => x.id === V.histId);
      if(found) return found;
    }
    // Nếu chưa có V.histId, kiểm tra xem có bản ghi partial nào đang dang dở của cùng bài thi này không
    const wid = V.wid || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].id : '');
    const exId = V.ex?.id || '';
    const exTitle = V.ex?.title || '';
    for(let i = D.hist.length - 1; i >= 0; i--){
      const h = D.hist[i];
      if(h && h.partial && ((exId && h.ex?.id === exId) || (h.title === exTitle && (!wid || h.wid === wid)))){
        V.histId = h.id;
        return h;
      }
    }
    return null;
  }

  // Đồng bộ toàn bộ dữ liệu (bao gồm gradedQs, histId, batches, lastGradedElapsed, elapsed) vào D.savedSessions
  function syncPartialSessionToSaved(){
    if(!V || V.view !== 'exam' || !V.ex) return;
    ensureGradedState();
    const sum = getExamGradingSummary();
    D.savedSessions = D.savedSessions || {};
    const wid = V.wid || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].id : '');
    const weekName = V.weekName || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].name : (pathOf(wid) || ''));
    const sKey = V.sessionKey || V.ex.id || `${wid}__${V.ex.title || 'exam'}`;
    V.sessionKey = sKey;

    // Nếu đã chấm hết 100% số câu trong đề thì xóa khỏi danh sách làm dở
    if(sum.gradedCnt >= sum.total && sum.total > 0){
      delete D.savedSessions[sKey];
      for(const [k, sv] of Object.entries(D.savedSessions)){
        if((V.ex.id && sv.examId === V.ex.id) || (sv.title === V.ex.title && (!wid || sv.wid === wid))){
          delete D.savedSessions[k];
        }
      }
      save();
      return;
    }

    const usedSec = getUsedSec();
    const totalDone = sum.gradedCnt + sum.ungradedAnsweredCnt;

    D.savedSessions[sKey] = {
      key: sKey,
      examId: V.ex.id || '',
      title: V.ex.title || 'Bài thi',
      wid,
      weekName,
      wi: V.wi ?? -1,
      ei: V.ei ?? -1,
      ex: {...V.ex, files: []},
      order: (V.order || []).slice(),
      perm: (V.perm || []).map(p => Array.isArray(p) ? p.slice() : p),
      ans: {...(V.ans || {})},
      gradedQs: {...(V.gradedQs || {})},
      gradedCount: sum.gradedCnt,
      gradedCorrect: sum.gradedCorrect,
      partialGraded: sum.gradedCnt > 0,
      histId: V.histId || '',
      batches: JSON.parse(JSON.stringify(V.batches || [])),
      lastGradedElapsed: V.lastGradedElapsed || 0,
      elapsed: usedSec,
      limit: V.limit || 0,
      cur: V.cur ?? null,
      layout: V.layout || localStorage.getItem('luyende_layout') || 'split',
      fromMistakes: !!V.fromMistakes,
      doneCount: totalDone,
      totalCount: sum.total,
      savedAt: Date.now()
    };
    save();
  }

  // Cộng thêm số giây mới học vào D.studyLog của ngày hôm nay
  function addStudyTimeDelta(deltaSec){
    const dSec = Math.max(0, Math.round(deltaSec || 0));
    if(dSec <= 0) return;
    D.studyLog = D.studyLog || {};
    const dt = new Date();
    const tk = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    D.studyLog[tk] = (D.studyLog[tk] || 0) + dSec;
  }

  // --- HÀM CHÍNH: CHẤM ĐIỂM CÁC CÂU ĐÃ LÀM (HOẶC CHẤM 1 CÂU / CHẤM TOÀN BỘ) & GỘP VỀ 1 BÀI DUY NHẤT ---
  function executeConsolidateGrading(mode, specificQi){
    // mode: 'answered' (chỉ chấm các câu đã trả lời) | 'single' (chỉ chấm 1 câu specificQi) | 'all' (chấm tất cả và kết thúc đề)
    if(!V || V.view !== 'exam' || !V.ex) return;
    ensureGradedState();

    const {ex, ans} = V;
    const total = ex.qs.length;
    const newlyGradedIndices = [];

    if(mode === 'single' && specificQi !== undefined){
      if(!V.gradedQs[specificQi] && isAnswered(ex.qs[specificQi], ans[specificQi])){
        V.gradedQs[specificQi] = true;
        newlyGradedIndices.push(specificQi);
      }
    } else if(mode === 'answered'){
      for(let i = 0; i < total; i++){
        if(!V.gradedQs[i] && isAnswered(ex.qs[i], ans[i])){
          V.gradedQs[i] = true;
          newlyGradedIndices.push(i);
        }
      }
    } else if(mode === 'all'){
      for(let i = 0; i < total; i++){
        if(!V.gradedQs[i]){
          V.gradedQs[i] = true;
          newlyGradedIndices.push(i);
        }
      }
    }

    if(!newlyGradedIndices.length && mode !== 'all') return;

    // 1. Tính thời gian tích lũy và thời gian làm thêm của đợt này
    const curTotalUsed = Math.min(getUsedSec(), V.limit || 1e9);
    const prevElapsed = V.lastGradedElapsed || 0;
    const deltaUsed = Math.max(0, curTotalUsed - prevElapsed);
    V.lastGradedElapsed = curTotalUsed;
    // Chốt V.elapsed = curTotalUsed và đặt lại V.t0 = Date.now() để đồng hồ tiếp tục đếm mượt mà không bị nhân đôi
    V.elapsed = curTotalUsed;
    V.t0 = Date.now();
    addStudyTimeDelta(deltaUsed);

    // 2. Tính điểm đợt này và tổng điểm tích lũy của cả bài
    const batchCorrect = newlyGradedIndices.filter(qi => isQuestionCorrect(ex, ans, qi)).length;
    const sum = getExamGradingSummary();
    const isNowComplete = (mode === 'all' || sum.gradedCnt >= total);

    const batchInfo = {
      batchNo: (V.batches?.length || 0) + 1,
      ts: Date.now(),
      count: newlyGradedIndices.length,
      correct: batchCorrect,
      totalGraded: sum.gradedCnt,
      totalCorrect: sum.gradedCorrect,
      usedDelta: deltaUsed,
      totalUsed: curTotalUsed
    };
    V.batches.push(batchInfo);

    // 3. Tạo mới hoặc CẬP NHẬT HỢP NHẤT vào 1 bản ghi duy nhất trong D.hist
    const wid = V.wid || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].id : '');
    const weekName = V.weekName || (V.wi >= 0 && D.weeks[V.wi] ? D.weeks[V.wi].name : (pathOf(wid) || ''));
    let h = findOrCreateConsolidatedHistRecord();

    if(h){
      // Cập nhật trực tiếp vào bản ghi lịch sử của bài này (Gộp kết quả + Cộng dồn thời gian!)
      h.ts = Date.now();
      h.c = sum.gradedCorrect;
      h.t = total;
      h.used = Math.max(h.used || 0, curTotalUsed);
      h.limit = V.limit || h.limit || 0;
      h.ex = ex;
      h.order = (V.order || []).slice();
      h.perm = JSON.parse(JSON.stringify(V.perm || []));
      h.ans = JSON.parse(JSON.stringify(V.ans || {}));
      h.gradedQs = {...V.gradedQs};
      h.gradedCount = sum.gradedCnt;
      h.partial = !isNowComplete;
      h.batches = JSON.parse(JSON.stringify(V.batches));
    } else {
      h = {
        id: V.histId || uid(),
        firstTs: Date.now(),
        ts: Date.now(),
        title: ex.title,
        week: weekName,
        wid,
        c: sum.gradedCorrect,
        t: total,
        used: curTotalUsed,
        limit: V.limit || 0,
        ex,
        order: (V.order || []).slice(),
        perm: JSON.parse(JSON.stringify(V.perm || [])),
        ans: JSON.parse(JSON.stringify(V.ans || {})),
        gradedQs: {...V.gradedQs},
        gradedCount: sum.gradedCnt,
        partial: !isNowComplete,
        batches: JSON.parse(JSON.stringify(V.batches))
      };
      V.histId = h.id;
      D.hist.push(h);
    }

    V.h = h;
    if(typeof window.markMistakesDirty === 'function') window.markMistakesDirty();

    // 4. Nếu đã chấm xong toàn bộ 100% câu trong đề (hoặc chọn nộp kết thúc toàn bộ)
    if(isNowComplete){
      clearInterval(TI);
      V.rev = true;
      V.cur = null;
      syncPartialSessionToSaved(); // Sẽ tự động xóa khỏi savedSessions vì đã hoàn thành 100%
      if(window.SFX) window.SFX.submitSuccess();
      save();
      render();
      return;
    }

    // 5. Nếu vẫn còn câu chưa làm (Chấm từng phần):
    // Giữ người dùng ở màn hình làm bài hiện tại, khóa & hiện lời giải các câu vừa chấm, giữ mở các câu còn lại!
    syncPartialSessionToSaved();
    if(window.SFX){
      if(mode === 'single') window.SFX.ding();
      else window.SFX.submitSuccess();
    }
    save();
    drawQ();
  }

  // --- GHI ĐÈ drawQ ĐỂ HỖ TRỢ HIỂN THỊ HỖN HỢP (CÂU ĐÃ CHẤM HIỆN ĐÁP ÁN + GIẢI THÍCH, CÂU CHƯA CHẤM VẪN LÀM BÌNH THƯỜNG) ---
  drawQ = function(){
    if(!V || !V.ex) return;
    ensureGradedState();
    const {ex, order, perm, ans, rev} = V;
    const L = $('#L'), R = $('#R');
    if(!L || !R) return;
    const ls = L.scrollTop, rs = R.scrollTop;
    const nm = qi => order.indexOf(qi) + 1;
    const ok = qi => isQuestionCorrect(ex, ans, qi);
    const gq = g => order.filter(i => ex.qs[i].g === g);
    const rng = g => {
      const a = gq(g).map(nm), x = Math.min(...a), y = Math.max(...a);
      return x === y ? `Câu ${x}` : `Nhóm câu hỏi ${x} - ${y}`;
    };
    const isVert = V.layout === 'vertical';
    const filterUngraded = !!(V.filterUngraded && !rev);

    // Hàm dựng thẻ câu hỏi (dùng chung cho cả giao diện Ngang và Dọc)
    const buildQuestionCard = (qi, gi, inVerticalMode) => {
      const q = ex.qs[qi], a = ans[qi], answered = isAnswered(q, a);
      const qGraded = isQuestionGradedInView(qi);
      const isPending = !qGraded && answered && !rev;
      const hideCard = filterUngraded && qGraded;

      const showStem = inVerticalMode
        ? !!(q.q && String(q.q).trim() !== '')
        : !!(ex.groups[gi]?.passage && q.q && String(q.q).trim() !== '');
      const stemKey = inVerticalMode ? (gi + ':s' + qi) : (gi + ':rq' + qi);
      const stemHtml = showStem ? `<div class="qstem">${seg(fmtArrangeText(q.q), stemKey)}</div>` : '';

      // Nhãn trạng thái chấm của câu này
      let statusTagHtml = '';
      if(qGraded){
        const pass = ok(qi);
        statusTagHtml = `<span class="graded-lock-tag ${pass ? 'ok' : 'no'}">${pass ? '✅ Đã chấm: Đúng' : (answered ? '❌ Đã chấm: Sai' : '⚪ Đã chấm: Bỏ trống')}</span>`;
      } else if(rev && V.h?.partial){
        statusTagHtml = `<span class="graded-lock-tag wait">⏳ Chưa làm (Để làm sau)</span>`;
      } else if(isPending){
        statusTagHtml = `<span class="graded-lock-tag wait">● Chờ chấm</span>`;
      }

      // Các nút hành động trên góc phải thẻ câu hỏi
      const actionBtnsHtml = `<span class="cn-actions">
        ${!rev && !qGraded ? `<button type="button" class="gh grade-one-btn ${answered ? 'show' : ''}" data-a="grade_one_q" data-q="${qi}" title="Chấm điểm ngay câu này và xem lời giải">✓ Chấm câu này</button>` : ''}
        ${!rev && !qGraded ? `<button type="button" class="gh clr-ans-btn ${answered ? 'show' : ''}" data-a="clr_ans" data-q="${qi}" title="${q.type === 'fill' ? 'Xóa nội dung vừa điền' : 'Hủy chọn đáp án câu này'}">${q.type === 'fill' ? '✕ Xóa trả lời' : '✕ Bỏ chọn'}</button>` : ''}
        <button type="button" class="gh" style="padding:2px 8px;font-size:12px" data-a="editq" data-q="${qi}" title="Sửa nhanh câu hỏi và đáp án này">✏️ Sửa câu</button>
      </span>`;

      if(q.type === 'fill'){
        const correctVal = q.correctText || (q.opts && q.opts[q.ans]) || '';
        const isCorrect = ok(qi);
        let expHtml = '';
        if(qGraded){
          expHtml = `<div class="exp">${!answered ? '⚪ Chưa trả lời. ' : isCorrect ? '✅ Chính xác. ' : '❌ Chưa đúng. '}Đáp án đúng: <b>${esc(correctVal)}</b>${q.exp ? `<br>💡 ${fmtRich(q.exp)}` : ''}${q.vi ? `<br>🌐 ${fmtRich(q.vi)}` : ''}</div>`;
        } else if(rev && V.h?.partial){
          expHtml = `<div class="exp" style="border-left:3px solid #f59e0b">⏳ <b>Câu này bạn để dành chưa làm.</b> Bấm nút <b>"▶ Làm tiếp các câu còn lại"</b> ở thanh trên cùng để làm và chấm tiếp!</div>`;
        }
        return `<div class="cd ${answered || qGraded ? 'dn' : ''} ${qGraded ? 'graded-locked' : ''} ${hideCard ? 'hide-by-ungraded-filter' : ''}" id="R${qi}" data-a="fq" data-i="${qi}">
          <div class="cn" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
            <span>Câu ${nm(qi)}. <small class="mu">(Tự luận điền đáp án)</small>${statusTagHtml}</span>
            ${actionBtnsHtml}
          </div>
          ${stemHtml}
          <input class="${qGraded ? (isCorrect ? 'fill-in ok' : 'fill-in no') : ''}" style="width:100%;margin-top:4px" ${(rev || qGraded) ? 'disabled' : ''} data-a="fill" data-q="${qi}" value="${esc(a || '')}" placeholder="Nhập đáp án của bạn vào đây...">
          ${expHtml}
        </div>`;
      }

      const activePerm = (perm[qi] || getValidOptIndices(q)).filter(oi => oi < q.opts.length && String(q.opts[oi] ?? '').trim() !== '');
      const finalPerm = activePerm.length ? activePerm : getValidOptIndices(q);
      const isTF = q.type === 'tf' || finalPerm.length <= 2;
      const opsHtml = finalPerm.map((oi, pi) => {
        const c = qGraded
          ? (oi === q.ans ? 'ok' : oi === a ? 'no' : '')
          : (oi === a ? 'sel' : '');
        return `<div class="op ${c}" tabindex="0" ${qGraded ? '' : `data-a="pick" data-q="${qi}" data-o="${oi}"`}><i>${ltr[pi] || pi + 1}</i><span>${seg(q.opts[oi], gi + ':ro' + qi + '_' + oi)}</span></div>`;
      }).join('');
      const wrappedOps = isTF ? `<div class="tf-grid">${opsHtml}</div>` : opsHtml;
      const ansPos = finalPerm.indexOf(q.ans);
      const ansLetter = ltr[ansPos >= 0 ? ansPos : q.ans] || 'A';

      let expHtml = '';
      if(qGraded){
        expHtml = `<div class="exp">${a == null ? '⚪ Chưa trả lời. ' : ok(qi) ? '✅ Chính xác. ' : '❌ Chưa đúng. '}Đáp án: <b>${ansLetter}. ${fmtRich(q.opts[q.ans])}</b>${q.exp ? `<br>💡 ${fmtRich(q.exp)}` : ''}${q.vi ? `<br>🌐 ${fmtRich(q.vi)}` : ''}</div>`;
      } else if(rev && V.h?.partial){
        expHtml = `<div class="exp" style="border-left:3px solid #f59e0b">⏳ <b>Câu này bạn để dành chưa làm.</b> Bấm nút <b>"▶ Làm tiếp các câu còn lại"</b> ở thanh trên cùng để vào làm tiếp và gộp điểm!</div>`;
      }

      return `<div class="cd ${answered || qGraded ? 'dn' : ''} ${qGraded ? 'graded-locked' : ''} ${hideCard ? 'hide-by-ungraded-filter' : ''}" id="R${qi}" data-a="fq" data-i="${qi}">
        <div class="cn" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
          <span>Câu ${nm(qi)}.${isTF ? '<span class="tf-tag">TRUE / FALSE</span>' : ''}${statusTagHtml}</span>
          ${actionBtnsHtml}
        </div>
        ${stemHtml}
        ${wrappedOps}
        ${expHtml}
      </div>`;
    };

    // Hàm dựng đoạn văn đục lỗ (Cloze passage) hỗ trợ hiển thị từng ô trống đã chấm vs chưa chấm
    const buildPassageHtml = (g, gi, extraCls) => {
      if(!g.passage) return '';
      return `<div class="ps ${extraCls || ''}">` + g.passage.split(/\[\[(\d+)\]\]/).map((t, i) => {
        if(i % 2 === 0) return seg(t, gi + ':' + i);
        const qi = +t - 1, q = ex.qs[qi];
        if(!q) return '(' + t + ')';
        const qGraded = isQuestionGradedInView(qi);
        if(q.type === 'fill'){
          const uVal = ans[qi] || '';
          const cVal = q.correctText || (q.opts && q.opts[q.ans]) || '';
          if(qGraded){
            const pass = ok(qi);
            return `<span class="fill-in ${pass ? 'ok' : 'no'}" id="L${qi}" data-a="fq" data-i="${qi}">(${t}) ${esc(uVal || '___')} ${pass ? '✓' : `➜ ${esc(cVal)}`}</span>`;
          }
          return `<span>(${t}) <input class="fill-in" id="L${qi}" ${(rev) ? 'disabled' : ''} data-a="fill" data-q="${qi}" value="${esc(uVal)}" placeholder="Điền từ..."></span>`;
        }
        const a = qGraded ? q.ans : ans[qi];
        const cls = qGraded ? (ok(qi) ? 'ok' : 'no') : (a != null ? 'dn pending' : '');
        return `<button class="bl ${cls}" id="L${qi}" data-a="fq" data-i="${qi}">(${t}) ${a != null ? esc(q.opts[a]) : '______'}</button>`;
      }).join('') + `</div>`;
    };

    if(isVert){
      L.innerHTML = ex.groups.map((g, gi) => {
        const pasHtml = buildPassageHtml(g, gi, 'vert-ps');
        const cardsHtml = gq(gi).map(qi => buildQuestionCard(qi, gi, true)).join('');
        return `<div class="grp" id="G${gi}"><div class="gh2">${rng(gi)}</div>${g.instr ? `<div class="ins">${seg(g.instr, gi + ':ins')}</div>` : ''}${pasHtml}${cardsHtml}</div>`;
      }).join('');
      R.innerHTML = '';
      L.scrollTop = ls;
    } else {
      L.innerHTML = ex.groups.map((g, gi) => {
        let body = '';
        if(g.passage){
          body = buildPassageHtml(g, gi, '');
        } else {
          body = gq(gi).map(qi => {
            const q = ex.qs[qi];
            const qGraded = isQuestionGradedInView(qi);
            const hideSt = filterUngraded && qGraded;
            return `<div class="st ${hideSt ? 'hide-by-ungraded-filter' : ''}" id="L${qi}" data-a="fq" data-i="${qi}"><b>Câu ${nm(qi)}.</b> ${seg(fmtArrangeText(q.q), gi + ':s' + qi)}</div>`;
          }).join('');
        }
        return `<div class="grp" id="G${gi}"><div class="gh2">${rng(gi)}</div>${g.instr ? `<div class="ins">${seg(g.instr, gi + ':ins')}</div>` : ''}${body}</div>`;
      }).join('');

      R.innerHTML = ex.groups.map((g, gi) => `<div class="rg">${rng(gi)}</div>` + gq(gi).map(qi => buildQuestionCard(qi, gi, false)).join('')).join('');
      L.scrollTop = ls;
      R.scrollTop = rs;
    }

    updateProgressText();
    if(V.cur != null) applyCurHighlight(V.cur);
  };

  // --- CẬP NHẬT THANH CÂU HỎI (#QB), THANH HEADER (.eh) & BANNER TIẾN ĐỘ ĐỢT CHẤM ---
  function renderBatchConsolidationBar(){
    const qb = $('#QB');
    if(!qb || !V || V.view !== 'exam' || !V.ex) return;
    const sum = getExamGradingSummary();

    // 1. Cập nhật nút "✅ Chấm câu đã làm (X)" trên thanh Header (.eh)
    const eh = document.querySelector('#main .eh');
    if(eh){
      let partialBtn = document.getElementById('eh-grade-partial-btn');
      let resumePartialBtn = document.getElementById('eh-resume-partial-btn');
      if(!V.rev){
        if(resumePartialBtn) resumePartialBtn.remove();
        if(sum.ungradedAnsweredCnt > 0 && (sum.ungradedBlankCnt > 0 || sum.gradedCnt > 0)){
          if(!partialBtn){
            partialBtn = document.createElement('button');
            partialBtn.type = 'button';
            partialBtn.id = 'eh-grade-partial-btn';
            partialBtn.className = 'pri btn-grade-partial';
            partialBtn.dataset.a = 'grade_answered_now';
            const subBtn = eh.querySelector('button[data-a="sub"]');
            if(subBtn) subBtn.before(partialBtn);
            else eh.appendChild(partialBtn);
          }
          partialBtn.innerHTML = `✅ Chấm ${sum.ungradedAnsweredCnt} câu vừa làm${sum.ungradedBlankCnt > 0 ? ` (Còn ${sum.ungradedBlankCnt} câu để sau)` : ''}`;
          partialBtn.title = 'Chấm điểm ngay các câu bạn đã làm và giữ các câu còn lại để làm tiếp hoặc làm sau';
        } else if(partialBtn){
          partialBtn.remove();
        }
        // Đổi nhãn nút Nộp bài cho rõ ràng nếu đã chấm 1 phần
        const subBtn = eh.querySelector('button[data-a="sub"]');
        if(subBtn){
          subBtn.textContent = sum.gradedCnt > 0 ? '🏁 Chấm & Nộp bài' : 'Nộp bài';
        }
      } else {
        if(partialBtn) partialBtn.remove();
        // Nếu đang ở màn hình Xem lại (V.rev) mà bài thi còn câu chưa làm (V.h?.partial hoặc có câu bỏ trống)
        const unansCnt = (V.ex.qs || []).filter((q, i) => !(V.gradedQs && V.gradedQs[i]) && !isAnswered(q, V.ans?.[i])).length;
        const remCnt = V.h?.partial ? sum.remainingCnt : unansCnt;
        if(remCnt > 0){
          if(!resumePartialBtn){
            resumePartialBtn = document.createElement('button');
            resumePartialBtn.type = 'button';
            resumePartialBtn.id = 'eh-resume-partial-btn';
            resumePartialBtn.className = 'pri btn-resume';
            resumePartialBtn.dataset.a = 'continue_remaining_qs';
            const backBtn = eh.querySelector('button[data-a="back"]');
            if(backBtn) backBtn.before(resumePartialBtn);
            else eh.appendChild(resumePartialBtn);
          }
          resumePartialBtn.innerHTML = `▶ Làm tiếp ${remCnt} câu còn lại (Gộp vào bài này)`;
        } else if(resumePartialBtn){
          resumePartialBtn.remove();
        }
      }
    }

    // 2. Hiển thị thanh Batch Consolidation Bar ngay dưới #QB nếu bài thi đã có ít nhất 1 đợt chấm (hoặc đang xem lại bài nhiều đợt)
    let bar = document.getElementById('batch-status-bar');
    const batches = V.batches || V.h?.batches || [];
    const showBar = (sum.gradedCnt > 0 && !V.rev) || (V.rev && (V.h?.partial || batches.length > 1));

    if(!showBar){
      if(bar) bar.remove();
      return;
    }

    if(!bar){
      bar = document.createElement('div');
      bar.id = 'batch-status-bar';
      bar.className = 'batch-status-bar no-print';
      qb.after(bar);
    }

    const gradedPct = sum.gradedCnt ? Math.round((sum.gradedCorrect / sum.gradedCnt) * 100) : 0;
    const totalUsedSec = V.rev ? (V.h?.used || 0) : getUsedSec();
    const batchesHtml = batches.length > 0 ? `
      <div class="batch-history-mini">
        <span style="font-weight:700;color:var(--pr)">🗂 Lịch sử gộp (${batches.length} đợt):</span>
        ${batches.map(b => `<span class="batch-chip">Đợt ${b.batchNo}: Chấm ${b.count} câu (Đúng ${b.correct}/${b.count}) · +${fmt(b.usedDelta || 0)}</span>`).join('')}
      </div>
    ` : '';

    bar.innerHTML = `
      <div style="flex:1;min-width:260px">
        <div class="batch-metrics">
          <span class="batch-pill" style="border-color:var(--ok);color:var(--ok)">✅ Đã chấm: <b>${sum.gradedCnt}/${sum.total} câu</b> (${sum.gradedCorrect} đúng · ${sum.gradedWrong} sai · ${gradedPct}%)</span>
          ${!V.rev && sum.ungradedAnsweredCnt > 0 ? `<span class="batch-pill" style="border-color:#f59e0b;color:#d97706">● Mới làm thêm: <b>${sum.ungradedAnsweredCnt} câu</b> (chờ chấm)</span>` : ''}
          ${sum.remainingCnt > 0 ? `<span class="batch-pill">⏳ Còn lại: <b>${sum.remainingCnt} câu</b> chưa chấm</span>` : `<span class="batch-pill" style="background:var(--ok);color:#fff;border-color:var(--ok)">🏆 Đã hoàn thành 100% câu hỏi!</span>`}
          <span class="batch-pill" style="color:var(--pr)">⏱ Tổng thời gian tích lũy: <b id="batch-total-time-lbl">${fmt(totalUsedSec)}</b></span>
        </div>
        ${batchesHtml}
      </div>
      <div class="row" style="margin:0">
        ${!V.rev ? `
          ${sum.ungradedAnsweredCnt > 0 ? `<button type="button" class="pri btn-grade-partial" style="padding:5px 11px;font-size:12.5px" data-a="grade_answered_now">✅ Chấm ngay ${sum.ungradedAnsweredCnt} câu mới làm</button>` : ''}
          ${sum.remainingCnt > 0 ? `<button type="button" class="gh" style="padding:5px 10px;font-size:12px;${V.filterUngraded ? 'border-color:var(--pr);color:var(--pr);font-weight:700;background:var(--hl)' : ''}" data-a="tgl_filter_ungraded">${V.filterUngraded ? `📋 Hiện tất cả (${sum.total})` : `🔍 Chỉ hiện ${sum.remainingCnt} câu chưa chấm`}</button>` : ''}
          ${sum.remainingCnt > 0 ? `<button type="button" class="gh" style="padding:5px 10px;font-size:12px" data-a="jump_next_ungraded" title="Nhảy tới câu đầu tiên chưa làm">⏭ Câu chưa làm tiếp</button>` : ''}
          <button type="button" class="gh" style="padding:5px 10px;font-size:12px;border-color:#f59e0b;color:#d97706;font-weight:700" data-a="save_partial_and_exit" title="Lưu kết quả đã chấm vào bài duy nhất và thoát ra, lúc khác vào làm tiếp các câu còn lại">🏠 Lưu & Làm tiếp các câu còn lại sau</button>
        ` : `
          ${sum.remainingCnt > 0 ? `
            <button type="button" class="pri btn-resume" style="padding:5px 12px;font-size:12.5px" data-a="continue_remaining_qs">▶ Làm tiếp ${sum.remainingCnt} câu còn lại & Chấm gộp</button>
            <button type="button" class="gh" style="padding:5px 10px;font-size:12px" data-a="tgl_ungraded_key">${V.showUngradedKey ? '🙈 Ẩn đáp án câu chưa làm' : '👁 Xem đáp án cả câu chưa làm'}</button>
          ` : ''}
        `}
      </div>
    `;
  }

  // Ghi đè drawQBar & updateProgressText để phân biệt rõ: Câu đã chấm Đúng (Xanh), Câu đã chấm Sai (Đỏ), Câu mới chọn chờ chấm (Vàng cam), Câu chưa làm (Trắng)
  drawQBar = function(justAnsweredQi){
    const qb = $('#QB');
    if(!qb || !V || !V.ex) return;
    ensureGradedState();
    const {ex, order, ans, rev, cur} = V;
    const sum = getExamGradingSummary();

    let progTrack = $('#exam-prog-track');
    if(!progTrack){
      qb.insertAdjacentHTML('beforebegin', `<div class="exam-prog-track" id="exam-prog-track"><div class="exam-prog-fill" id="exam-prog-fill"></div></div>`);
      progTrack = $('#exam-prog-track');
    }
    const progFill = $('#exam-prog-fill');
    if(progFill){
      const total = ex.qs.length || 1;
      const doneCnt = rev ? sum.gradedCorrect : (sum.gradedCnt + sum.ungradedAnsweredCnt);
      progFill.style.width = Math.round((doneCnt / total) * 100) + '%';
    }

    qb.innerHTML = `<span class="qbar-lbl">Câu hỏi (${order.length}):</span>` + order.map((qi, idx) => {
      const q = ex.qs[qi];
      const answered = isAnswered(q, ans[qi]);
      const qGraded = isQuestionGradedInView(qi);
      const pass = isQuestionCorrect(ex, ans, qi);
      let cls = '';
      let sym = '';
      let tip = `Nhấn để chuyển đến Câu ${idx + 1}`;

      if(qGraded){
        cls = pass ? 'done' : 'wrong';
        sym = pass ? ' ✓' : ' ✗';
        tip += pass ? ' (Đã chấm: Đúng)' : ' (Đã chấm: Sai)';
      } else if(answered && !rev){
        cls = 'pending';
        sym = ' ●';
        tip += ' (Đã chọn — Chờ chấm)';
      }
      if(cur === qi) cls += ' cur';
      if(justAnsweredQi === qi) cls += ' qb-pop';
      return `<button class="qb ${cls.trim()}" id="Q${qi}" data-a="fq" data-i="${qi}" title="${tip}">${idx + 1}${sym}</button>`;
    }).join('');

    if(!rev && sum.ungradedAnsweredCnt > 0){
      const btnAll = document.createElement('button');
      btnAll.type = 'button';
      btnAll.id = 'qb-clr-all-btn';
      btnAll.className = 'qb-clr-all';
      btnAll.dataset.a = 'clr_all_ans';
      btnAll.title = sum.gradedCnt > 0 ? 'Xóa các câu mới chọn (giữ nguyên các câu đã chấm)' : 'Xóa toàn bộ các câu đã chọn';
      btnAll.innerHTML = sum.gradedCnt > 0 ? `✕ Xóa ${sum.ungradedAnsweredCnt} câu mới chọn` : `✕ Xóa hết đã chọn (${sum.ungradedAnsweredCnt})`;
      qb.appendChild(btnAll);
    }

    renderBatchConsolidationBar();
  };

  updateProgressText = function(justAnsweredQi){
    const pg = $('#pg');
    if(!pg || !V || !V.ex) return;
    const sum = getExamGradingSummary();
    if(V.rev){
      if(V.h?.partial && sum.gradedCnt < sum.total){
        const pctGraded = sum.gradedCnt ? Math.round((sum.gradedCorrect / sum.gradedCnt) * 100) : 0;
        pg.textContent = `⏳ Đã chấm ${sum.gradedCnt}/${sum.total} câu: ✅ ${sum.gradedCorrect} đúng, ❌ ${sum.gradedWrong} sai (${pctGraded}%) · Còn ${sum.remainingCnt} câu làm sau`;
      } else {
        const c = V.ex.qs.filter((q, i) => isQuestionCorrect(V.ex, V.ans, i)).length;
        pg.textContent = `✅ ${c} đúng, ❌ ${sum.total - c} sai / ${sum.total} câu (${Math.round((c / (sum.total || 1)) * 100)}%)`;
      }
    } else if(sum.gradedCnt > 0){
      pg.textContent = `Đã chấm ${sum.gradedCnt}/${sum.total} (✅${sum.gradedCorrect}) · Mới làm: ${sum.ungradedAnsweredCnt} · Còn trống: ${sum.ungradedBlankCnt}`;
    } else {
      const done = sum.ungradedAnsweredCnt;
      pg.textContent = `Đã làm ${done}/${sum.total} câu (${Math.round((done / (sum.total || 1)) * 100)}%)`;
    }
    drawQBar(justAnsweredQi);
  };

  // --- CẬP NHẬT TƯƠNG TÁC CHỌN ĐÁP ÁN (act.pick), XÓA ĐÁP ÁN (act.clr_ans) & GÕ TỰ LUẬN ĐỂ BẢO VỆ CÂU ĐÃ CHẤM ---
  const origPick38 = act.pick;
  act.pick = function(d){
    if(V.rev) return;
    const qi = +d.q;
    if(V.gradedQs && V.gradedQs[qi]){
      // Câu này đã được chấm ở đợt trước -> khóa kết quả, chỉ cuộn tới để xem
      focusQ(qi, true, 'R');
      return;
    }
    origPick38(d);
    // Hiện nút "✓ Chấm câu này" trên thẻ câu hỏi vừa chọn
    const rCard = document.getElementById('R' + qi);
    if(rCard){
      const gBtn = rCard.querySelector(`.grade-one-btn[data-q="${qi}"]`);
      const answered = isAnswered(V.ex.qs[qi], V.ans[qi]);
      if(gBtn) gBtn.classList.toggle('show', answered);
    }
    updateProgressText(qi);
    syncPartialSessionToSaved();
  };

  const origClrAns38 = act.clr_ans;
  act.clr_ans = function(d){
    if(V.rev) return;
    const qi = +d.q;
    if(V.gradedQs && V.gradedQs[qi]) return;
    origClrAns38(d);
    const rCard = document.getElementById('R' + qi);
    if(rCard){
      rCard.querySelector(`.grade-one-btn[data-q="${qi}"]`)?.classList.remove('show');
    }
    updateProgressText(qi);
    syncPartialSessionToSaved();
  };

  // Đồng bộ nút "✓ Chấm câu này" khi người dùng gõ vào ô tự luận input[data-a="fill"]
  document.addEventListener('input', e => {
    const t = e.target;
    if(t && t.dataset?.a === 'fill' && V && V.view === 'exam' && !V.rev){
      const qi = +t.dataset.q;
      if(V.gradedQs && V.gradedQs[qi]) return;
      const hasVal = t.value.trim().length > 0;
      const rCard = document.getElementById('R' + qi);
      if(rCard){
        const gBtn = rCard.querySelector(`.grade-one-btn[data-q="${qi}"]`);
        if(gBtn) gBtn.classList.toggle('show', hasVal);
      }
      renderBatchConsolidationBar();
    }
  });

  // Cập nhật nhãn tổng thời gian trên thanh Batch Bar mỗi giây
  setInterval(() => {
    if(V && V.view === 'exam' && !V.rev && !V.paused){
      const lbl = document.getElementById('batch-total-time-lbl');
      if(lbl) lbl.textContent = fmt(getUsedSec());
    }
  }, 1000);

  // --- GHI ĐÈ HỘP THOẠI NỘP BÀI (act.sub), XEM LẠI LỊCH SỬ (act.hv) & KHÔI PHỤC PHIÊN LÀM DỞ ---
  act.sub = function(){
    if(V.rev || !V.ex) return;
    const sum = getExamGradingSummary();

    // Trường hợp vẫn còn câu chưa trả lời (hoặc đã chấm 1 phần và đang làm thêm)
    if(sum.ungradedBlankCnt > 0){
      modal(`<h3>📝 Chấm điểm câu đã làm hay Nộp toàn bộ đề?</h3>
        <div style="background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0;font-size:14px;line-height:1.7">
          ${sum.gradedCnt > 0 ? `• Đã chấm ở các đợt trước: <b style="color:var(--ok)">${sum.gradedCnt}/${sum.total} câu</b> (Đúng ${sum.gradedCorrect} câu)<br>` : ''}
          • Số câu vừa làm mới (chờ chấm): <b style="color:var(--pr)">${sum.ungradedAnsweredCnt} câu</b><br>
          • Số câu còn bỏ trống (chưa làm): <b style="color:#d97706">${sum.ungradedBlankCnt} câu</b><br>
          • Tổng thời gian tích lũy: <b>${fmt(getUsedSec())}</b>
        </div>
        <p class="mu" style="font-size:13.5px">💡 <b>Gợi ý:</b> Bạn có thể bấm <b>"Chấm các câu đã làm"</b> để xem ngay kết quả phần vừa làm, còn <b>${sum.ungradedBlankCnt} câu chưa làm</b> sẽ được giữ lại để bạn làm tiếp ngay hoặc để lúc khác vào làm tiếp rồi chấm gộp vào <b>cùng 1 bài duy nhất</b>!</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
          ${sum.ungradedAnsweredCnt > 0 ? `
            <button type="button" class="pri btn-grade-partial" style="padding:11px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center" data-a="sub_grade_partial">
              <span>✅ <b>Chấm ${sum.ungradedAnsweredCnt} câu vừa làm</b> (Để dành ${sum.ungradedBlankCnt} câu còn lại làm tiếp / làm sau)</span>
              <span>Chấm ngay ➜</span>
            </button>
            <button type="button" class="pri btn-save-exit" style="padding:11px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center" data-a="sub_grade_partial_and_exit">
              <span>🏠 <b>Chấm ${sum.ungradedAnsweredCnt} câu vừa làm & Thoát ra</b> (Lúc khác vào làm tiếp ${sum.ungradedBlankCnt} câu)</span>
              <span>Lưu & Thoát ➜</span>
            </button>
          ` : ''}
          <button type="button" class="gh" style="padding:10px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;border-color:var(--no);color:var(--no)" data-a="sub2">
            <span>🏁 <b>Chấm & Nộp kết thúc toàn bộ đề</b> (Tính ${sum.ungradedBlankCnt} câu trống là chưa đúng)</span>
            <span>Nộp hết</span>
          </button>
          <button type="button" class="gh" style="padding:9px 14px;text-align:center" data-a="close">⬅ Quay lại làm tiếp</button>
        </div>`);
      return;
    }

    // Trường hợp đã trả lời kín 100% các câu hỏi
    modal(`<h3>🏁 Hoàn thành & Chấm toàn bộ bài thi?</h3>
      <p>Bạn đã hoàn thành <b>${sum.total}/${sum.total} câu hỏi</b> (Tổng thời gian tích lũy: <b>${fmt(getUsedSec())}</b>).</p>
      ${sum.gradedCnt > 0 ? `<p class="mu" style="font-size:13.5px">Kết quả của <b>${sum.ungradedAnsweredCnt} câu cuối cùng</b> sẽ được gộp chung với <b>${sum.gradedCnt} câu đã chấm trước đó</b> thành <b>1 bài hoàn chỉnh duy nhất</b>!</p>` : ''}
      <div class="row" style="margin-top:14px">
        <button class="pri" data-a="sub2">🏁 Chấm điểm & Hoàn tất</button>
        <button class="gh" data-a="close">Kiểm tra lại</button>
      </div>`);
  };

  // Ghi đè submit() để luôn gộp kết quả và tổng thời gian về 1 bản ghi duy nhất trong D.hist
  submit = function(){
    if(V.rev) return;
    executeConsolidateGrading('all');
  };

  // Hàm mở bài thi để làm tiếp các câu còn lại (từ bản ghi Lịch sử D.hist hoặc từ D.savedSessions)
  function continueRemainingQuestionsFromHist(histId){
    const h = (D.hist || []).find(x => x.id === histId);
    if(!h || !h.ex) return;

    // Xác định những câu nào đã được chấm (hoặc đã trả lời ở lần trước)
    const gradedQs = {};
    if(h.gradedQs && Object.keys(h.gradedQs).length > 0){
      Object.assign(gradedQs, h.gradedQs);
    } else {
      (h.ex.qs || []).forEach((q, qi) => {
        if(isAnswered(q, h.ans?.[qi])) gradedQs[qi] = true;
      });
    }

    let wi = D.weeks.findIndex(w => w.id === h.wid);
    if(wi < 0 && h.week) wi = D.weeks.findIndex(w => w.name === h.week);
    let ei = -1;
    let liveEx = h.ex;
    if(wi >= 0 && D.weeks[wi]){
      const fIdx = (D.weeks[wi].exams || []).findIndex(e => (h.ex.id && e.id === h.ex.id) || e.title === h.title);
      if(fIdx >= 0){
        ei = fIdx;
        liveEx = D.weeks[wi].exams[fIdx];
        if(h.ex.hl && h.ex.hl.length) liveEx.hl = h.ex.hl;
      }
    }

    // Kiểm tra xem trong D.savedSessions có câu trả lời nháp nào mới hơn không
    const sKey = liveEx.id || `${h.wid || ''}__${liveEx.title || 'exam'}`;
    const savedS = D.savedSessions?.[sKey];
    const mergedAns = {...(h.ans || {}), ...(savedS?.ans || {})};
    const totalPrevUsed = Math.max(h.used || 0, savedS?.elapsed || 0);

    // Tìm câu đầu tiên chưa được chấm để cuộn tới ngay
    const order = (h.order && h.order.length === liveEx.qs.length) ? h.order.slice() : liveEx.qs.map((_, i) => i);
    const firstUngradedQi = order.find(qi => !gradedQs[qi]) ?? 0;

    modal('');
    V = {
      view: 'exam',
      sessionKey: sKey,
      histId: h.id,
      wid: h.wid || (wi >= 0 ? D.weeks[wi].id : ''),
      weekName: h.week || (wi >= 0 ? D.weeks[wi].name : ''),
      wi,
      ei,
      ex: liveEx,
      order,
      perm: (h.perm && h.perm.length === liveEx.qs.length) ? JSON.parse(JSON.stringify(h.perm)) : liveEx.qs.map(q => getValidOptIndices(q)),
      ans: mergedAns,
      gradedQs,
      batches: JSON.parse(JSON.stringify(h.batches || [{
        batchNo: 1,
        ts: h.ts || Date.now(),
        count: Object.keys(gradedQs).length,
        correct: h.c || 0,
        totalGraded: Object.keys(gradedQs).length,
        totalCorrect: h.c || 0,
        usedDelta: h.used || 0,
        totalUsed: h.used || 0
      }])),
      lastGradedElapsed: h.used || 0,
      limit: h.limit || 0,
      t0: Date.now(),
      elapsed: totalPrevUsed,
      paused: false,
      rev: false,
      cur: firstUngradedQi,
      filterUngraded: false,
      layout: savedS?.layout || localStorage.getItem('luyende_layout') || 'split',
      fromMistakes: false,
      h
    };

    syncPartialSessionToSaved();
    if(window.SFX) window.SFX.start();
    render();
    setTimeout(() => focusQ(firstUngradedQi, false, 'QB'), 60);
  }

  // Nâng cấp act.hv (Xem lại bài trong Lịch sử) để giữ nguyên thông tin gradedQs & batches
  act.hv = function(d){
    const h = (D.hist || []).find(x => x.id === d.i);
    if(!h) return;
    V = {
      view: 'exam',
      wi: D.weeks.findIndex(w => w.id === h.wid),
      ex: h.ex,
      order: h.order || h.ex.qs.map((_, i) => i),
      perm: h.perm || h.ex.qs.map(q => getValidOptIndices(q)),
      ans: h.ans || {},
      gradedQs: h.gradedQs || {},
      batches: h.batches || [],
      histId: h.id,
      rev: true,
      showUngradedKey: false,
      h,
      cur: null
    };
    render();
  };

  // Nâng cấp act.resume_saved để khôi phục đầy đủ gradedQs, histId, batches và tổng thời gian
  const origResumeSaved38 = act.resume_saved;
  act.resume_saved = function(d){
    const s = D.savedSessions?.[d.k];
    if(s && (s.partialGraded || s.histId || (s.gradedQs && Object.keys(s.gradedQs).length > 0))){
      if(s.histId && (D.hist || []).some(x => x.id === s.histId)){
        continueRemainingQuestionsFromHist(s.histId);
        return;
      }
      origResumeSaved38(d);
      V.gradedQs = s.gradedQs || {};
      V.histId = s.histId || '';
      V.batches = s.batches || [];
      V.lastGradedElapsed = s.lastGradedElapsed || s.elapsed || 0;
      render();
      return;
    }
    origResumeSaved38(d);
  };

  // --- NÂNG CẤP HIỂN THỊ TRONG BẢNG LỊCH SỬ (renderStats) & THƯ MỤC TUẦN (renderWeek) ---
  const origRenderStats38 = renderStats;
  renderStats = function(m){
    origRenderStats38(m);

    // 1. Nâng cấp bảng Lịch sử làm bài để hiển thị tiến độ chấm từng phần, tổng thời gian gộp & nút "▶ Làm tiếp câu còn lại"
    const all = (D.hist || []).slice().sort((a, b) => a.ts - b.ts);
    const ds = SF ? desc(SF) : SC ? cset(SC) : null;
    const H = (ds ? all.filter(h => ds.has(h.wid)) : all).slice().reverse();

    const tables = m.querySelectorAll('.sc table');
    const histTable = tables.length ? tables[tables.length - 1] : null;
    if(histTable && H.length){
      const rows = histTable.querySelectorAll('tr');
      // rows[0] là header
      H.forEach((h, idx) => {
        const tr = rows[idx + 1];
        if(!tr) return;
        const tds = tr.querySelectorAll('td');
        if(tds.length < 6) return;

        const total = h.t || h.ex?.qs?.length || 0;
        const gradedCnt = h.gradedCount ?? (h.gradedQs ? Object.keys(h.gradedQs).length : total);
        const answeredCnt = (h.ex?.qs || []).filter((q, qi) => isAnswered(q, h.ans?.[qi])).length;
        const remCnt = h.partial ? Math.max(0, total - gradedCnt) : Math.max(0, total - answeredCnt);
        const batchCnt = h.batches?.length || 1;

        // Cột 2: Tên bài + Nhãn số đợt gộp
        if(h.partial){
          tds[1].insertAdjacentHTML('beforeend', `<br><span class="graded-lock-tag wait" style="margin:3px 0 0">⏳ Đã chấm ${gradedCnt}/${total} câu · Còn ${remCnt} câu làm sau</span>`);
        } else if(batchCnt > 1){
          tds[1].insertAdjacentHTML('beforeend', `<br><span class="graded-lock-tag ok" style="margin:3px 0 0">✅ Đã gộp hoàn chỉnh (${batchCnt} đợt làm)</span>`);
        }

        // Cột 3: Kết quả (Đúng / Tổng)
        if(h.partial && gradedCnt < total){
          const wrongGraded = Math.max(0, gradedCnt - h.c);
          tds[2].innerHTML = `
            <b style="color:var(--ok)">${h.c} đúng</b> / <span style="color:var(--no)">${wrongGraded} sai</span>
            <br><small class="mu">Đã chấm: <b>${gradedCnt}/${total}</b> câu (Còn ${remCnt} câu)</small>
          `;
        }

        // Cột 4: Điểm số
        if(h.partial && gradedCnt > 0 && gradedCnt < total){
          const pctGraded = Math.round((h.c / gradedCnt) * 100);
          const pctTotal = Math.round((h.c / (total || 1)) * 100);
          tds[3].innerHTML = `
            <b style="color:var(--pr)">${pctGraded}% phần đã làm</b> (${(h.c / gradedCnt * 10).toFixed(1)}đ)
            <br><small class="mu">Tích lũy toàn đề: ${pctTotal}% (${(h.c / (total || 1) * 10).toFixed(2)}đ)</small>
          `;
        }

        // Cột 5: Tổng thời gian cộng dồn
        if(batchCnt > 1 || h.partial){
          tds[4].innerHTML = `
            <b>Tổng: ${fmt(h.used || 0)}</b> / ${h.limit ? fmt(h.limit) : '∞'}
            <br><small class="mu">Cộng dồn ${batchCnt} đợt</small>
          `;
        }

        // Cột 6: Nút Thao tác (Bổ sung nút "▶ Làm tiếp X câu")
        if(remCnt > 0){
          const actRow = tds[5].querySelector('.row');
          if(actRow && !actRow.querySelector('[data-a="hv_cont"]')){
            actRow.insertAdjacentHTML('afterbegin', `
              <button class="pri btn-resume" style="padding:6px 10px;font-size:12.5px" data-a="hv_cont" data-i="${h.id}" title="Vào làm tiếp ${remCnt} câu còn lại rồi chấm gộp điểm và cộng dồn thời gian vào bài này">▶ Làm tiếp (${remCnt} câu)</button>
            `);
          }
        }
      });
    }
  };

  // --- ĐĂNG KÝ CÁC ACTION MỚI CHO CHẤM TỪNG PHẦN & GỘP BÀI ---
  Object.assign(act, {
    // Bấm nút "✅ Chấm X câu vừa làm" ngay trên thanh công cụ hoặc trong thanh trạng thái
    grade_answered_now(){
      if(V.rev || !V.ex) return;
      const sum = getExamGradingSummary();
      if(sum.ungradedAnsweredCnt <= 0) return;
      executeConsolidateGrading('answered');
    },
    // Bấm nút "✓ Chấm câu này" trên 1 thẻ câu hỏi cụ thể
    grade_one_q(d){
      if(V.rev || !V.ex) return;
      executeConsolidateGrading('single', +d.q);
    },
    // Chọn "Chấm X câu vừa làm & Ở lại làm tiếp" từ hộp thoại Nộp bài
    sub_grade_partial(){
      modal('');
      executeConsolidateGrading('answered');
    },
    // Chọn "Chấm X câu vừa làm & Thoát ra để lúc khác làm tiếp"
    sub_grade_partial_and_exit(){
      modal('');
      executeConsolidateGrading('answered');
      clearInterval(TI);
      stopSpeech();
      syncPartialSessionToSaved();
      if(V.fromMistakes) V = {view: 'mistakes'};
      else if(V.wi >= 0 && D.weeks[V.wi]) V = {view: 'week', wi: V.wi};
      else V = {view: 'stats'};
      render();
    },
    // Lưu kết quả đã chấm & thoát ra ngoài để lúc khác vào làm tiếp các câu còn lại
    save_partial_and_exit(){
      if(V.rev) return;
      const sum = getExamGradingSummary();
      if(sum.ungradedAnsweredCnt > 0){
        executeConsolidateGrading('answered');
      } else {
        syncPartialSessionToSaved();
      }
      clearInterval(TI);
      stopSpeech();
      if(window.SFX) window.SFX.ding();
      if(V.fromMistakes) V = {view: 'mistakes'};
      else if(V.wi >= 0 && D.weeks[V.wi]) V = {view: 'week', wi: V.wi};
      else V = {view: 'stats'};
      render();
    },
    // Lọc chỉ hiện các câu chưa chấm để tập trung làm nốt
    tgl_filter_ungraded(){
      V.filterUngraded = !V.filterUngraded;
      drawQ();
    },
    // Nhảy nhanh tới câu đầu tiên chưa làm / chưa chấm
    jump_next_ungraded(){
      if(!V || !V.ex) return;
      const order = V.order || [];
      const nextQi = order.find(qi => !(V.gradedQs && V.gradedQs[qi]) && !isAnswered(V.ex.qs[qi], V.ans?.[qi]))
                  ?? order.find(qi => !(V.gradedQs && V.gradedQs[qi]));
      if(nextQi !== undefined) focusQ(nextQi, false, 'QB');
    },
    // Bấm "▶ Làm tiếp các câu còn lại" khi đang ở chế độ Xem lại (V.rev)
    continue_remaining_qs(){
      if(V.h && V.h.id){
        continueRemainingQuestionsFromHist(V.h.id);
      }
    },
    // Bấm "▶ Làm tiếp (X câu)" từ bảng Lịch sử ở trang Thống kê
    hv_cont(d){
      if(d.i) continueRemainingQuestionsFromHist(d.i);
    },
    // Ẩn / Hiện đáp án của các câu chưa làm khi đang ở chế độ Xem lại
    tgl_ungraded_key(){
      V.showUngradedKey = !V.showUngradedKey;
      drawQ();
    },
    // Ghi đè clr_all_ans_go để chỉ xóa các câu CHƯA CHẤM (bảo vệ kết quả các câu đã chấm ở đợt trước)
    clr_all_ans_go(){
      if(V.rev || !V.ex) return;
      const resetTimer = !!$('#clr-reset-timer')?.checked;
      const hasGraded = V.gradedQs && Object.keys(V.gradedQs).length > 0;
      if(hasGraded){
        for(const k of Object.keys(V.ans || {})){
          if(!V.gradedQs[+k]) delete V.ans[k];
        }
      } else {
        V.ans = {};
      }
      if(resetTimer && !hasGraded){
        V.elapsed = 0;
        V.t0 = Date.now();
        V._warned180 = false;
        V._warned60 = false;
        V._lastTickSec = -1;
        tick();
      }
      if(window.SFX) window.SFX.trash();
      modal('');
      drawQ();
      syncPartialSessionToSaved();
    }
  });

  render();
})();
